# Agent Assignments
# Feature: 015-dockerize-dev-environment
# Generated: 2026-09-05
# Command: /speckit.agent-assign.assign

agents_scanned:
  - name: "architect"
    source: "user"
    description: "Technical design docs, ADRs, C4 descriptions, API/OpenAPI references"
  - name: "backend-engineer"
    source: "user"
    description: "Writes/reviews/refactors server-side code (Go, Python, Java, Node, Rust, C#, Ruby)"
  - name: "claire"
    source: "user"
    description: "Jira Delivery Specialist — creates/refines/reviews Jira tickets"
  - name: "frontend-engineer"
    source: "user"
    description: "Writes/reviews/refactors client-side/UI code (Vue, React, Svelte, Angular)"
  - name: "pm"
    source: "user"
    description: "Pulls requirements into PRDs; decomposes design docs into Jira tickets"
  - name: "qa"
    source: "user"
    description: "Test planning/strategy, scaffolds runnable tests, API test automation"
  - name: "reviewer"
    source: "user"
    description: "Code/security review, PR/diff audits"
  - name: "sre"
    source: "user"
    description: "Release readiness and incident postmortems"

