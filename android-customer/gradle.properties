org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Build cache Gradle sengaja TIDAK diaktifkan: disk mesin pengembang hampir penuh (lihat README).
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Kompilasi Kotlin di dalam proses Gradle: tanpa JVM daemon Kotlin kedua (hemat memori; mesin
# pengembang ini sering kehabisan RAM dan swap-nya memakan sisa disk).
kotlin.compiler.execution.strategy=in-process
