          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invoices/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Billing]
      summary: Batalkan invoice
      description: Hanya invoice berstatus unpaid yang bisa ditransisikan. Selain itu ditolak 409.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '409': { $ref: '#/components/responses/Conflict' }

  /materials:
