        '422': { $ref: '#/components/responses/ValidationError' }

  /roles:
    get:
      tags: [Pengguna & Peran]
      summary: Daftar peran
      description: |
        Digerbangi canAccessMenu('roles') (001-user-store-settings US2).
        `user_count` pada setiap baris adalah jumlah pengguna AKTIF yang
        memakai peran itu — dipasok siap pakai supaya frontend tidak perlu
        request kedua, dan supaya pesan penolakan 409 delete (FR-014)
        mengutip angka yang sama persis.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
