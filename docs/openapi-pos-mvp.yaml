    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Company Onboarding]
      summary: Aktivasi company (019-billing-system, third expansion)
      description: >-
        Rate-limited (10/menit). Tidak lagi butuh kode aktivasi dari email
        klien (research.md R14) — staf owner/admin penyedia, satu-satunya
        yang punya akses ke endpoint ini, tidak pernah punya jalan sah
        untuk tahu kode yang dikirim ke email klien. Diganti syarat yang
        BISA diverifikasi langsung: company ini sudah punya minimal satu
        Invoice berstatus 'paid'. Ditolak (409) bila company sudah aktif
        atau belum ada invoice lunas — bukan lagi 422 (bukan kesalahan
        input, melainkan konflik aturan bisnis, sama seperti delete-guard
        Invoice/License/Company lain di kodebase ini).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /companies/{id}/deactivate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Company Onboarding]
      summary: Nonaktifkan company (019-billing-system, third expansion)
      description: >-
        Rate-limited (10/menit). Kebalikan dari POST /companies/{id}/activate
        — mengunci login owner user (is_active=false) dan mengembalikan
        status company ke pending_activation, TANPA menghapus company atau
        riwayat invoice-nya sama sekali. Ditolak (409) bila company belum
        aktif.
