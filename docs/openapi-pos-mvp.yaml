openapi: 3.0.3

# =====================================================================
# KLASIFIKASI: INTERNAL
# Kontrak API — Sistem POS Multi-Outlet
# Cakupan: MVP Oktober 2026. 046 (2026-10-12): modul Event dan Pre-order (termasuk pengiriman kurir) dihapus dari API.
# Acuan: PRD v1.4, schema-pos-mvp.sql v1.0, uml-pos-mvp.md v1.0
#
# ATURAN: berkas ini adalah sumber kebenaran kontrak API. Koleksi Bruno
# dan Postman diturunkan dari sini, bukan ditulis terpisah. Perubahan
# endpoint wajib memperbarui berkas ini dalam commit yang sama.
# =====================================================================

info:
  title: BoothPOS API
  version: 1.4.0
  description: |
    API internal untuk BoothPOS — sistem POS untuk toko
    merchandise dan restoran dengan satu atau beberapa outlet. Berjalan di
    localhost pada perangkat operasional toko, tanpa akses publik,
    sejalan dengan model lisensi sekali bayar dan instalasi lokal per toko.

    **Autentikasi** — token bearer. Token diperoleh dari `/auth/login`
    dan dikirim pada header `Authorization: Bearer <token>`.

    **Format uang** — seluruh nilai uang berupa string desimal dua angka
    di belakang koma, contoh `"150000.00"`. String dipakai agar tidak ada
    galat pembulatan floating point di sisi klien.

    **Zona waktu** — seluruh timestamp dalam format ISO 8601 dengan
    offset waktu lokal perangkat.

servers:
  - url: http://localhost:8000/api/v1
    description: Instalasi lokal pada laptop operasional

tags:
  - name: Devices
  - name: Dashboard
  - name: Menu
  - name: License
  - name: Auth
  - name: Master Data
  - name: Settings
  - name: Stock
  - name: Session
  - name: Sales
  - name: Payment
  - name: Report
  - name: Vendor & Bahan Baku
  - name: Purchase Order
  - name: Import & Export
  - name: Company Onboarding
  - name: Restaurant

security:
  - bearerAuth: []

# =====================================================================
# PATHS
# =====================================================================
paths:

  # ------------------------------------------------------------------
  # LICENSE (018-license-activation)
  # ------------------------------------------------------------------
  # Kedua endpoint ini SENGAJA tanpa auth DAN dikecualikan dari
  # EnsureInstallationIsActivated (satu-satunya pengecualian selain
  # keduanya sendiri) — harus tetap terjangkau selagi instalasi belum
  # teraktivasi sama sekali (FR-002). Setiap endpoint LAIN di berkas ini
  # mengembalikan 423 selagi belum aktif — tidak diulang di tiap path
  # demi keterbacaan, cukup dicatat sekali di sini.
  /license/status:
    get:
      tags: [License]
      summary: Status aktivasi instalasi ini
      security: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  activated: { type: boolean }

  /license/activate:
    post:
      tags: [License]
      summary: Aktivasi instalasi dengan kunci lisensi
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key]
              properties:
                license_key: { type: string, description: 'base64(payload).base64(signature) — string tunggal yang ditempel dari email vendor.' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  activated: { type: boolean }
        '422':
          description: Kunci lisensi tidak valid — satu alasan generik saja, tidak membedakan bentuk salah dari tanda tangan salah (FR-003).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  # ------------------------------------------------------------------
  # AUTH
  # ------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan dapatkan token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: kasir01 }
                password: { type: string, format: password }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/roster:
    get:
      tags: [Auth]
      summary: Daftar staf aktif satu outlet untuk layar pilih-nama terminal (048/B1)
      description: |
        Hanya data layar pilih-staf — tanpa username dan tanpa hash PIN. Butuh token (token penyiapan terminal dari
        login owner/admin). Staf = pengguna aktif yang ditugaskan ke outlet itu, atau yang perannya melihat semua outlet.
      parameters:
        - { name: outlet_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Daftar staf
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        role: { type: string, nullable: true }
                        has_pin: { type: boolean }
                        locked: { type: boolean, description: Login PIN sedang terkunci }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Outlet tidak ada atau tidak aktif }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/pin-sessions:
    post:
      tags: [Auth]
      summary: Masuk dengan PIN 6 digit (048/B1)
      description: |
        Mengeluarkan token sesi PIN berumur 12 jam. Lima PIN salah berturut-turut mengunci login PIN staf itu 15
        menit (429 `pin_locked`); kata sandi tetap dapat dipakai lewat `/auth/login`. Pengguna yang tidak ada, tidak
        aktif, atau bukan staf outlet dijawab sama (401 `invalid_pin`) tanpa hitungan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, user_id, pin]
              properties:
                outlet_id: { type: integer }
                user_id: { type: integer }
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { description: "PIN salah (`code: invalid_pin`, `attempts_remaining` bila ada)" }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: "Terkunci (`code: pin_locked`, `locked_until`)" }

  /auth/pin-changes:
    post:
      tags: [Auth]
      summary: Atur atau ganti PIN sendiri (048/B1)
      description: Sudah punya PIN → wajib `current_pin` (salah dihitung ke kunci yang sama). Belum punya → wajib `current_password`. PIN lemah (angka sama / berurutan) ditolak.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_pin]
              properties:
                new_pin: { type: string, pattern: '^[0-9]{6}$' }
                current_pin: { type: string, nullable: true }
                current_password: { type: string, nullable: true, format: password }
      responses:
        '200': { description: PIN diubah }
        '401': { description: Kata sandi atau PIN saat ini salah }
        '422': { description: "PIN lemah (`pin_too_weak`) atau `current_pin_required`" }
        '429': { description: Terkunci }

  /auth/token-refresh:
    post:
      tags: [Auth]
      summary: Perpanjang token sesi PIN (048/B1)
      description: Hanya untuk token hasil PIN; token kata sandi tidak kedaluwarsa dan dijawab 403.
      responses:
        '200':
          description: Token baru; token lama dicabut
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Bukan token PIN (`token_not_refreshable`) }

  /users/{id}/pin-reset:
    post:
      tags: [Auth]
      summary: Reset PIN seorang staf (owner/admin) (048/B1)
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: PIN dan kunci dihapus; sesi PIN staf itu dicabut }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices:
    get:
      tags: [Devices]
      summary: Daftar terminal POS pada outlet yang berlaku (owner/admin) (048/B14)
      responses:
        '200':
          description: Daftar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices/pairings:
    post:
      tags: [Devices]
      summary: Daftarkan terminal POS (owner/admin) (048/B14)
      description: |
        Outlet diturunkan server dari konteks (satu-satunya outlet, atau `X-Outlet-Id`), TIDAK dari body. Admin yang
        melihat banyak outlet wajib memilih satu lewat header.

        **064 — terminal dikenali HANYA lewat nama.** Tidak ada kode otomatis `T01`/`T02` lagi; `code` di body tidak
        diterima (diabaikan). Nama (dipangkas, wajib, ≤ 80) harus unik di antara terminal AKTIF satu outlet + mode
        data tanpa membedakan huruf besar/kecil; terminal yang dicabut melepas namanya. Duplikat atau kosong → 422 `errors.name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80, example: Kasir Depan }
      responses:
        '201':
          description: Terminal terdaftar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /devices/heartbeat:
    post:
      tags: [Devices]
      summary: Heartbeat terminal POS — setiap 60 dtk (048 / T064)
      description: |
        Terminal mengirim versi aplikasi, jam perangkat, dan kedalaman antrean. Server menyimpan `app_version`
        dan waktu terakhir terlihat, lalu menjawab waktu server dan selisih jam.

        **Tanda selisih jam**: `skew_seconds` = (`clock_ms` − `server_time_ms`) / 1000, dibulatkan. POSITIF berarti
        JAM PERANGKAT MAJU dari server; negatif berarti tertinggal. Nilai yang sama disimpan di perangkat.

        `queue_depth` divalidasi (0–10000) tetapi TIDAK disimpan (antrean sinkron belum ada, B16).
        `menu_release` = versi rilis menu TERBIT tertinggi bila mesin rilis aktif (`menu_release_enabled`);
        `null` bila mesin rilis mati atau belum ada rilis terbit. Tidak menulis catatan aktivitas per heartbeat.

        Perangkat ditentukan dari header `X-Device-Id`: harus terminal aktif milik outlet yang terlihat pengguna.
        Tanpa header, atau perangkat tak dikenal/dicabut/outlet lain → 422 `errors.device_id`.
      parameters:
        - name: X-Device-Id
          in: header
          required: true
          description: Id terminal (`devices.id`) yang dipasangkan.
          schema: { type: string, example: "1" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_version, clock_ms, queue_depth]
              properties:
                app_version: { type: string, maxLength: 40, example: "1.4.2" }
                clock_ms: { type: integer, minimum: 0, description: "Epoch milidetik jam perangkat." }
                queue_depth: { type: integer, minimum: 0, maximum: 10000, description: "Divalidasi saja; tidak disimpan." }
      responses:
        '200':
          description: Heartbeat diterima
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time_ms: { type: integer, description: "Epoch milidetik jam server." }
                  skew_seconds: { type: integer, description: "Positif = jam perangkat maju dari server." }
                  menu_release: { type: integer, nullable: true, description: "Versi rilis menu yang berlaku; null bila mesin rilis mati." }
                  name: { type: string, description: "064 — nama terminal ini sekarang; tablet yang dipasang sebelum fitur nama-saja mengisinya dari sini." }
        '422':
          description: Perangkat tidak dikenal, dicabut, bukan milik outlet ini, atau body tidak valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  errors: { type: object }

  /devices/server-address:
    get:
      tags: [Devices]
      summary: Alamat server yang dipilih admin untuk terminal ini (054)
      description: |
        Dipanggil tablet setelah roster berhasil (research.md R3, opsi A). Terautentikasi
        seperti roster (token dari penyiapan terminal); perangkat ditentukan dari header
        X-Device-Id dengan pengecekan yang sama dengan heartbeat. Hanya pilihan aktif yang
        dikirim: alamat satunya dan kredensial tidak pernah sampai ke tablet (FR-011).
      parameters:
        - in: header
          name: X-Device-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [selected, url]
                properties:
                  selected: { type: string, enum: [local, online] }
                  url: { type: string, nullable: true, description: 'Alamat pilihan; null = tetap alamat pairing tablet' }
        '422':
          description: Header X-Device-Id kosong, tidak dikenal, atau perangkat dicabut (kode device_id)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /devices/{id}:
    patch:
      tags: [Devices]
      summary: Ganti nama terminal POS (owner/admin) (064)
      description: |
        Aturan nama sama dengan pendaftaran (unik di antara terminal aktif satu outlet, tanpa membedakan huruf besar/kecil;
        mengganti huruf besar/kecil namanya sendiri boleh). Terminal outlet lain → 404; yang sudah dicabut → 409.
        Order yang sudah tertaut ke terminal ini menampilkan nama barunya. Dicatat sebagai `device_renamed`.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Terminal dengan nama baru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Devices]
      summary: Cabut terminal POS (jejak audit tetap ada) (048/B14)
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Dicabut (idempoten) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cabut token aktif
      responses:
        '204': { description: Berhasil }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil pengguna aktif
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/scope:
    get:
      tags: [Auth]
      summary: Outlet yang boleh dilihat pengguna dan pilihan X-Outlet-Id (045 Stage 2)
      description: >
        Header `X-Outlet-Id` (opsional, di semua endpoint ber-login) hanya MENYEMPITKAN dalam outlet yang boleh
        dilihat pengguna; tanpa header = semua. Id di luar daftar → 403 `outlet_forbidden`; bukan angka → 422
        `outlet_invalid`. `outlet_id` pada body/query tidak pernah memperluas cakupan atau menentukan outlet record.
        Record outlet lain yang diminta lewat id menjawab 404.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  outlets:
                    type: array
                    items:
                      type: object
                      properties: { id: { type: integer }, code: { type: string }, name: { type: string } }
                  selected: { type: integer, nullable: true }
                  can_see_all: { type: boolean }
                  multi: { type: boolean, description: "Lebih dari satu outlet terlihat; kendali pemilih tampil hanya bila true." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/password:
    put:
      tags: [Auth]
      summary: Ganti password akun sendiri (005-ux-enhancements-dashboard)
      description: >
        Self-service — SENGAJA tidak digerbang canAccessMenu('users'), sama
        seperti /auth/language. Setiap akun boleh mengubah password
        miliknya sendiri, digerbang hanya oleh current_password yang benar.
        Token sesi yang sedang dipakai TIDAK dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/photo:
    post:
      tags: [Auth]
      summary: Ganti foto profil akun sendiri (005-ux-enhancements-dashboard)
      description: >
        Self-service — sengaja endpoint TERPISAH dari
        `POST /users/{user}/photo` (yang digerbang UserPolicy::update() /
        canAccessMenu('users')). Endpoint ini hanya pernah menyentuh
        $request->user() sendiri, tidak menerima {user} dari klien, jadi
        aman dipakai peran tanpa akses menu Pengguna (mis. Kasir).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: "JPEG/PNG, maks 5 MB" }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/language:
    put:
      tags: [Auth]
      summary: Ganti preferensi bahasa akun sendiri (002-language-toggle)
      description: >
        Self-service — SENGAJA tidak digerbang canAccessMenu('users').
        Setiap akun yang sudah login boleh mengubah bahasanya sendiri,
        termasuk peran tanpa akses menu Pengguna (mis. Kasir default).
        Berlaku untuk seluruh antarmuka setelah login; layar login dan
        struk transaksi TIDAK ikut berubah (selalu Bahasa Indonesia).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { type: string, enum: [id, en] }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # MASTER DATA — ARTIST
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # SETTINGS — FLAG FITUR / LISENSI
  # ------------------------------------------------------------------
  /settings/features:
    get:
      tags: [Settings]
      summary: Status flag fitur berbayar
      description: |
        Dibaca frontend untuk menentukan tampilan UI sesuai tingkat
        lisensi (Pro/Master) — bukan sumber kebenaran otorisasi. Penegakan
        sebenarnya tetap terjadi di server pada setiap endpoint terkait
        (contoh: `POST /artists`), bukan dari flag yang dibaca di sini.
        Klien yang memaksa memanggil endpoint terlarang tetap akan
        ditolak 403 meski tidak pernah memanggil endpoint ini.

        `system_mode` (003-seed-demo-live, FR-005) terbuka untuk SEMUA
        role yang login (bukan hanya owner/admin) — status DEMO/LIVE harus
        selalu terlihat oleh siapa pun yang memakai sistem. Hanya
        MENGUBAHNYA yang dibatasi owner/admin, lewat `PUT /settings`.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  multi_artist_enabled: { type: boolean }
                  artist_count: { type: integer, description: Jumlah artist aktif saat ini }
                  artist_limit_reached: { type: boolean, description: "true bila Pro dan sudah punya 1 artist" }
                  system_mode:
                    type: string
                    enum: [demo, live]
                    description: |
                      Mode aktif saat ini. 'demo' menampilkan data contoh
                      (lihat SakanaFridgeDemoSeeder); 'live' hanya
                      menampilkan data yang dibuat sungguhan. Default
                      'live' bila baris settings `system_mode` belum
                      pernah dibuat (instalasi baru TIDAK PERNAH diam-diam
                      mulai dalam mode DEMO).
                  app_name:
                    type: string
                    maxLength: 50
                    description: |
                      Nama aplikasi/merek produk (default `BoothPOS`), tampil di
                      sidebar dan sebagai "Powered by …" pada dokumen. Bukan nama
                      toko (`store_name`). Diubah owner/admin lewat `PUT /settings`
                      (key `app_name`, maks. 50 karakter — lebih panjang ditolak
                      422); kosong/spasi saja berarti kembali ke default.
                  store_timezone:
                    type: string
                    description: |
                      042-dashboard-revamp — zona waktu toko (IANA, default `Asia/Jakarta`) yang menentukan
                      tanggal bisnis. Diubah owner/admin lewat `PUT /settings` (key `store_timezone`).
                      Pengaturan terkait yang diubah dengan cara yang sama: `business_day_cutoff` (`HH:MM`,
                      default `00:00`), `cash_difference_tolerance` (uang ≥ 0, default 5000),
                      `device_offline_after_minutes` (1–1440, default 5); nilai tak valid → 422.
                  business_day_cutoff:
                    type: string
                    description: "042 — jam (HH:MM, waktu lokal toko) hari bisnis baru dimulai."
                  tax_rate:
                    type: number
                    description: "048 — tarif pajak eksklusif (%), 0 bawaan. Angka tampilan; server selalu menghitung ulang."
                  tax_label: { type: string, description: "048 — label pajak di layar/struk (bawaan `Pajak`)." }
                  variance_tolerance: { type: integer, description: "048 — toleransi selisih kas saat tutup shift (Rp, bawaan 5000)." }
                  cash_out_approval_threshold: { type: integer, description: "048 — kas keluar di atas ini butuh persetujuan atasan (Rp, bawaan 200000)." }
                  schema_update_required:
                    type: boolean
                    description: |
                      035-po-row-actions — `true` hanya untuk pengguna yang boleh
                      mengelola pengaturan (owner/admin) SAAT ada migrasi yang
                      belum diterapkan; selalu `false` untuk peran lain dan bila
                      database sudah mutakhir. Daftar migrasinya TIDAK PERNAH
                      dikirim. Aplikasi tidak pernah menerapkan migrasi dari
                      sebuah request — administrator yang melakukannya.

  /settings/payment:
    get:
      tags: [Settings]
      summary: Ambil pengaturan informasi pembayaran invoice
      description: |
        Singleton (satu baris, id selalu 1) berisi informasi pembayaran
        (nama bank, nomor rekening, atas nama, instruksi) yang dijadikan
        default `payment_information` saat invoice baru dibuat
        (019-billing-system, FR-008/FR-015). Dibuat kosong secara otomatis
        pada akses pertama. Digerbang dengan menu key `settings` yang sudah
        ada (bukan menu key baru).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePaymentSetting' }
        '403':
          description: Peran tanpa akses menu settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Settings]
      summary: Perbarui pengaturan informasi pembayaran invoice
      description: |
        Selalu updateOrCreate(['id' => 1], ...) — tidak pernah membuat baris
        kedua meskipun dipanggil berulang kali.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_name: { type: string, nullable: true }
                account_number: { type: string, nullable: true }
                account_holder: { type: string, nullable: true }
                instructions: { type: string, nullable: true }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePaymentSetting' }
        '403':
          description: Peran tanpa akses menu settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /settings/server-address:
    get:
      tags: [Settings]
      summary: Ambil alamat server lokal dan online (054)
      description: |
        Owner/admin (menu `settings`). Mengembalikan kedua alamat dan pilihan aktif.
        Alamat yang belum diisi bernilai null; pilihan awal `local`.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerAddress' }
        '403':
          description: Peran tanpa akses menu settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Settings]
      summary: Ubah alamat server lokal/online dan pilihan aktif (054)
      description: |
        Satu transaksi: menulis ketiga pengaturan dan satu baris activity_logs
        (`server_address_updated`) berisi nilai sebelum dan sesudah. Ditolak 422 bila URL
        tidak lengkap (http/https, dengan host), atau bila `selected` = online tanpa alamat
        online. Perubahan berlaku pada tablet saat pengecekan koneksi berikutnya (FR-013).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerAddress' }
      responses:
        '200':
          description: Tersimpan; respons sama dengan GET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerAddress' }
        '403':
          description: Peran tanpa akses menu settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 'URL tidak valid, atau pilihan online tanpa alamat online (kunci: local, online, atau selected)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /settings:
    get:
      tags: [Settings]
      summary: Daftar seluruh pengaturan
      description: |
        Hanya owner/admin (F14 — Setting & config management). Tabel
        `payment_channels` (nomor rekening) TIDAK ikut di sini; itu
        resource terpisah dengan penyamaran nomor rekeningnya sendiri.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Setting' }
                  store_logo_url:
                    type: string
                    nullable: true
                    description: 023-event-availability-invoice-redesign (US4, research.md Decision 8) — diselesaikan lewat ImageUploadService, konvensi yang sama dengan setiap gambar lain di produk ini; menggantikan konstruksi URL manual di frontend yang jadi akar bug logo tidak tampil.
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      summary: Ubah satu atau beberapa pengaturan sekaligus
      description: |
        Bentuk BULK, bukan satu key per request — layar pengaturan
        biasanya menyimpan beberapa field sekaligus (nama toko, kontak,
        format struk). Ini juga satu-satunya jalur admin untuk mengubah
        `multi_artist_enabled` (upgrade lisensi Pro ke Master); lihat
        catatan lisensi pada `POST /artists`. `type`/`group` boleh
        dikosongkan pada key yang sudah ada — nilai lama dipakai lagi.
        Setiap key yang berubah tercatat di log aktivitas (F13.4).

        Juga satu-satunya jalur mengubah `system_mode`
        (003-seed-demo-live) — key baru bernilai `demo`/`live`, group
        `system`. Tidak ada endpoint terpisah untuk ini (lihat
        specs/003-seed-demo-live/contracts/settings-system-mode.md):

        ```json
        { "settings": [{ "key": "system_mode", "value": "demo", "type": "string", "group": "system" }] }
        ```

        006-purchase-order-and-ops (US7) — juga satu-satunya jalur untuk
        tiga key baru ini, tidak ada endpoint terpisah: `theme_accent_color`
        (hex warna, group `appearance`, diterapkan klien sebagai override
        CSS custom property `--color-brand`), `receipt_footer_text` (group
        `receipt`, dirender di struk hanya bila terisi — dihilangkan sama
        sekali, bukan blok kosong, saat kosong), `receipt_show_logo`
        (boolean-as-string, group `receipt`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/SettingInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Setting' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /settings/store-logo:
    post:
      tags: [Settings]
      summary: Unggah/ganti logo toko (001-user-store-settings US3, T045)
      description: |
        Mengikuti pola persis `POST /categories/{id}/image` — endpoint
        multipart terpisah karena `PUT /settings`'s bulk JSON body tidak
        bisa membawa file (lihat research.md Decision 3). Menulis baris
        `store_logo_path` di tabel `settings` yang sama, dicatat ke log
        aktivitas seperti setiap perubahan `PUT /settings` lainnya.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Setting' }
                  store_logo_url:
                    type: string
                    description: 023-event-availability-invoice-redesign (US4) — dari path yang BARU SAJA diunggah, bukan dibaca ulang dari DB, supaya tampil seketika tanpa round-trip kedua.
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # LOG AKTIVITAS (F13.4)
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # CADANGAN & PEMULIHAN DATABASE (Pengaturan)
  # ------------------------------------------------------------------
  /backups:
    get:
      tags: [Settings]
      summary: Daftar cadangan database
      description: |
        Owner/admin saja (403 untuk peran lain) — cadangan memuat SELURUH data,
        termasuk hash kata sandi dan data pelanggan. Terbaru dulu. Setiap
        cadangan = satu folder di `BACKUP_PATH` (default `storage/app/backups`)
        berisi `database.sql` dan, bila ada, `payment-proofs.tar.gz`.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Backup' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Settings]
      summary: Buat cadangan sekarang
      description: |
        Sama dengan `php artisan app:backup` (dump MySQL + arsip bukti pembayaran
        + salinan ke `BACKUP_EXTERNAL_PATH` bila diset). Butuh `mysqldump` di
        server (image toko membawanya; image dev tidak). Gagal di tengah jalan
        → folder setengah jadi dihapus dan 500 dengan `message`.
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: mysqldump gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /backups/{id}:
    parameters:
      - { name: id, in: path, required: true, description: "Id cadangan (`Y-m-d_His`); pola lain → 404.", schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}_\d{6}(-\d+)?$' } }
    delete:
      tags: [Settings]
      summary: Hapus satu cadangan
      description: |
        Menghapus folder cadangan beserta isinya (`database.sql` dan
        `payment-proofs.tar.gz`). Tidak menyentuh database, bukti pembayaran ASLI,
        maupun salinan di `BACKUP_EXTERNAL_PATH`. Tidak bisa dibatalkan. Owner/admin
        saja; tercatat di log aplikasi (siapa & cadangan mana).
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /backups/{id}/download:
    parameters:
      - { name: id, in: path, required: true, description: "Id cadangan (`Y-m-d_His`, mis. `2026-09-30_100000`); pola lain → 404.", schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}_\d{6}(-\d+)?$' } }
    get:
      tags: [Settings]
      summary: Unduh berkas database.sql sebuah cadangan
      responses:
        '200':
          description: Berkas SQL
          content:
            application/sql:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /backups/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}_\d{6}(-\d+)?$' } }
    post:
      tags: [Settings]
      summary: Pulihkan database dari sebuah cadangan
      description: |
        MENIMPA SELURUH database. Wajib `confirm: "RESTORE"` (persis, huruf besar;
        selain itu 422 dan tidak ada yang disentuh). Urutannya SELALU: (1) buat
        cadangan pengaman dari kondisi saat ini, (2) baru timpa. Bila cadangan
        pengaman gagal, pemulihan TIDAK dijalankan (500 dengan pesan yang
        menyebut pemulihan dibatalkan). Berkas bukti pembayaran hanya dicadangkan,
        tidak dipulihkan. Sesi/token ikut tertimpa isi cadangan, jadi klien
        sebaiknya memuat ulang dan siap diarahkan ke login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [RESTORE] }
      responses:
        '200':
          description: Dipulihkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRestoreResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Kata konfirmasi salah/hilang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Cadangan pengaman atau pemulihan gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /backups/restore-upload:
    post:
      tags: [Settings]
      summary: Pulihkan database dari berkas .sql yang diunggah
      description: |
        Aturan sama dengan `POST /backups/{id}/restore` (kata konfirmasi,
        cadangan pengaman dulu). Berkas harus berekstensi `.sql`, maks. 50 MB,
        dan tampak seperti dump aplikasi ini — memuat tabel `settings` DAN
        `users` — kalau tidak 422 pada `file` sebelum apa pun disentuh.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, confirm]
              properties:
                file: { type: string, format: binary }
                confirm: { type: string, enum: [RESTORE] }
      responses:
        '200':
          description: Dipulihkan (`source` = "upload")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRestoreResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Berkas/konfirmasi tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Cadangan pengaman atau pemulihan gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /activity-logs:
    get:
      tags: [Settings]
      summary: Riwayat tindakan sensitif
      description: |
        Hapus data, penyesuaian stok, dan perubahan harga/pengaturan
        (F13.4, prioritas M). Hanya owner/admin. `old_values`/`new_values`
        adalah snapshot kolom yang bisa diisi ulang (fillable) pada
        entitas terkait saat kejadian, bukan diff per-field.
      parameters:
        - { name: entity_type, in: query, schema: { type: string, example: Artist } }
        - { name: entity_id, in: query, schema: { type: integer } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string, enum: [created, updated, deleted, stock_adjusted, price_changed] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ActivityLog' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /artists:
    get:
      tags: [Master Data]
      summary: Daftar artist
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Artist' }
    post:
      tags: [Master Data]
      summary: Buat artist
      description: |
        **Gate lisensi (v1.1)** — bila pengaturan `multi_artist_enabled`
        bernilai false (instalasi Pro) dan sudah ada satu artist aktif,
        permintaan ini ditolak dengan 403. Instalasi baru yang belum
        punya artist sama sekali tetap boleh membuat SATU artist
        (menjadi artist bawaan), baik pada Pro maupun Master. Cek dulu
        `GET /settings/features` untuk menyembunyikan tombol "Tambah
        Artist" di UI saat kuota sudah tercapai.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '403':
          description: Kuota artist Pro sudah tercapai, perlu upgrade ke Master
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /artists/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data]
      summary: Detail artist
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data]
      summary: Perbarui artist
      description: Kolom `code` tidak dapat diubah karena sudah menjadi bagian SKU yang beredar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Master Data]
      summary: Nonaktifkan artist
      description: Soft delete. Ditolak bila artist masih memiliki produk aktif.
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------
  # MASTER DATA — KATEGORI
  # ------------------------------------------------------------------
  /categories:
    get:
      tags: [Master Data]
      summary: Daftar kategori
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Master Data]
      summary: Buat kategori
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Master Data]
      summary: Perbarui kategori
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
    delete:
      tags: [Master Data]
      summary: Nonaktifkan kategori
      description: Ditolak bila masih ada produk aktif pada kategori ini.
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories/{id}/image:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Master Data]
      summary: Unggah/ganti gambar kategori (Task 5)
      description: |
        Kategori sebelumnya tidak punya kolom gambar sama sekali
        (`image_path` ditambahkan lewat migrasi
        `2026_10_07_000001_add_image_path_to_categories_table`). Pola sama
        dengan POST /products/{id}/image.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # MASTER DATA — PRODUK
  # ------------------------------------------------------------------
  /pos/categories:
    get:
      tags: [Products]
      summary: Kategori kasir menurut mode sistem aktif (055)
      description: |
        Sumber kategori untuk layar kasir Android. Hanya kategori aktif dari mode sistem
        yang sedang aktif (DEMO/LIVE, lewat HasDataMode). Kategori tanpa produk yang bisa
        dijual tetap dikembalikan dengan product_count 0. Gerbang sama dengan GET /products?pos=1.
      responses:
        '200':
          description: Berhasil; urut display_order lalu nama
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PosCategory' }
        '401':
          description: Tanpa sesi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products:
    get:
      tags: [Master Data]
      summary: Daftar produk
      description: |
        `variants` TIDAK disertakan kecuali `with_variants=1` dikirim.
        Opt-in, bukan default: layar Kelola Produk tidak memakai varian,
        sedangkan layar kasir memakainya — memuatnya selalu hanya
        memperbesar payload untuk konsumen yang tidak butuh.
        043-products-page-redesign — MODE KATALOG: bila parameter `tab` (`menu`|`retail`) dikirim, respons
        berbentuk baris katalog (grid/tabel layar Produk) + `counts` per tab (menu, retail, material,
        semi_finished, packaging, modifier), dengan filter `q`, `category_id[]` (termasuk sub-kategori),
        `status[]` (draft|active|discontinued), `quality` (no_station|no_price|no_cost), `sort`
        (name|sku|price|status, awalan `-` = turun), `page`, `per_page` (15).
        045 Stage 4 (bentuk lama, tanpa `tab`): `pos=1` = layar pemesanan — menu menurut outlet SHIFT terbuka pengguna
        (item yang tidak dibawa outlet itu tidak muncul; varian membawa `outlet_price` untuk outlet itu). Hal sama berlaku
        untuk `GET /variants/lookup?pos=1` dan `GET /menu/availability?pos=1` (tanda 86 outlet shift, bukan header).
        045 Stage 3: `outlet_id[]` mempersempit ke item yang DIBAWA outlet-outlet itu (hanya outlet yang boleh dilihat
        pemanggil). Dengan lebih dari satu outlet terlihat, `availability` berisi satu entri per outlet
        `{outlet_id, outlet_code, outlet_name, state: available|sold_out|not_carried, reason}`; dengan satu outlet
        bentuk lama (satu entri tanpa outlet). Tanpa `tab`, bentuk lama
        tidak berubah. Biaya (`food_cost_pct`) hanya untuk pengguna dengan menu products/reports.
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [menu, retail] }, description: "043 — mengaktifkan mode katalog" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "043 — nama, nama pendek, SKU, atau awalan kode" }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { type: string, enum: [draft, active, discontinued] } } }
        - { name: quality, in: query, schema: { type: string, enum: [no_station, no_price, no_cost] } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, sku, -sku, price, -price, status, -status] } }
        - { name: with_modifiers, in: query, schema: { type: boolean }, description: "028 — opt-in: sertakan `modifier_groups` (grup EFEKTIF aktif + opsi aktif: grup produk ∪ grup kategorinya). Default tidak berubah." }
        - { name: search, in: query, description: "Cocokkan nama produk, atau SKU/nama varian pada salah satu variannya", schema: { type: string } }
        - name: artist_id
          in: query
          description: |
            005-ux-enhancements-dashboard — sekarang array (dropdown
            multi-pilih Products/POS): `artist_id[]=1&artist_id[]=2`.
            Skalar tunggal lama (`artist_id=1`) tetap didukung mundur.
            Kosong/tidak dikirim = tanpa filter sumbu ini.
          style: form
          explode: true
          schema: { type: array, items: { type: integer } }
        - name: category_id
          in: query
          description: Sama seperti `artist_id` di atas — array, kompatibel mundur.
          style: form
          explode: true
          schema: { type: array, items: { type: integer } }
        - name: with_variants
          in: query
          description: |
            `1`/`true` menyertakan `variants` pada setiap produk, dimuat
            lewat eager-load (bukan satu query per produk). Isinya sama
            persis dengan `GET /products/{id}`, termasuk varian nonaktif.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Master Data]
      summary: Buat produk beserta varian
      description: |
        `code_prefix` dan `sku` dihasilkan server, tidak dikirim klien.
        `code_prefix` = artist.code + "-" + category.code + "-" + product_segment
        (format "ART-CA-SEG", 10 karakter). `sku` = code_prefix + "-" + urutan
        varian 3 digit (format "ART-CA-SEG-001", 14 karakter).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data]
      summary: Detail produk beserta varian
      description: |
        045 Stage 3 (halaman item): `availability` satu baris per outlet yang terlihat (state `available|sold_out|not_carried`,
        catatan 86 per outlet) dan `outlet_prices` `{outlets:[{id,code,name}], by_variant:{variantId:{outletId:"harga"}}}`
        berisi HANYA harga khusus outlet (yang tidak ada mengikuti harga dasar); keduanya berbentuk lama / `null` bila hanya
        satu outlet terlihat.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data]
      summary: Perbarui produk
      description: Perubahan nama tidak mengubah `code_prefix` maupun SKU yang sudah ada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
    delete:
      tags: [Master Data]
      summary: Nonaktifkan produk
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{id}/image:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Master Data]
      summary: Unggah/ganti gambar produk (Task 5)
      description: |
        Terpisah dari POST/PUT /products karena endpoint itu menerima
        array bersarang `variants`, yang sulit dikirim lewat
        multipart/form-data. Gambar lama (bila ada) dihapus setelah
        gambar baru tersimpan. Disk publik — dilayani lewat
        /storage/... setelah `php artisan storage:link`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}/variants:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Master Data]
      summary: Tambah varian pada produk
      description: |
        034-seller-po-bom — `copy_bom_from_variant_id` (opsional): salin BOM
        dari varian lain PRODUK YANG SAMA ke varian baru dalam satu transaksi
        (422 bila bukan produk yang sama / sumber kosong; 403 tanpa menu
        `purchase_orders`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }

  /variants/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Master Data]
      summary: Perbarui varian
      description: |
        Perubahan `sell_price` atau `cost_price` tidak memengaruhi transaksi
        yang sudah tercatat, karena harga disimpan sebagai snapshot.
        `current_stock` tidak dapat diubah lewat endpoint ini.

        034-seller-po-bom — selama BOM varian ditandai SELESAI, `cost_price`
        mengikuti biaya BOM dan dikunci: nilai yang BERBEDA ditolak 409
        `{code: cost_price_locked_by_bom}`; nilai yang sama diterima.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
        '409': { $ref: '#/components/responses/Conflict' }

  /variants/lookup:
    get:
      tags: [Master Data]
      summary: Cari varian untuk kasir
      description: Endpoint ringan khusus layar kasir. Hanya mengembalikan varian aktif dengan kolom seperlunya. 045 — `pos=1` (outlet shift; item yang tidak dibawa tidak muncul; `outlet_price`, `outlet_stock`) dan `stock_outlet=<id>` (layar Stok; `outlet_stock` = saldo di outlet itu).
      parameters:
        - { name: q, in: query, required: true, description: "SKU, nama varian, atau nama produk induknya", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VariantLookup' }

  # ------------------------------------------------------------------
  # STOK
  # ------------------------------------------------------------------
  /stock/movements:
    get:
      tags: [Stock]
      summary: Riwayat pergerakan stok
      description: |
        036-bom-variant-stock-ux — dipakai layar Stok DAN riwayat transaksi per
        varian (`variant_id`). 045 Stage 5: setiap baris membawa `outlet_id/outlet_code/outlet_name`; `stock_before/after` =
        saldo outlet itu; hanya outlet yang berlaku; filter `outlet_id`. Urutan: `created_at` terbaru dulu, lalu `id`
        terbaru dulu (timestamp kembar tetap stabil). **Akses**: menu `stock`
        ATAU `products` — peran lain 403 (dulu terbuka untuk semua peran yang
        login, sehingga `user_name` tidak boleh ikut dibuka).

        `reference` diselesaikan server menjadi nomor transaksi yang bisa dibaca
        (penjualan/retur -> nomor order; transfer -> nomor transfer) dan `null` bila
        tidak bisa dibuktikan menyangkut varian ini. 046 — pergerakan lama bertipe
        `purchase`/`preorder_handover` yang menunjuk pre-order tetap tampil sebagai riwayat
        tetapi selalu `null`; tipe `preorder_handover` tidak lagi dibuat siapa pun (tidak pernah menampilkan nomor yang salah). Penyesuaian stok awal/manual
        dan impor tidak punya referensi (alasan ada di `reason`).
      parameters:
        - { name: variant_id, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [purchase, sale, preorder_handover, adjustment, return, initial] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StockMovement' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stock/adjustments:
    post:
      tags: [Stock]
      summary: Penyesuaian stok manual
      description: |
        Dipakai untuk stok awal dan hasil stock opname. Menulis baris
        `stock_movements` dan memperbarui `current_stock` dalam satu
        transaksi database. Alasan wajib diisi.
        045 Stage 5 — stok adalah saldo per outlet: `outlet_id` wajib bila pengguna melihat beberapa outlet (422), di
        luar yang boleh dilihat → 403 `outlet_forbidden`; satu outlet = outlet itu. Saldo satu outlet tidak boleh negatif (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, reason]
              properties:
                reason: { type: string, maxLength: 255, example: Stok awal event Oktober }
                outlet_id: { type: integer, description: "045: outlet yang saldonya diubah" }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [variant_id, qty_change]
                    properties:
                      variant_id: { type: integer }
                      qty_change: { type: integer, description: "Positif menambah, negatif mengurangi. Tidak boleh nol." }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  movements:
                    type: array
                    items: { $ref: '#/components/schemas/StockMovement' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stock/balances:
    get:
      tags: [Stock]
      summary: Saldo stok per (varian, outlet) (045 Stage 5)
      description: Menu `stock` atau `products`. Hanya outlet yang berlaku; filter `variant_id[]` dan `outlet_id`. `{data:[{variant_id,sku,outlet_id,outlet_code,outlet_name,on_hand}]}`.
      parameters:
        - { name: variant_id, in: query, schema: { type: array, items: { type: integer } } }
        - { name: outlet_id, in: query, schema: { type: integer } }
      responses:
        '200': { description: Berhasil }
        '403': { description: Tanpa menu stock/products }
  /stock/transfers:
    get:
      tags: [Stock]
      summary: Daftar transfer stok antar outlet (045 Stage 6)
      description: Menu `stock`. Hanya transfer yang salah satu outletnya menjadi hak pemanggil (outlet nonaktif tetap dihitung); filter `status`, `outlet_id[]`, `from`, `to`, `discrepancy=1`. Tiap baris membawa `can {receive, cancel}` yang dihitung server (izin + penugasan).
      responses:
        '200': { description: "{data:[{id,number,status,has_discrepancy,from_outlet,to_outlet,line_count,dispatched_at/by,received_at/by,cancelled_at/by,can}], meta}" }
    post:
      tags: [Stock]
      summary: Membuat DAN mengirim transfer
      description: >
        Izin `stock.transfer.dispatch`; outlet asal harus hak pemanggil (403 `outlet_forbidden`). Outlet berbeda dan aktif, baris
        (kind variant|material, item_id, qty > 0; item harus melacak stok, jumlah bulat) → 422; saldo asal tidak cukup → 409/422 dengan nama
        outlet. Saldo asal turun seketika (`transfer_out`); barang berstatus dalam perjalanan. `client_ref` idempoten (`200` untuk
        pengulangan). Item yang tidak dijual di tujuan hanya memberi peringatan `not_carried_at_destination`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_outlet_id, to_outlet_id, lines]
              properties:
                from_outlet_id: { type: integer }
                to_outlet_id: { type: integer }
                note: { type: string, maxLength: 255 }
                client_ref: { type: string, maxLength: 64 }
                lines:
                  type: array
                  items: { type: object, required: [kind, item_id, qty], properties: { kind: { type: string, enum: [variant, material] }, item_id: { type: integer }, qty: { type: number } } }
      responses:
        '201': { description: Transfer dikirim }
        '200': { description: Pengulangan client_ref }
        '403': { description: Tanpa izin / outlet asal di luar jangkauan }
        '422': { description: Validasi }
  /stock/transfers/{id}:
    get:
      tags: [Stock]
      summary: Detail transfer (baris, langkah, jejak buku besar, peringatan)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Berhasil }
        '404': { description: Di luar jangkauan }
  /stock/transfers/{id}/receive:
    post:
      tags: [Stock]
      summary: Menerima transfer
      description: >
        Izin `stock.transfer.receive` dan outlet tujuan hak pemanggil (nonaktif tetap boleh). `lines[{line_id, qty_received, reason}]`
        (kosong = terima semua). Kurang dari dikirim → `reason` wajib dan transfer ditandai selisih; lebih → 422; kedua kali → 409.
      responses:
        '200': { description: Diterima }
        '403': { description: Izin / outlet }
        '409': { description: Bukan dalam perjalanan }
        '422': { description: Selisih tanpa alasan / lebih dari dikirim }
  /stock/transfers/{id}/cancel:
    post:
      tags: [Stock]
      summary: Membatalkan transfer yang belum diterima
      description: Izin `stock.transfer.cancel` dan outlet asal hak pemanggil. Barang kembali ke outlet asal (`transfer_cancel`). Hanya in_transit (409 selain itu).
      responses:
        '200': { description: Dibatalkan }
        '403': { description: Izin / outlet }
        '409': { description: Bukan dalam perjalanan }
  /stock/transfers/discrepancies:
    get:
      tags: [Stock]
      summary: Selisih transfer (dikirim − diterima, alasan, penerima)
      responses:
        '200': { description: "{data:[{number,from_outlet,to_outlet,item,qty_sent,qty_received,shortfall,reason,received_by}]}" }
  /stock/in-transit:
    get:
      tags: [Stock]
      summary: Jumlah dalam perjalanan per item dan arah
      parameters: [{ name: outlet_id, in: query, schema: { type: array, items: { type: integer } } }]
      responses:
        '200': { description: "{data:[{kind,item,from_outlet,to_outlet,qty,transfers[]}]}" }
  /stock/low:
    get:
      tags: [Stock]
      summary: Varian dengan stok menipis (per outlet)
      description: |
        Varian aktif yang `current_stock`-nya sudah di titik atau di bawah
        `low_stock_alert` masing-masing. Varian tanpa `low_stock_alert`
        (null) tidak pernah muncul di sini — belum ada ambang untuk dicek.
        045 Stage 5 — stok adalah saldo PER OUTLET: satu baris per (varian, outlet) yang punya saldo ≤ ambang, hanya untuk
        outlet yang berlaku; `current_stock` = saldo di outlet itu; baris membawa `outlet_id/outlet_code/outlet_name`.
        Definisi yang sama dengan angka "stok menipis" Dashboard.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        variant_id: { type: integer }
                        sku: { type: string }
                        product_name: { type: string }
                        current_stock: { type: integer }
                        low_stock_alert: { type: integer }

  # ------------------------------------------------------------------
  # SESI KASIR (046: tanpa event)
  # ------------------------------------------------------------------
  /sessions/current:
    get:
      tags: [Session]
      summary: Sesi kasir aktif milik pengguna (per SUMBER permintaan)
      description: |
        045 — membawa `outlet_id` dan `outlet {id, code, name}` (outlet shift); sama untuk POST /sessions dan `session` pada ringkasan shift.

        **065 — shift aplikasi dan shift web dipisah.** Yang dikembalikan adalah shift terbuka milik pengguna dari SUMBER
        permintaan ini: tablet (membawa `X-Device-Id`) atau web (tanpa header). 404 bila sumber itu tidak punya shift terbuka,
        walaupun sumber lain punya.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierSession' }
        '404':
          description: Tidak ada sesi terbuka

  /sessions:
    get:
      tags: [Session]
      summary: Daftar shift (065)
      description: |
        Owner/admin melihat SEMUA shift (aplikasi dan web) pada outlet dan mode data yang diizinkan; pengguna lain hanya
        shift miliknya (`user_id` orang lain diabaikan). Angka per baris dari kueri terkelompok (jumlah kueri tidak naik
        bersama jumlah baris); shift tertutup membaca nilai yang tersimpan. Terbuka dulu, lalu terbaru.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, closed, all], default: open } }
        - { name: source, in: query, schema: { type: string, enum: [app, web] } }
        - { name: user_id, in: query, description: "Hanya berlaku untuk owner/admin.", schema: { type: integer } }
        - { name: date_from, in: query, description: "Tanggal bisnis shift (Y-m-d).", schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Daftar shift
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ShiftRow' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Session]
      summary: Buka sesi kasir
      description: |
        Ditolak (409) bila pengguna masih memiliki sesi lain berstatus `open` DARI SUMBER YANG SAMA. **065:** shift
        aplikasi (tablet, `X-Device-Id`) dan shift web berdiri sendiri — satu pengguna boleh memegang satu dari masing-masing
        sumber; pembayaran, refund, dan kas masuk/keluar masuk ke shift sumbernya. Kas awal: `opening_cash` (total ketikan)
        ATAU `opening_denominations` (pecahan), jangan keduanya berbeda.

        046-hide-events-preorders — shift TIDAK lagi terikat event: `event_id` DIHAPUS dari body (nilai yang masih
        dikirim klien lama diabaikan) dan tidak ada lagi aturan "hanya pada event aktif"; shift hanya butuh kas awal
        dan outlet (dipilih server).

        006-purchase-order-and-ops (US6) — `opening_cash_entries[]` opsional
        memecah `opening_cash` per artist (satu sesi kasir tetap satu baris
        `cashier_sessions`, bukan satu sesi per artist). Bila diisi, jumlah
        seluruh `amount` WAJIB persis sama dengan `opening_cash` (422 bila
        tidak).

        048 / S2 — kas awal boleh diberikan sebagai `opening_denominations[]` (pecahan × qty); jumlahnya
        DIHITUNG SERVER (`opening_cash` diturunkan darinya). `opening_cash` lama tetap diterima; bila keduanya
        dikirim, harus sama (422). Pecahan di luar {100000, 50000, 20000, 10000, 5000, 2000, 1000, 500, 200, 100}
        dan pecahan ganda ditolak 422. Header `X-Device-Id` (opsional) mencatat terminal pembuka; terminal yang
        dicabut atau milik outlet lain → 422 `errors.device_id`.
      parameters:
        - name: X-Device-Id
          in: header
          required: false
          description: 048 — id terminal (`devices.id`) yang membuka shift. Tanpa header (SPA web) tetap berjalan.
          schema: { type: string, example: "1" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Isi salah satu: `opening_cash` ATAU `opening_denominations`."
              properties:
                outlet_id:
                  type: integer
                  nullable: true
                  description: >
                    045 Stage 2 — outlet shift. Opsional: tanpa nilai dipakai satu-satunya outlet yang berlaku
                    (penugasan atau header X-Outlet-Id); lebih dari satu → 422 `errors.outlet_id`. Di luar outlet
                    yang boleh dilihat → 403 `outlet_forbidden`. Pengguna non-admin tanpa penugasan → 409
                    `outlet_unassigned`. Order, pembayaran dan tiket di shift ini mewarisi outletnya.
                opening_cash: { type: string, example: "500000.00", nullable: true }
                opening_denominations:
                  type: array
                  nullable: true
                  description: 048 — hitungan kas awal per pecahan. Baris ber-qty nol diabaikan.
                  maxItems: 10
                  items:
                    type: object
                    required: [denomination, qty]
                    properties:
                      denomination: { type: integer, enum: [100000, 50000, 20000, 10000, 5000, 2000, 1000, 500, 200, 100] }
                      qty: { type: integer, minimum: 0, maximum: 100000 }
                opening_cash_entries:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required: [amount]
                    properties:
                      outlet_id: { type: integer, nullable: true }
                      amount: { type: string, example: "250000.00" }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Sesi dibuka
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sessions/{id}/close:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Session]
      summary: Tutup sesi kasir
      description: |
        Server menghitung `expected_cash` dari kas awal ditambah pembayaran
        tunai terverifikasi pada sesi DIKURANGI kembalian (`orders.change_amount`),
        tanpa order yang dibatalkan (`voided`) — rumus yang sama dengan panel
        shift di halaman Sales — lalu menghitung selisih terhadap
        `closing_cash` yang dilaporkan kasir. Hanya order berstatus `completed`
        yang dihitung (028: tab `open` tidak pernah masuk).

        **028 — `409` bila shift masih memegang tab terbuka**; badan respons memuat
        `open_tabs` (id, nomor, meja/label) supaya UI bisa menautkannya. Tab harus
        dibayar, dibatalkan, atau diserahkan ke shift lain dulu.

        **065 — total ketikan.** Selain per pecahan, kasir boleh mengetik total uang di laci: `counted_total` (rupiah
        utuh ≥ 0; tidak bersama `counted_by_denomination`, 422). Kedua cara itu memakai protokol terkontrol yang sama
        (di bawah); persetujuan selisih terikat ke angka yang DIKIRIM (pecahan atau `counted_total`). **EDC dihapus dari
        alur tutup:** `edc_batch_total` tidak diterima lagi (diabaikan), tidak disimpan, dan tidak ada di `z_report`.
        `expected_cash` kini juga ada di ringkasan dan X-report sebelum menghitung (keputusan pemilik; hitungan buta 048 dihentikan).

        **048 / S2 — protokol terkontrol.** Kirim `counted_by_denomination[]` (kasir menghitung per pecahan).
        Server menjumlahkan hitungan itu sendiri, lalu:
        - `409 pending_payments` bila masih ada pembayaran QRIS (`qr_ewallet`) berstatus `pending` di shift ini;
        - `409 override_required` bila |selisih| > `variance_tolerance` (`GET /settings/features`, bawaan Rp 5.000);
          shift TIDAK ditutup. Persetujuan selisih belum tersedia (S3/US4).
        Hanya protokol terkontrol (pecahan atau `counted_total`) yang memeriksa dua aturan itu. Bentuk lama (`closing_cash` saja) tetap
        seperti sebelumnya. Salah satu dari `closing_cash` atau `counted_by_denomination` wajib (422).

        Menerima header `Idempotency-Key` (satu UUID per niat tutup): pengiriman ulang dengan kunci yang sama
        mengembalikan hasil tutup yang tersimpan, bukan 409. `expected_cash` hanya muncul di respons ini (dan
        di Z-report), tidak di ringkasan atau X-report sebelum hitungan dikirim.

        Respons memuat `z_report`: salinan angka shift saat tutup (sama dengan X-report plus hitungan, selisih,
        toleransi, `edc_batch_total`, dan `closed_at`), disimpan supaya laporan lama tidak ikut berubah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Isi `counted_by_denomination` (pecahan) ATAU `counted_total` (total ketikan, 065) ATAU `closing_cash` (bentuk lama).
              properties:
                closing_cash: { type: string, nullable: true, example: "2350000.00" }
                counted_total: { type: number, nullable: true, minimum: 0, description: "065 — total uang di laci, rupiah utuh; tidak bersama `counted_by_denomination`." }
                counted_by_denomination:
                  type: array
                  nullable: true
                  maxItems: 10
                  items:
                    type: object
                    required: [denomination, qty]
                    properties:
                      denomination: { type: integer, enum: [100000, 50000, 20000, 10000, 5000, 2000, 1000, 500, 200, 100] }
                      qty: { type: integer, minimum: 0, maximum: 100000 }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Sesi ditutup
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierSession' }
        '409':
          description: Sesi sudah ditutup, ATAU masih ada tab terbuka (memuat `open_tabs`), ATAU (048) `pending_payments`/`override_required`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: string, enum: [open_tabs, pending_payments, override_required], nullable: true }
                  variance: { type: string, nullable: true }
                  tolerance: { type: string, nullable: true }
                  open_tabs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        order_number: { type: string }
                        table: { type: string, nullable: true, description: Nama meja; null untuk takeaway. }
                        tab_label: { type: string, nullable: true }

  /overrides:
    post:
      tags: [Override]
      summary: Terbitkan persetujuan di titik aksi (048 / S3)
      description: |
        Penyetuju memasukkan PIN-nya; server menghitung hash subjek SENDIRI dari `subject` (id objek + bidang body aksi), dan
        mengembalikan `override_token` sekali pakai, berlaku **120 detik**, terikat ke aksi, bidang body itu, outlet
        aktif peminta, dan peminta. Token hanya dikembalikan sekali; server hanya menyimpan hash-nya.

        `subject` = identitas objek (id path: tab, sesi, baris, produk, pembayaran) SERTA bidang body aksi yang dijaga.
        Token terikat ke objek itu: persetujuan untuk baris A tidak berlaku untuk baris B (422 `override_mismatch`).
        Daftar per aksi: void_line → tab_id, line_id, reason_code, kitchen_status, stock_decision, reason;
        cancel_order → tab_id, reason_code, reason; cash_out → session_id, direction, amount, reason_code;
        variance → session_id, counted_by_denomination; availability → product_id, reason_code_id, note, outlet_ids;
        qris_verify → tab_id, payment_id, reference; qris_fail → tab_id, payment_id.
        Server tidak pernah menerima hash dari klien. Aksi yang dijaga memanggil `override_token` dari body-nya dan
        menghitung ulang subjek dari body-nya sendiri; tidak cocok → `422 override_mismatch`.

        **Batasan yang disadari**: karena parameter path tidak ikut dalam subjek, token tidak terikat ke tab/baris/
        sesi/produk tertentu; terikat ke aksi, bidang body, outlet, peminta, 120 dtk, dan sekali pakai.

        Aksi: `void_line` (reason_code, kitchen_status, stock_decision, reason), `cancel_order` (reason_code, reason),
        `cash_out` (direction, amount, reason_code), `variance` (counted_by_denomination), `availability`
        (reason_code_id, note, outlet_ids), `qris_verify` (reference), `qris_fail` (tanpa bidang).

        Penyetuju harus aktif, berada di outlet yang sama, memegang izin aksi, dan bukan peminta. PIN penyetuju memakai
        kunci 5-salah yang sama dengan login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, subject, approver_user_id, pin]
              properties:
                action: { type: string, enum: [void_line, cancel_order, cash_out, variance, availability, qris_verify, qris_fail, discount, reprint, refund] }
                subject: { type: object, description: "Identitas objek (id path) + bidang body aksi yang dijaga (lihat deskripsi)." }
                approver_user_id: { type: integer }
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '201':
          description: Token diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  override_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { description: "PIN penyetuju salah (`code` = invalid_pin; `attempts_remaining` menyertai)." }
        '403': { description: "Penyetuju tidak berwenang (`approver_not_permitted`) atau outlet di luar jangkauan (`outlet_forbidden`)." }
        '409': { description: "Penyetuju sama dengan peminta (`same_person`)." }
        '422': { description: Validasi body. }
        '429': { description: "PIN penyetuju terkunci setelah 5 kali salah (`pin_locked`, `locked_until`)." }

  /overrides/approvers:
    get:
      tags: [Override]
      summary: Daftar penyetuju yang memenuhi syarat untuk aksi (048 / S3)
      description: |
        Respons berupa **larik polos** `[{id, name, role}]` (bukan dibungkus `data`). Hanya penyetuju aktif yang punya
        PIN, di outlet aktif (header `X-Outlet-Id`), memegang izin aksi, dan bukan peminta.
      parameters:
        - { name: action, in: query, required: true, schema: { type: string, enum: [void_line, cancel_order, cash_out, variance, availability, qris_verify, qris_fail, discount, reprint, refund] } }
        - { name: X-Outlet-Id, in: header, required: false, schema: { type: integer } }
      responses:
        '200':
          description: Larik penyetuju
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    role: { type: string, nullable: true }

  /tabs/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Restaurant]
      summary: Batalkan seluruh tab terbuka (048 / S3)
      description: |
        Menjalankan pembatalan tab (stok kembali hanya untuk item yang belum dimasak). `409 has_payments` bila tab sudah
        dibayar (tanpa alur refund). Peminta tanpa izin `order.cancel` wajib `override_token` dari `POST /overrides`
        (aksi `cancel_order`, bidang body: reason_code, reason); tanpa itu `409 override_required`. Token dan pembatalan
        dalam satu transaksi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string, enum: [wrong_item, customer_request, kitchen_error, other] }
                reason: { type: string, maxLength: 255 }
                override_token: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Tab dibatalkan (status voided)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '409': { description: "`has_payments`, `override_required`, `override_expired`, atau tab tidak terbuka." }
        '422': { description: "`override_mismatch` atau validasi body." }

  /tabs/{id}/payments/{payment}/verify:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: payment, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Restaurant]
      summary: Verifikasi pembayaran tab; QRIS wajib referensi dan persetujuan (048 / S3)
      description: |
        Non-QRIS: perilaku lama. QRIS (`qr_ewallet`): `reference` minimal 4 karakter (422 bila kurang) dan persetujuan
        `qris_verify` bila peminta tanpa `payment.qris.verify` (`409 override_required` bila tidak ada). Pencatat
        pembayaran tidak boleh memverifikasi sendiri (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: { type: string, minLength: 4, maxLength: 40 }
                override_token: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Pembayaran terverifikasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "`override_required`, `override_expired`, atau pembayaran sudah terverifikasi." }
        '422': { description: "`override_mismatch` atau referensi kurang dari 4 karakter." }

  /tabs/{id}/payments/{payment}/fail:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: payment, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Restaurant]
      summary: Tandai QRIS tidak ditemukan di mutasi (048 / S3)
      description: |
        Hanya QRIS, hanya selama tab masih terbuka. Pembayaran menjadi `rejected` dan keluar dari total terbayar.
        Butuh persetujuan `qris_fail` bila peminta tanpa `payment.qris.verify`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                override_token: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Pembayaran ditandai rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "`override_required`, `override_expired`, tab tidak terbuka, atau pembayaran bukan pending." }
        '422': { description: "`override_mismatch` atau pembayaran bukan QRIS." }

  /sessions/{id}/x-report:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Session]
      summary: X-report shift (048 — dihitung langsung, tidak disimpan)
      description: |
        Angka shift saat ini, dihitung dengan rumus yang SAMA dengan `summary` dan Z-report saat tutup
        (ShiftReportService). Tidak menutup shift dan tidak menyimpan apa pun. Pemilik shift atau owner/admin.
        **Tanpa `expected_cash`**: kas seharusnya baru tampil setelah hitungan buta dikirim (respons tutup dan Z-report).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at: { type: string, format: date-time }
                  session_id: { type: integer }
                  terminal_name: { type: string, nullable: true, description: "064 — terminal tempat shift berjalan; berlaku juga untuk summary dan Z-report." }
                  status: { type: string, enum: [open, closed] }
                  opening_cash: { $ref: '#/components/schemas/Money' }
                  order_count: { type: integer }
                  total_sales: { $ref: '#/components/schemas/Money' }
                  void_count: { type: integer }
                  void_total: { $ref: '#/components/schemas/Money' }
                  change_given: { $ref: '#/components/schemas/Money' }
                  cash_received: { $ref: '#/components/schemas/Money' }
                  cash_in: { $ref: '#/components/schemas/Money' }
                  cash_out: { $ref: '#/components/schemas/Money' }
                  expected_cash: { $ref: '#/components/schemas/Money', description: "065 — kas seharusnya di laci; kini dikirim sebelum menghitung (keputusan pemilik)." }
                  by_method:
                    type: array
                    items:
                      type: object
                      properties:
                        method: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
                        count: { type: integer }
                        amount: { $ref: '#/components/schemas/Money' }
                  hourly:
                    type: array
                    description: Penjualan per jam dinding toko (jam dengan penjualan saja).
                    items:
                      type: object
                      properties:
                        hour: { type: string, example: "09" }
                        order_count: { type: integer }
                        total: { $ref: '#/components/schemas/Money' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sessions/{id}/cash-movements:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Session]
      summary: Daftar kas masuk/keluar shift (048)
      description: Pemilik shift atau owner/admin. Diurutkan menurut urutan pencatatan.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CashMovement' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Session]
      summary: Catat kas masuk atau keluar (048 — api-gap B3)
      description: |
        Kas masuk/keluar di luar penjualan (uang kecil, setor bank, tambah modal). Hanya di shift TERBUKA milik
        pengguna. Alasan wajib dan harus sah untuk arahnya; `other` wajib catatan.
        Kas keluar di atas `cash_out_approval_threshold` (`GET /settings/features`) ditolak `409 override_required`
        dan TIDAK dicatat; persetujuan belum tersedia (S3/US4). Menerima `Idempotency-Key`: permintaan yang
        diulang dengan kunci sama hanya dicatat sekali.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: UUID per niat. Permintaan ulang dengan kunci sama tidak mencatat baris kedua.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, reason_code, amount]
              properties:
                direction: { type: string, enum: [in, out] }
                reason_code:
                  type: string
                  description: "in → float_topup | change_exchange | other; out → petty_cash | supplier | bank_deposit | other"
                reason_note: { type: string, nullable: true, maxLength: 200, description: "Wajib bila reason_code = other." }
                amount: { type: string, example: "30000.00", description: "Harus > 0, paling banyak dua desimal." }
      responses:
        '201':
          description: Kas dicatat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashMovement' }
        '403':
          description: Shift milik pengguna lain (`code` = session_not_owner).
        '409':
          description: Shift sudah ditutup (`session_closed`), atau kas keluar di atas ambang (`override_required`, tidak dicatat).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: string, enum: [session_closed, override_required] }
                  threshold: { type: string, nullable: true }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sessions/{id}/summary:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Session]
      summary: Ringkasan sesi kasir
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }

  # ------------------------------------------------------------------
  # PEMBAYARAN
  # ------------------------------------------------------------------
  /payment-channels:
    get:
      tags: [Payment]
      summary: Daftar kanal pembayaran non-tunai
      description: |
        Mengembalikan rekening bank dan QR e-wallet yang aktif untuk
        ditampilkan ke pelanggan.

        CATATAN KEAMANAN — hanya peran owner dan admin yang menerima
        `account_number` lengkap. Peran kasir menerima nomor tersamar
        pada daftar, dan nomor penuh hanya saat kanal dipilih untuk satu
        transaksi.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentChannel' }
    post:
      tags: [Payment]
      summary: Tambah kanal pembayaran (owner/admin)
      description: |
        Task 4 — `qr_image` kini bisa diikutsertakan saat membuat kanal
        (sebelumnya tidak ada field gambar sama sekali di endpoint ini,
        sehingga kanal QR baru tidak pernah punya cara diberi gambar QR).
        Disimpan di disk publik supaya bisa dirender langsung oleh UI POS.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, provider, account_name]
              properties:
                type: { type: string, enum: [bank_transfer, qr_ewallet] }
                provider: { type: string, maxLength: 50 }
                account_name: { type: string, maxLength: 100 }
                account_number: { type: string, nullable: true, description: Wajib untuk bank_transfer. }
                display_order: { type: integer }
                qr_image:
                  type: string
                  format: binary
                  description: JPEG atau PNG, maksimal 5 MB. Opsional — bisa ditambahkan belakangan lewat POST /payment-channels/{id}.
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentChannel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payment-channels/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Payment]
      summary: Ubah kanal pembayaran, termasuk gambar QR (owner/admin)
      description: |
        Task 4 — endpoint yang SEBELUMNYA SAMA SEKALI TIDAK ADA (hanya
        index()/store() yang terdaftar). Tanpa ini, kanal yang sudah
        dibuat tanpa QR code tidak bisa diberi gambar belakangan.
        Memakai POST, bukan PUT, karena unggahan multipart/form-data
        dengan method override lebih konsisten diimplementasikan di
        klien lewat POST langsung.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                type: { type: string, enum: [bank_transfer, qr_ewallet] }
                provider: { type: string, maxLength: 50 }
                account_name: { type: string, maxLength: 100 }
                account_number: { type: string, nullable: true }
                display_order: { type: integer }
                is_active: { type: boolean }
                qr_image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
                remove_qr_image:
                  type: boolean
                  description: Menghapus gambar QR yang sudah ada tanpa menggantinya.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentChannel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Payment]
      summary: Hapus kanal pembayaran (soft delete) (owner/admin)
      description: |
        024-invoice-layout-shipping-slip — soft-delete kanal pembayaran.
        Mengembalikan 409 jika kanal sedang digunakan oleh payment yang
        sudah ada (FK constraint).
      responses:
        '204':
          description: Berhasil dihapus
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payment-proofs:
    post:
      tags: [Payment]
      summary: Unggah bukti pembayaran
      description: |
        Dipanggil sebelum transaksi disimpan. Mengembalikan `proof_token`
        yang disertakan saat membuat order atau pembayaran.
        Token tanpa transaksi akan dibersihkan otomatis setelah 24 jam.

        CATATAN KEAMANAN (area risiko: input validation) — tipe berkas
        diverifikasi dari isi berkas, bukan dari header klien. Berkas
        disimpan dengan nama acak di luar direktori publik.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, captured_via]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG atau PNG, maksimal 5 MB setelah kompresi klien
                captured_via:
                  type: string
                  enum: [webcam, upload]
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  proof_token: { type: string, format: uuid }
                  file_size: { type: integer }
        '413':
          description: Berkas melebihi batas ukuran
        '422': { $ref: '#/components/responses/ValidationError' }

  /payment-proofs/{id}/file:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Payment]
      summary: Ambil berkas bukti pembayaran
      description: |
        Disajikan melalui pemeriksaan izin, bukan tautan langsung ke penyimpanan. Boleh dibuka:
        owner/admin, pengunggah berkas, dan (031-optional-payment-proof) pencatat pembayaran untuk
        bukti yang BERLAKU pada pembayaran itu (bukti yang ditambahkan owner belakangan tetap bisa
        dibuka kasir pemilik pembayarannya). Bukti yang sudah diganti (`superseded_at`) hanya untuk
        owner/admin dan pengunggahnya. Pengguna lain → 403.
      responses:
        '200':
          description: Berkas gambar
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # PENJUALAN
  # ------------------------------------------------------------------
  /orders:
    get:
      tags: [Sales]
      summary: Daftar transaksi
      parameters:
        - { name: session_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [completed, voided] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
    post:
      tags: [Sales]
      summary: Buat transaksi penjualan
      description: |
        Endpoint inti kasir. Seluruh operasi berjalan dalam satu transaksi
        database: order, order_items, payments, payment_proofs, dan
        stock_movements.

        **Aturan yang ditegakkan server:**
        - Sesi kasir harus berstatus `open`
        - Harga diambil dari master, bukan dari kiriman klien
        - Pembayaran non-tunai wajib menyertakan `channel_id`; `proof_token` (foto/berkas bukti) OPSIONAL
          sejak 031-optional-payment-proof — bisa ditambahkan belakangan lewat
          `PATCH /orders/{id}/payments/{payment_id}/confirmation`. Token yang dikirim harus valid dan belum terpakai.
        - Total pembayaran harus menutup `total_amount` — KECUALI penjualan memiliki
          `customer_id` (028-partial-split-payment): penjualan boleh selesai
          dibayar sebagian (`completed`, stok berkurang, `change_amount` 0) dan
          sisanya dilunasi lewat `POST /orders/{id}/payments`. Tanpa pelanggan,
          pembayaran kurang → 409 `customer_required_for_partial_payment`.
        - Stok tidak boleh menjadi negatif

        **Idempotensi** — sertakan `local_ref` berupa UUID yang dibuat
        klien. Bila permintaan dengan `local_ref` sama dikirim ulang,
        server mengembalikan transaksi yang sudah ada, bukan membuat baru.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: Transaksi tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Stok tidak mencukupi, sesi tertutup, atau local_ref sudah dipakai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sales]
      summary: Detail transaksi
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/reprints:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Sales]
      summary: Cetak ulang struk — salinan pertama gratis, berikutnya dengan persetujuan (048 / S4)
      description: |
        `copy_no` = salinan yang akan dicetak; salinan asli adalah 1, jadi cetak ulang pertama = 2 (gratis menurut
        `reprint_free_copies`, bawaan 1). Cetak ulang berikutnya butuh `override_token` dengan action `reprint` dan
        subjek `order_id`, `copy_no`. `copy_no` yang tidak sama dengan salinan berikutnya di server → 409
        `reprint_copy_changed` dengan `copy_no` yang benar (muat ulang struk). Hanya order `completed`; selain itu 409
        `order_not_completed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [copy_no]
              properties:
                copy_no: { type: integer, minimum: 2, example: 2 }
                override_token: { type: string, nullable: true }
      responses:
        '200':
          description: Salinan dicatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: { type: integer }
                  copy_no: { type: integer, description: "Nomor salinan yang dicetak (2 = cetak ulang pertama)." }
                  free: { type: boolean }
                  receipt_no: { type: string, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}/refund:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Sales]
      summary: Refund penuh order yang sudah lunas — selalu butuh persetujuan (048 / S4)
      description: |
        Refund penuh untuk order `completed` yang sudah lunas penuh, belum pernah direfund, dan tanpa QRIS tertunda.
        SELALU butuh `override_token` (action `refund`, subjek `order_id`, `reason_code`, `reason`); tidak ada bypass
        izin peminta. Efek: stok dikembalikan lewat pergerakan `return` (referensi baris order); bagian tunai dikembalikan
        sebagai kas keluar `refund` di SHIFT BERJALAN pengguna yang meminta; order asal TIDAK diubah (total, bayar,
        kembalian, status tetap `completed`, `refunded_at` dicatat). Laporan lama tidak berubah.

        ASUMSI (lihat laporan): tidak ada batasan kanal — `online` dan `offline` sama-sama dapat direfund, karena
        refund booth adalah kasus utama. `reason_code` dari kategori `refund`.

        Galat: `409 order_not_refundable` (belum selesai atau dibatalkan), `order_already_refunded`,
        `order_not_fully_paid`, `pending_payments` (QRIS tertunda), `shift_required`, `override_required`;
        `422 override_mismatch`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string, example: wrong_item }
                reason: { type: string, nullable: true, maxLength: 200 }
                override_token: { type: string, nullable: true }
      responses:
        '200':
          description: Refund dicatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: { type: integer }
                  refunded_at: { type: string, format: date-time, description: "Status order tetap completed; kolom ini menandai refund." }
                  refund_total: { type: string, example: "8000.00" }
                  cash_returned: { type: string, example: "8000.00", description: "Bagian tunai yang keluar dari laci shift berjalan (0.00 bila tanpa tunai)." }
                  session_id: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}/void:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Sales]
      summary: Batalkan transaksi
      description: |
        Transaksi tidak dihapus. Status berubah menjadi `voided` dan stok
        dikembalikan melalui `stock_movements` bertipe `return`.
        Hanya peran owner dan admin yang diizinkan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Dibatalkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{id}/payments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Sales]
      summary: Pembayaran susulan atas penjualan POS yang dibayar sebagian (028-partial-split-payment, US5)
      description: |
        Mencatat SATU pembayaran dan mengembalikan penjualan terbaru dengan `payment_summary`.
        Siapa saja yang login boleh mencatat (sama seperti checkout). Aturan, semuanya dinilai
        setelah baris order dikunci:
        - `client_ref` (UUID) yang sama pada order yang sama → **200** tanpa pembayaran baru
          (idempotensi); ref milik transaksi lain → 422;
        - order `voided` → 409; sudah lunas → 409; `amount` > sisa tagihan → 422 (`errors.amount`
          menyebut maksimumnya);
        - pembayaran **tunai** memerlukan sesi kasir TERBUKA milik pencatat (409 bila tidak ada) dan
          disimpan di `payments.session_id` — uang dihitung di shift tempat ia diterima; non-tunai
          mencatat sesi bila ada;
        - non-tunai wajib `channel_id`; `proof_token` opsional (031) — bukti bisa ditambahkan belakangan.
        Menulis baris `activity_logs` `payment_recorded` di transaksi yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Pembayaran baru tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Replay `client_ref` — tidak ada pembayaran baru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { description: "Order batal, sudah lunas, atau tunai tanpa sesi kasir terbuka" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}/payments/{payment_id}:
    delete:
      tags: [Sales]
      summary: Hapus satu pembayaran penjualan POS (028-partial-split-payment)
      description: |
        Hanya owner/admin (403 untuk peran lain). 404 bila pembayaran bukan milik order ini. 409 untuk
        order `voided`, dan untuk pembayaran **tunai** milik shift yang SUDAH ditutup (sudah direkonsiliasi —
        menghapusnya akan merusak laporan shift). Menghapus baris pembayaran dan buktinya, menghitung ulang
        `paid_amount`, dan menulis `activity_logs` `payment_deleted` (jumlah/status lama dan baru).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: payment_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Order sesudah dihitung ulang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Order batal, atau tunai milik shift yang sudah ditutup" }

  /orders/{id}/payments/{payment_id}/verify:
    post:
      tags: [Sales]
      summary: Tandai satu pembayaran non-tunai penjualan POS terverifikasi (032-mark-payment-verified)
      description: |
        032-mark-payment-verified — menandai SATU pembayaran non-tunai yang masih `pending` sebagai
        `verified` (sudah dicocokkan dengan mutasi bank/e-wallet). Tanpa body. **Satu arah dan FINAL:**
        tidak ada route untuk membatalkan verifikasi (keputusan produk); jejaknya ada di activity log.

        **Otorisasi:** owner/admin, atau pengguna mana pun KECUALI pencatat pembayaran itu
        (`payments.recorded_by`) — pencatat → 403. Pembayaran lama tanpa pencatat boleh diverifikasi siapa pun.

        **Aturan** (setelah baris transaksi dikunci, jadi dua klik serentak berlaku berurutan): pembayaran
        milik transaksi ini (404 bila bukan); penjualan `voided` → 409; tunai → 422 (`errors.method`; tunai sudah
        terverifikasi sejak dicatat); sudah `verified` → 409; `rejected` → 409.

        Menulis `verified_by`/`verified_at` dan baris `activity_logs` `payment_verified` (nilai lama/baru) di
        transaksi yang sama. Tidak mengubah jumlah, metode, kanal, status, total, kas yang diharapkan, atau
        laporan; pembayaran itu kini muncul di rincian per-metode `GET /sessions/{id}/summary` (rincian itu
        sejak awal hanya menghitung pembayaran terverifikasi).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: payment_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Penjualan sesudah diverifikasi (payments[] memuat verification, verified_by_name, verified_at, can_verify)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Penjualan batal, atau pembayaran sudah terverifikasi / ditolak" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/verify-payments:
    post:
      tags: [Sales]
      summary: Verifikasi massal pembayaran non-tunai dari beberapa penjualan (032-mark-payment-verified, US3)
      description: |
        Untuk tiap penjualan terpilih (id dari daftar Sales), memverifikasi setiap pembayaran NON-TUNAI yang
        masih `pending` lewat jalur satu-pembayaran yang sama (satu transaksi dan satu baris audit
        `payment_verified` per pembayaran). Yang tak bisa diverifikasi pemanggil DILEWATI dan dihitung per
        alasan, tidak menggagalkan sisanya: `voided` (penjualan batal), `rejected`, `already_verified`,
        `own_payment` (dicatat pemanggil, kecuali owner/admin). Pembayaran tunai diabaikan (tidak dihitung).
        Id yang tak ditemukan / milik mode DEMO-LIVE lain diabaikan. Satu arah dan final seperti verifikasi
        tunggal. Hitungan adalah jumlah PEMBAYARAN, kecuali `verified_orders`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_ids]
              properties:
                order_ids: { type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: { type: integer } }
      responses:
        '200':
          description: Ringkasan
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: integer }
                  verified_orders: { type: integer }
                  skipped:
                    type: object
                    properties:
                      already_verified: { type: integer }
                      own_payment: { type: integer }
                      voided: { type: integer }
                      rejected: { type: integer }
                  skipped_total: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}/payments/{payment_id}/confirmation:
    patch:
      tags: [Sales]
      summary: Tambah / ubah / ganti konfirmasi pembayaran penjualan POS (031-optional-payment-proof)
      description: |
        031-optional-payment-proof — menambah, mengubah, atau mengganti KONFIRMASI sebuah pembayaran
        non-tunai yang sudah tercatat: bukti (`proof_token` dari `POST /payment-proofs`), `reference`,
        dan `notes`. Semua kunci opsional; minimal satu harus dikirim (422 `errors.confirmation`).
        Mengirim `null` mengosongkan referensi/catatan, tetapi hasil akhirnya tidak boleh kosong
        sama sekali (bukti, referensi, dan catatan semuanya tak ada → 422). Bukti tidak bisa
        dihapus mentah, hanya diganti: bukti lama ditandai `superseded_at`, file dan barisnya
        DIPERTAHANKAN untuk audit.

        **Otorisasi:** owner/admin, atau pengguna yang mencatat pembayaran itu (`payments.recorded_by`);
        pengguna lain → 403. Pembayaran lama tanpa pencatat → hanya owner/admin.

        **Aturan** (setelah baris transaksi dikunci): pembayaran milik transaksi ini (404 bila bukan);
        penjualan `voided` → 409; pembayaran tunai → 422 (`errors.method`); token bukti tak dikenal/sudah terpakai → 422.

        Tidak pernah mengubah jumlah, metode, kanal, waktu, status, total, atau kas shift. Menulis
        `activity_logs` `payment_confirmation_updated` (nilai lama dan baru) di transaksi yang sama.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: payment_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentConfirmationInput' }
      responses:
        '200':
          description: Penjualan sesudah diubah (payments[] memuat notes, proof_id, has_proof, can_view_proof, can_edit_confirmation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Penjualan sudah dibatalkan" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}/receipt:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sales]
      summary: Data struk
      description: Mengembalikan data siap tampil untuk struk di layar, termasuk identitas toko dari pengaturan dan `app_name` (nama aplikasi untuk teks "Powered by …"). 028-partial-split-payment — juga `paid_amount`, `balance_amount`, `payment_status` (`unpaid|partially_paid|fully_paid`) dan `reference`/`paid_at` per pembayaran; struk yang diambil ulang setelah pembayaran susulan memuatnya. 045 — `outlet_name`/`outlet_code` = outlet tempat penjualan terjadi (outlet shift); SPA mencetaknya hanya bila ada lebih dari satu outlet.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }

  # ------------------------------------------------------------------
  # POS DRAFTS (006-purchase-order-and-ops, US4)
  # ------------------------------------------------------------------
  /pos-drafts:
    get:
      tags: [Sales]
      summary: Daftar draft transaksi kasir milik pengguna saat ini
      description: |
        Tidak menyentuh stok — checkout tetap menghitung ulang harga dari
        master data saat draft dilanjutkan, sesuai Constitution IV. Hanya
        draft milik pengguna yang login (dilingkupi kepemilikan, bukan
        menu_keys — setiap kasir yang login sudah boleh bertransaksi POS).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PosDraftSummary' }
    post:
      tags: [Sales]
      summary: Simpan keranjang POS saat ini sebagai draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                customer_id: { type: integer, nullable: true }
                label: { type: string, nullable: true, maxLength: 100 }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [variant_id, qty]
                    properties:
                      variant_id: { type: integer }
                      sku: { type: string, nullable: true }
                      qty: { type: integer, minimum: 1 }
                      sell_price:
                        type: string
                        nullable: true
                        description: Snapshot tampilan saja, bukan sumber harga sungguhan.
                discount_amount: { type: string }
      responses:
        '201':
          description: Draft tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosDraftSummary' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /pos-drafts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sales]
      summary: Lanjutkan draft — kembalikan keranjang siap dipakai POS
      description: 404 bila draft bukan milik pengguna yang login (bukan 403 — tidak membocorkan keberadaan draft pengguna lain).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Sales]
      summary: Buang draft
      responses:
        '204': { description: Dibuang }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # PURCHASE ORDER (006-purchase-order-and-ops, US1)
  # ------------------------------------------------------------------
  /purchase-orders:
    get:
      tags: [Purchase Order]
      summary: Daftar purchase order
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, ordered, received, paid, cancelled] } }
        - { name: vendor_id, in: query, schema: { type: integer } }
        - { name: artist_id, in: query, description: 034-seller-po-bom — saring menurut seller yang dibelikan., schema: { type: integer } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Purchase Order]
      summary: Buat purchase order (selalu berstatus draft)
      description: |
        `material_id` wajib untuk baris `line_type=material`, `description`
        wajib untuk baris `line_type=service` (FR-001). `product_id` selalu
        opsional apa pun `line_type`-nya (tautan bahan baku ke produk
        tertentu). `po_number` dibuat server, unik lintas mode DEMO/LIVE.

        034-seller-po-bom — `artist_id` (seller yang dibelikan) WAJIB: satu
        seller per purchase order. Seller inilah dasar filter selector BOM.
        `product_id` ("Linked Product") tidak lagi ditawarkan UI, tetapi
        tetap diterima dan disimpan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /purchase-orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Purchase Order]
      summary: Detail purchase order (termasuk items dan payments)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Purchase Order]
      summary: Perbarui purchase order
      description: |
        Baris item hanya boleh diubah selama status masih `draft` — 409 bila tidak.

        034-seller-po-bom — `artist_id`: menetapkan seller pada PO lama
        (tanpa seller, `artist_id: null`) selalu boleh; MENGUBAH seller
        ditolak 409 bila salah satu baris PO ini sudah dipakai baris BOM.
        Setiap penetapan/perubahan ditulis ke activity log
        (`purchase_order_seller_assigned` / `purchase_order_seller_changed`).

        035-po-row-actions — PO berstatus APA PUN (kecuali dibatalkan, 409)
        tetap bisa mengubah vendor, seller, dan catatan; baris dikunci setelah
        `draft`. Perubahan vendor/total/baris ditulis ke activity log
        (`purchase_order_updated`, nilai lama + baru) di transaksi yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Purchase Order]
      summary: Hapus purchase order
      description: |
        Hanya diizinkan selama status masih `draft` — 409 bila tidak (pesan
        menyarankan Batalkan untuk status lain). 035-po-row-actions: juga 409
        bila PO sudah punya pembayaran, atau salah satu barisnya sudah dipakai
        baris BOM varian — penghapusan tidak boleh meninggalkan data yatim.
        Penghapusan ditulis ke activity log di transaksi yang sama.
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /purchase-orders/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Purchase Order]
      summary: Ubah status purchase order
      description: |
        Transisi yang diizinkan: `draft`→`ordered`|`cancelled`,
        `ordered`→`received`|`cancelled`, `received`→`paid`. Transisi lain
        ditolak 409. Saat pindah ke `received`, setiap baris `material`
        menambah `current_stock` bahan baku terkait via
        `MaterialStockService::applyMovement()` dan mencatat
        `ActivityLogger` di transaksi yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ordered, received, paid, cancelled] }
                cancel_reason: { type: string, nullable: true, maxLength: 255 }
      responses:
        '200':
          description: Status diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /purchase-orders/{id}/payments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Purchase Order]
      summary: Catat pembayaran ke vendor untuk purchase order ini
      description: Lewat PaymentRecorder yang sama dengan pembayaran order (parameter purchaseOrderId).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount]
              properties:
                method: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
                channel_id: { type: integer, nullable: true }
                amount: { type: string }
                proof_token: { type: string, format: uuid, nullable: true }
                notes: { type: string, nullable: true, maxLength: 1000 }
      responses:
        '201':
          description: Pembayaran dicatat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /purchase-orders/{id}/invoice:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Purchase Order]
      summary: Data faktur purchase order (dirender jadi PDF di klien)
      description: |
        Endpoint ini murni data — sama seperti struk penjualan, PDF-nya
        dirender di klien lewat html2canvas + jsPDF, bukan generator PDF
        di server.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------
  # PELANGGAN
  # ------------------------------------------------------------------
  /customers:
    get:
      tags: [Master Data]
      summary: Cari pelanggan
      parameters:
        - { name: search, in: query, description: "Nama, telepon, atau akun media sosial", schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Customer' }
    post:
      tags: [Master Data]
      summary: Buat pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

  /customers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Master Data]
      summary: Perbarui pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
    delete:
      tags: [Master Data]
      summary: Hapus pelanggan
      description: |
        009-ui-ux-refinements (US4). Soft delete, owner/admin saja. Ditolak
        (409) bila pelanggan masih memiliki order (status apa pun) yang
        mereferensikannya. 046 — pre-order lama (riwayat diam) tidak dihitung.
      responses:
        '204': { description: Berhasil }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/{id}/transactions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data]
      summary: Riwayat transaksi pelanggan
      description: |
        009-ui-ux-refinements (US5). Daftar ringkas order (penjualan) milik
        pelanggan, terbaru dulu (046: pre-order sudah dihapus dari riwayat).
        Tier otorisasi baca sama dengan GET /customers (tidak diperluas).
        `status` memakai kolom status order (completed/voided).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [order] }
                        id: { type: integer }
                        number: { type: string }
                        status: { type: string }
                        total_amount: { type: string }
                        date: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customers/export:
    get:
      tags: [Master Data]
      summary: Ekspor daftar pelanggan ke .xlsx (020-customer-data-import-export, US1)
      description: |
        Digerbang canAccessAnyMenu(['artists','categories','products','stock',
        'vendors','materials','roles','users']) — tier owner/admin/inventory,
        sama seperti bulk master-data lain (GET /exports/{entity}), lebih
        ketat dari GET /customers yang terbuka untuk semua peran termasuk
        kasir. Berkas terpisah dari workbook master-data gabungan — lihat
        research.md Decision 1 di specs/020-customer-data-import-export/.
        Hanya mencakup pelanggan pada mode data (DEMO/LIVE) yang sedang aktif.
      responses:
        '200':
          description: "Berkas .xlsx (kolom: name, phone, address, email, social_handle, notes)"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /customers/import/template:
    get:
      tags: [Master Data]
      summary: Unduh template impor pelanggan (020-customer-data-import-export, US2)
      description: Kolom header sama persis dengan GET /customers/export, supaya berkas ekspor langsung valid diimpor ulang.
      responses:
        '200':
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /customers/import:
    post:
      tags: [Master Data]
      summary: Impor batch pelanggan dari .xlsx (020-customer-data-import-export, US2/US3)
      description: |
        Validasi PENUH dulu, baru diterapkan sekaligus dalam satu transaksi
        (all-or-nothing, meniru MasterDataImportService/PreorderImport).
        ATURAN BARU: baris dengan `email` yang cocok (case-insensitive,
        exact match, dalam mode data aktif) dengan pelanggan yang sudah ada
        meng-UPDATE pelanggan itu (sel kosong tidak mengosongkan nilai yang
        sudah ada), bukan membuat duplikat. Baris tanpa email SELALU
        membuat pelanggan baru. `dry_run=1` melewati jalur validasi yang
        identik untuk pratinjau (US3), tanpa menulis apa pun.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Berkas .xlsx, maks 10 MB. }
                dry_run: { type: string, enum: ['1'], description: Validasi tanpa menyimpan (pratinjau). }
      responses:
        '200':
          description: Pratinjau (dry_run=1) — tidak ada yang disimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerImportResult' }
        '201':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerImportResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Validasi gagal — tidak ada baris yang disimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  row_errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        errors: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # LAPORAN
  # ------------------------------------------------------------------
  # --- 042-dashboard-revamp -------------------------------------------------------------------
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Ringkasan Dashboard (empat angka utama, pembanding, deret tren)
      description: |
        Butuh menu `dashboard` (403 bila tidak). Dihitung saat dibaca dan di-cache ≤ 30 detik per
        [mode data, periode, hari bisnis, zona waktu, cut-off]; `computed_at` = kapan dihitung.
        `today` membandingkan dengan KEMARIN sampai jam yang sama (deret per jam); `7d`/`30d`
        membandingkan dengan periode sebelumnya yang sama panjang (deret per hari).
        `kpis.orders` menghitung order SEMUA status; `avg_order_value` = bersih ÷ order SELESAI
        (`null` bila belum ada); `change_pct` `null` bila pembanding nol; `low_stock` memakai
        `change_abs` dan selalu `scope: organisation`. Penjualan bersih mengikuti definisi halaman Sales.
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [today, 7d, 30d], default: today } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '403': { description: Tanpa menu dashboard }
        '422': { description: period tidak valid }

  /dashboard/shifts:
    get:
      tags: [Dashboard]
      summary: Shift terbuka semua pengguna untuk panel dashboard (065)
      description: "Satu baris per shift terbuka (aplikasi dan web), maks. 50, terbaru dulu; `total_open` = jumlah sebenarnya. Owner/admin melihat semua pengguna; peran lain dengan menu dashboard hanya miliknya. 403 tanpa menu `dashboard`."
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ShiftRow' } }
                  total_open: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cash-movements:
    get:
      tags: [Session]
      summary: Daftar kas masuk/keluar lintas shift (065)
      description: Aturan lihat sama dengan `GET /sessions`. `totals` menjumlah SELURUH hasil yang disaring, bukan hanya halaman ini.
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [in, out] } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: session_id, in: query, schema: { type: integer } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        session_id: { type: integer }
                        direction: { type: string, enum: [in, out] }
                        reason_code: { type: string }
                        reason_label: { type: string, nullable: true }
                        reason_note: { type: string, nullable: true }
                        amount: { $ref: '#/components/schemas/Money' }
                        created_by_name: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                        terminal_name: { type: string, nullable: true }
                        source: { type: string, enum: [app, web] }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
                  totals:
                    type: object
                    properties:
                      in: { $ref: '#/components/schemas/Money' }
                      out: { $ref: '#/components/schemas/Money' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /server-address:
    get:
      tags: [Settings]
      summary: Alamat server pilihan admin untuk tablet baru — PUBLIK (065)
      description: |
        Tanpa token dan tanpa terminal: dibaca tablet saat "Siapkan terminal" lewat alamat bawaan yang tertanam di
        aplikasi. HANYA alamat yang dipilih admin keluar; alamat satunya tidak pernah. Dibatasi laju (30/menit) dan tetap
        di balik gerbang lisensi (423 bila belum aktivasi). `url` null bila pilihan itu belum punya alamat.
        `GET /devices/server-address` (butuh terminal) tetap ada untuk APK lama.
      security: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  selected: { type: string, enum: [local, online] }
                  url: { type: string, nullable: true }
        '423': { description: Instalasi belum aktivasi }
        '429': { description: Terlalu banyak permintaan }

  /dashboard/attention:
    get:
      tags: [Dashboard]
      summary: Butir "Perlu tindakan" untuk hari bisnis ini
      description: |
        Selalu memuat SEMUA jenis (`payments_pending`, `void_after_fire`, `cash_difference`, `low_stock`);
        yang tidak perlu tindakan berseverity `ok` dengan `count` 0. `count` teratas = jumlah butir yang
        tidak `ok`. `link` null bila pemanggil tidak berhak membuka halaman tujuan. `payments_pending`
        menghitung ORDER POS/tab (bukan baris pembayaran); `void_after_fire` menghitung baris item yang
        dibatalkan setelah tiket dikirim (nilai = qty × harga snapshot; `amount_unknown_count` untuk
        pembatalan lama tanpa harga); `cash_difference` = shift ditutup hari ini dengan selisih di atas
        toleransi (setting `cash_difference_tolerance`).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardAttention' }
        '403': { description: Tanpa menu dashboard }

  /dashboard/orders:
    get:
      tags: [Dashboard]
      summary: Tabel "Order terbaru" (tab dengan jumlah, pencarian, filter)
      description: |
        Tiap order tepat satu tab: `cancelled` (voided) → `open` → `partial` (selesai, belum lunas) →
        `paid`. `counts` dihitung dengan semua filter KECUALI tab. `hidden_tabs` (`bill`, `closed`) adalah
        tab desain yang belum punya data di produk ini. Rentang tanggal bawaan = rentang periode.
        Tanpa data kontak pelanggan.
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [today, 7d, 30d] } }
        - { name: tab, in: query, schema: { type: string, enum: [all, open, partial, paid, cancelled], default: all } }
        - { name: q, in: query, description: "Cari no. order, nama meja, nama item.", schema: { type: string, maxLength: 100 } }
        - { name: type, in: query, style: form, explode: true, schema: { type: array, items: { type: string, enum: [retail, dine_in, takeaway] } } }
        - { name: method, in: query, style: form, explode: true, schema: { type: array, items: { type: string, enum: [cash, bank_transfer, qr_ewallet] } } }
        - { name: pstat, in: query, style: form, explode: true, schema: { type: array, items: { type: string, enum: [unpaid, pending, partial, paid] } } }
        - { name: from, in: query, description: "Tanggal bisnis.", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Tanggal bisnis.", schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, total_amount, -total_amount, order_number, -order_number], default: -created_at } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardOrders' }
        '403': { description: Tanpa menu dashboard }
        '422': { description: Parameter tidak valid }

  /dashboard/orders/export:
    get:
      tags: [Dashboard]
      summary: Ekspor CSV baris yang sama dengan tabel "Order terbaru"
      description: Filter yang sama dengan `GET /dashboard/orders`, tanpa halaman; UTF-8 dengan BOM; tanpa data kontak.
      responses:
        '200':
          description: Berkas CSV
          content:
            text/csv: { schema: { type: string, format: binary } }
        '403': { description: Tanpa menu dashboard }

  /dashboard/export:
    get:
      tags: [Dashboard]
      summary: Ekspor CSV Dashboard (empat angka, pembanding, titik tren, butir perlu tindakan)
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [today, 7d, 30d], default: today } }
      responses:
        '200':
          description: Berkas CSV (angka sama dengan summary dan attention yang dihitung pada permintaan ini)
          content:
            text/csv: { schema: { type: string, format: binary } }
        '403': { description: Tanpa menu dashboard }

  # --- 043-products-page-redesign -------------------------------------------------------------
  /products/summary:
    get:
      tags: [Menu]
      summary: Angka header layar Produk (aktif, 86 hari ini, belum dirilis, kualitas data)
      description: |
        Terbuka untuk pengguna yang login (seperti daftar produk). Semua angka sama dengan baris di bawahnya
        (SC-001): `active` = item menu bukan-ritel berstatus aktif dengan total/draft/discontinued; `sold_out_today`
        = item dengan tanda 86 yang berlaku; `unreleased` = perubahan menu yang belum dirilis, `null` bila
        `menu_release_enabled` mati; `quality` = jenis kekurangan data pertama yang ada (`no_station`, `no_price`,
        `no_cost`) beserta contoh namanya.
      responses:
        '200': { description: Berhasil }

  /reason-codes:
    get:
      tags: [Menu]
      summary: Daftar kode alasan (86, diskontinu, penolakan persetujuan)
      description: Terbuka untuk pengguna login; `include_inactive=1` hanya berlaku untuk menu `settings`. Label dalam bahasa pengguna.
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [sold_out, discontinue, approval_reject] } }
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Berhasil }
    post:
      tags: [Menu]
      summary: Membuat kode alasan (menu settings)
      responses:
        '201': { description: Dibuat }
        '403': { description: Bukan admin }
        '422': { description: Kode ganda atau tidak valid }

  /reason-codes/{id}:
    put:
      tags: [Menu]
      summary: Mengubah label/urutan/status kode alasan (kode tidak pernah dihapus)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Berhasil }
        '403': { description: Bukan admin }

  /permission-catalog:
    get:
      tags: [Menu]
      summary: Katalog izin tingkat-aksi untuk layar Peran
      responses:
        '200': { description: "{data:[{key,label}]}" }

  /products/{id}/price-history:
    get:
      tags: [Menu]
      summary: Riwayat harga dasar semua varian item (terbaru dulu; baris terakhir = pembuatan)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '200': { description: "{data:[{at,variant,outlet_id,outlet_code,old_price,new_price,source,by,approved_by,release_version,note}], meta}. 045: baris harga OUTLET membawa outlet_id/outlet_code (null = harga dasar) dan hanya untuk outlet yang boleh dilihat pemanggil." }

  /products/{id}/sold-out:
    post:
      tags: [Menu]
      summary: Menandai item habis (86)
      description: |
        048 / S3 — izin `menu.availability.set`. Tanpa izin itu, `override_token` dari `POST /overrides` (aksi
        `availability`, bidang body: reason_code_id, note, outlet_ids) WAJIB; tanpa itu `409 override_required`.
        Alasan wajib dari kategori `sold_out`. Berlaku sampai akhir hari
        bisnis (zona waktu toko + cut-off) atau sampai dibatalkan; item tidak bisa ditambahkan ke order/tab
        baru (409) tetapi baris yang sudah ada tidak berubah. 409 bila item didiskontinu atau sudah ditandai.

        045 Stage 3 — per outlet: `outlet_ids` (opsional; tiap id harus termasuk outlet yang boleh dilihat, selain itu 422;
        `[]` → 422) menandai HANYA outlet-outlet itu (satu tanda per outlet). Tanpa `outlet_ids`: outlet yang DIPILIH
        (`X-Outlet-Id`) bila ada; selain itu tanda GLOBAL yang berlaku di semua outlet (perilaku lama). Bentrok (409)
        bila sudah ada tanda aktif yang berlaku di outlet itu. DELETE menerima `outlet_ids` yang sama dan hanya
        membatalkan tanda outlet-outlet itu (403 `outlet_forbidden` di luar jangkauan). Order/tab juga ditolak (422)
        bila item TIDAK DIBAWA outlet shift/tab (`unavailable_not_carried`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason_code_id], properties: { reason_code_id: { type: integer }, note: { type: string, maxLength: 255 }, override_token: { type: string, maxLength: 64 } } }
      responses:
        '201': { description: Ditandai }
        '403': { description: Tanpa izin }
        '409': { description: Sudah ditandai / didiskontinu }
        '422': { description: Alasan tidak valid }
    delete:
      tags: [Menu]
      summary: Membatalkan tanda 86
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Tersedia lagi }
        '403': { description: Tanpa izin }
        '409': { description: Tidak sedang ditandai }

  /products/{id}/discontinue:
    post:
      tags: [Menu]
      summary: Mendiskontinu item
      description: |
        Izin `menu.item.manage`; alasan wajib (kategori `discontinue`). Rilis menu mati: berlaku seketika
        (`is_active=false`, tanda 86 dibatalkan); rilis aktif: membuat `menu_change` (`change` terisi) dan status
        BELUM berubah sampai rilis berikutnya. Riwayat dan laporan tidak berubah.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason_code_id], properties: { reason_code_id: { type: integer }, note: { type: string, maxLength: 255 } } }
      responses:
        '200': { description: "{id,status,is_active,change}" }
        '403': { description: Tanpa izin }
        '409': { description: Sudah didiskontinu }

  /products/{id}/reactivate:
    post:
      tags: [Menu]
      summary: Mengaktifkan kembali item yang didiskontinu
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: "{id,status,is_active,change}" }
        '403': { description: Tanpa izin }
        '409': { description: Tidak sedang didiskontinu }

  /menu/availability:
    get:
      tags: [Menu]
      summary: Poll ketersediaan untuk terminal (tanda 86, item didiskontinu, versi menu)
      description: Dipanggil ±tiap 5 detik oleh POS/lantai; hanya kenyamanan — server menolak lagi saat order. `304` bila `since` sama dengan etag.
      parameters:
        - { name: since, in: query, schema: { type: string } }
      responses:
        '200': { description: "{etag,menu_version,sold_out:[{product_id,variant_ids,reason_code,expires_at}],discontinued_ids}" }
        '304': { description: Tidak berubah }

  /price-changes/preview:
    post:
      tags: [Menu]
      summary: Pratinjau ubah harga massal (tidak menyimpan apa pun)
      description: |
        Izin `menu.price.bulk`. Dihitung set-based oleh server: `{items:[{product,variant,old_price,new_price}], count, warnings[]}`.
        `422` bila tak ada kategori, nilai kosong/nol, `effective_from` di masa lalu, harga hasil ≤ 0, atau cakupan tak cocok apa pun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_ids, type, value, effective_from]
              properties:
                category_ids: { type: array, items: { type: integer } }
                type: { type: string, enum: [percent, amount] }
                value: { type: number }
                rounding: { type: string, enum: [none, "500"] }
                effective_from: { type: string, format: date }
                price_scope: { type: string, enum: [base, outlets, all_outlets], default: base, description: "045: base = harga dasar (perilaku lama); outlets/all_outlets = harga khusus per outlet (harga lama = harga efektif di outlet; item yang tidak dibawa outlet dilewati; 422 saat rilis menu aktif)" }
                outlet_ids: { type: array, items: { type: integer }, description: "Wajib untuk price_scope=outlets; harus termasuk outlet yang boleh dilihat" }
      responses:
        '200': { description: "Pratinjau; tiap item membawa outlet_id/outlet_code (null untuk harga dasar)" }
        '403': { description: Tanpa izin }
        '422': { description: Validasi }

  /price-changes:
    post:
      tags: [Menu]
      summary: Menerapkan ubah harga massal (semua-atau-tidak-sama-sekali)
      description: |
        Body sama dengan pratinjau; server menghitung ulang. Rilis mati: harga berlaku langsung (atau malas pada
        `effective_from`) dan `price_history` ditulis lewat `PriceService`. Rilis aktif: satu `menu_change` per varian di bawah satu
        `price_change_batch`; yang melewati ambang persetujuan berstatus `awaiting_approval`.
      responses:
        '200': { description: "{batch_id,applied,pending,awaiting_approval}" }
        '403': { description: Tanpa izin }
        '422': { description: Validasi }

  /products/{id}/variants:
    put:
      tags: [Menu]
      summary: Simpan seluruh varian satu produk dalam satu batch (drawer Varian)
      description: |
        Semua-atau-tidak-sama-sekali di satu transaksi; harga dasar hanya lewat `PriceService`
        (riwayat harga, mode rilis/persetujuan). `409 cost_price_locked_by_bom|recipe` bila biaya dikunci.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Varian tersimpan (dan perubahan harga yang menunggu, bila ada) }
        '403': { description: Tanpa izin }
        '409': { description: Konflik aturan bisnis }
        '422': { description: Validasi }

  /products/{id}/modifier-links:
    put:
      tags: [Menu]
      summary: Mengganti tautan grup modifier sebuah item dengan aturan per item
      description: |
        Izin ubah produk. Mengganti SELURUH tautan item itu dalam satu transaksi; isi grup (opsi) tidak berubah.
        Aturan tautan (`is_required`, `min_select`, `max_select`, `display_order`) menimpa aturan grup saat order
        (`ModifierResolver`). `max_select` kosong = tanpa batas. Rilis aktif: diantrekan sebagai `menu_change`
        jenis `modifier_link` (`applied:false`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [links]
              properties:
                links:
                  type: array
                  items:
                    type: object
                    required: [group_id]
                    properties:
                      group_id: { type: integer }
                      is_required: { type: boolean }
                      min_select: { type: integer, minimum: 0 }
                      max_select: { type: integer, nullable: true, minimum: 1 }
                      display_order: { type: integer, minimum: 0 }
      responses:
        '200': { description: "{applied, change:{id,kind,status}|null}" }
        '403': { description: Tanpa izin }
        '422': { description: "Aturan tidak valid (0 ≤ min ≤ max, grup tak dikenal/ganda)" }

  /products/{id}/recipes:
    get:
      tags: [Menu]
      summary: Daftar versi resep sebuah item (terbaru dulu)
      description: |
        Menu `products`. `is_active_now` = versi aktif untuk setidaknya satu varian. Bidang biaya (`portion_cost`,
        `incomplete`, `food_cost_pct`) hanya untuk pemegang menu produk/laporan DAN izin `menu.recipe.edit`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: "{data:[{id,version,yield,effective_from,note,variants[],is_active_now,portion_cost?,food_cost_pct?}]}" }
        '403': { description: Tanpa menu produk }
    post:
      tags: [Menu]
      summary: Membuat versi resep berikutnya
      description: |
        Menu `products` + izin `menu.recipe.edit`. Versi tidak pernah diubah; menyimpan = versi baru, versi lama tetap.
        Rumus biaya satu tempat (`RecipeCost`): `jumlah ÷ (1 − susut%/100) × biaya satuan`, biaya porsi = Σ ÷ yield.
        Biaya satuan = harga vendor acuan, atau `standard_cost` bahan setengah jadi. Baris tanpa biaya membuat hasil
        `incomplete` (tidak pernah nol diam-diam). `cost_price` varian yang tercakup ditulis saat versi mulai berlaku.
        Tanpa pemotongan stok bahan dan tanpa konversi satuan.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yield, effective_from, variant_ids, lines]
              properties:
                yield: { type: number, description: "> 0" }
                effective_from: { type: string, format: date, description: "Tidak lebih dari 30 hari ke belakang" }
                note: { type: string, maxLength: 500 }
                variant_ids: { type: array, items: { type: integer } }
                lines:
                  type: array
                  items:
                    type: object
                    required: [material_id, quantity]
                    properties:
                      material_id: { type: integer }
                      quantity: { type: number, description: "> 0, satuan bahan" }
                      shrinkage_pct: { type: number, minimum: 0, maximum: 99.99 }
      responses:
        '201': { description: "Versi dibuat (bentuk sama dengan GET /recipes/{id})" }
        '403': { description: Tanpa izin }
        '409': { description: "`cost_source_conflict` — varian BOM-selesai dipilih" }
        '422': { description: Validasi }

  /products/{id}/recipes/recalculate:
    post:
      tags: [Menu]
      summary: Hitung ulang biaya varian yang digerakkan resep
      description: Menulis ulang `cost_price` dari biaya porsi SAAT INI (harga vendor berubah). Biaya tak lengkap dilewati (`skipped`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: "{updated:[{variant_id,sku,cost_price}], skipped:[{variant_id,sku,reason}]}" }
        '403': { description: Tanpa izin }

  /recipes/{id}:
    get:
      tags: [Menu]
      summary: Satu versi resep lengkap dengan baris bahan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: "Versi + lines[{material_id,name,unit,kind,quantity,shrinkage_pct,unit_cost?,line_cost?}] + portion_cost?, food_cost_pct?, gross_margin?, incomplete?" }
        '403': { description: Tanpa menu produk }

  /menu/changes:
    get:
      tags: [Menu]
      summary: Perubahan menu yang menunggu rilis
      description: Menu `products`. Filter `status`, `kind`. Hanya bermakna saat rilis menu aktif (`menu_release_enabled`).
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [price, item_publish, item_discontinue, item_reactivate, modifier_link] } }
      responses:
        '200': { description: "{data:[{id,kind,status,summary,requested_by,created_at,...}]}" }

  /menu/changes/{id}/cancel:
    post:
      tags: [Menu]
      summary: Membatalkan perubahan yang belum dirilis
      description: Pengaju perubahan atau pemegang `menu.release.publish`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Dibatalkan }
        '403': { description: Bukan pengaju dan tanpa izin rilis }
        '409': { description: Sudah dirilis atau dibatalkan }

  /menu/releases:
    get:
      tags: [Menu]
      summary: Daftar versi rilis menu
      responses:
        '200': { description: "{data:[{id,version,status,publish_at,published_at,note,change_count}]}" }
    post:
      tags: [Menu]
      summary: Membuat rilis berikutnya
      description: |
        Izin `menu.release.publish`. Hanya memuat perubahan `pending` (tanpa persetujuan) atau `approved`;
        `409 changes_not_ready` bila ada yang masih `awaiting_approval`. Terbit seketika bila `publish_at` kosong/sudah lewat,
        selain itu dijadwalkan dan diterbitkan malas (`publishDue`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                publish_at: { type: string, format: date-time, nullable: true }
                note: { type: string }
                change_ids: { type: array, items: { type: integer } }
      responses:
        '201': { description: Rilis dibuat }
        '403': { description: Tanpa izin }
        '409': { description: changes_not_ready }

  /menu/releases/{id}:
    get:
      tags: [Menu]
      summary: Detail rilis (perubahan yang dimuat tepat, pengaju, penyetuju, perilis)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: "Rilis + changes[]" }

  /menu/releases/{id}/cancel:
    post:
      tags: [Menu]
      summary: Membatalkan rilis yang DIJADWALKAN
      description: Izin `menu.release.publish`. Perubahan di dalamnya kembali menunggu.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Dibatalkan }
        '403': { description: Tanpa izin }
        '409': { description: Bukan rilis terjadwal }

  /approvals:
    get:
      tags: [Menu]
      summary: Daftar persetujuan perubahan harga
      description: Izin `menu.price.approve`. Memuat pengaju, varian, harga lama → baru, `difference_pct`, dan ambang.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [menu_price] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
      responses:
        '200': { description: "{data:[...]}" }
        '403': { description: Tanpa izin }

  /approvals/{id}/approve:
    post:
      tags: [Menu]
      summary: Menyetujui perubahan harga
      description: "Satu jalur (`ApprovalService`): pengaju ≠ penyetuju — `409 self_approval` bila sama."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Disetujui }
        '403': { description: Tanpa izin }
        '409': { description: self_approval atau sudah diputuskan }

  /approvals/{id}/reject:
    post:
      tags: [Menu]
      summary: Menolak perubahan harga
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason_code_id], properties: { reason_code_id: { type: integer }, note: { type: string } } }
      responses:
        '200': { description: Ditolak }
        '403': { description: Tanpa izin }
        '409': { description: Sudah diputuskan }

  # 045 Stage 7 — CATATAN untuk seluruh laporan per outlet di bawah (nama rute di berkas ini masih memakai istilah lama
  # "artist"; rute sebenarnya: /reports/outlet-settlements, /reports/outlet-profit, /reports/stock-by-outlet):
  # baris dikelompokkan per outlet TEMPAT penjualan (outlet shift/pre-order); order dan pre-order LAMA (`outlet_backfilled`)
  # tetap atas nama penjual lamanya dan barisnya membawa `historical: true` (angka lampau tidak bergeser). Σ baris =
  # total; hanya outlet yang berlaku untuk pemanggil; stok per outlet membaca saldo `variant_outlet_stock`.
  /reports/sales:
    get:
      tags: [Report]
      summary: Laporan penjualan
      description: |
        045 Stage 4 — tiap baris `transactions[]` membawa `sold_at_name`/`sold_at_code` (outlet TEMPAT penjualan = outlet shift;
        beda dari `outlet_names`, outlet asal item).

        046-hide-events-preorders — tidak ada lagi event dan pre-order: angka dan baris hanya dari order `completed`
        (POS/tab); `event_id` dan pengelompokan `event` DIHAPUS, `totals.pos_*` sama dengan angka bersama (kunci
        dipertahankan), dan respons tidak lagi membawa `event`. Tanpa `date_from`/`date_to` laporan ini memuat SEMUA
        penjualan (SPA mengirim hari ini secara bawaan).

        042-dashboard-revamp — `date_from`/`date_to` adalah TANGGAL BISNIS (zona waktu toko +
        jam batas hari, disimpan pada `orders.business_date`), bukan tanggal UTC dari
        `created_at`; `group_by=day` mengelompokkan menurut tanggal bisnis yang sama. Angka
        `pos_*` dihitung oleh `App\Services\SalesFigures`, sumber yang sama dengan Dashboard.
      parameters:
        - { name: date_from, in: query, description: "Tanggal bisnis (Y-m-d).", schema: { type: string, format: date } }
        - { name: date_to, in: query, description: "Tanggal bisnis (Y-m-d).", schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { type: string, enum: [product, category, outlet, day, customer], default: product } }
        - { name: include_voided, in: query, description: "1 = sertakan order berstatus `voided` di `transactions[]` (untuk audit). Transaksi batal TIDAK PERNAH ikut `totals`/`rows`.", schema: { type: integer, enum: [0, 1] } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
        '422':
          description: Rentang tanggal tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/sales/transactions/export:
    post:
      tags: [Report]
      summary: Ekspor daftar transaksi Sales (.xlsx)
      description: |
        Berkas berisi PERSIS baris yang tampil di halaman Sales (hanya transaksi dari POS, jadi kunci selain `order:<id>` ditolak 422). Klien hanya mengirim KUNCI baris
        (`keys`: "order:12"); seluruh isi dibangun ulang di server lewat service yang sama
        dengan `GET /reports/sales`, jadi nominal tak bisa dipalsukan dan berkas tak pernah berbeda
        dari layar. Kunci yang tak ada atau di luar filter tanggal DIABAIKAN. Tanpa `keys`
        = seluruh transaksi sesuai filter. Maks. 5000 kunci.

        Kolom: `transaction_no, status, time, customer, sellers, cashier, items` (SEMUA baris
        item, "Nama ×qty; …"), `units, discount, payment_methods, payment_status, cash, non_cash, total`;
        pengguna yang boleh melihat laporan juga mendapat `cost, margin`. Kontak pelanggan
        (telepon/email) SENGAJA tidak ikut. Nominal berupa angka agar bisa dijumlah di Excel.

        028-partial-split-payment: kolom `payment_status` kini berisi `unpaid|partially_paid|fully_paid`
        (dulu status verifikasi mentah) dan ditambah `paid`, `balance` (setelah `total`, sebelum `cost, margin`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date_from: { type: string, format: date, nullable: true }
                date_to: { type: string, format: date, nullable: true }
                include_voided: { type: boolean, nullable: true }
                keys:
                  type: array
                  maxItems: 5000
                  items: { type: string, pattern: '^order:\d+$' }
      responses:
        '200':
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Kunci tidak valid / lebih dari 5000
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/profit:
    get:
      tags: [Report]
      summary: Laporan modal dan keuntungan (per periode)
      description: |
        Laba kotor dihitung dari nilai snapshot pada `order_items`, bukan harga master saat laporan dibuka. Hanya
        peran owner dan admin.

        046-hide-events-preorders — berskala PERIODE tanggal bisnis (bawaan hari bisnis berjalan) dan penjualan
        selesai saja: tanpa `event_id`, `event`, `event_cost`, `net_profit`, dan seluruh bagian `*_pos`/`*_preorder`.
      parameters:
        - { name: date_from, in: query, description: "Tanggal bisnis (Y-m-d). Kosong DAN date_to kosong = hari bisnis berjalan.", schema: { type: string, format: date } }
        - { name: date_to, in: query, description: "Tanggal bisnis (Y-m-d), >= date_from.", schema: { type: string, format: date } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfitReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Rentang tanggal tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/outlet-profit:
    get:
      tags: [Report]
      summary: Laporan modal dan laba kotor per outlet (F9.5)
      description: |
        Untuk setiap outlet dengan minimal satu `order_items` 'completed' pada periode: `total_sales` (SUM
        `line_total`), `modal` (SUM `cost_price * qty`, snapshot yang sama dipakai `GET /reports/profit`) dan
        `gross_profit = total_sales - modal`. Dikelompokkan per outlet PELAPORAN (045 Stage 7); baris yang memuat
        penjualan lama membawa `historical: true`. 046 — periode tanggal bisnis (bawaan hari ini), tanpa event dan
        pre-order. Urut nama. Hanya peran owner dan admin.
      parameters:
        - { name: date_from, in: query, description: "Tanggal bisnis (Y-m-d). Kosong DAN date_to kosong = hari bisnis berjalan.", schema: { type: string, format: date } }
        - { name: date_to, in: query, description: "Tanggal bisnis (Y-m-d), >= date_from.", schema: { type: string, format: date } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  date_from: { type: string, format: date }
                  date_to: { type: string, format: date }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        outlet_id: { type: integer }
                        outlet_name: { type: string }
                        historical: { type: boolean }
                        total_sales: { $ref: '#/components/schemas/Money' }
                        modal: { $ref: '#/components/schemas/Money' }
                        gross_profit: { $ref: '#/components/schemas/Money' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/purchases:
    get:
      tags: [Report]
      summary: Laporan pembelian (006-purchase-order-and-ops, US9)
      description: |
        Sumbernya `purchase_orders` (Eloquent, sudah HasDataMode — bukan
        `DB::table()` mentah seperti /reports/sales), bukan `order_items`.
        Tidak diskop event. Hanya peran owner dan admin.
      parameters:
        - { name: vendor_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [draft, ordered, received, paid, cancelled] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        po_number: { type: string }
                        vendor_name: { type: string }
                        status: { type: string }
                        created_at: { type: string, format: date-time }
                        total_amount: { $ref: '#/components/schemas/Money' }
                  totals:
                    type: object
                    properties:
                      po_count: { type: integer }
                      total_amount: { $ref: '#/components/schemas/Money' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/stock-by-artist:
    get:
      tags: [Report]
      summary: Laporan stok per artist (006-purchase-order-and-ops, US10; drilldown 009-ui-ux-refinements, US7)
      description: |
        Sumbernya `product_variants` (sudah HasDataMode via join produk),
        dijumlahkan `current_stock` per artist. Tidak diskop event. Hanya
        peran owner dan admin.

        Tanpa `artist_id`: mengembalikan array ringkasan per artist (bentuk
        lama, tidak berubah). Dengan `artist_id`: mengembalikan detail
        tingkat variant untuk SATU artist tersebut, dengan join
        artist→products→variants yang sama satu level lebih dalam
        (bukan endpoint/query terpisah).
      parameters:
        - name: artist_id
          in: query
          description: |
            Opsional. Bila diisi, respons berganti bentuk menjadi detail
            satu artist (lihat StockByArtistDetail). 404 bila artist_id
            tidak ditemukan atau berada di mode DEMO/LIVE yang sedang
            tidak aktif.
          schema: { type: integer }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Ringkasan seluruh artist (artist_id tidak diisi)
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            artist_id: { type: integer }
                            artist_name: { type: string }
                            variant_count: { type: integer }
                            total_stock: { type: integer }
                  - $ref: '#/components/schemas/StockByArtistDetail'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: artist_id tidak ditemukan pada mode DEMO/LIVE yang aktif

  /reports/outlet-settlements:
    get:
      tags: [Report]
      summary: Rekap penjualan per outlet (per periode)
      description: |
        046-hide-events-preorders — dihitung LANGSUNG dari penjualan selesai pada periode (tanggal bisnis, bawaan hari
        bisnis berjalan); tidak ada lagi snapshot per event dan tidak ada lagi "tutup event". Tiap baris HANYA
        `outlet_id`, `outlet_name`, `historical`, `total_sales`, `total_units`.

        Daftar memuat seluruh outlet aktif yang berlaku untuk pemanggil, termasuk yang belum punya penjualan (nol).
        Outlet nonaktif hanya ikut bila punya penjualan pada periode. Hanya peran owner dan admin.
      parameters:
        - { name: date_from, in: query, description: "Tanggal bisnis (Y-m-d). Kosong DAN date_to kosong = hari bisnis berjalan.", schema: { type: string, format: date } }
        - { name: date_to, in: query, description: "Tanggal bisnis (Y-m-d), >= date_from.", schema: { type: string, format: date } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  date_from: { type: string, format: date }
                  date_to: { type: string, format: date }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OutletSettlement' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/outlet-settlements/{outlet}/transactions:
    parameters:
      - name: outlet
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Report]
      summary: Drill-down transaksi yang menyusun rekap satu outlet (F11.6)
      description: |
        Daftar order 'completed' pada periode yang memuat minimal satu item outlet PELAPORAN ini, dikelompokkan per
        order. `items[]` pada setiap baris HANYA memuat item milik outlet yang diminta, jadi jumlah `amount_for_outlet`
        sama dengan `total_sales` outlet itu pada rekap. Hanya peran owner dan admin.
      parameters:
        - { name: date_from, in: query, description: "Tanggal bisnis (Y-m-d). Kosong DAN date_to kosong = hari bisnis berjalan.", schema: { type: string, format: date } }
        - { name: date_to, in: query, description: "Tanggal bisnis (Y-m-d), >= date_from.", schema: { type: string, format: date } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  date_from: { type: string, format: date }
                  date_to: { type: string, format: date }
                  outlet:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: 'order-42', description: '"order-<id>".' }
                        number: { type: string, description: 'order_number.' }
                        created_at: { type: string, format: date-time, nullable: true }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              sku: { type: string }
                              name: { type: string }
                              qty: { type: integer }
                              line_total: { $ref: '#/components/schemas/Money' }
                        amount_for_outlet:
                          $ref: '#/components/schemas/Money'
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/{report}/export:
    parameters:
      - name: report
        in: path
        required: true
        schema: { type: string, enum: [sales, profit, outlet-settlements, outlet-profit, purchases, stock-by-outlet] }
    get:
      tags: [Report]
      summary: Ekspor laporan ke Excel
      description: |
        Parameter filter sama dengan endpoint laporan terkait (periode `date_from`/`date_to` untuk `profit`,
        `outlet-settlements`, `outlet-profit`). Ekspor tidak menyertakan kolom kontak pelanggan.

        `report=outlet-settlements` (F11.6) berisi DUA sheet: "Rekap" (kolom `outlet_id, outlet_name, historical,
        total_sales, total_units`, sama dengan layar) dan "Detail Transaksi" (satu baris flat per item per order pada
        periode: outlet_name, order_number, date, item_name, qty, line_total).

        `report=purchases` — satu sheet, baris sama seperti `GET /reports/purchases`. `report=stock-by-outlet` — satu
        sheet, SELALU bentuk ringkasan (per outlet).

        046 — nilai `preorder` DIHAPUS (404) bersama modul Pre-order.
      parameters:
        - { name: date_from, in: query, description: "Tanggal bisnis (Y-m-d). Kosong DAN date_to kosong = hari bisnis berjalan.", schema: { type: string, format: date } }
        - { name: date_to, in: query, description: "Tanggal bisnis (Y-m-d), >= date_from.", schema: { type: string, format: date } }
      responses:
        '200':
          description: Berkas xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '404': { description: Jenis laporan tidak dikenal }

  # ------------------------------------------------------------------
  # VENDOR, BAHAN BAKU, DAN BOM (ditambahkan pasca-MVP, 2026-09-01)
  #
  # CATATAN CAKUPAN — bukan kebangkitan "vendor management" / "materials/
  # production" yang dicoret PRD §10.2: cakupan di sini sengaja lebih
  # sempit (tidak ada purchase order, tidak ada penjadwalan produksi) dan
  # tidak berkorespondensi dengan nomor F- manapun. Lihat catatan
  # bertanggal di CLAUDE.md/README.md/PRD §10.2.
  # ------------------------------------------------------------------

  /users:
    get:
      tags: [Pengguna & Peran]
      summary: Daftar pengguna
      description: Digerbangi canAccessMenu('users') (001-user-store-settings US1).
      parameters:
        - { name: search, in: query, schema: { type: string }, description: "Mencocokkan name atau username (FR-004)." }
        - { name: role_id, in: query, schema: { type: integer } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pengguna & Peran]
      summary: Buat pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/outlets:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Pengguna & Peran]
      summary: Ganti penugasan outlet pengguna (045 Stage 2)
      description: >
        Mengganti SELURUH penugasan. Pengguna tidak boleh mengatur penugasannya sendiri (403). Pengelola tanpa
        flag `all_outlets` hanya boleh memberi dan melepas outlet yang ia lihat sendiri (403 `outlet_forbidden`).
        Owner/Admin ditolak 409 `outlet_all_by_role` (mereka melihat semua outlet). Outlet tidak ada/nonaktif → 422.
        Daftar kosong = sengaja tanpa penugasan. Dicatat di activity_logs (`user_outlets_updated`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_ids]
              properties:
                outlet_ids: { type: array, items: { type: integer } }
      responses:
        '200': { description: Pengguna dengan outlet_ids terbaru }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pengguna & Peran]
      summary: Detail pengguna
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pengguna & Peran]
      summary: Perbarui pengguna
      description: |
        password bersifat opsional (kosong berarti tidak diubah). Ditolak
        409 bila targetnya akun yang sedang login sendiri DAN perubahan
        akan menonaktifkannya atau mengganti role_id-nya (FR-006) — ini
        konflik aturan bisnis, bukan soal hak akses, jadi 409 bukan 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Pengguna & Peran]
      summary: Hapus (nonaktifkan) pengguna
      description: Soft delete. 409 bila targetnya akun yang sedang login sendiri (FR-006).
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/photo:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Pengguna & Peran]
      summary: Unggah/ganti foto pengguna
      description: Mirip persis POST /products/{id}/image, memakai ImageUploadService yang sama.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /roles:
    get:
      tags: [Pengguna & Peran]
      summary: Daftar peran
      description: |
        Digerbangi canAccessMenu('roles') (001-user-store-settings US2).
        `user_count` pada setiap baris adalah jumlah pengguna AKTIF yang
        memakai peran itu — dipasok siap pakai supaya frontend tidak perlu
        request kedua, dan supaya pesan penolakan 409 delete (FR-014)
        mengutip angka yang sama persis.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pengguna & Peran]
      summary: Buat peran
      description: |
        Setiap nilai `menu_keys` divalidasi terhadap registry
        App\Support\MenuKeys — kunci tak dikenal ditolak 422, tidak pernah
        didiamkan tersimpan tanpa efek.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /roles/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pengguna & Peran]
      summary: Detail peran
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pengguna & Peran]
      summary: Perbarui peran
      description: |
        Ditolak 409 (FR-013) bila perubahan `menu_keys` akan membuat TIDAK
        ADA satu pun peran tersisa (selain peran ini) yang mencakup KEDUA
        kunci reserved `users` DAN `roles` — toko tidak boleh pernah
        kehilangan kemampuan mengelola aksesnya sendiri.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Pengguna & Peran]
      summary: Hapus peran
      description: |
        Soft delete. Ditolak 409 bila peran masih dipakai satu atau lebih
        pengguna aktif (FR-014, pesan mengutip jumlah pengguna persis), ATAU
        bila peran ini adalah peran terakhir yang mencakup users+roles
        (FR-013, dicek sesudah FR-014).
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /menu-keys:
    get:
      tags: [Pengguna & Peran]
      summary: Registry menu/fitur yang tersedia
      description: |
        Sumber kebenaran tunggal App\Support\MenuKeys, dikembalikan sebagai
        {key,label}[] supaya layar pengaturan peran (RoleMenuPicker.vue)
