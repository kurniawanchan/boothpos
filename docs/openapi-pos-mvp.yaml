  # CATATAN CAKUPAN — bukan kebangkitan "vendor management" / "materials/
  # production" yang dicoret PRD §10.2: cakupan di sini sengaja lebih
  # sempit (tidak ada purchase order, tidak ada penjadwalan produksi) dan
  # tidak berkorespondensi dengan nomor F- manapun. Lihat catatan
  # bertanggal di CLAUDE.md/README.md/PRD §10.2.
  # ------------------------------------------------------------------

  /users:
    get:
      tags: [Pengguna & Peran]
