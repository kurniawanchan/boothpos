        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Company Onboarding]
      summary: Onboarding company
      description: Membuat company (status pending_activation) + owner User tidak aktif. Aktivasi tidak lagi lewat kode email (research.md R14, 019-billing-system third expansion) — lihat POST /companies/{id}/activate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyOnboardInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /companies/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Company Onboarding]
      summary: Detail company
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Company Onboarding]
      summary: Edit company (019-billing-system, second expansion)
      description: Mengedit data bisnis/kontak company. TIDAK menyentuh owner_username/owner_password/status/activation_* (research.md R11).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyUpdateInput' }
      responses:
