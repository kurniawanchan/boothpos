    delete:
      tags: [Vendor & Bahan Baku]
      summary: Hapus (detach) harga vendor untuk suatu bahan
      responses:
        '204': { description: Berhasil }

  # ------------------------------------------------------------------
  # 034-seller-po-bom — BOM bersumber BARIS PURCHASE ORDER.
  #
  # Baris BOM menunjuk satu baris PO milik SELLER varian itu (PO berstatus
  # ordered/received/paid) dan menyimpan SNAPSHOT item/tipe/nomor PO/vendor/
  # biaya satuan. Biaya tidak pernah mengikuti PO yang berubah; hanya
  # replace-source (eksplisit) yang mengubahnya. Baris tanpa baris PO adalah
  # baris LEGACY (is_legacy: true). Membaca BOM butuh menu `products`;
  # SEMUA aksi lain butuh menu `products` DAN `purchase_orders` (403 bila
  # tidak). Respons baca/mutasi berbentuk VariantBom { data, summary }.
  # ------------------------------------------------------------------

  /variants/{variant}/bom:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vendor & Bahan Baku]
      summary: BOM suatu varian (baris + ringkasan biaya)
      description: |
        `summary` memisahkan biaya bahan dan jasa. Baris LEGACY dihitung
        dengan harga acuan vendor hidup (perilaku lama); baris bersumber PO
        memakai snapshot `unit_cost`. `newer_price` dan `source_cancelled`
        adalah ISYARAT yang dihitung saat dibaca (tidak mengubah baris).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Vendor & Bahan Baku]
      summary: Simpan jumlah per unit beberapa baris BOM sekaligus (tombol Simpan)
      description: |
        036-bom-variant-stock-ux. Semua-atau-tidak-sama-sekali dalam SATU
        transaksi: varian dikunci sekali; setiap `id` dibuktikan milik varian ini
        SEBELUM ada yang ditulis; nilai yang tidak berubah dilewati (tanpa jejak
        audit); tiap baris yang berubah dicatat `bom_qty_changed`; bila BOM sudah
        SELESAI, harga modal disinkronkan SEKALI di akhir (`cost_price_synced`).
        Hanya `qty_needed` yang berubah; biaya/vendor/sumber tidak tersentuh.
        Penyimpan terakhir menang (tanpa versi optimistis). Perlu menu `products`
        DAN `purchase_orders`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [id, qty_needed]
                    properties:
                      id: { type: integer, description: id baris BOM; harus unik dalam permintaan. }
                      qty_needed: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Disimpan; BOM yang dimuat ulang.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Salah satu id bukan baris varian ini (mis. dihapus orang lain) — `code` = `bom_line_not_found`; tidak ada yang disimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Bentuk atau jumlah tidak valid (kunci galat `lines.N.qty_needed`); tidak ada yang disimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Vendor & Bahan Baku]
      deprecated: true
      summary: "[LEGACY] Tambah baris BOM lama (bahan + jumlah per unit)"
      description: |
        Jalur lama; membuat baris LEGACY (tanpa baris PO) dan tercatat di
        activity log (`bom_item_added`). Satu baris legacy per bahan. 409
        bila BOM varian sudah SELESAI. UI tidak lagi menawarkannya — pakai
        `POST /variants/{variant}/bom/items`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BomLineInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BomLine' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /variants/{variant}/bom/eligible-lines:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vendor & Bahan Baku]
      summary: Baris PO yang boleh dipilih untuk BOM varian ini
      description: |
        HANYA baris PO milik seller varian ini dengan status ordered,
        received, atau paid (bukan draft/cancelled/PO tanpa seller/seller
        lain/mode lain). `in_bom` menandai baris yang sudah dipakai BOM
        varian ini.
      parameters:
        - { name: q, in: query, description: Teks item/bahan/deskripsi jasa., schema: { type: string } }
        - { name: purchase_order, in: query, description: Sebagian nomor PO., schema: { type: string } }
        - { name: vendor_id, in: query, schema: { type: integer } }
        - { name: line_type, in: query, schema: { type: string, enum: [material, service] } }
        - { name: date_from, in: query, description: Tanggal PO (ordered_at, kalau belum ada created_at)., schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: per_page, in: query, description: Maksimal 100., schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EligibleBomLine' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /variants/{variant}/bom/items:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Tambah satu atau banyak baris PO ke BOM
      description: |
        Biaya satuan, vendor, nomor PO, dan nama item DISALIN SERVER dari
        baris PO (snapshot) — `unit_cost` dari klien diabaikan. `qty` =
        jumlah per SATU unit produk jadi (default 1; bilangan bulat >= 1 — 036: pecahan ditolak 422).
        Semua-atau-tidak-sama-sekali: satu baris yang ditolak membatalkan
        seluruh permintaan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [purchase_order_item_id]
                    properties:
                      purchase_order_item_id: { type: integer }
                      qty: { type: integer, minimum: 1, nullable: true, description: Bilangan bulat >= 1 (angka bulat berbentuk 2.0 / "2" diterima). }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Baris PO itu sudah ada di BOM varian ini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Bukan milik seller varian ini, PO belum/tidak ordered-received-paid, baris tidak dikenal, qty tidak valid, atau duplikat dalam permintaan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /variants/{variant}/bom/complete:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Tandai BOM selesai (harga modal mengikuti BOM)
      description: |
        Sejak itu `cost_price` varian = biaya BOM, disinkronkan otomatis pada
        setiap perubahan BOM, dan dikunci terhadap edit manual (PUT /variants
        → 409). Transaksi yang sudah tercatat tidak berubah. Idempoten.
        409 dengan `code`: `empty` (BOM kosong), `has_legacy` (masih ada
        baris legacy; `rows` menyebut baris itu), `invalid_row` (jumlah ≤ 0
        atau sumber PO bukan milik seller varian ini). PO sumber yang
        DIBATALKAN tidak menghalangi.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Belum memenuhi syarat (lihat `code`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: string, enum: [empty, has_legacy, invalid_row] }
                  rows:
                    type: array
                    items: { type: object, properties: { id: { type: integer }, item_name: { type: string, nullable: true } } }

  /variants/{variant}/bom/reopen:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Buka kembali BOM
      description: Melepas kunci `cost_price`; nilainya TETAP pada angka terakhir. Idempoten.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /variants/{variant}/bom/copy:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Salin BOM varian lain KE varian ini
      description: |
        Hanya antar varian PRODUK YANG SAMA (422 bila beda produk, varian
        sama, atau BOM sumber kosong). Baris digandakan lengkap dengan
        snapshot; sesudahnya tiap varian berdiri sendiri. Target yang sudah
        punya baris butuh `confirm_replace: true` (409
        `{code: requires_confirmation, variants: [...]}`). Salinan tidak
        pernah menandai target selesai dan MEMBUKA KEMBALI target yang
        selesai (harga modal tetap).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, source_variant_id]
              properties:
                mode: { type: string, enum: [from] }
                source_variant_id: { type: integer }
                confirm_replace: { type: boolean }
      responses:
        '200':
          description: Berhasil — VariantBom varian ini ditambah `results`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VariantBom'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/BomCopyResult' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /variants/{variant}/bom/copy-out:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Salin BOM varian ini ke varian berikutnya / semua varian lain
      description: |
        `next` = varian berikutnya (id lebih besar) pada produk yang sama;
        `all` = semua varian lain. Semua-atau-tidak-sama-sekali dalam satu
        transaksi; aturan konfirmasi dan pembukaan kembali sama dengan
        `/bom/copy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [next, all] }
                confirm_replace: { type: boolean }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/BomCopyResult' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /bom/{bomLine}:
    parameters:
      - { name: bomLine, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Vendor & Bahan Baku]
      summary: Ubah jumlah/catatan satu baris BOM
      description: |
        Hanya `qty_needed` dan `notes`; biaya/vendor/sumber tidak pernah
        berubah di sini. KONTRAK BERUBAH (034): respons kini BOM yang dimuat
        ulang (VariantBom), bukan satu baris datar. 036: `qty_needed` bilangan
        bulat >= 1; UI memakai `PUT /variants/{variant}/bom` (Simpan) untuk
        banyak baris sekaligus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qty_needed: { type: integer, minimum: 1 }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Vendor & Bahan Baku]
      summary: Hapus baris BOM
      description: |
        KONTRAK BERUBAH (034): 200 dengan BOM yang dimuat ulang (dulu 204).
        BOM SELESAI yang menjadi kosong dibuka kembali otomatis
        (`summary.reopened: true`; harga modal tetap pada nilai terakhir).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /bom/{bomLine}/replace-source:
    parameters:
      - { name: bomLine, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Ganti sumber (baris PO) sebuah baris BOM — tindakan eksplisit
      description: |
        Satu-satunya cara biaya/vendor/PO sebuah baris berubah (mis. "pakai
        harga terbaru", atau mengganti baris LEGACY dengan baris PO).
        Jumlah per unit tetap. Aturan seller + status sama dengan menambah
        baris; baris PO yang sudah dipakai baris lain BOM ini → 409; sumber
        yang sama → tanpa perubahan. Tercatat (`bom_source_replaced`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchase_order_item_id]
              properties:
                purchase_order_item_id: { type: integer }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /variants/{variant}/cost-breakdown:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vendor & Bahan Baku]
      summary: Rincian modal bahan (BOM) suatu varian
      description: |
        `bom_cost` = jumlah `qty_needed * unit_cost` seluruh baris BOM.
        `unit_cost` per baris memakai harga vendor `is_preferred` bila
        ada, kalau tidak ada yang ditandai maka harga TERMURAH dipakai
        (lihat `App\Services\BomCostCalculator` untuk alasannya). Bahan
        tanpa harga vendor sama sekali dihitung sebagai biaya nol dan
        ditandai `has_price: false`.

        **`bom_cost` TIDAK menimpa `cost_price` saat BOM belum selesai** —
        keduanya disajikan berdampingan. 034-seller-po-bom: begitu BOM
        ditandai SELESAI (`POST /variants/{variant}/bom/complete`),
        `cost_price` mengikuti `bom_cost` otomatis. Baris bersumber PO memakai
        SNAPSHOT `unit_cost`; baris LEGACY tetap memakai harga vendor acuan.
        `material_cost` + `service_cost` = `bom_cost`.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BomCostBreakdown' }

  # ------------------------------------------------------------------
  # IMPOR & EKSPOR MASTER DATA (PRD 7.15)
  #
  # CATATAN CAKUPAN — impor Excel awalnya dipotong dari MVP (PRD 10.2).
  # Ditambahkan kembali pada 2026-09-01 atas permintaan eksplisit
  # pemilik produk; keputusan pemotongan lama sengaja tidak dihapus dari
  # PRD, hanya diberi catatan bertanggal.
  # ------------------------------------------------------------------

  /exports/{entity}:
    parameters:
      - name: entity
        in: path
        required: true
        schema: { type: string, enum: [artists, categories, products, stock, vendors, materials, vendor_prices, bom, roles, users] }
    get:
      tags: [Import & Export]
      summary: Ekspor satu entitas master data ke Excel
      description: |
        Satu berkas `.xlsx` berisi SATU sheet bernama sama dengan `entity`,
        dengan judul kolom yang sama persis dengan yang diterima
        `POST /imports/master-data`. Berkas hasil ekspor karena itu bisa
        disunting lalu diunggah kembali apa adanya.

        Sheet `products` berisi **satu baris per varian** (bukan per
        produk), karena harga melekat pada varian.

        `vendors`, `materials`, `vendor_prices`, `bom` ditambahkan
        pasca-MVP (2026-09-01) — lihat catatan bertanggal di
        `CLAUDE.md`/`README.md`/PRD §10.2. `bom` berisi satu baris per
        pasangan varian+bahan, direferensikan lewat `sku` (bukan produk
        induk) karena BOM diikat ke varian.

        `roles`/`users` ditambahkan pada User Story 4 fitur
        001-user-store-settings (2026-09-02). Sheet `users` TIDAK PERNAH
        memuat kolom password (FR-007); kolom `photo_path`-nya adalah
        REFERENSI string ke path penyimpanan, bukan data biner gambarnya,
        dan diabaikan sepenuhnya bila muncul pada berkas impor.

        Digerbang `canManageMasterData()` (owner/admin/inventory) — lebih
        ketat daripada endpoint daftar yang boleh dibaca kasir, karena
        menarik seluruh master data sebagai berkas adalah permukaan
        ekstraksi data massal.
      responses:
        '200':
          description: Berkas xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /imports/master-data/template:
    get:
      tags: [Import & Export]
      summary: Unduh template impor gabungan
      description: |
        Workbook `.xlsx` berisi sepuluh sheet (`artists`, `categories`,
        `products`, `stock`, `vendors`, `materials`, `vendor_prices`, `bom`,
        `roles`, `users`) lengkap dengan judul kolom yang benar dan satu
        baris contoh per sheet (F15.3). Enam sheet terakhir ditambahkan
        pasca-MVP (`vendors`..`bom` pada 2026-09-01, `roles`/`users` pada
        2026-09-02 — User Story 4 fitur 001-user-store-settings) — bukan
        bagian dari F15.3 asli, tapi dibangun mengikuti pola workbook
        gabungan yang sama persis.
      responses:
        '200':
          description: Berkas xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /imports/master-data:
    post:
      tags: [Import & Export]
      summary: Impor massal master data dari satu berkas Excel
      description: |
        Satu berkas `.xlsx` memuat sampai delapan sheet sekaligus. Sheet
        yang tidak dikenali diabaikan dan dilaporkan pada `ignored_sheets`;
        nama sheet dicocokkan tanpa memandang huruf besar/kecil.

        **Urutan pemrosesan** selalu `artists` → `categories` → `products`
        → `stock` → `vendors` → `materials` → `vendor_prices` → `bom` →
        `roles` → `users`, berapa pun urutan sheet di dalam berkas. Sheet
        vendor/bahan baku/BOM ditambahkan pasca-MVP 2026-09-01; `roles`/
        `users` ditambahkan 2026-09-02 (User Story 4) — lihat catatan
        bertanggal di CLAUDE.md/README.md/PRD §10.2; keduanya kapabilitas
        baru, bukan pemulihan salah satu butir yang dicoret PRD §10.2.
        `users` menunjuk `roles` lewat NAMA (`role_name`), bukan kode —
        `Role` tidak punya kolom `code` seperti entitas lain.

        **Semua-atau-tidak sama sekali.** Seluruh berkas divalidasi lebih
        dulu; bila ada satu baris pun yang tidak valid, tidak ada data yang
        diubah dan seluruh galat dikembalikan sekaligus (422). Ini
        menyimpang dari kriteria penerimaan F15.5 (yang meminta baris valid
        tetap tersimpan) secara sengaja: sheet-sheet ini saling bergantung,
        sehingga penyimpanan sebagian meninggalkan master data setengah
        jadi yang jauh lebih sulit dibereskan.

        **Kunci pencocokan (upsert, bukan selalu insert)**
        | Sheet | Kunci |
        |---|---|
        | `artists` | `code` |
        | `categories` | `code` |
        | `products` | `sku` bila diisi; bila kosong, `code_prefix` + urutan varian |
        | `stock` | `sku` |
        | `vendors` | `code` |
        | `materials` | `code` |
        | `vendor_prices` | pasangan (`vendor_code`, `material_code`) |
        | `bom` | pasangan (`sku`, `material_code`) |
        | `roles` | `name` |
        | `users` | `username` |

        **Kode dihasilkan server.** `code_prefix` dan `sku` selalu dibuat
        `ProductCodeGenerator`. Kolom `sku` pada sheet `products` hanya
        boleh menunjuk varian yang SUDAH ada — SKU yang tidak dikenal
        ditolak, tidak dipakai untuk membuat varian baru.

        **Stok bersifat absolut.** Kolom `current_stock` pada sheet `stock`
        adalah jumlah akhir yang diinginkan; server menghitung selisihnya
        terhadap stok saat ini dan menerapkannya sebagai satu
        `stock_movements` bertipe `adjustment` (F15.8). Baris yang angkanya
        sudah sama tidak menghasilkan movement apa pun.

        Sheet `stock` menunjuk varian lewat `sku`. Cara paling aman mengisi
        stok awal varian BARU adalah kolom `initial_stock` di sheet
        `products`, karena SKU dibuat server. Sheet `stock` tetap boleh
        menunjuk SKU yang baru akan dibuat oleh berkas yang sama — SKU-nya
        deterministik (`code_prefix` + `-` + urutan 3 digit, mis.
        `RYU-KY-SAK-001`) — dan penyelesaiannya ditunda sampai sheet
        `products` diterapkan. SKU yang tetap tidak ditemukan setelah itu
        membatalkan seluruh impor dengan galat per-baris biasa.

        **Sel kosong berarti "jangan diubah"**, bukan "kosongkan nilainya".

        **Task 6 — gambar via impor massal.** Sheet `products` dan
        `categories` punya kolom `image_filename`, dan sheet `products`
        SENDIRI juga punya kolom kedua `variant_image_filename` — yang
        pertama gambar PRODUK (dipakai bersama semua variannya), yang
        kedua gambar VARIAN baris itu sendiri secara spesifik (mis. desain/
        motif berbeda per varian). Bila diisi, nilainya harus PERSIS SAMA
        dengan nama asli salah satu berkas yang diunggah bersamaan lewat
        field `images[]` pada request yang sama. Berkas yang cocok disalin
        ke penyimpanan publik (lokasi yang sama dengan
        `POST /products/{id}/image` / `POST /categories/{id}/image` /
        `POST /variants/{id}/image`, Task 5) dan `image_path` entitas yang
        bersangkutan diisi. Nama berkas yang direferensikan TAPI TIDAK ADA
        padanannya di `images[]` adalah GALAT PER BARIS
        (`column: image_filename` atau `column: variant_image_filename`),
        bukan dilewati diam-diam — konsisten dengan strategi
        semua-atau-tidak-sama-sekali impor ini. Kolom kosong berarti
        "tidak ada gambar diikutsertakan" (gambar yang sudah ada, bila ada,
        tidak diubah).

        **Vendor/bahan/BOM (pasca-MVP, 2026-09-01).** Sheet `vendor_prices`
        dan `bom` mereferensikan vendor/bahan/varian lewat `vendor_code`/
        `material_code`/`sku` — pola yang sama dengan `artist_code`/
        `category_code` pada sheet `products`. Baris `bom` boleh menunjuk
        SKU yang baru dibuat sheet `products` pada berkas yang sama
        (diselesaikan setelah sheet `products` diterapkan, pola yang sama
        dengan sheet `stock`). Menandai `is_preferred = 1` pada sheet
        `vendor_prices` melepas tanda preferred dari harga vendor lain
        untuk bahan yang sama.

        **Roles/Users (User Story 4, 2026-09-02).** Sheet `roles` punya
        kolom `menu_keys` berisi daftar kunci menu dipisah KOMA dalam satu
        sel (mis. `pos,session`), divalidasi terhadap registry
        `App\Support\MenuKeys`. Sheet `users` mereferensikan peran lewat
        `role_name` (boleh menunjuk peran baru yang dibuat sheet `roles`
        pada berkas yang sama) dan TIDAK PERNAH punya kolom password
        (FR-007) — akun baru dari impor mendapat password ACAK yang dibuat
        server, wajib diatur ulang pemiliknya lewat `PUT /users/{user}`.
        Baris `users` yang `role_name`-nya tidak dikenal membatalkan
        SELURUH impor (FR-009), termasuk baris `roles` valid pada berkas
        yang sama.

        Digerbang `canAccessAnyMenu()` — siapa pun yang bisa mengelola
        salah satu entitas master data pada berkas (termasuk
        pengguna/peran) boleh mengimpornya secara massal, konsisten dengan
        `canManageMasterData()` (owner/admin/inventory) untuk sheet lain.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Berkas `.xlsx`, maksimal 10 MB.
                dry_run:
                  type: boolean
                  default: false
                  description: |
                    Bila `true`, berkas hanya divalidasi dan jumlah baris
                    dilaporkan — tidak ada data yang ditulis (F15.4).
                images:
                  type: array
                  items: { type: string, format: binary }
                  description: |
                    Task 6 — batch gambar JPEG/PNG (maks 5 MB masing-masing,
                    maks 200 berkas) yang direferensikan lewat kolom
                    image_filename (sheet products/categories) atau
                    variant_image_filename (sheet products), dicocokkan
                    berdasarkan nama berkas ASLI.
      responses:
        '200':
          description: Impor berhasil, atau pratinjau tanpa galat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataImportResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            Berkas ditolak (bukan `.xlsx` valid, terlalu besar, tidak
            memuat sheet yang dikenali) ATAU ada baris yang tidak valid.
            Pada kasus terakhir `errors` berisi daftar galat per baris dan
            `applied` bernilai `false` — tidak ada data yang berubah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataImportResult' }

# =====================================================================
# COMPONENTS
# =====================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 25, maximum: 100 }

  responses:
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Peran tidak memiliki izin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Bertentangan dengan aturan bisnis
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SchemaOutdated:
      description: |
        035-po-row-actions — struktur database TERTINGGAL dari versi aplikasi
        (migrasi belum diterapkan; kolom/tabel belum ada). Bisa muncul dari
        endpoint API MANA PUN yang menyentuh bagian skema yang belum ada.
        Hanya SQLSTATE 42S22/42S02 yang dikonversi; galat database lain tetap
        500. Pesan ramah tanpa SQL/nama tabel/kolom; detail lengkap hanya di
        log server. Klien menampilkan status galat + "Coba lagi", bukan layar
        kosong atau keadaan kosong yang menyesatkan.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              code: { type: string, enum: [schema_outdated] }
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:

    CustomerImportResult:
      type: object
      description: Bentuk respons POST /customers/import, baik dry_run maupun penerapan sungguhan (020-customer-data-import-export).
      properties:
        dry_run: { type: boolean }
        created_count: { type: integer }
        updated_count: { type: integer }
        row_errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              errors: { type: array, items: { type: string } }

    StockByArtistDetail:
      type: object
      description: |
        Bentuk respons GET /reports/stock-by-artist ketika query param
        artist_id diisi (009-ui-ux-refinements, US7).
      properties:
        artist_id: { type: integer }
        artist_name: { type: string }
        variants:
          type: array
          items:
            type: object
            properties:
              variant_id: { type: integer }
              sku: { type: string }
              variant_name: { type: string, nullable: true }
              current_stock: { type: integer }
        variant_count: { type: integer }
        total_stock: { type: integer }

    InvoicePaymentSetting:
      type: object
      description: |
        Singleton konfigurasi informasi pembayaran invoice
        (019-billing-system US4). Bukan HasDataMode-scoped — data
        administratif, tampil identik di mode DEMO/LIVE.
      properties:
        id: { type: integer, example: 1 }
        bank_name: { type: string, nullable: true }
        account_number: { type: string, nullable: true }
        account_holder: { type: string, nullable: true }
        instructions: { type: string, nullable: true }

    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string, nullable: true, example: INSUFFICIENT_STOCK }

    Paginated:
      type: object
      properties:
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }

    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "150000.00"

    # BUG YANG DITEMUKAN & DIPERBAIKI — skema ini sebelumnya juga bernama
    # `User` sama seperti skema entitas CRUD pengguna di bawah (lihat
    # bagian "Pengguna & Peran"), yang ditambahkan belakangan oleh alur
    # kerja terpisah. Dua definisi top-level dengan kunci sama di YAML
    # membuat definisi kedua diam-diam menimpa yang pertama pada parser
    # yang taat spesifikasi — endpoint /auth/login dan /auth/me akan
    # terdokumentasi memakai skema yang salah (bentuk objek role, bukan
    # nama+menu_keys) tanpa galat apa pun yang terlihat. Diberi nama
    # sendiri karena memang bentuknya berbeda dari skema entitas User
    # (role di sini nama tampilan saja + menu_keys hasil resolusi sesi,
    # bukan objek Role penuh).
    AuthenticatedUser:
      type: object
      description: |
        Bentuk `user` pada respons /auth/login dan /auth/me — BUKAN skema
        entitas User CRUD (lihat `User` di bagian "Pengguna & Peran").
        `role` adalah NAMA Role yang bisa dikonfigurasi bebas oleh owner
        (bukan lagi enum 4 nilai tetap) — dipakai HANYA untuk tampilan.
        `menu_keys` adalah daftar kunci menu yang boleh diakses akun ini,
        resolusi sekali per sesi login/`GET /auth/me`; ini yang dipakai
        frontend untuk `canAccessMenu()` (cosmetic saja — penegakan
        sesungguhnya tetap di server pada setiap endpoint).
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        role: { type: string, example: Owner }
        menu_keys:
          type: array
          items: { type: string }
          example: [dashboard, pos, session, products, reports, settings]
        is_active: { type: boolean }
        photo_url:
          type: string
          nullable: true
          description: |
            005-ux-enhancements-dashboard — dipakai avatar header (AppSidebar)
            dan layar Profil Saya. null bila belum pernah mengunggah foto.
        language:
          type: string
          enum: [id, en]
          description: >
            Preferensi bahasa antarmuka akun ini (002-language-toggle),
            default 'en'. Berlaku setelah login saja — tidak mempengaruhi
            layar login maupun struk transaksi (selalu Bahasa Indonesia).

    Artist:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, minLength: 3, maxLength: 3, example: RYU }
        name: { type: string }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        product_count: { type: integer, readOnly: true }

    ArtistInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 3, maxLength: 3, description: Huruf kapital. Permanen setelah dibuat. }
        name: { type: string, maxLength: 100 }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean, default: true }

    # -------------------------------------------------------------
    # Pengguna & Peran (001-user-store-settings, ditambahkan 2026-10)
    # -------------------------------------------------------------
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        role:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        is_active: { type: boolean }
        photo_url: { type: string, nullable: true, readOnly: true }
        last_login_at: { type: string, format: date-time, nullable: true }
      description: password TIDAK PERNAH disertakan (FR-007), termasuk pada ekspor massal.

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 50 }
        menu_keys:
          type: array
          items: { type: string }
          description: Divalidasi terhadap registry App\Support\MenuKeys.
        is_system_default:
          type: boolean
          description: |
            `true` untuk 4 peran bawaan (Owner/Admin/Kasir/Inventory) yang
            direproduksi seeder — informasional saja, tidak memblokir edit.
        user_count:
          type: integer
          readOnly: true
          description: Jumlah pengguna AKTIF yang memakai peran ini.

    RoleInput:
      type: object
      required: [name, menu_keys]
      properties:
        name: { type: string, maxLength: 50, description: Unik di antara peran yang belum dihapus. }
        menu_keys:
          type: array
          items: { type: string }
          description: Setiap nilai harus salah satu kunci App\Support\MenuKeys — kunci tak dikenal ditolak 422.

    UserInput:
      type: object
      required: [name, username, role_id]
      properties:
        name: { type: string, maxLength: 100 }
        username: { type: string, maxLength: 50, description: Unik di antara pengguna yang belum dihapus. }
        password: { type: string, minLength: 8, description: Wajib saat membuat; opsional saat memperbarui (kosong = tidak diubah). }
        role_id: { type: integer, description: Harus merujuk Role yang belum dihapus. }
        is_active: { type: boolean, default: true }

    # -------------------------------------------------------------
    # Vendor, bahan baku, dan BOM (ditambahkan pasca-MVP, 2026-09-01)
    # -------------------------------------------------------------
    Vendor:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, maxLength: 20, example: VNAKR }
        name: { type: string }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        material_price_count: { type: integer, nullable: true, readOnly: true }

    VendorInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 20, description: Permanen setelah dibuat, sama seperti Artist/Category. }
        name: { type: string, maxLength: 150 }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean, default: true }

    BusinessType:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, maxLength: 20, example: RETAIL }
        name: { type: string }
        is_active: { type: boolean }
        company_count: { type: integer, nullable: true, readOnly: true }

    BusinessTypeInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 20, description: Permanen setelah dibuat. }
        name: { type: string, maxLength: 100 }
        is_active: { type: boolean, default: true }

    License:
      type: object
      description: 019-billing-system — rename dari Package (research.md R1').
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        license_tier: { type: string, enum: [pro, master], description: Deskriptif saja — tidak diterapkan otomatis ke Setting multi_artist_enabled instalasi ini. }
        price: { type: string, description: 'Angka desimal sebagai string, mis. "500000.00".' }
        payment_type: { type: string, enum: [one_time, subscription], description: Label deskriptif saja — tidak ada billing berulang otomatis (FR-017). }
        is_active: { type: boolean }
        company_count: { type: integer, nullable: true, readOnly: true }

    LicenseInput:
      type: object
      required: [name, license_tier, price, payment_type]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }
        license_tier: { type: string, enum: [pro, master] }
        price: { type: number, minimum: 0 }
        payment_type: { type: string, enum: [one_time, subscription] }
        is_active: { type: boolean, default: true }

    Company:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string, nullable: true }
        contact_name: { type: string }
        contact_email: { type: string }
        contact_phone: { type: string, nullable: true }
        status: { type: string, enum: [pending_activation, active] }
        can_activate: { type: boolean, readOnly: true, description: 'research.md R14 (019-billing-system, third expansion) — true bila status belum active DAN sudah ada minimal satu Invoice berstatus paid milik company ini.' }
        activated_at: { type: string, format: date-time, nullable: true }
        business_type: { $ref: '#/components/schemas/BusinessType' }
        license: { $ref: '#/components/schemas/License' }
        owner_username: { type: string, readOnly: true }
        created_at: { type: string, format: date-time }

    CompanyOnboardInput:
      type: object
      required: [business_type_id, license_id, name, contact_name, contact_email, owner_username, owner_password]
      properties:
        business_type_id: { type: integer, description: Harus merujuk business type yang masih aktif. }
        license_id: { type: integer, description: Harus merujuk lisensi yang masih aktif. }
        name: { type: string, maxLength: 150 }
        address: { type: string, nullable: true }
        contact_name: { type: string, maxLength: 100 }
        contact_email: { type: string, format: email }
        contact_phone: { type: string, nullable: true }
        owner_username: { type: string, maxLength: 50, description: Harus unik lintas seluruh tabel users. }
        owner_password: { type: string, minLength: 8 }

    CompanyUpdateInput:
      type: object
      description: 019-billing-system (second expansion, research.md R11) — TIDAK termasuk owner_username/owner_password (creation-only, kredensial owner tidak pernah diubah lewat edit company).
      required: [business_type_id, license_id, name, contact_name, contact_email]
      properties:
        business_type_id: { type: integer, description: Harus merujuk business type yang masih aktif. }
        license_id: { type: integer, description: Harus merujuk lisensi yang masih aktif. }
        name: { type: string, maxLength: 150 }
        address: { type: string, nullable: true }
        contact_name: { type: string, maxLength: 100 }
        contact_email: { type: string, format: email }
        contact_phone: { type: string, nullable: true }

    Invoice:
      type: object
      description: 019-billing-system — Invoice sebagai dokumen mandiri (research.md R3'/R4'), bukan lagi anak Company/Package.
      properties:
        id: { type: integer }
        invoice_number: { type: string, description: "Digenerate server, unik lintas mode DEMO/LIVE, format INV-{YYYYMM}-{seq} (research.md R3')." }
        company_id: { type: integer }
        company:
          type: object
          nullable: true
          readOnly: true
          description: research.md R12 — business_type dibaca live dari relasi Company::businessType(), BUKAN snapshot seperti license/subtotal di bawah (mendeskripsikan Company itu sendiri, bukan fakta pembayaran yang dibekukan saat invoice dibuat).
          properties:
            id: { type: integer }
            name: { type: string }
            business_type:
              type: object
              nullable: true
              readOnly: true
              properties:
                id: { type: integer }
                name: { type: string }
        license_id: { type: integer }
        license:
          type: object
          nullable: true
          readOnly: true
          properties:
            id: { type: integer }
            name: { type: string }
            payment_type: { type: string, enum: [one_time, subscription] }
        subtotal: { type: string, description: 'Angka desimal sebagai string, mis. "500000.00".' }
        discount: { type: string, description: 'Angka desimal sebagai string — jumlah tetap, bukan persentase (research.md R4).' }
        grand_total: { type: string, description: 'subtotal - discount, DISIMPAN saat dibuat — tidak pernah dihitung ulang dari license.price yang berubah kemudian (FR-013).' }
        due_date: { type: string, format: date }
        status: { type: string, enum: [unpaid, paid, cancelled] }
        paid_at: { type: string, format: date, nullable: true }
        payment_information: { type: string, nullable: true, description: Default dari invoice_payment_settings saat dibuat, bisa ditimpa per-invoice (FR-015). }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Material:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, maxLength: 20, example: AC3 }
        name: { type: string }
        unit: { type: string, example: lembar, description: "Bebas: pcs, gram, meter, lembar, dst." }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        vendor_price_count: { type: integer, nullable: true, readOnly: true }
        vendor_prices:
          type: array
          readOnly: true
          description: Hanya disertakan pada GET /materials/{id}.
          items: { $ref: '#/components/schemas/VendorMaterialPrice' }

    MaterialInput:
      type: object
      required: [code, name, unit]
      properties:
        code: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 150 }
        unit: { type: string, maxLength: 20 }
        notes: { type: string, nullable: true }
        is_active: { type: boolean, default: true }

    VendorMaterialPrice:
      type: object
      properties:
        id: { type: integer }
        vendor_id: { type: integer }
        vendor_name: { type: string, readOnly: true }
        material_id: { type: integer }
        price: { type: string, example: "15000.00" }
        is_preferred:
          type: boolean
          description: |
            Vendor acuan untuk perhitungan bom_cost saat bahan ini punya
            >1 vendor. Hanya satu true per bahan — menandai satu melepas
            tanda dari yang lain.
        notes: { type: string, nullable: true }

    VendorMaterialPriceInput:
      type: object
      required: [vendor_id, price]
      description: vendor_id wajib hanya saat membuat (POST); tidak berlaku saat update (PUT).
      properties:
        vendor_id: { type: integer }
        price: { type: number, minimum: 0 }
        is_preferred: { type: boolean, default: false }
        notes: { type: string, nullable: true }

    BomLine:
      type: object
      properties:
        id: { type: integer }
        product_variant_id: { type: integer }
        material_id: { type: integer }
        material_name: { type: string, readOnly: true }
        material_unit: { type: string, readOnly: true }
        qty_needed: { type: string, example: "2.5000", description: Per satu unit produk jadi; boleh pecahan. }
        notes: { type: string, nullable: true }
        is_legacy: { type: boolean, description: 034 — tanpa baris PO. }
        line_type: { type: string, enum: [material, service] }
        item_name: { type: string, nullable: true }
        purchase_order_item_id: { type: integer, nullable: true }
        po_number: { type: string, nullable: true }
        vendor_id: { type: integer, nullable: true }
        vendor_name: { type: string, nullable: true }
        unit_cost: { type: string, nullable: true, description: Snapshot biaya satuan baris PO. }

    VariantBom:
      type: object
      description: BOM varian — baris + ringkasan biaya (034-seller-po-bom).
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/VariantBomRow' }
        summary: { $ref: '#/components/schemas/VariantBomSummary' }

    VariantBomRow:
      type: object
      properties:
        id: { type: integer }
        product_variant_id: { type: integer }
        line_type: { type: string, enum: [material, service] }
        item_name: { type: string, nullable: true }
        is_legacy: { type: boolean }
        material_id: { type: integer, nullable: true }
        material_unit: { type: string, nullable: true }
        purchase_order_item_id: { type: integer, nullable: true }
        po_number: { type: string, nullable: true }
        vendor_id: { type: integer, nullable: true }
        vendor_name: { type: string, nullable: true }
        unit_cost: { type: string, example: "500.00", description: SNAPSHOT baris PO (baris LEGACY — harga vendor acuan hidup). }
        qty_needed: { type: string, example: "1.0000", description: Per SATU unit produk jadi. }
        item_cost: { type: string, example: "500.00", description: unit_cost x qty_needed (dibulatkan ke sen). }
        po_qty: { type: number, nullable: true, description: Jumlah yang dibeli di baris PO — hanya rujukan, tidak membatasi. }
        notes: { type: string, nullable: true }
        source_cancelled: { type: boolean, description: PO sumber dibatalkan; biaya tercatat tetap dipakai. }
        newer_price:
          type: object
          nullable: true
          description: Baris PO TERBARU (seller sama, bahan/jasa sama) dengan harga berbeda; hanya isyarat.
          properties:
            purchase_order_item_id: { type: integer }
            po_number: { type: string }
            unit_price: { type: string }

    VariantBomSummary:
      type: object
      properties:
        material_cost: { type: string, example: "800.00" }
        service_cost: { type: string, example: "1000.00" }
        bom_cost: { type: string, example: "1800.00" }
        has_legacy: { type: boolean }
        bom_complete: { type: boolean }
        cost_price: { type: string, example: "1800.00" }
        current_stock: { type: integer, readOnly: true, description: "036 — stok varian saat dibaca; hanya-baca (tidak ada aksi BOM yang mengubah stok)." }
        reopened: { type: boolean, description: true bila BOM selesai dibuka kembali otomatis oleh permintaan ini (menjadi kosong). }

    EligibleBomLine:
      type: object
      properties:
        purchase_order_item_id: { type: integer }
        purchase_order_id: { type: integer }
        po_number: { type: string }
        po_status: { type: string, enum: [ordered, received, paid] }
        po_date: { type: string, format: date-time, nullable: true }
        vendor_id: { type: integer }
        vendor_name: { type: string, nullable: true }
        line_type: { type: string, enum: [material, service] }
        item_name: { type: string, nullable: true }
        material_id: { type: integer, nullable: true }
        unit_price: { type: string, example: "500.00" }
        po_qty: { type: number }
        in_bom: { type: boolean }

    BomCopyResult:
      type: object
      properties:
        variant_id: { type: integer }
        sku: { type: string }
        status: { type: string, enum: [copied] }
        rows: { type: integer }
        reopened: { type: boolean }

    BomLineInput:
      type: object
      required: [material_id, qty_needed]
      description: material_id wajib hanya saat membuat (POST); tidak berlaku saat update (PUT).
      properties:
        material_id: { type: integer }
        qty_needed: { type: integer, minimum: 1, description: "036 — bilangan bulat >= 1 (pecahan ditolak 422). Baris lama yang sudah berpecahan tetap terbaca dan terhitung apa adanya." }
        notes: { type: string, nullable: true }

    BomCostBreakdown:
      type: object
      description: |
        Read-only. bom_cost TIDAK PERNAH menimpa cost_price — keduanya
        disajikan berdampingan untuk direkonsiliasi manual oleh pemilik
        toko (lihat App\Services\BomCostCalculator).
      properties:
        product_variant_id: { type: integer }
        sku: { type: string }
        cost_price: { type: string, example: "12345.00", description: Modal manual yang sudah ada, tidak diubah oleh endpoint ini. }
        bom_cost: { type: string, example: "16000.00", description: "Jumlah qty_needed * unit_cost seluruh baris BOM." }
        material_cost: { type: string, example: "16000.00" }
        service_cost: { type: string, example: "0.00" }
        has_legacy: { type: boolean, description: Ada baris tanpa baris PO (legacy). }
        lines:
          type: array
          items:
            type: object
            properties:
              bom_line_id: { type: integer }
              line_type: { type: string, enum: [material, service] }
              is_legacy: { type: boolean }
              purchase_order_item_id: { type: integer, nullable: true }
              po_number: { type: string, nullable: true }
              item_name: { type: string, nullable: true }
              material_id: { type: integer, nullable: true }
              material_name: { type: string, nullable: true }
              unit: { type: string, nullable: true }
              qty_needed: { type: string }
              unit_cost: { type: string, description: Harga vendor acuan (preferred, atau termurah bila tidak ada yang preferred). }
              line_cost: { type: string }
              has_price: { type: boolean, description: false bila bahan ini belum punya harga vendor sama sekali (line_cost dihitung 0). }
              reference_vendor_id: { type: integer, nullable: true }
              reference_vendor_name: { type: string, nullable: true }
              reference_is_preferred: { type: boolean }

    Category:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, minLength: 2, maxLength: 2, example: KY }
        name: { type: string }
        image_path: { type: string, nullable: true, description: "Task 5. Diisi via POST /categories/{id}/image atau impor massal (Task 6)." }
        image_url: { type: string, nullable: true, readOnly: true, description: "URL siap-pakai (disk publik)." }
        parent_id: { type: integer, nullable: true }
        display_order: { type: integer }
        is_active: { type: boolean }

    CategoryInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 2 }
        name: { type: string, maxLength: 100 }
        parent_id: { type: integer, nullable: true }
        display_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }

    Variant:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        sku: { type: string, minLength: 14, maxLength: 14, example: RYU-KY-SAK-001 }
        variant_name: { type: string }
        cost_price: { $ref: '#/components/schemas/Money' }
        sell_price: { $ref: '#/components/schemas/Money' }
        current_stock: { type: integer, readOnly: true }
        low_stock_alert: { type: integer, nullable: true }
        is_active: { type: boolean }
        bom_complete: { type: boolean, description: "034 — BOM ditandai selesai; cost_price mengikuti biaya BOM dan dikunci." }
        has_bom: { type: boolean, description: "034 — hanya ada pada GET/PUT produk untuk pengguna menu products (baris BOM dimuat)." }
        bom_cost: { type: string, nullable: true, example: "1800.00", description: "034 — biaya BOM; null bila belum ada baris. Hanya bila has_bom ikut dikirim." }

    VariantInput:
      type: object
      required: [variant_name, sell_price]
      properties:
        variant_name: { type: string, maxLength: 100, default: Standard }
        cost_price: { $ref: '#/components/schemas/Money' }
        sell_price: { $ref: '#/components/schemas/Money' }
        low_stock_alert: { type: integer, nullable: true }
        is_active: { type: boolean, default: true }
        copy_bom_from_variant_id: { type: integer, nullable: true, description: "034 — hanya pada POST /products/{id}/variants." }

    VariantLookup:
      type: object
      description: Bentuk ringkas untuk layar kasir
      properties:
        variant_id: { type: integer }
        sku: { type: string }
        label: { type: string, example: Keychain Sakura — Varian A }
        artist_name: { type: string }
        category_name: { type: string, nullable: true, description: "Nama kategori produk induk (untuk membedakan produk bernama sama)" }
        sell_price: { $ref: '#/components/schemas/Money' }
        current_stock: { type: integer }
        is_preorder: { type: boolean }
        image_url: { type: string, nullable: true, description: "Foto varian sendiri; bila tidak ada, foto produk induk; bila tidak ada, null. Layar kasir memakainya di kartu hasil pencarian dan baris keranjang." }

    Product:
      type: object
      properties:
        id: { type: integer }
        artist_id: { type: integer }
        artist_name: { type: string, readOnly: true }
        category_id: { type: integer }
        category_name: { type: string, readOnly: true }
        code_prefix: { type: string, minLength: 10, maxLength: 10, readOnly: true, example: RYU-KY-SAK }
        name: { type: string }
        description: { type: string, nullable: true }
        image_path: { type: string, nullable: true, description: "Diisi via POST /products/{id}/image atau impor massal (Task 6)." }
        image_url: { type: string, nullable: true, readOnly: true, description: "URL siap-pakai (disk publik), ditambahkan Task 5." }
        is_preorder: { type: boolean }
        preorder_eta: { type: string, format: date, nullable: true }
        is_active: { type: boolean }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }

    ProductInput:
      type: object
      required: [artist_id, category_id, name]
      properties:
        artist_id: { type: integer }
        category_id: { type: integer }
        name: { type: string, maxLength: 150 }
        description: { type: string, nullable: true }
        is_preorder: { type: boolean, default: false }
        preorder_eta: { type: string, format: date, nullable: true }
        is_active: { type: boolean, default: true }
        variants:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/VariantInput' }

    StockMovement:
      type: object
      properties:
        id: { type: integer }
        variant_id: { type: integer }
        sku: { type: string, readOnly: true }
        type: { type: string, enum: [purchase, sale, preorder_handover, adjustment, return, initial] }
        qty_change: { type: integer }
        stock_before: { type: integer }
        stock_after: { type: integer }
        reason: { type: string, nullable: true }
        user_name: { type: string, nullable: true, readOnly: true, description: Pengguna pencatat; null bila penggunanya sudah dihapus. }
        variant_name: { type: string, nullable: true, readOnly: true }
