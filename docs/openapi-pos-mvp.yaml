        material_unit: { type: string, readOnly: true }
        qty_needed: { type: string, example: "2.5000", description: Per satu unit produk jadi; boleh pecahan. }
        notes: { type: string, nullable: true }
        is_legacy: { type: boolean, description: 034 — tanpa baris PO. }
        line_type: { type: string, enum: [material, service] }
        item_name: { type: string, nullable: true }
        purchase_order_item_id: { type: integer, nullable: true }
        po_number: { type: string, nullable: true }
        vendor_id: { type: integer, nullable: true }
        vendor_name: { type: string, nullable: true }
        unit_cost: { type: string, nullable: true, description: Snapshot biaya satuan baris PO. }

    VariantBom:
      type: object
