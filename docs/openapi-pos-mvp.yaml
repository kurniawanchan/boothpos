openapi: 3.0.3

# =====================================================================
# KLASIFIKASI: INTERNAL
# Kontrak API — Sistem POS Event-Based Multi-Artist
# Cakupan: MVP Oktober 2026 (termasuk pre-order dan pengiriman kurir)
# Acuan: PRD v1.4, schema-pos-mvp.sql v1.0, uml-pos-mvp.md v1.0
#
# ATURAN: berkas ini adalah sumber kebenaran kontrak API. Koleksi Bruno
# dan Postman diturunkan dari sini, bukan ditulis terpisah. Perubahan
# endpoint wajib memperbarui berkas ini dalam commit yang sama.
# =====================================================================

info:
  title: BoothPOS API
  version: 1.4.0
  description: |
    API internal untuk BoothPOS — sistem POS berbasis event untuk toko
    merchandise yang berjualan online maupun di bazaar/event. Berjalan di
    localhost pada perangkat operasional toko, tanpa akses publik,
    sejalan dengan model lisensi sekali bayar dan instalasi lokal per toko.

    **Autentikasi** — token bearer. Token diperoleh dari `/auth/login`
    dan dikirim pada header `Authorization: Bearer <token>`.

    **Format uang** — seluruh nilai uang berupa string desimal dua angka
    di belakang koma, contoh `"150000.00"`. String dipakai agar tidak ada
    galat pembulatan floating point di sisi klien.

    **Zona waktu** — seluruh timestamp dalam format ISO 8601 dengan
    offset waktu lokal perangkat.

servers:
  - url: http://localhost:8000/api/v1
    description: Instalasi lokal pada laptop operasional

tags:
  - name: Auth
  - name: Master Data
  - name: Settings
  - name: Stock
  - name: Event & Session
  - name: Sales
  - name: Preorder
  - name: Payment
  - name: Report
  - name: Vendor & Bahan Baku
  - name: Purchase Order
  - name: Import & Export

security:
  - bearerAuth: []

# =====================================================================
# PATHS
# =====================================================================
paths:

  # ------------------------------------------------------------------
  # AUTH
  # ------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan dapatkan token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: kasir01 }
                password: { type: string, format: password }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cabut token aktif
      responses:
        '204': { description: Berhasil }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil pengguna aktif
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    put:
      tags: [Auth]
      summary: Ganti password akun sendiri (005-ux-enhancements-dashboard)
      description: >
        Self-service — SENGAJA tidak digerbang canAccessMenu('users'), sama
        seperti /auth/language. Setiap akun boleh mengubah password
        miliknya sendiri, digerbang hanya oleh current_password yang benar.
        Token sesi yang sedang dipakai TIDAK dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/photo:
    post:
      tags: [Auth]
      summary: Ganti foto profil akun sendiri (005-ux-enhancements-dashboard)
      description: >
        Self-service — sengaja endpoint TERPISAH dari
        `POST /users/{user}/photo` (yang digerbang UserPolicy::update() /
        canAccessMenu('users')). Endpoint ini hanya pernah menyentuh
        $request->user() sendiri, tidak menerima {user} dari klien, jadi
        aman dipakai peran tanpa akses menu Pengguna (mis. Kasir).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: "JPEG/PNG, maks 5 MB" }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/language:
    put:
      tags: [Auth]
      summary: Ganti preferensi bahasa akun sendiri (002-language-toggle)
      description: >
        Self-service — SENGAJA tidak digerbang canAccessMenu('users').
        Setiap akun yang sudah login boleh mengubah bahasanya sendiri,
        termasuk peran tanpa akses menu Pengguna (mis. Kasir default).
        Berlaku untuk seluruh antarmuka setelah login; layar login dan
        struk transaksi TIDAK ikut berubah (selalu Bahasa Indonesia).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { type: string, enum: [id, en] }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # MASTER DATA — ARTIST
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # SETTINGS — FLAG FITUR / LISENSI
  # ------------------------------------------------------------------
  /settings/features:
    get:
      tags: [Settings]
      summary: Status flag fitur berbayar
      description: |
        Dibaca frontend untuk menentukan tampilan UI sesuai tingkat
        lisensi (Pro/Master) — bukan sumber kebenaran otorisasi. Penegakan
        sebenarnya tetap terjadi di server pada setiap endpoint terkait
        (contoh: `POST /artists`), bukan dari flag yang dibaca di sini.
        Klien yang memaksa memanggil endpoint terlarang tetap akan
        ditolak 403 meski tidak pernah memanggil endpoint ini.

        `system_mode` (003-seed-demo-live, FR-005) terbuka untuk SEMUA
        role yang login (bukan hanya owner/admin) — status DEMO/LIVE harus
        selalu terlihat oleh siapa pun yang memakai sistem. Hanya
        MENGUBAHNYA yang dibatasi owner/admin, lewat `PUT /settings`.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  multi_artist_enabled: { type: boolean }
                  artist_count: { type: integer, description: Jumlah artist aktif saat ini }
                  artist_limit_reached: { type: boolean, description: "true bila Pro dan sudah punya 1 artist" }
                  system_mode:
                    type: string
                    enum: [demo, live]
                    description: |
                      Mode aktif saat ini. 'demo' menampilkan data contoh
                      (lihat SakanaFridgeDemoSeeder); 'live' hanya
                      menampilkan data yang dibuat sungguhan. Default
                      'live' bila baris settings `system_mode` belum
                      pernah dibuat (instalasi baru TIDAK PERNAH diam-diam
                      mulai dalam mode DEMO).

  /settings:
    get:
      tags: [Settings]
      summary: Daftar seluruh pengaturan
      description: |
        Hanya owner/admin (F14 — Setting & config management). Tabel
        `payment_channels` (nomor rekening) TIDAK ikut di sini; itu
        resource terpisah dengan penyamaran nomor rekeningnya sendiri.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Setting' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      summary: Ubah satu atau beberapa pengaturan sekaligus
      description: |
        Bentuk BULK, bukan satu key per request — layar pengaturan
        biasanya menyimpan beberapa field sekaligus (nama toko, kontak,
        format struk). Ini juga satu-satunya jalur admin untuk mengubah
        `multi_artist_enabled` (upgrade lisensi Pro ke Master); lihat
        catatan lisensi pada `POST /artists`. `type`/`group` boleh
        dikosongkan pada key yang sudah ada — nilai lama dipakai lagi.
        Setiap key yang berubah tercatat di log aktivitas (F13.4).

        Juga satu-satunya jalur mengubah `system_mode`
        (003-seed-demo-live) — key baru bernilai `demo`/`live`, group
        `system`. Tidak ada endpoint terpisah untuk ini (lihat
        specs/003-seed-demo-live/contracts/settings-system-mode.md):

        ```json
        { "settings": [{ "key": "system_mode", "value": "demo", "type": "string", "group": "system" }] }
        ```

        006-purchase-order-and-ops (US7) — juga satu-satunya jalur untuk
        tiga key baru ini, tidak ada endpoint terpisah: `theme_accent_color`
        (hex warna, group `appearance`, diterapkan klien sebagai override
        CSS custom property `--color-brand`), `receipt_footer_text` (group
        `receipt`, dirender di struk hanya bila terisi — dihilangkan sama
        sekali, bukan blok kosong, saat kosong), `receipt_show_logo`
        (boolean-as-string, group `receipt`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/SettingInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Setting' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /settings/store-logo:
    post:
      tags: [Settings]
      summary: Unggah/ganti logo toko (001-user-store-settings US3, T045)
      description: |
        Mengikuti pola persis `POST /categories/{id}/image` — endpoint
        multipart terpisah karena `PUT /settings`'s bulk JSON body tidak
        bisa membawa file (lihat research.md Decision 3). Menulis baris
        `store_logo_path` di tabel `settings` yang sama, dicatat ke log
        aktivitas seperti setiap perubahan `PUT /settings` lainnya.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Setting' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # LOG AKTIVITAS (F13.4)
  # ------------------------------------------------------------------
  /activity-logs:
    get:
      tags: [Settings]
      summary: Riwayat tindakan sensitif
      description: |
        Hapus data, penyesuaian stok, dan perubahan harga/pengaturan
        (F13.4, prioritas M). Hanya owner/admin. `old_values`/`new_values`
        adalah snapshot kolom yang bisa diisi ulang (fillable) pada
        entitas terkait saat kejadian, bukan diff per-field.
      parameters:
        - { name: entity_type, in: query, schema: { type: string, example: Artist } }
        - { name: entity_id, in: query, schema: { type: integer } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string, enum: [created, updated, deleted, stock_adjusted, price_changed] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ActivityLog' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /artists:
    get:
      tags: [Master Data]
      summary: Daftar artist
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Artist' }
    post:
      tags: [Master Data]
      summary: Buat artist
      description: |
        **Gate lisensi (v1.1)** — bila pengaturan `multi_artist_enabled`
        bernilai false (instalasi Pro) dan sudah ada satu artist aktif,
        permintaan ini ditolak dengan 403. Instalasi baru yang belum
        punya artist sama sekali tetap boleh membuat SATU artist
        (menjadi artist bawaan), baik pada Pro maupun Master. Cek dulu
        `GET /settings/features` untuk menyembunyikan tombol "Tambah
        Artist" di UI saat kuota sudah tercapai.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '403':
          description: Kuota artist Pro sudah tercapai, perlu upgrade ke Master
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /artists/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data]
      summary: Detail artist
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data]
      summary: Perbarui artist
      description: Kolom `code` tidak dapat diubah karena sudah menjadi bagian SKU yang beredar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Master Data]
      summary: Nonaktifkan artist
      description: Soft delete. Ditolak bila artist masih memiliki produk aktif.
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------
  # MASTER DATA — KATEGORI
  # ------------------------------------------------------------------
  /categories:
    get:
      tags: [Master Data]
      summary: Daftar kategori
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Master Data]
      summary: Buat kategori
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Master Data]
      summary: Perbarui kategori
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
    delete:
      tags: [Master Data]
      summary: Nonaktifkan kategori
      description: Ditolak bila masih ada produk aktif pada kategori ini.
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories/{id}/image:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Master Data]
      summary: Unggah/ganti gambar kategori (Task 5)
      description: |
        Kategori sebelumnya tidak punya kolom gambar sama sekali
        (`image_path` ditambahkan lewat migrasi
        `2026_10_07_000001_add_image_path_to_categories_table`). Pola sama
        dengan POST /products/{id}/image.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # MASTER DATA — PRODUK
  # ------------------------------------------------------------------
  /products:
    get:
      tags: [Master Data]
      summary: Daftar produk
      description: |
        `variants` TIDAK disertakan kecuali `with_variants=1` dikirim.
        Opt-in, bukan default: layar Kelola Produk tidak memakai varian,
        sedangkan layar kasir memakainya — memuatnya selalu hanya
        memperbesar payload untuk konsumen yang tidak butuh.
      parameters:
        - { name: search, in: query, description: "Cocokkan nama produk atau SKU", schema: { type: string } }
        - name: artist_id
          in: query
          description: |
            005-ux-enhancements-dashboard — sekarang array (dropdown
            multi-pilih Products/POS): `artist_id[]=1&artist_id[]=2`.
            Skalar tunggal lama (`artist_id=1`) tetap didukung mundur.
            Kosong/tidak dikirim = tanpa filter sumbu ini.
          style: form
          explode: true
          schema: { type: array, items: { type: integer } }
        - name: category_id
          in: query
          description: Sama seperti `artist_id` di atas — array, kompatibel mundur.
          style: form
          explode: true
          schema: { type: array, items: { type: integer } }
        - { name: is_preorder, in: query, schema: { type: boolean } }
        - name: with_variants
          in: query
          description: |
            `1`/`true` menyertakan `variants` pada setiap produk, dimuat
            lewat eager-load (bukan satu query per produk). Isinya sama
            persis dengan `GET /products/{id}`, termasuk varian nonaktif.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Master Data]
      summary: Buat produk beserta varian
      description: |
        `code_prefix` dan `sku` dihasilkan server, tidak dikirim klien.
        Segmen produk diturunkan dari nama bila `product_segment` kosong.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data]
      summary: Detail produk beserta varian
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data]
      summary: Perbarui produk
      description: Perubahan nama tidak mengubah `code_prefix` maupun SKU yang sudah ada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
    delete:
      tags: [Master Data]
      summary: Nonaktifkan produk
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{id}/image:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Master Data]
      summary: Unggah/ganti gambar produk (Task 5)
      description: |
        Terpisah dari POST/PUT /products karena endpoint itu menerima
        array bersarang `variants`, yang sulit dikirim lewat
        multipart/form-data. Gambar lama (bila ada) dihapus setelah
        gambar baru tersimpan. Disk publik — dilayani lewat
        /storage/... setelah `php artisan storage:link`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}/variants:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Master Data]
      summary: Tambah varian pada produk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }

  /variants/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Master Data]
      summary: Perbarui varian
      description: |
        Perubahan `sell_price` atau `cost_price` tidak memengaruhi transaksi
        yang sudah tercatat, karena harga disimpan sebagai snapshot.
        `current_stock` tidak dapat diubah lewat endpoint ini.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }

  /variants/lookup:
    get:
      tags: [Master Data]
      summary: Cari varian untuk kasir
      description: Endpoint ringan khusus layar kasir. Hanya mengembalikan varian aktif dengan kolom seperlunya.
      parameters:
        - { name: q, in: query, required: true, description: "SKU atau potongan nama", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VariantLookup' }

  # ------------------------------------------------------------------
  # STOK
  # ------------------------------------------------------------------
  /stock/movements:
    get:
      tags: [Stock]
      summary: Riwayat pergerakan stok
      parameters:
        - { name: variant_id, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [purchase, sale, preorder_handover, adjustment, return, initial] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StockMovement' }

  /stock/adjustments:
    post:
      tags: [Stock]
      summary: Penyesuaian stok manual
      description: |
        Dipakai untuk stok awal dan hasil stock opname. Menulis baris
        `stock_movements` dan memperbarui `current_stock` dalam satu
        transaksi database. Alasan wajib diisi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, reason]
              properties:
                reason: { type: string, maxLength: 255, example: Stok awal event Oktober }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [variant_id, qty_change]
                    properties:
                      variant_id: { type: integer }
                      qty_change: { type: integer, description: "Positif menambah, negatif mengurangi. Tidak boleh nol." }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  movements:
                    type: array
                    items: { $ref: '#/components/schemas/StockMovement' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stock/low:
    get:
      tags: [Stock]
      summary: Varian dengan stok menipis
      description: |
        Varian aktif yang `current_stock`-nya sudah di titik atau di bawah
        `low_stock_alert` masing-masing. Varian tanpa `low_stock_alert`
        (null) tidak pernah muncul di sini — belum ada ambang untuk dicek.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        variant_id: { type: integer }
                        sku: { type: string }
                        product_name: { type: string }
                        current_stock: { type: integer }
                        low_stock_alert: { type: integer }

  # ------------------------------------------------------------------
  # EVENT & SESI
  # ------------------------------------------------------------------
  /events:
    get:
      tags: [Event & Session]
      summary: Daftar event
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, active, closed, cancelled] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Event' }
    post:
      tags: [Event & Session]
      summary: Buat event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }

  /events/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Event & Session]
      summary: Detail event
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
    put:
      tags: [Event & Session]
      summary: Perbarui event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
    delete:
      tags: [Event & Session]
      summary: Hapus event
      description: |
        009-ui-ux-refinements (US4). Soft delete, owner/admin saja. Ditolak
        (409) bila event masih memiliki order atau pre-order (status apa
        pun) yang mereferensikannya.
      responses:
        '204': { description: Berhasil }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Event & Session]
      summary: Ubah status event
      description: |
        Perpindahan status mengikuti state machine. Menutup event memicu
        perhitungan `artist_settlements`. Event tidak dapat ditutup bila
        masih ada sesi kasir berstatus `open`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, closed, cancelled] }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '409':
          $ref: '#/components/responses/Conflict'

  /sessions/current:
    get:
      tags: [Event & Session]
      summary: Sesi kasir aktif milik pengguna
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierSession' }
        '404':
          description: Tidak ada sesi terbuka

  /sessions:
    post:
      tags: [Event & Session]
      summary: Buka sesi kasir
      description: |
        Ditolak bila pengguna masih memiliki sesi lain berstatus `open`.

        006-purchase-order-and-ops (US6) — `opening_cash_entries[]` opsional
        memecah `opening_cash` per artist (satu sesi kasir tetap satu baris
        `cashier_sessions`, bukan satu sesi per artist). Bila diisi, jumlah
        seluruh `amount` WAJIB persis sama dengan `opening_cash` (422 bila
        tidak).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, opening_cash]
              properties:
                event_id: { type: integer }
                opening_cash: { type: string, example: "500000.00" }
                opening_cash_entries:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required: [artist_id, amount]
                    properties:
                      artist_id: { type: integer }
                      amount: { type: string, example: "250000.00" }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Sesi dibuka
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sessions/{id}/close:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Event & Session]
      summary: Tutup sesi kasir
      description: |
        Server menghitung `expected_cash` dari kas awal ditambah seluruh
        pembayaran tunai pada sesi, lalu menghitung selisih terhadap
        `closing_cash` yang dilaporkan kasir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closing_cash]
              properties:
                closing_cash: { type: string, example: "2350000.00" }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Sesi ditutup
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierSession' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sessions/{id}/summary:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Event & Session]
      summary: Ringkasan sesi kasir
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }

  # ------------------------------------------------------------------
  # PEMBAYARAN
  # ------------------------------------------------------------------
  /payment-channels:
    get:
      tags: [Payment]
      summary: Daftar kanal pembayaran non-tunai
      description: |
        Mengembalikan rekening bank dan QR e-wallet yang aktif untuk
        ditampilkan ke pelanggan.

        CATATAN KEAMANAN — hanya peran owner dan admin yang menerima
        `account_number` lengkap. Peran kasir menerima nomor tersamar
        pada daftar, dan nomor penuh hanya saat kanal dipilih untuk satu
        transaksi.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentChannel' }
    post:
      tags: [Payment]
      summary: Tambah kanal pembayaran (owner/admin)
      description: |
        Task 4 — `qr_image` kini bisa diikutsertakan saat membuat kanal
        (sebelumnya tidak ada field gambar sama sekali di endpoint ini,
        sehingga kanal QR baru tidak pernah punya cara diberi gambar QR).
        Disimpan di disk publik supaya bisa dirender langsung oleh UI POS.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, provider, account_name]
              properties:
                type: { type: string, enum: [bank_transfer, qr_ewallet] }
                provider: { type: string, maxLength: 50 }
                account_name: { type: string, maxLength: 100 }
                account_number: { type: string, nullable: true, description: Wajib untuk bank_transfer. }
                display_order: { type: integer }
                qr_image:
                  type: string
                  format: binary
                  description: JPEG atau PNG, maksimal 5 MB. Opsional — bisa ditambahkan belakangan lewat POST /payment-channels/{id}.
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentChannel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payment-channels/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Payment]
      summary: Ubah kanal pembayaran, termasuk gambar QR (owner/admin)
      description: |
        Task 4 — endpoint yang SEBELUMNYA SAMA SEKALI TIDAK ADA (hanya
        index()/store() yang terdaftar). Tanpa ini, kanal yang sudah
        dibuat tanpa QR code tidak bisa diberi gambar belakangan.
        Memakai POST, bukan PUT, karena unggahan multipart/form-data
        dengan method override lebih konsisten diimplementasikan di
        klien lewat POST langsung.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                type: { type: string, enum: [bank_transfer, qr_ewallet] }
                provider: { type: string, maxLength: 50 }
                account_name: { type: string, maxLength: 100 }
                account_number: { type: string, nullable: true }
                display_order: { type: integer }
                is_active: { type: boolean }
                qr_image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
                remove_qr_image:
                  type: boolean
                  description: Menghapus gambar QR yang sudah ada tanpa menggantinya.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentChannel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payment-proofs:
    post:
      tags: [Payment]
      summary: Unggah bukti pembayaran
      description: |
        Dipanggil sebelum transaksi disimpan. Mengembalikan `proof_token`
        yang disertakan saat membuat order atau pembayaran pre-order.
        Token tanpa transaksi akan dibersihkan otomatis setelah 24 jam.

        CATATAN KEAMANAN (area risiko: input validation) — tipe berkas
        diverifikasi dari isi berkas, bukan dari header klien. Berkas
        disimpan dengan nama acak di luar direktori publik.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, captured_via]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG atau PNG, maksimal 5 MB setelah kompresi klien
                captured_via:
                  type: string
                  enum: [webcam, upload]
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  proof_token: { type: string, format: uuid }
                  file_size: { type: integer }
        '413':
          description: Berkas melebihi batas ukuran
        '422': { $ref: '#/components/responses/ValidationError' }

  /payment-proofs/{id}/file:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Payment]
      summary: Ambil berkas bukti pembayaran
      description: Disajikan melalui pemeriksaan izin, bukan tautan langsung ke penyimpanan.
      responses:
        '200':
          description: Berkas gambar
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # PENJUALAN
  # ------------------------------------------------------------------
  /orders:
    get:
      tags: [Sales]
      summary: Daftar transaksi
      parameters:
        - { name: event_id, in: query, schema: { type: integer } }
        - { name: session_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [completed, voided] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
    post:
      tags: [Sales]
      summary: Buat transaksi penjualan
      description: |
        Endpoint inti kasir. Seluruh operasi berjalan dalam satu transaksi
        database: order, order_items, payments, payment_proofs, dan
        stock_movements.

        **Aturan yang ditegakkan server:**
        - Sesi kasir harus berstatus `open`
        - Harga diambil dari master, bukan dari kiriman klien
        - Pembayaran non-tunai wajib menyertakan `proof_token`
        - Total pembayaran harus menutup `total_amount`
        - Stok tidak boleh menjadi negatif

        **Idempotensi** — sertakan `local_ref` berupa UUID yang dibuat
        klien. Bila permintaan dengan `local_ref` sama dikirim ulang,
        server mengembalikan transaksi yang sudah ada, bukan membuat baru.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: Transaksi tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Stok tidak mencukupi, sesi tertutup, atau local_ref sudah dipakai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sales]
      summary: Detail transaksi
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/void:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Sales]
      summary: Batalkan transaksi
      description: |
        Transaksi tidak dihapus. Status berubah menjadi `voided` dan stok
        dikembalikan melalui `stock_movements` bertipe `return`.
        Hanya peran owner dan admin yang diizinkan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Dibatalkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{id}/receipt:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sales]
      summary: Data struk
      description: Mengembalikan data siap tampil untuk struk di layar, termasuk identitas toko dari pengaturan.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }

  # ------------------------------------------------------------------
  # POS DRAFTS (006-purchase-order-and-ops, US4)
  # ------------------------------------------------------------------
  /pos-drafts:
    get:
      tags: [Sales]
      summary: Daftar draft transaksi kasir milik pengguna saat ini
      description: |
        Tidak menyentuh stok — checkout tetap menghitung ulang harga dari
        master data saat draft dilanjutkan, sesuai Constitution IV. Hanya
        draft milik pengguna yang login (dilingkupi kepemilikan, bukan
        menu_keys — setiap kasir yang login sudah boleh bertransaksi POS).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PosDraftSummary' }
    post:
      tags: [Sales]
      summary: Simpan keranjang POS saat ini sebagai draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                event_id: { type: integer, nullable: true }
                customer_id: { type: integer, nullable: true }
                label: { type: string, nullable: true, maxLength: 100 }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [variant_id, qty]
                    properties:
                      variant_id: { type: integer }
                      sku: { type: string, nullable: true }
                      qty: { type: integer, minimum: 1 }
                      sell_price:
                        type: string
                        nullable: true
                        description: Snapshot tampilan saja, bukan sumber harga sungguhan.
                discount_amount: { type: string }
      responses:
        '201':
          description: Draft tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosDraftSummary' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /pos-drafts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sales]
      summary: Lanjutkan draft — kembalikan keranjang siap dipakai POS
      description: 404 bila draft bukan milik pengguna yang login (bukan 403 — tidak membocorkan keberadaan draft pengguna lain).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Sales]
      summary: Buang draft
      responses:
        '204': { description: Dibuang }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # PURCHASE ORDER (006-purchase-order-and-ops, US1)
  # ------------------------------------------------------------------
  /purchase-orders:
    get:
      tags: [Purchase Order]
      summary: Daftar purchase order
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, ordered, received, paid, cancelled] } }
        - { name: vendor_id, in: query, schema: { type: integer } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Purchase Order]
      summary: Buat purchase order (selalu berstatus draft)
      description: |
        `material_id` wajib untuk baris `line_type=material`, `description`
        wajib untuk baris `line_type=service` (FR-001). `product_id` selalu
        opsional apa pun `line_type`-nya (tautan bahan baku ke produk
        tertentu). `po_number` dibuat server, unik lintas mode DEMO/LIVE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /purchase-orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Purchase Order]
      summary: Detail purchase order (termasuk items dan payments)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Purchase Order]
      summary: Perbarui purchase order
      description: Baris item hanya boleh diubah selama status masih `draft` — 409 bila tidak.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Purchase Order]
      summary: Hapus purchase order
      description: Hanya diizinkan selama status masih `draft` — 409 bila tidak.
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /purchase-orders/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Purchase Order]
      summary: Ubah status purchase order
      description: |
        Transisi yang diizinkan: `draft`→`ordered`|`cancelled`,
        `ordered`→`received`|`cancelled`, `received`→`paid`. Transisi lain
        ditolak 409. Saat pindah ke `received`, setiap baris `material`
        menambah `current_stock` bahan baku terkait via
        `MaterialStockService::applyMovement()` dan mencatat
        `ActivityLogger` di transaksi yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ordered, received, paid, cancelled] }
                cancel_reason: { type: string, nullable: true, maxLength: 255 }
      responses:
        '200':
          description: Status diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /purchase-orders/{id}/payments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Purchase Order]
      summary: Catat pembayaran ke vendor untuk purchase order ini
      description: Lewat PaymentRecorder yang sama dengan pembayaran order/preorder (parameter purchaseOrderId).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount]
              properties:
                method: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
                channel_id: { type: integer, nullable: true }
                amount: { type: string }
                proof_token: { type: string, format: uuid, nullable: true }
                notes: { type: string, nullable: true, maxLength: 1000 }
      responses:
        '201':
          description: Pembayaran dicatat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /purchase-orders/{id}/invoice:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Purchase Order]
      summary: Data faktur purchase order (dirender jadi PDF di klien)
      description: |
        Endpoint ini murni data — sama seperti struk penjualan, PDF-nya
        dirender di klien lewat html2canvas + jsPDF, bukan generator PDF
        di server.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------
  # PELANGGAN
  # ------------------------------------------------------------------
  /customers:
    get:
      tags: [Master Data]
      summary: Cari pelanggan
      parameters:
        - { name: search, in: query, description: "Nama, telepon, atau akun media sosial", schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Customer' }
    post:
      tags: [Master Data]
      summary: Buat pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

  /customers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Master Data]
      summary: Perbarui pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
    delete:
      tags: [Master Data]
      summary: Hapus pelanggan
      description: |
        009-ui-ux-refinements (US4). Soft delete, owner/admin saja. Ditolak
        (409) bila pelanggan masih memiliki order atau pre-order (status
        apa pun) yang mereferensikannya.
      responses:
        '204': { description: Berhasil }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/{id}/transactions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data]
      summary: Riwayat transaksi pelanggan
      description: |
        009-ui-ux-refinements (US5). Menggabungkan order dan pre-order milik
        pelanggan menjadi satu daftar ringkas, diurutkan berdasarkan tanggal
        terbaru. Tier otorisasi baca sama dengan GET /customers (tidak
        diperluas). `status` untuk order memakai kolom status miliknya
        sendiri (completed/voided); untuk pre-order memakai kolom status
        pre-order (ordered/dp_paid/arrived/settled/handed_over/cancelled).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [order, preorder] }
                        id: { type: integer }
                        number: { type: string }
                        status: { type: string }
                        total_amount: { type: string }
                        date: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # PRE-ORDER
  # ------------------------------------------------------------------
  /preorders:
    get:
      tags: [Preorder]
      summary: Daftar pre-order
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ordered, dp_paid, arrived, settled, handed_over, cancelled] } }
        - { name: event_id, in: query, schema: { type: integer } }
        - { name: customer_id, in: query, schema: { type: integer } }
        - { name: fulfillment, in: query, schema: { type: string, enum: [pickup, courier] } }
        - { name: search, in: query, description: "007-preorder-import-export-notify (US1) — cocok parsial, tidak peka huruf besar/kecil, terhadap nama pelanggan.", schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PreorderSummary' }
    post:
      tags: [Preorder]
      summary: Buat pre-order
      description: |
        Pelanggan wajib diisi. Stok TIDAK berkurang pada tahap ini karena
        barang belum tersedia.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreorderInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /preorders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Preorder]
      summary: Detail pre-order
      description: |
        007-preorder-import-export-notify (US4) — respons kini menyertakan
        `latest_notification` (percobaan kirim email terakhir untuk
        pre-order ini, atau `null` bila belum pernah dicoba).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Preorder'
                  - type: object
                    properties:
                      latest_notification:
                        type: object
                        nullable: true
                        properties:
                          trigger: { type: string, enum: [status_change, manual_resend] }
                          status: { type: string, enum: [sent, skipped_no_email, skipped_not_configured, failed] }
                          error_message: { type: string, nullable: true }
                          sent_at: { type: string, format: date-time, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /preorders/{id}/invoice:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Preorder]
      summary: Data invoice/struk sesuai status (007-preorder-import-export-notify, US2)
      description: |
        Data mentah — PDF-nya dirender di klien (html2canvas + jsPDF), sama
        seperti struk penjualan dan invoice purchase order. `document_type`
        dihitung server dari status pre-order saat ini: `invoice` untuk
        `ordered`/`dp_paid`/`arrived`, `receipt` untuk `settled`/
        `handed_over`, `cancelled` untuk `cancelled`.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Preorder'
                  - type: object
                    properties:
                      document_type: { type: string, enum: [invoice, receipt, cancelled] }
        '404': { $ref: '#/components/responses/NotFound' }

  /preorders/export:
    get:
      tags: [Preorder]
      summary: Ekspor daftar pre-order ke .xlsx (007-preorder-import-export-notify, US3)
      description: Hanya owner/admin. Menghormati filter yang sama dengan `GET /preorders` (`status`/`event_id`/`customer_id`/`fulfillment`/`search`/`date_from`/`date_to`).
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: event_id, in: query, schema: { type: integer } }
        - { name: customer_id, in: query, schema: { type: integer } }
        - { name: fulfillment, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /preorders/import/template:
    get:
      tags: [Preorder]
      summary: Unduh template impor pre-order (007-preorder-import-export-notify, US3)
      description: Hanya owner/admin. Kolom header sama persis dengan yang divalidasi `POST /preorders/import`.
      responses:
        '200':
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /preorders/import:
    post:
      tags: [Preorder]
      summary: Impor batch pre-order dari .xlsx (007-preorder-import-export-notify, US3)
      description: |
        Hanya owner/admin. Validasi PENUH dulu, baru diterapkan sekaligus
        dalam satu transaksi (all-or-nothing, meniru
        `MasterDataImportService` — research.md R3) — bila ada satu baris
        gagal, TIDAK ADA yang disimpan. Setiap pre-order yang diimpor
        SELALU dibuat berstatus `ordered` dengan `paid_amount = 0`, apa pun
        data di berkas (FR-010) — operator memajukan status/pembayarannya
        secara manual setelah impor lewat endpoint yang sudah ada.
        `customer_name` yang belum dikenal otomatis membuat `Customer`
        baru (FR-009). Harga/qty pada baris DIPAKAI APA ADANYA (bukan
        dihitung ulang dari master data saat ini) — pengecualian yang
        disengaja terhadap aturan "server selalu menghitung ulang", karena
        impor mencatat transaksi historis yang sudah terjadi di luar
        sistem (research.md R4).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Berkas .xlsx dengan tata kolom sama dengan template. }
                dry_run: { type: string, enum: ['1'], description: Validasi tanpa menyimpan (pratinjau). }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  created_count: { type: integer }
                  created_customer_count: { type: integer }
                  preorder_ids: { type: array, items: { type: integer } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Validasi gagal — tidak ada baris yang disimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  row_errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        errors: { type: array, items: { type: string } }

  /preorders/{id}/notifications/resend:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Preorder]
      summary: Kirim ulang notifikasi email pre-order (007-preorder-import-export-notify, US4)
      description: |
        Hanya owner/admin. Jalur yang sama persis dengan notifikasi
        otomatis saat status berubah (`PreorderNotifier`), dipicu manual,
        independen dari perubahan status apa pun. SELALU 200 dengan hasil
        percobaan, tidak pernah 500 karena kegagalan kirim (FR-012/FR-013)
        — kegagalan/dilewati adalah hasil yang sah, bukan galat request.
      responses:
        '200':
          description: Percobaan tercatat (berhasil atau tidak)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [sent, skipped_no_email, skipped_not_configured, failed] }
                  recipient_email: { type: string, nullable: true }
                  sent_at: { type: string, format: date-time, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }

  /preorders/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Preorder]
      summary: Ubah status pre-order
      description: |
        Perpindahan status mengikuti state machine pada dokumen UML.
        Lompatan status ditolak dengan 409.

        **Efek stok:**
        - `arrived` menulis `stock_movements` bertipe `purchase`
        - `handed_over` menulis `stock_movements` bertipe `preorder_handover`
        - `handed_over` hanya diizinkan bila `paid_amount` sudah menutup `total_amount`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [dp_paid, arrived, settled, handed_over, cancelled] }
                cancel_reason: { type: string, nullable: true }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '409':
          description: Perpindahan status tidak valid atau belum lunas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /preorders/{id}/payments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Preorder]
      summary: Catat pembayaran pre-order
      description: |
        Dipakai untuk DP maupun pelunasan. Pembayaran non-tunai wajib
        menyertakan `proof_token`. Server memperbarui `paid_amount` dan
        memindahkan status bila pembayaran melunasi tagihan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /preorders/{id}/shipment:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Preorder]
      summary: Buat data pengiriman
      description: Hanya untuk pre-order dengan `fulfillment = courier`. Satu pre-order satu pengiriman.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '409': { $ref: '#/components/responses/Conflict' }

  /shipments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Preorder]
      summary: Perbarui pengiriman
      description: Dipakai untuk mengisi nomor resi dan memindahkan status pengiriman.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking_number: { type: string, nullable: true }
                status: { type: string, enum: [pending, packed, shipped, delivered] }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }

  # ------------------------------------------------------------------
  # LAPORAN
  # ------------------------------------------------------------------
  /reports/sales:
    get:
      tags: [Report]
      summary: Laporan penjualan
      parameters:
        - { name: event_id, in: query, schema: { type: integer } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { type: string, enum: [product, category, artist, day, event, customer], default: product } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }

  /reports/profit:
    get:
      tags: [Report]
      summary: Laporan modal dan keuntungan
      description: |
        Laba kotor dihitung dari nilai snapshot pada `order_items`, bukan
        harga master saat laporan dibuka. Laba bersih mengurangkan
        `event_cost`. Hanya peran owner dan admin.
      parameters:
        - { name: event_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfitReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/artist-profit:
    get:
      tags: [Report]
      summary: Laporan modal dan laba kotor per artist (F9.5)
      description: |
        Untuk setiap artist dengan minimal satu `order_items` 'completed'
        pada event ini: `total_sales` (SUM `line_total`), `modal` (SUM
        `cost_price * qty`, snapshot yang sama dipakai `GET /reports/profit`
        — bukan modal BOM hidup, lihat docblock `ReportController::
        artistProfit()`), dan `gross_profit = total_sales - modal`.

        `event_cost` TIDAK dikurangkan di laporan ini sama sekali (sudah
        diperhitungkan terpisah pada `GET /reports/profit`, F9.3) — sengaja
        tidak ada field itu pada respons ini. Hanya peran owner dan admin.
      parameters:
        - { name: event_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        artist_id: { type: integer }
                        artist_name: { type: string }
                        total_sales: { $ref: '#/components/schemas/Money' }
                        modal: { $ref: '#/components/schemas/Money' }
                        gross_profit: { $ref: '#/components/schemas/Money' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/purchases:
    get:
      tags: [Report]
      summary: Laporan pembelian (006-purchase-order-and-ops, US9)
      description: |
        Sumbernya `purchase_orders` (Eloquent, sudah HasDataMode — bukan
        `DB::table()` mentah seperti /reports/sales), bukan `order_items`.
        Tidak diskop event. Hanya peran owner dan admin.
      parameters:
        - { name: vendor_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [draft, ordered, received, paid, cancelled] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        po_number: { type: string }
                        vendor_name: { type: string }
                        status: { type: string }
                        created_at: { type: string, format: date-time }
                        total_amount: { $ref: '#/components/schemas/Money' }
                  totals:
                    type: object
                    properties:
                      po_count: { type: integer }
                      total_amount: { $ref: '#/components/schemas/Money' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/stock-by-artist:
    get:
      tags: [Report]
      summary: Laporan stok per artist (006-purchase-order-and-ops, US10; drilldown 009-ui-ux-refinements, US7)
      description: |
        Sumbernya `product_variants` (sudah HasDataMode via join produk),
        dijumlahkan `current_stock` per artist. Tidak diskop event. Hanya
        peran owner dan admin.

        Tanpa `artist_id`: mengembalikan array ringkasan per artist (bentuk
        lama, tidak berubah). Dengan `artist_id`: mengembalikan detail
        tingkat variant untuk SATU artist tersebut, dengan join
        artist→products→variants yang sama satu level lebih dalam
        (bukan endpoint/query terpisah).
      parameters:
        - name: artist_id
          in: query
          description: |
            Opsional. Bila diisi, respons berganti bentuk menjadi detail
            satu artist (lihat StockByArtistDetail). 404 bila artist_id
            tidak ditemukan atau berada di mode DEMO/LIVE yang sedang
            tidak aktif.
          schema: { type: integer }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Ringkasan seluruh artist (artist_id tidak diisi)
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            artist_id: { type: integer }
                            artist_name: { type: string }
                            variant_count: { type: integer }
                            total_stock: { type: integer }
                  - $ref: '#/components/schemas/StockByArtistDetail'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: artist_id tidak ditemukan pada mode DEMO/LIVE yang aktif

  /reports/artist-settlements:
    get:
      tags: [Report]
      summary: Rekap hasil per artist
      description: |
        Angka dihitung ulang dari `order_items` setiap kali dibaca, tanpa
        potongan komisi.

        Daftar memuat **seluruh artist aktif**, termasuk yang belum punya
        penjualan sama sekali di event ini (seluruh nilai uang `"0.00"`,
        `total_units` 0, `status` `unpaid`, `id` `null`). Artist nonaktif
        hanya ikut bila punya baris settlement di event ini.
      parameters:
        - { name: event_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ArtistSettlement' }

  /reports/artist-settlements/{artist}/transactions:
    parameters:
      - name: artist
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Report]
      summary: Drill-down transaksi yang menyusun rekap satu artist (F11.6)
      description: |
        Daftar order 'completed' pada event ini yang memuat minimal satu
        item milik artist ini, dikelompokkan per order. Karena satu order
        booth ini bisa berisi item dari BEBERAPA artist sekaligus, `items[]`
        pada setiap baris HANYA memuat item milik artist yang diminta —
        bukan seluruh isi order tersebut. Hanya peran owner dan admin.
      parameters:
        - { name: event_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
                  artist:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        order_id: { type: integer }
                        order_number: { type: string }
                        created_at: { type: string, format: date-time, nullable: true }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              sku: { type: string }
                              name: { type: string }
                              qty: { type: integer }
                              line_total: { $ref: '#/components/schemas/Money' }
                        order_total_for_artist:
                          $ref: '#/components/schemas/Money'
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/artist-settlements/{id}/payment:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Report]
      summary: Catat pembayaran ke artist
      description: Menandai berapa yang sudah diserahkan ke artist. Tidak mengubah `total_sales`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: string, example: "1250000.00" }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistSettlement' }

  /reports/{report}/export:
    parameters:
      - name: report
        in: path
        required: true
        schema: { type: string, enum: [sales, profit, artist-settlements, artist-profit] }
    get:
      tags: [Report]
      summary: Ekspor laporan ke Excel
      description: |
        Parameter filter sama dengan endpoint laporan terkait. Ekspor tidak
        menyertakan kolom kontak pelanggan.

        `report=artist-settlements` (F11.6) sengaja berbeda dari tiga
        laporan lain: berkasnya berisi DUA sheet, "Rekap" (bentuk lama,
        tidak berubah) dan "Detail Transaksi" (baru — satu baris flat per
        item per order, lintas semua artist di event ini: artist_name,
        order_number, date, item_name, qty, line_total).
      parameters:
        - { name: event_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Berkas xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  # ------------------------------------------------------------------
  # VENDOR, BAHAN BAKU, DAN BOM (ditambahkan pasca-MVP, 2026-09-01)
  #
  # CATATAN CAKUPAN — bukan kebangkitan "vendor management" / "materials/
  # production" yang dicoret PRD §10.2: cakupan di sini sengaja lebih
  # sempit (tidak ada purchase order, tidak ada penjadwalan produksi) dan
  # tidak berkorespondensi dengan nomor F- manapun. Lihat catatan
  # bertanggal di CLAUDE.md/README.md/PRD §10.2.
  # ------------------------------------------------------------------

  /users:
    get:
      tags: [Pengguna & Peran]
      summary: Daftar pengguna
      description: Digerbangi canAccessMenu('users') (001-user-store-settings US1).
      parameters:
        - { name: search, in: query, schema: { type: string }, description: "Mencocokkan name atau username (FR-004)." }
        - { name: role_id, in: query, schema: { type: integer } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pengguna & Peran]
      summary: Buat pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pengguna & Peran]
      summary: Detail pengguna
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pengguna & Peran]
      summary: Perbarui pengguna
      description: |
        password bersifat opsional (kosong berarti tidak diubah). Ditolak
        409 bila targetnya akun yang sedang login sendiri DAN perubahan
        akan menonaktifkannya atau mengganti role_id-nya (FR-006) — ini
        konflik aturan bisnis, bukan soal hak akses, jadi 409 bukan 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Pengguna & Peran]
      summary: Hapus (nonaktifkan) pengguna
      description: Soft delete. 409 bila targetnya akun yang sedang login sendiri (FR-006).
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/photo:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Pengguna & Peran]
      summary: Unggah/ganti foto pengguna
      description: Mirip persis POST /products/{id}/image, memakai ImageUploadService yang sama.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /roles:
    get:
      tags: [Pengguna & Peran]
      summary: Daftar peran
      description: |
        Digerbangi canAccessMenu('roles') (001-user-store-settings US2).
        `user_count` pada setiap baris adalah jumlah pengguna AKTIF yang
        memakai peran itu — dipasok siap pakai supaya frontend tidak perlu
        request kedua, dan supaya pesan penolakan 409 delete (FR-014)
        mengutip angka yang sama persis.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pengguna & Peran]
      summary: Buat peran
      description: |
        Setiap nilai `menu_keys` divalidasi terhadap registry
        App\Support\MenuKeys — kunci tak dikenal ditolak 422, tidak pernah
        didiamkan tersimpan tanpa efek.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /roles/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pengguna & Peran]
      summary: Detail peran
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pengguna & Peran]
      summary: Perbarui peran
      description: |
        Ditolak 409 (FR-013) bila perubahan `menu_keys` akan membuat TIDAK
        ADA satu pun peran tersisa (selain peran ini) yang mencakup KEDUA
        kunci reserved `users` DAN `roles` — toko tidak boleh pernah
        kehilangan kemampuan mengelola aksesnya sendiri.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Pengguna & Peran]
      summary: Hapus peran
      description: |
        Soft delete. Ditolak 409 bila peran masih dipakai satu atau lebih
        pengguna aktif (FR-014, pesan mengutip jumlah pengguna persis), ATAU
        bila peran ini adalah peran terakhir yang mencakup users+roles
        (FR-013, dicek sesudah FR-014).
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /menu-keys:
    get:
      tags: [Pengguna & Peran]
      summary: Registry menu/fitur yang tersedia
      description: |
        Sumber kebenaran tunggal App\Support\MenuKeys, dikembalikan sebagai
        {key,label}[] supaya layar pengaturan peran (RoleMenuPicker.vue)
        merender checkbox tanpa daftar menu di-hardcode dua kali.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: roles }
                        label: { type: string, example: Peran }

  /vendors:
    get:
      tags: [Vendor & Bahan Baku]
      summary: Daftar vendor
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Vendor' }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Buat vendor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendors/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Vendor & Bahan Baku]
      summary: Detail vendor
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Vendor & Bahan Baku]
      summary: Perbarui vendor
      description: Kolom `code` tidak dapat diubah, konsisten dengan Artist/Category.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Vendor & Bahan Baku]
      summary: Hapus vendor
      description: Soft delete. Ditolak (409) bila vendor masih punya baris harga bahan terdaftar.
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /materials:
    get:
      tags: [Vendor & Bahan Baku]
      summary: Daftar bahan baku
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Material' }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Buat bahan baku
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaterialInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Material' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /materials/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Vendor & Bahan Baku]
      summary: Detail bahan baku (menyertakan seluruh harga vendor)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Material' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Vendor & Bahan Baku]
      summary: Perbarui bahan baku
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaterialInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Material' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Vendor & Bahan Baku]
      summary: Hapus bahan baku
      description: |
        Soft delete. Ditolak (409) bila bahan masih punya harga vendor
        terdaftar ATAU masih dipakai baris BOM varian mana pun.
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /materials/{material}/vendor-prices:
    parameters:
      - { name: material, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Tambah harga vendor untuk satu bahan
      description: |
        Satu bahan boleh punya harga dari banyak vendor (unique pada
        pasangan vendor+bahan). Mengirim `is_preferred: true` melepas
        tanda preferred dari harga lain milik bahan yang sama — hanya
        satu vendor preferred per bahan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorMaterialPriceInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorMaterialPrice' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendor-prices/{vendorPrice}:
    parameters:
      - { name: vendorPrice, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Vendor & Bahan Baku]
      summary: Perbarui harga vendor untuk suatu bahan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorMaterialPriceInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorMaterialPrice' }
    delete:
      tags: [Vendor & Bahan Baku]
      summary: Hapus (detach) harga vendor untuk suatu bahan
      responses:
        '204': { description: Berhasil }

  /variants/{variant}/bom:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vendor & Bahan Baku]
      summary: Daftar baris BOM suatu varian
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BomLine' }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Tambah baris BOM (bahan + jumlah per unit) ke suatu varian
      description: |
        BOM diikat ke VARIAN, bukan produk induk — varian ukuran/warna
        berbeda dari produk yang sama bisa butuh jumlah bahan berbeda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BomLineInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BomLine' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /bom/{bomLine}:
    parameters:
      - { name: bomLine, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Vendor & Bahan Baku]
      summary: Perbarui jumlah/notes satu baris BOM
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BomLineInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BomLine' }
    delete:
      tags: [Vendor & Bahan Baku]
      summary: Hapus baris BOM
      responses:
        '204': { description: Berhasil }

  /variants/{variant}/cost-breakdown:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vendor & Bahan Baku]
      summary: Rincian modal bahan (BOM) suatu varian
      description: |
        `bom_cost` = jumlah `qty_needed * unit_cost` seluruh baris BOM.
        `unit_cost` per baris memakai harga vendor `is_preferred` bila
        ada, kalau tidak ada yang ditandai maka harga TERMURAH dipakai
        (lihat `App\Services\BomCostCalculator` untuk alasannya). Bahan
        tanpa harga vendor sama sekali dihitung sebagai biaya nol dan
        ditandai `has_price: false`.

        **`bom_cost` TIDAK PERNAH menimpa `cost_price`** — keduanya
        disajikan berdampingan di response ini supaya pemilik toko bisa
        membandingkan dan merekonsiliasi manual.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BomCostBreakdown' }

  # ------------------------------------------------------------------
  # IMPOR & EKSPOR MASTER DATA (PRD 7.15)
  #
  # CATATAN CAKUPAN — impor Excel awalnya dipotong dari MVP (PRD 10.2).
  # Ditambahkan kembali pada 2026-09-01 atas permintaan eksplisit
  # pemilik produk; keputusan pemotongan lama sengaja tidak dihapus dari
  # PRD, hanya diberi catatan bertanggal.
  # ------------------------------------------------------------------

  /exports/{entity}:
    parameters:
      - name: entity
        in: path
        required: true
        schema: { type: string, enum: [artists, categories, products, stock, vendors, materials, vendor_prices, bom, roles, users] }
    get:
      tags: [Import & Export]
      summary: Ekspor satu entitas master data ke Excel
      description: |
        Satu berkas `.xlsx` berisi SATU sheet bernama sama dengan `entity`,
        dengan judul kolom yang sama persis dengan yang diterima
        `POST /imports/master-data`. Berkas hasil ekspor karena itu bisa
        disunting lalu diunggah kembali apa adanya.

        Sheet `products` berisi **satu baris per varian** (bukan per
        produk), karena harga melekat pada varian.

        `vendors`, `materials`, `vendor_prices`, `bom` ditambahkan
        pasca-MVP (2026-09-01) — lihat catatan bertanggal di
        `CLAUDE.md`/`README.md`/PRD §10.2. `bom` berisi satu baris per
        pasangan varian+bahan, direferensikan lewat `sku` (bukan produk
        induk) karena BOM diikat ke varian.

        `roles`/`users` ditambahkan pada User Story 4 fitur
        001-user-store-settings (2026-09-02). Sheet `users` TIDAK PERNAH
        memuat kolom password (FR-007); kolom `photo_path`-nya adalah
        REFERENSI string ke path penyimpanan, bukan data biner gambarnya,
        dan diabaikan sepenuhnya bila muncul pada berkas impor.

        Digerbang `canManageMasterData()` (owner/admin/inventory) — lebih
        ketat daripada endpoint daftar yang boleh dibaca kasir, karena
        menarik seluruh master data sebagai berkas adalah permukaan
        ekstraksi data massal.
      responses:
        '200':
          description: Berkas xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /imports/master-data/template:
    get:
      tags: [Import & Export]
      summary: Unduh template impor gabungan
      description: |
        Workbook `.xlsx` berisi sepuluh sheet (`artists`, `categories`,
        `products`, `stock`, `vendors`, `materials`, `vendor_prices`, `bom`,
        `roles`, `users`) lengkap dengan judul kolom yang benar dan satu
        baris contoh per sheet (F15.3). Enam sheet terakhir ditambahkan
        pasca-MVP (`vendors`..`bom` pada 2026-09-01, `roles`/`users` pada
        2026-09-02 — User Story 4 fitur 001-user-store-settings) — bukan
        bagian dari F15.3 asli, tapi dibangun mengikuti pola workbook
        gabungan yang sama persis.
      responses:
        '200':
          description: Berkas xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /imports/master-data:
    post:
      tags: [Import & Export]
      summary: Impor massal master data dari satu berkas Excel
      description: |
        Satu berkas `.xlsx` memuat sampai delapan sheet sekaligus. Sheet
        yang tidak dikenali diabaikan dan dilaporkan pada `ignored_sheets`;
        nama sheet dicocokkan tanpa memandang huruf besar/kecil.

        **Urutan pemrosesan** selalu `artists` → `categories` → `products`
        → `stock` → `vendors` → `materials` → `vendor_prices` → `bom` →
        `roles` → `users`, berapa pun urutan sheet di dalam berkas. Sheet
        vendor/bahan baku/BOM ditambahkan pasca-MVP 2026-09-01; `roles`/
        `users` ditambahkan 2026-09-02 (User Story 4) — lihat catatan
        bertanggal di CLAUDE.md/README.md/PRD §10.2; keduanya kapabilitas
        baru, bukan pemulihan salah satu butir yang dicoret PRD §10.2.
        `users` menunjuk `roles` lewat NAMA (`role_name`), bukan kode —
        `Role` tidak punya kolom `code` seperti entitas lain.

        **Semua-atau-tidak sama sekali.** Seluruh berkas divalidasi lebih
        dulu; bila ada satu baris pun yang tidak valid, tidak ada data yang
        diubah dan seluruh galat dikembalikan sekaligus (422). Ini
        menyimpang dari kriteria penerimaan F15.5 (yang meminta baris valid
        tetap tersimpan) secara sengaja: sheet-sheet ini saling bergantung,
        sehingga penyimpanan sebagian meninggalkan master data setengah
        jadi yang jauh lebih sulit dibereskan.

        **Kunci pencocokan (upsert, bukan selalu insert)**
        | Sheet | Kunci |
        |---|---|
        | `artists` | `code` |
        | `categories` | `code` |
        | `products` | `sku` bila diisi; bila kosong, `code_prefix` (artist_code + category_code + product_segment) + `variant_name` |
        | `stock` | `sku` |
        | `vendors` | `code` |
        | `materials` | `code` |
        | `vendor_prices` | pasangan (`vendor_code`, `material_code`) |
        | `bom` | pasangan (`sku`, `material_code`) |
        | `roles` | `name` |
        | `users` | `username` |

        **Kode dihasilkan server.** `code_prefix` dan `sku` selalu dibuat
        `ProductCodeGenerator`. Kolom `sku` pada sheet `products` hanya
        boleh menunjuk varian yang SUDAH ada — SKU yang tidak dikenal
        ditolak, tidak dipakai untuk membuat varian baru.

        **Stok bersifat absolut.** Kolom `current_stock` pada sheet `stock`
        adalah jumlah akhir yang diinginkan; server menghitung selisihnya
        terhadap stok saat ini dan menerapkannya sebagai satu
        `stock_movements` bertipe `adjustment` (F15.8). Baris yang angkanya
        sudah sama tidak menghasilkan movement apa pun.

        Sheet `stock` menunjuk varian lewat `sku`. Cara paling aman mengisi
        stok awal varian BARU adalah kolom `initial_stock` di sheet
        `products`, karena SKU dibuat server. Sheet `stock` tetap boleh
        menunjuk SKU yang baru akan dibuat oleh berkas yang sama — SKU-nya
        deterministik (`code_prefix` + urutan 4 digit) — dan
        penyelesaiannya ditunda sampai sheet `products` diterapkan. SKU
        yang tetap tidak ditemukan setelah itu membatalkan seluruh impor
        dengan galat per-baris biasa.

        **Sel kosong berarti "jangan diubah"**, bukan "kosongkan nilainya".

        **Task 6 — gambar via impor massal.** Sheet `products` dan
        `categories` punya kolom `image_filename`. Bila diisi, nilainya
        harus PERSIS SAMA dengan nama asli salah satu berkas yang
        diunggah bersamaan lewat field `images[]` pada request yang sama.
        Berkas yang cocok disalin ke penyimpanan publik (lokasi yang sama
        dengan `POST /products/{id}/image` / `POST /categories/{id}/image`,
        Task 5) dan `image_path` entitas diisi. Nama berkas yang
        direferensikan TAPI TIDAK ADA padanannya di `images[]` adalah
        GALAT PER BARIS (`column: image_filename`), bukan dilewati diam-diam
        — konsisten dengan strategi semua-atau-tidak-sama-sekali impor ini.
        Kolom kosong berarti "tidak ada gambar diikutsertakan" (gambar yang
        sudah ada, bila ada, tidak diubah).

        **Vendor/bahan/BOM (pasca-MVP, 2026-09-01).** Sheet `vendor_prices`
        dan `bom` mereferensikan vendor/bahan/varian lewat `vendor_code`/
        `material_code`/`sku` — pola yang sama dengan `artist_code`/
        `category_code` pada sheet `products`. Baris `bom` boleh menunjuk
        SKU yang baru dibuat sheet `products` pada berkas yang sama
        (diselesaikan setelah sheet `products` diterapkan, pola yang sama
        dengan sheet `stock`). Menandai `is_preferred = 1` pada sheet
        `vendor_prices` melepas tanda preferred dari harga vendor lain
        untuk bahan yang sama.

        **Roles/Users (User Story 4, 2026-09-02).** Sheet `roles` punya
        kolom `menu_keys` berisi daftar kunci menu dipisah KOMA dalam satu
        sel (mis. `pos,session`), divalidasi terhadap registry
        `App\Support\MenuKeys`. Sheet `users` mereferensikan peran lewat
        `role_name` (boleh menunjuk peran baru yang dibuat sheet `roles`
        pada berkas yang sama) dan TIDAK PERNAH punya kolom password
        (FR-007) — akun baru dari impor mendapat password ACAK yang dibuat
        server, wajib diatur ulang pemiliknya lewat `PUT /users/{user}`.
        Baris `users` yang `role_name`-nya tidak dikenal membatalkan
        SELURUH impor (FR-009), termasuk baris `roles` valid pada berkas
        yang sama.

        Digerbang `canAccessAnyMenu()` — siapa pun yang bisa mengelola
        salah satu entitas master data pada berkas (termasuk
        pengguna/peran) boleh mengimpornya secara massal, konsisten dengan
        `canManageMasterData()` (owner/admin/inventory) untuk sheet lain.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Berkas `.xlsx`, maksimal 10 MB.
                dry_run:
                  type: boolean
                  default: false
                  description: |
                    Bila `true`, berkas hanya divalidasi dan jumlah baris
                    dilaporkan — tidak ada data yang ditulis (F15.4).
                images:
                  type: array
                  items: { type: string, format: binary }
                  description: |
                    Task 6 — batch gambar JPEG/PNG (maks 5 MB masing-masing,
                    maks 200 berkas) yang direferensikan lewat kolom
                    image_filename pada sheet products/categories,
                    dicocokkan berdasarkan nama berkas ASLI.
      responses:
        '200':
          description: Impor berhasil, atau pratinjau tanpa galat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataImportResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            Berkas ditolak (bukan `.xlsx` valid, terlalu besar, tidak
            memuat sheet yang dikenali) ATAU ada baris yang tidak valid.
            Pada kasus terakhir `errors` berisi daftar galat per baris dan
            `applied` bernilai `false` — tidak ada data yang berubah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataImportResult' }

# =====================================================================
# COMPONENTS
# =====================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 25, maximum: 100 }

  responses:
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Peran tidak memiliki izin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Bertentangan dengan aturan bisnis
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:

    StockByArtistDetail:
      type: object
      description: |
        Bentuk respons GET /reports/stock-by-artist ketika query param
        artist_id diisi (009-ui-ux-refinements, US7).
      properties:
        artist_id: { type: integer }
        artist_name: { type: string }
        variants:
          type: array
          items:
            type: object
            properties:
              variant_id: { type: integer }
              sku: { type: string }
              variant_name: { type: string, nullable: true }
              current_stock: { type: integer }
        variant_count: { type: integer }
        total_stock: { type: integer }

    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string, nullable: true, example: INSUFFICIENT_STOCK }

    Paginated:
      type: object
      properties:
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }

    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "150000.00"

    # BUG YANG DITEMUKAN & DIPERBAIKI — skema ini sebelumnya juga bernama
    # `User` sama seperti skema entitas CRUD pengguna di bawah (lihat
    # bagian "Pengguna & Peran"), yang ditambahkan belakangan oleh alur
    # kerja terpisah. Dua definisi top-level dengan kunci sama di YAML
    # membuat definisi kedua diam-diam menimpa yang pertama pada parser
    # yang taat spesifikasi — endpoint /auth/login dan /auth/me akan
    # terdokumentasi memakai skema yang salah (bentuk objek role, bukan
    # nama+menu_keys) tanpa galat apa pun yang terlihat. Diberi nama
    # sendiri karena memang bentuknya berbeda dari skema entitas User
    # (role di sini nama tampilan saja + menu_keys hasil resolusi sesi,
    # bukan objek Role penuh).
    AuthenticatedUser:
      type: object
      description: |
        Bentuk `user` pada respons /auth/login dan /auth/me — BUKAN skema
        entitas User CRUD (lihat `User` di bagian "Pengguna & Peran").
        `role` adalah NAMA Role yang bisa dikonfigurasi bebas oleh owner
        (bukan lagi enum 4 nilai tetap) — dipakai HANYA untuk tampilan.
        `menu_keys` adalah daftar kunci menu yang boleh diakses akun ini,
        resolusi sekali per sesi login/`GET /auth/me`; ini yang dipakai
        frontend untuk `canAccessMenu()` (cosmetic saja — penegakan
        sesungguhnya tetap di server pada setiap endpoint).
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        role: { type: string, example: Owner }
        menu_keys:
          type: array
          items: { type: string }
          example: [dashboard, pos, session, products, reports, settings]
        is_active: { type: boolean }
        photo_url:
          type: string
          nullable: true
          description: |
            005-ux-enhancements-dashboard — dipakai avatar header (AppSidebar)
            dan layar Profil Saya. null bila belum pernah mengunggah foto.
        language:
          type: string
          enum: [id, en]
          description: >
            Preferensi bahasa antarmuka akun ini (002-language-toggle),
            default 'en'. Berlaku setelah login saja — tidak mempengaruhi
            layar login maupun struk transaksi (selalu Bahasa Indonesia).

    Artist:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, minLength: 3, maxLength: 3, example: RYU }
        name: { type: string }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        product_count: { type: integer, readOnly: true }

    ArtistInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 3, maxLength: 3, description: Huruf kapital. Permanen setelah dibuat. }
        name: { type: string, maxLength: 100 }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean, default: true }

    # -------------------------------------------------------------
    # Pengguna & Peran (001-user-store-settings, ditambahkan 2026-10)
    # -------------------------------------------------------------
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        role:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        is_active: { type: boolean }
        photo_url: { type: string, nullable: true, readOnly: true }
        last_login_at: { type: string, format: date-time, nullable: true }
      description: password TIDAK PERNAH disertakan (FR-007), termasuk pada ekspor massal.

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 50 }
        menu_keys:
          type: array
          items: { type: string }
          description: Divalidasi terhadap registry App\Support\MenuKeys.
        is_system_default:
          type: boolean
          description: |
            `true` untuk 4 peran bawaan (Owner/Admin/Kasir/Inventory) yang
            direproduksi seeder — informasional saja, tidak memblokir edit.
        user_count:
          type: integer
          readOnly: true
          description: Jumlah pengguna AKTIF yang memakai peran ini.

    RoleInput:
      type: object
      required: [name, menu_keys]
      properties:
        name: { type: string, maxLength: 50, description: Unik di antara peran yang belum dihapus. }
        menu_keys:
          type: array
          items: { type: string }
          description: Setiap nilai harus salah satu kunci App\Support\MenuKeys — kunci tak dikenal ditolak 422.

    UserInput:
      type: object
      required: [name, username, role_id]
      properties:
        name: { type: string, maxLength: 100 }
        username: { type: string, maxLength: 50, description: Unik di antara pengguna yang belum dihapus. }
        password: { type: string, minLength: 8, description: Wajib saat membuat; opsional saat memperbarui (kosong = tidak diubah). }
        role_id: { type: integer, description: Harus merujuk Role yang belum dihapus. }
        is_active: { type: boolean, default: true }

    # -------------------------------------------------------------
    # Vendor, bahan baku, dan BOM (ditambahkan pasca-MVP, 2026-09-01)
    # -------------------------------------------------------------
    Vendor:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, maxLength: 20, example: VNAKR }
        name: { type: string }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        material_price_count: { type: integer, nullable: true, readOnly: true }

    VendorInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 20, description: Permanen setelah dibuat, sama seperti Artist/Category. }
        name: { type: string, maxLength: 150 }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean, default: true }

    Material:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, maxLength: 20, example: AC3 }
        name: { type: string }
        unit: { type: string, example: lembar, description: "Bebas: pcs, gram, meter, lembar, dst." }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        vendor_price_count: { type: integer, nullable: true, readOnly: true }
        vendor_prices:
          type: array
          readOnly: true
          description: Hanya disertakan pada GET /materials/{id}.
          items: { $ref: '#/components/schemas/VendorMaterialPrice' }

    MaterialInput:
      type: object
      required: [code, name, unit]
      properties:
        code: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 150 }
        unit: { type: string, maxLength: 20 }
        notes: { type: string, nullable: true }
        is_active: { type: boolean, default: true }

    VendorMaterialPrice:
      type: object
      properties:
        id: { type: integer }
        vendor_id: { type: integer }
        vendor_name: { type: string, readOnly: true }
        material_id: { type: integer }
        price: { type: string, example: "15000.00" }
        is_preferred:
          type: boolean
          description: |
            Vendor acuan untuk perhitungan bom_cost saat bahan ini punya
            >1 vendor. Hanya satu true per bahan — menandai satu melepas
            tanda dari yang lain.
        notes: { type: string, nullable: true }

    VendorMaterialPriceInput:
      type: object
      required: [vendor_id, price]
      description: vendor_id wajib hanya saat membuat (POST); tidak berlaku saat update (PUT).
      properties:
        vendor_id: { type: integer }
        price: { type: number, minimum: 0 }
        is_preferred: { type: boolean, default: false }
        notes: { type: string, nullable: true }

    BomLine:
      type: object
      properties:
        id: { type: integer }
        product_variant_id: { type: integer }
        material_id: { type: integer }
        material_name: { type: string, readOnly: true }
        material_unit: { type: string, readOnly: true }
        qty_needed: { type: string, example: "2.5000", description: Per satu unit produk jadi; boleh pecahan. }
        notes: { type: string, nullable: true }

    BomLineInput:
      type: object
      required: [material_id, qty_needed]
      description: material_id wajib hanya saat membuat (POST); tidak berlaku saat update (PUT).
      properties:
        material_id: { type: integer }
        qty_needed: { type: number, exclusiveMinimum: 0 }
        notes: { type: string, nullable: true }

    BomCostBreakdown:
      type: object
      description: |
        Read-only. bom_cost TIDAK PERNAH menimpa cost_price — keduanya
        disajikan berdampingan untuk direkonsiliasi manual oleh pemilik
        toko (lihat App\Services\BomCostCalculator).
      properties:
        product_variant_id: { type: integer }
        sku: { type: string }
        cost_price: { type: string, example: "12345.00", description: Modal manual yang sudah ada, tidak diubah oleh endpoint ini. }
        bom_cost: { type: string, example: "16000.00", description: "Jumlah qty_needed * unit_cost seluruh baris BOM." }
        lines:
          type: array
          items:
            type: object
            properties:
              bom_line_id: { type: integer }
              material_id: { type: integer }
              material_name: { type: string }
              unit: { type: string }
              qty_needed: { type: string }
              unit_cost: { type: string, description: Harga vendor acuan (preferred, atau termurah bila tidak ada yang preferred). }
              line_cost: { type: string }
              has_price: { type: boolean, description: false bila bahan ini belum punya harga vendor sama sekali (line_cost dihitung 0). }
              reference_vendor_id: { type: integer, nullable: true }
              reference_vendor_name: { type: string, nullable: true }
              reference_is_preferred: { type: boolean }

    Category:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, minLength: 2, maxLength: 2, example: KY }
        name: { type: string }
        image_path: { type: string, nullable: true, description: "Task 5. Diisi via POST /categories/{id}/image atau impor massal (Task 6)." }
        image_url: { type: string, nullable: true, readOnly: true, description: "URL siap-pakai (disk publik)." }
        parent_id: { type: integer, nullable: true }
        display_order: { type: integer }
        is_active: { type: boolean }

    CategoryInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 2 }
        name: { type: string, maxLength: 100 }
        parent_id: { type: integer, nullable: true }
        display_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }

    Variant:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        sku: { type: string, minLength: 12, maxLength: 12, example: RYUKYSAK0007 }
        variant_name: { type: string }
        cost_price: { $ref: '#/components/schemas/Money' }
        sell_price: { $ref: '#/components/schemas/Money' }
        current_stock: { type: integer, readOnly: true }
        low_stock_alert: { type: integer, nullable: true }
        is_active: { type: boolean }

    VariantInput:
      type: object
      required: [variant_name, sell_price]
      properties:
        variant_name: { type: string, maxLength: 100, default: Standard }
        cost_price: { $ref: '#/components/schemas/Money' }
        sell_price: { $ref: '#/components/schemas/Money' }
        low_stock_alert: { type: integer, nullable: true }
        is_active: { type: boolean, default: true }

    VariantLookup:
      type: object
      description: Bentuk ringkas untuk layar kasir
      properties:
        variant_id: { type: integer }
        sku: { type: string }
        label: { type: string, example: Keychain Sakura — Varian A }
        artist_name: { type: string }
        sell_price: { $ref: '#/components/schemas/Money' }
        current_stock: { type: integer }
        is_preorder: { type: boolean }

    Product:
      type: object
      properties:
        id: { type: integer }
        artist_id: { type: integer }
        artist_name: { type: string, readOnly: true }
        category_id: { type: integer }
        category_name: { type: string, readOnly: true }
        code_prefix: { type: string, minLength: 8, maxLength: 8, readOnly: true, example: RYUKYSAK }
        product_segment: { type: string, minLength: 3, maxLength: 3 }
        name: { type: string }
        description: { type: string, nullable: true }
        image_path: { type: string, nullable: true, description: "Diisi via POST /products/{id}/image atau impor massal (Task 6)." }
