        shipping_cost: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money', description: "021-preorder-form-updates (US2) — nominal Rupiah tetap, opsional, default 0. 422 bila melebihi subtotal+shipping_cost." }
        pickup_day: { type: string, format: date, nullable: true, description: "021-preorder-form-updates (US3) — hanya berlaku saat fulfillment=pickup DAN event_id terisi; harus berada dalam rentang tanggal event tersebut (422 bila tidak)." }
