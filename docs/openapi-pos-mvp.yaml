          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invoices:
    get:
      tags: [Billing]
      summary: Daftar invoice keseluruhan (019-billing-system — menu mandiri, bukan lagi anak Company)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [unpaid, paid, cancelled] } }
        - { name: company_id, in: query, schema: { type: integer } }
        - { name: license_id, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Billing]
      summary: Buat invoice
      description: Server menghitung invoice_number dan grand_total (subtotal - discount) — tidak pernah dipercaya dari client (research.md R3'/R4', FR-013).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, license_id, subtotal, due_date]
              properties:
                company_id: { type: integer }
                license_id: { type: integer }
                subtotal: { type: number, format: float, minimum: 0.01 }
                discount: { type: number, format: float, minimum: 0, default: 0, description: Jumlah tetap, tidak boleh melebihi subtotal. }
                due_date: { type: string, format: date }
                payment_information: { type: string, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /invoices/summary:
    get:
      tags: [Billing]
      summary: Statistik invoice (FR-012)
      description: Dihitung langsung dari query invoice yang sama, ter-scope data_mode aktif — tidak bisa disagree dengan daftar invoice pada layar yang sama.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  unpaid:
                    type: object
                    properties:
                      count: { type: integer }
                      total: { type: string }
                  paid:
                    type: object
                    properties:
                      count: { type: integer }
                      total: { type: string }
                  overall_count: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoices/export:
    get:
      tags: [Billing]
      summary: Ekspor daftar invoice ke .xlsx (019-billing-system, T074/T075)
      description: Hanya owner/admin (inline isOwnerOrAdmin(), meniru `GET /preorders/export`). Menghormati filter yang sama dengan `GET /invoices` (`status`/`company_id`/`license_id`).
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [unpaid, paid, cancelled] } }
        - { name: company_id, in: query, schema: { type: integer } }
        - { name: license_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoices/import/template:
    get:
      tags: [Billing]
      summary: Unduh template impor invoice (019-billing-system, T074/T075)
      description: Hanya owner/admin. Kolom header sama persis dengan yang divalidasi `POST /invoices/import`.
      responses:
        '200':
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoices/import:
    post:
      tags: [Billing]
      summary: Impor batch invoice dari .xlsx (019-billing-system, T074/T075)
      description: |
        Hanya owner/admin. Validasi PENUH dulu, baru diterapkan sekaligus
        dalam satu transaksi (all-or-nothing, meniru
        `PreorderExportImportService`/`MasterDataImportService`, research.md
        R6') — bila ada satu baris gagal, TIDAK ADA yang disimpan. Baris
        dengan `invoice_number` KOSONG adalah CREATE (`company_name`/
        `license_name` di-resolve ke Company/License by name; nomor invoice
        dibuat via `InvoiceService::generateNumber()`, `grand_total` selalu
        dihitung server dari subtotal-discount, tidak pernah diimpor). Baris
        dengan `invoice_number` TERISI adalah UPDATE pada invoice yang sudah
        ada; ditolak (per-row error, seluruh impor gagal) bila invoice
        tersebut sudah berstatus `paid` (FR-011) atau bila `invoice_number`
        tidak ditemukan. `dry_run=1` melewati jalur validasi yang identik
        untuk pratinjau tanpa menyimpan.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Berkas .xlsx dengan tata kolom sama dengan template. }
                dry_run: { type: string, enum: ['1'], description: Validasi tanpa menyimpan (pratinjau). }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  created_count: { type: integer }
                  updated_count: { type: integer }
                  invoice_ids: { type: array, items: { type: integer } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Validasi gagal — tidak ada baris yang disimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  row_errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        errors: { type: array, items: { type: string } }

  /invoices/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
