openapi: 3.0.3

# =====================================================================
# KLASIFIKASI: INTERNAL
# Kontrak API — Sistem POS Event-Based Multi-Artist
# Cakupan: MVP Oktober 2026 (termasuk pre-order dan pengiriman kurir)
# Acuan: PRD v1.4, schema-pos-mvp.sql v1.0, uml-pos-mvp.md v1.0
#
# ATURAN: berkas ini adalah sumber kebenaran kontrak API. Koleksi Bruno
# dan Postman diturunkan dari sini, bukan ditulis terpisah. Perubahan
# endpoint wajib memperbarui berkas ini dalam commit yang sama.
# =====================================================================

info:
  title: BoothPOS API
  version: 1.4.0
  description: |
    API internal untuk BoothPOS — sistem POS berbasis event untuk toko
    merchandise yang berjualan online maupun di bazaar/event. Berjalan di
    localhost pada perangkat operasional toko, tanpa akses publik,
    sejalan dengan model lisensi sekali bayar dan instalasi lokal per toko.

    **Autentikasi** — token bearer. Token diperoleh dari `/auth/login`
    dan dikirim pada header `Authorization: Bearer <token>`.

    **Format uang** — seluruh nilai uang berupa string desimal dua angka
    di belakang koma, contoh `"150000.00"`. String dipakai agar tidak ada
    galat pembulatan floating point di sisi klien.

    **Zona waktu** — seluruh timestamp dalam format ISO 8601 dengan
    offset waktu lokal perangkat.

servers:
  - url: http://localhost:8000/api/v1
    description: Instalasi lokal pada laptop operasional

tags:
  - name: License
  - name: Auth
  - name: Master Data
  - name: Settings
  - name: Stock
  - name: Event & Session
  - name: Sales
  - name: Preorder
  - name: Payment
  - name: Report
  - name: Vendor & Bahan Baku
  - name: Purchase Order
  - name: Import & Export
  - name: Company Onboarding

security:
  - bearerAuth: []

# =====================================================================
# PATHS
# =====================================================================
paths:

  # ------------------------------------------------------------------
  # LICENSE (018-license-activation)
  # ------------------------------------------------------------------
  # Kedua endpoint ini SENGAJA tanpa auth DAN dikecualikan dari
  # EnsureInstallationIsActivated (satu-satunya pengecualian selain
  # keduanya sendiri) — harus tetap terjangkau selagi instalasi belum
  # teraktivasi sama sekali (FR-002). Setiap endpoint LAIN di berkas ini
  # mengembalikan 423 selagi belum aktif — tidak diulang di tiap path
  # demi keterbacaan, cukup dicatat sekali di sini.
  /license/status:
    get:
      tags: [License]
      summary: Status aktivasi instalasi ini
      security: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  activated: { type: boolean }

  /license/activate:
    post:
      tags: [License]
      summary: Aktivasi instalasi dengan kunci lisensi
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key]
              properties:
                license_key: { type: string, description: 'base64(payload).base64(signature) — string tunggal yang ditempel dari email vendor.' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  activated: { type: boolean }
        '422':
          description: Kunci lisensi tidak valid — satu alasan generik saja, tidak membedakan bentuk salah dari tanda tangan salah (FR-003).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  # ------------------------------------------------------------------
  # AUTH
  # ------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan dapatkan token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: kasir01 }
                password: { type: string, format: password }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cabut token aktif
      responses:
        '204': { description: Berhasil }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil pengguna aktif
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    put:
      tags: [Auth]
      summary: Ganti password akun sendiri (005-ux-enhancements-dashboard)
      description: >
        Self-service — SENGAJA tidak digerbang canAccessMenu('users'), sama
        seperti /auth/language. Setiap akun boleh mengubah password
        miliknya sendiri, digerbang hanya oleh current_password yang benar.
        Token sesi yang sedang dipakai TIDAK dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/photo:
    post:
      tags: [Auth]
      summary: Ganti foto profil akun sendiri (005-ux-enhancements-dashboard)
      description: >
        Self-service — sengaja endpoint TERPISAH dari
        `POST /users/{user}/photo` (yang digerbang UserPolicy::update() /
        canAccessMenu('users')). Endpoint ini hanya pernah menyentuh
        $request->user() sendiri, tidak menerima {user} dari klien, jadi
        aman dipakai peran tanpa akses menu Pengguna (mis. Kasir).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: "JPEG/PNG, maks 5 MB" }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/language:
    put:
      tags: [Auth]
      summary: Ganti preferensi bahasa akun sendiri (002-language-toggle)
      description: >
        Self-service — SENGAJA tidak digerbang canAccessMenu('users').
        Setiap akun yang sudah login boleh mengubah bahasanya sendiri,
        termasuk peran tanpa akses menu Pengguna (mis. Kasir default).
        Berlaku untuk seluruh antarmuka setelah login; layar login dan
        struk transaksi TIDAK ikut berubah (selalu Bahasa Indonesia).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { type: string, enum: [id, en] }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # MASTER DATA — ARTIST
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # SETTINGS — FLAG FITUR / LISENSI
  # ------------------------------------------------------------------
  /settings/features:
    get:
      tags: [Settings]
      summary: Status flag fitur berbayar
      description: |
        Dibaca frontend untuk menentukan tampilan UI sesuai tingkat
        lisensi (Pro/Master) — bukan sumber kebenaran otorisasi. Penegakan
        sebenarnya tetap terjadi di server pada setiap endpoint terkait
        (contoh: `POST /artists`), bukan dari flag yang dibaca di sini.
        Klien yang memaksa memanggil endpoint terlarang tetap akan
        ditolak 403 meski tidak pernah memanggil endpoint ini.

        `system_mode` (003-seed-demo-live, FR-005) terbuka untuk SEMUA
        role yang login (bukan hanya owner/admin) — status DEMO/LIVE harus
        selalu terlihat oleh siapa pun yang memakai sistem. Hanya
        MENGUBAHNYA yang dibatasi owner/admin, lewat `PUT /settings`.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  multi_artist_enabled: { type: boolean }
                  artist_count: { type: integer, description: Jumlah artist aktif saat ini }
                  artist_limit_reached: { type: boolean, description: "true bila Pro dan sudah punya 1 artist" }
                  system_mode:
                    type: string
                    enum: [demo, live]
                    description: |
                      Mode aktif saat ini. 'demo' menampilkan data contoh
                      (lihat SakanaFridgeDemoSeeder); 'live' hanya
                      menampilkan data yang dibuat sungguhan. Default
                      'live' bila baris settings `system_mode` belum
                      pernah dibuat (instalasi baru TIDAK PERNAH diam-diam
                      mulai dalam mode DEMO).
                  app_name:
                    type: string
                    maxLength: 50
                    description: |
                      Nama aplikasi/merek produk (default `BoothPOS`), tampil di
                      sidebar dan sebagai "Powered by …" pada dokumen. Bukan nama
                      toko (`store_name`). Diubah owner/admin lewat `PUT /settings`
                      (key `app_name`, maks. 50 karakter — lebih panjang ditolak
                      422); kosong/spasi saja berarti kembali ke default.
                  schema_update_required:
                    type: boolean
                    description: |
                      035-po-row-actions — `true` hanya untuk pengguna yang boleh
                      mengelola pengaturan (owner/admin) SAAT ada migrasi yang
                      belum diterapkan; selalu `false` untuk peran lain dan bila
                      database sudah mutakhir. Daftar migrasinya TIDAK PERNAH
                      dikirim. Aplikasi tidak pernah menerapkan migrasi dari
                      sebuah request — administrator yang melakukannya.

  /settings/payment:
    get:
      tags: [Settings]
      summary: Ambil pengaturan informasi pembayaran invoice
      description: |
        Singleton (satu baris, id selalu 1) berisi informasi pembayaran
        (nama bank, nomor rekening, atas nama, instruksi) yang dijadikan
        default `payment_information` saat invoice baru dibuat
        (019-billing-system, FR-008/FR-015). Dibuat kosong secara otomatis
        pada akses pertama. Digerbang dengan menu key `settings` yang sudah
        ada (bukan menu key baru).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePaymentSetting' }
        '403':
          description: Peran tanpa akses menu settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Settings]
      summary: Perbarui pengaturan informasi pembayaran invoice
      description: |
        Selalu updateOrCreate(['id' => 1], ...) — tidak pernah membuat baris
        kedua meskipun dipanggil berulang kali.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_name: { type: string, nullable: true }
                account_number: { type: string, nullable: true }
                account_holder: { type: string, nullable: true }
                instructions: { type: string, nullable: true }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePaymentSetting' }
        '403':
          description: Peran tanpa akses menu settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /settings:
    get:
      tags: [Settings]
      summary: Daftar seluruh pengaturan
      description: |
        Hanya owner/admin (F14 — Setting & config management). Tabel
        `payment_channels` (nomor rekening) TIDAK ikut di sini; itu
        resource terpisah dengan penyamaran nomor rekeningnya sendiri.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Setting' }
                  store_logo_url:
                    type: string
                    nullable: true
                    description: 023-event-availability-invoice-redesign (US4, research.md Decision 8) — diselesaikan lewat ImageUploadService, konvensi yang sama dengan setiap gambar lain di produk ini; menggantikan konstruksi URL manual di frontend yang jadi akar bug logo tidak tampil.
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      summary: Ubah satu atau beberapa pengaturan sekaligus
      description: |
        Bentuk BULK, bukan satu key per request — layar pengaturan
        biasanya menyimpan beberapa field sekaligus (nama toko, kontak,
        format struk). Ini juga satu-satunya jalur admin untuk mengubah
        `multi_artist_enabled` (upgrade lisensi Pro ke Master); lihat
        catatan lisensi pada `POST /artists`. `type`/`group` boleh
        dikosongkan pada key yang sudah ada — nilai lama dipakai lagi.
        Setiap key yang berubah tercatat di log aktivitas (F13.4).

        Juga satu-satunya jalur mengubah `system_mode`
        (003-seed-demo-live) — key baru bernilai `demo`/`live`, group
        `system`. Tidak ada endpoint terpisah untuk ini (lihat
        specs/003-seed-demo-live/contracts/settings-system-mode.md):

        ```json
        { "settings": [{ "key": "system_mode", "value": "demo", "type": "string", "group": "system" }] }
        ```

        006-purchase-order-and-ops (US7) — juga satu-satunya jalur untuk
        tiga key baru ini, tidak ada endpoint terpisah: `theme_accent_color`
        (hex warna, group `appearance`, diterapkan klien sebagai override
        CSS custom property `--color-brand`), `receipt_footer_text` (group
        `receipt`, dirender di struk hanya bila terisi — dihilangkan sama
        sekali, bukan blok kosong, saat kosong), `receipt_show_logo`
        (boolean-as-string, group `receipt`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/SettingInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Setting' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /settings/store-logo:
    post:
      tags: [Settings]
      summary: Unggah/ganti logo toko (001-user-store-settings US3, T045)
      description: |
        Mengikuti pola persis `POST /categories/{id}/image` — endpoint
        multipart terpisah karena `PUT /settings`'s bulk JSON body tidak
        bisa membawa file (lihat research.md Decision 3). Menulis baris
        `store_logo_path` di tabel `settings` yang sama, dicatat ke log
        aktivitas seperti setiap perubahan `PUT /settings` lainnya.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Setting' }
                  store_logo_url:
                    type: string
                    description: 023-event-availability-invoice-redesign (US4) — dari path yang BARU SAJA diunggah, bukan dibaca ulang dari DB, supaya tampil seketika tanpa round-trip kedua.
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # LOG AKTIVITAS (F13.4)
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # CADANGAN & PEMULIHAN DATABASE (Pengaturan)
  # ------------------------------------------------------------------
  /backups:
    get:
      tags: [Settings]
      summary: Daftar cadangan database
      description: |
        Owner/admin saja (403 untuk peran lain) — cadangan memuat SELURUH data,
        termasuk hash kata sandi dan data pelanggan. Terbaru dulu. Setiap
        cadangan = satu folder di `BACKUP_PATH` (default `storage/app/backups`)
        berisi `database.sql` dan, bila ada, `payment-proofs.tar.gz`.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Backup' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Settings]
      summary: Buat cadangan sekarang
      description: |
        Sama dengan `php artisan app:backup` (dump MySQL + arsip bukti pembayaran
        + salinan ke `BACKUP_EXTERNAL_PATH` bila diset). Butuh `mysqldump` di
        server (image toko membawanya; image dev tidak). Gagal di tengah jalan
        → folder setengah jadi dihapus dan 500 dengan `message`.
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: mysqldump gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /backups/{id}:
    parameters:
      - { name: id, in: path, required: true, description: "Id cadangan (`Y-m-d_His`); pola lain → 404.", schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}_\d{6}(-\d+)?$' } }
    delete:
      tags: [Settings]
      summary: Hapus satu cadangan
      description: |
        Menghapus folder cadangan beserta isinya (`database.sql` dan
        `payment-proofs.tar.gz`). Tidak menyentuh database, bukti pembayaran ASLI,
        maupun salinan di `BACKUP_EXTERNAL_PATH`. Tidak bisa dibatalkan. Owner/admin
        saja; tercatat di log aplikasi (siapa & cadangan mana).
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /backups/{id}/download:
    parameters:
      - { name: id, in: path, required: true, description: "Id cadangan (`Y-m-d_His`, mis. `2026-09-30_100000`); pola lain → 404.", schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}_\d{6}(-\d+)?$' } }
    get:
      tags: [Settings]
      summary: Unduh berkas database.sql sebuah cadangan
      responses:
        '200':
          description: Berkas SQL
          content:
            application/sql:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /backups/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}_\d{6}(-\d+)?$' } }
    post:
      tags: [Settings]
      summary: Pulihkan database dari sebuah cadangan
      description: |
        MENIMPA SELURUH database. Wajib `confirm: "RESTORE"` (persis, huruf besar;
        selain itu 422 dan tidak ada yang disentuh). Urutannya SELALU: (1) buat
        cadangan pengaman dari kondisi saat ini, (2) baru timpa. Bila cadangan
        pengaman gagal, pemulihan TIDAK dijalankan (500 dengan pesan yang
        menyebut pemulihan dibatalkan). Berkas bukti pembayaran hanya dicadangkan,
        tidak dipulihkan. Sesi/token ikut tertimpa isi cadangan, jadi klien
        sebaiknya memuat ulang dan siap diarahkan ke login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [RESTORE] }
      responses:
        '200':
          description: Dipulihkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRestoreResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Kata konfirmasi salah/hilang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Cadangan pengaman atau pemulihan gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /backups/restore-upload:
    post:
      tags: [Settings]
      summary: Pulihkan database dari berkas .sql yang diunggah
      description: |
        Aturan sama dengan `POST /backups/{id}/restore` (kata konfirmasi,
        cadangan pengaman dulu). Berkas harus berekstensi `.sql`, maks. 50 MB,
        dan tampak seperti dump aplikasi ini — memuat tabel `settings` DAN
        `users` — kalau tidak 422 pada `file` sebelum apa pun disentuh.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, confirm]
              properties:
                file: { type: string, format: binary }
                confirm: { type: string, enum: [RESTORE] }
      responses:
        '200':
          description: Dipulihkan (`source` = "upload")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRestoreResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Berkas/konfirmasi tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Cadangan pengaman atau pemulihan gagal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /activity-logs:
    get:
      tags: [Settings]
      summary: Riwayat tindakan sensitif
      description: |
        Hapus data, penyesuaian stok, dan perubahan harga/pengaturan
        (F13.4, prioritas M). Hanya owner/admin. `old_values`/`new_values`
        adalah snapshot kolom yang bisa diisi ulang (fillable) pada
        entitas terkait saat kejadian, bukan diff per-field.
      parameters:
        - { name: entity_type, in: query, schema: { type: string, example: Artist } }
        - { name: entity_id, in: query, schema: { type: integer } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string, enum: [created, updated, deleted, stock_adjusted, price_changed] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ActivityLog' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /artists:
    get:
      tags: [Master Data]
      summary: Daftar artist
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Artist' }
    post:
      tags: [Master Data]
      summary: Buat artist
      description: |
        **Gate lisensi (v1.1)** — bila pengaturan `multi_artist_enabled`
        bernilai false (instalasi Pro) dan sudah ada satu artist aktif,
        permintaan ini ditolak dengan 403. Instalasi baru yang belum
        punya artist sama sekali tetap boleh membuat SATU artist
        (menjadi artist bawaan), baik pada Pro maupun Master. Cek dulu
        `GET /settings/features` untuk menyembunyikan tombol "Tambah
        Artist" di UI saat kuota sudah tercapai.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '403':
          description: Kuota artist Pro sudah tercapai, perlu upgrade ke Master
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /artists/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data]
      summary: Detail artist
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data]
      summary: Perbarui artist
      description: Kolom `code` tidak dapat diubah karena sudah menjadi bagian SKU yang beredar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtistInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Master Data]
      summary: Nonaktifkan artist
      description: Soft delete. Ditolak bila artist masih memiliki produk aktif.
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------
  # MASTER DATA — KATEGORI
  # ------------------------------------------------------------------
  /categories:
    get:
      tags: [Master Data]
      summary: Daftar kategori
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Master Data]
      summary: Buat kategori
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Master Data]
      summary: Perbarui kategori
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
    delete:
      tags: [Master Data]
      summary: Nonaktifkan kategori
      description: Ditolak bila masih ada produk aktif pada kategori ini.
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories/{id}/image:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Master Data]
      summary: Unggah/ganti gambar kategori (Task 5)
      description: |
        Kategori sebelumnya tidak punya kolom gambar sama sekali
        (`image_path` ditambahkan lewat migrasi
        `2026_10_07_000001_add_image_path_to_categories_table`). Pola sama
        dengan POST /products/{id}/image.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # MASTER DATA — PRODUK
  # ------------------------------------------------------------------
  /products:
    get:
      tags: [Master Data]
      summary: Daftar produk
      description: |
        `variants` TIDAK disertakan kecuali `with_variants=1` dikirim.
        Opt-in, bukan default: layar Kelola Produk tidak memakai varian,
        sedangkan layar kasir memakainya — memuatnya selalu hanya
        memperbesar payload untuk konsumen yang tidak butuh.
      parameters:
        - { name: search, in: query, description: "Cocokkan nama produk, atau SKU/nama varian pada salah satu variannya", schema: { type: string } }
        - name: artist_id
          in: query
          description: |
            005-ux-enhancements-dashboard — sekarang array (dropdown
            multi-pilih Products/POS): `artist_id[]=1&artist_id[]=2`.
            Skalar tunggal lama (`artist_id=1`) tetap didukung mundur.
            Kosong/tidak dikirim = tanpa filter sumbu ini.
          style: form
          explode: true
          schema: { type: array, items: { type: integer } }
        - name: category_id
          in: query
          description: Sama seperti `artist_id` di atas — array, kompatibel mundur.
          style: form
          explode: true
          schema: { type: array, items: { type: integer } }
        - { name: is_preorder, in: query, schema: { type: boolean } }
        - name: with_variants
          in: query
          description: |
            `1`/`true` menyertakan `variants` pada setiap produk, dimuat
            lewat eager-load (bukan satu query per produk). Isinya sama
            persis dengan `GET /products/{id}`, termasuk varian nonaktif.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Master Data]
      summary: Buat produk beserta varian
      description: |
        `code_prefix` dan `sku` dihasilkan server, tidak dikirim klien.
        `code_prefix` = artist.code + "-" + category.code + "-" + product_segment
        (format "ART-CA-SEG", 10 karakter). `sku` = code_prefix + "-" + urutan
        varian 3 digit (format "ART-CA-SEG-001", 14 karakter).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data]
      summary: Detail produk beserta varian
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data]
      summary: Perbarui produk
      description: Perubahan nama tidak mengubah `code_prefix` maupun SKU yang sudah ada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
    delete:
      tags: [Master Data]
      summary: Nonaktifkan produk
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{id}/image:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Master Data]
      summary: Unggah/ganti gambar produk (Task 5)
      description: |
        Terpisah dari POST/PUT /products karena endpoint itu menerima
        array bersarang `variants`, yang sulit dikirim lewat
        multipart/form-data. Gambar lama (bila ada) dihapus setelah
        gambar baru tersimpan. Disk publik — dilayani lewat
        /storage/... setelah `php artisan storage:link`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}/variants:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Master Data]
      summary: Tambah varian pada produk
      description: |
        034-seller-po-bom — `copy_bom_from_variant_id` (opsional): salin BOM
        dari varian lain PRODUK YANG SAMA ke varian baru dalam satu transaksi
        (422 bila bukan produk yang sama / sumber kosong; 403 tanpa menu
        `purchase_orders`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }

  /variants/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Master Data]
      summary: Perbarui varian
      description: |
        Perubahan `sell_price` atau `cost_price` tidak memengaruhi transaksi
        yang sudah tercatat, karena harga disimpan sebagai snapshot.
        `current_stock` tidak dapat diubah lewat endpoint ini.

        034-seller-po-bom — selama BOM varian ditandai SELESAI, `cost_price`
        mengikuti biaya BOM dan dikunci: nilai yang BERBEDA ditolak 409
        `{code: cost_price_locked_by_bom}`; nilai yang sama diterima.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
        '409': { $ref: '#/components/responses/Conflict' }

  /variants/lookup:
    get:
      tags: [Master Data]
      summary: Cari varian untuk kasir
      description: Endpoint ringan khusus layar kasir. Hanya mengembalikan varian aktif dengan kolom seperlunya.
      parameters:
        - { name: q, in: query, required: true, description: "SKU, nama varian, atau nama produk induknya", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VariantLookup' }

  # ------------------------------------------------------------------
  # STOK
  # ------------------------------------------------------------------
  /stock/movements:
    get:
      tags: [Stock]
      summary: Riwayat pergerakan stok
      description: |
        036-bom-variant-stock-ux — dipakai layar Stok DAN riwayat transaksi per
        varian (`variant_id`). Urutan: `created_at` terbaru dulu, lalu `id`
        terbaru dulu (timestamp kembar tetap stabil). **Akses**: menu `stock`
        ATAU `products` — peran lain 403 (dulu terbuka untuk semua peran yang
        login, sehingga `user_name` tidak boleh ikut dibuka).

        `reference` diselesaikan server menjadi nomor transaksi yang bisa dibaca
        (penjualan/retur -> nomor order; tiba/serah terima/selisih edit pre-order ->
        nomor pre-order) dan `null` bila tidak bisa dibuktikan menyangkut varian
        ini (tidak pernah menampilkan nomor yang salah). Penyesuaian stok awal/manual
        dan impor tidak punya referensi (alasan ada di `reason`).
      parameters:
        - { name: variant_id, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [purchase, sale, preorder_handover, adjustment, return, initial] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StockMovement' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stock/adjustments:
    post:
      tags: [Stock]
      summary: Penyesuaian stok manual
      description: |
        Dipakai untuk stok awal dan hasil stock opname. Menulis baris
        `stock_movements` dan memperbarui `current_stock` dalam satu
        transaksi database. Alasan wajib diisi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, reason]
              properties:
                reason: { type: string, maxLength: 255, example: Stok awal event Oktober }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [variant_id, qty_change]
                    properties:
                      variant_id: { type: integer }
                      qty_change: { type: integer, description: "Positif menambah, negatif mengurangi. Tidak boleh nol." }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  movements:
                    type: array
                    items: { $ref: '#/components/schemas/StockMovement' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stock/low:
    get:
      tags: [Stock]
      summary: Varian dengan stok menipis
      description: |
        Varian aktif yang `current_stock`-nya sudah di titik atau di bawah
        `low_stock_alert` masing-masing. Varian tanpa `low_stock_alert`
        (null) tidak pernah muncul di sini — belum ada ambang untuk dicek.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        variant_id: { type: integer }
                        sku: { type: string }
                        product_name: { type: string }
                        current_stock: { type: integer }
                        low_stock_alert: { type: integer }

  # ------------------------------------------------------------------
  # EVENT & SESI
  # ------------------------------------------------------------------
  /events:
    get:
      tags: [Event & Session]
      summary: Daftar event
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, active, closed, cancelled] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Event' }
    post:
      tags: [Event & Session]
      summary: Buat event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }

  /events/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Event & Session]
      summary: Detail event
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
    put:
      tags: [Event & Session]
      summary: Perbarui event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
    delete:
      tags: [Event & Session]
      summary: Hapus event
      description: |
        009-ui-ux-refinements (US4). Soft delete, owner/admin saja. Ditolak
        (409) bila event masih memiliki order atau pre-order (status apa
        pun) yang mereferensikannya.
      responses:
        '204': { description: Berhasil }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Event & Session]
      summary: Ubah status event
      description: |
        Perpindahan status mengikuti state machine. Menutup event memicu
        perhitungan `artist_settlements`. Event tidak dapat ditutup bila
        masih ada sesi kasir berstatus `open`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, closed, cancelled] }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '409':
          $ref: '#/components/responses/Conflict'

  /sessions/current:
    get:
      tags: [Event & Session]
      summary: Sesi kasir aktif milik pengguna
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierSession' }
        '404':
          description: Tidak ada sesi terbuka

  /sessions:
    post:
      tags: [Event & Session]
      summary: Buka sesi kasir
      description: |
        Ditolak bila pengguna masih memiliki sesi lain berstatus `open`.

        006-purchase-order-and-ops (US6) — `opening_cash_entries[]` opsional
        memecah `opening_cash` per artist (satu sesi kasir tetap satu baris
        `cashier_sessions`, bukan satu sesi per artist). Bila diisi, jumlah
        seluruh `amount` WAJIB persis sama dengan `opening_cash` (422 bila
        tidak).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, opening_cash]
              properties:
                event_id: { type: integer }
                opening_cash: { type: string, example: "500000.00" }
                opening_cash_entries:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required: [artist_id, amount]
                    properties:
                      artist_id: { type: integer }
                      amount: { type: string, example: "250000.00" }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Sesi dibuka
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sessions/{id}/close:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Event & Session]
      summary: Tutup sesi kasir
      description: |
        Server menghitung `expected_cash` dari kas awal ditambah pembayaran
        tunai terverifikasi pada sesi DIKURANGI kembalian (`orders.change_amount`),
        tanpa order yang dibatalkan (`voided`) — rumus yang sama dengan panel
        shift di halaman Sales — lalu menghitung selisih terhadap
        `closing_cash` yang dilaporkan kasir.

        028-partial-split-payment (PERUBAHAN PERILAKU): tunai dihitung di shift
        TEMPAT UANG DITERIMA (`payments.session_id`), bukan shift penjualan
        aslinya. Pembayaran susulan atas penjualan lama masuk ke shift saat ia
        diterima; shift yang sudah ditutup tak pernah berubah. Kembalian tetap
        dikurangkan di shift penjualannya. Pembayaran pre-order (tanpa shift)
        tetap di luar kas shift.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closing_cash]
              properties:
                closing_cash: { type: string, example: "2350000.00" }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Sesi ditutup
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierSession' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sessions/{id}/summary:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Event & Session]
      summary: Ringkasan sesi kasir
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }

  # ------------------------------------------------------------------
  # PEMBAYARAN
  # ------------------------------------------------------------------
  /payment-channels:
    get:
      tags: [Payment]
      summary: Daftar kanal pembayaran non-tunai
      description: |
        Mengembalikan rekening bank dan QR e-wallet yang aktif untuk
        ditampilkan ke pelanggan.

        CATATAN KEAMANAN — hanya peran owner dan admin yang menerima
        `account_number` lengkap. Peran kasir menerima nomor tersamar
        pada daftar, dan nomor penuh hanya saat kanal dipilih untuk satu
        transaksi.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentChannel' }
    post:
      tags: [Payment]
      summary: Tambah kanal pembayaran (owner/admin)
      description: |
        Task 4 — `qr_image` kini bisa diikutsertakan saat membuat kanal
        (sebelumnya tidak ada field gambar sama sekali di endpoint ini,
        sehingga kanal QR baru tidak pernah punya cara diberi gambar QR).
        Disimpan di disk publik supaya bisa dirender langsung oleh UI POS.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, provider, account_name]
              properties:
                type: { type: string, enum: [bank_transfer, qr_ewallet] }
                provider: { type: string, maxLength: 50 }
                account_name: { type: string, maxLength: 100 }
                account_number: { type: string, nullable: true, description: Wajib untuk bank_transfer. }
                display_order: { type: integer }
                qr_image:
                  type: string
                  format: binary
                  description: JPEG atau PNG, maksimal 5 MB. Opsional — bisa ditambahkan belakangan lewat POST /payment-channels/{id}.
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentChannel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payment-channels/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Payment]
      summary: Ubah kanal pembayaran, termasuk gambar QR (owner/admin)
      description: |
        Task 4 — endpoint yang SEBELUMNYA SAMA SEKALI TIDAK ADA (hanya
        index()/store() yang terdaftar). Tanpa ini, kanal yang sudah
        dibuat tanpa QR code tidak bisa diberi gambar belakangan.
        Memakai POST, bukan PUT, karena unggahan multipart/form-data
        dengan method override lebih konsisten diimplementasikan di
        klien lewat POST langsung.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                type: { type: string, enum: [bank_transfer, qr_ewallet] }
                provider: { type: string, maxLength: 50 }
                account_name: { type: string, maxLength: 100 }
                account_number: { type: string, nullable: true }
                display_order: { type: integer }
                is_active: { type: boolean }
                qr_image: { type: string, format: binary, description: JPEG atau PNG, maksimal 5 MB. }
                remove_qr_image:
                  type: boolean
                  description: Menghapus gambar QR yang sudah ada tanpa menggantinya.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentChannel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Payment]
      summary: Hapus kanal pembayaran (soft delete) (owner/admin)
      description: |
        024-invoice-layout-shipping-slip — soft-delete kanal pembayaran.
        Mengembalikan 409 jika kanal sedang digunakan oleh payment yang
        sudah ada (FK constraint).
      responses:
        '204':
          description: Berhasil dihapus
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payment-proofs:
    post:
      tags: [Payment]
      summary: Unggah bukti pembayaran
      description: |
        Dipanggil sebelum transaksi disimpan. Mengembalikan `proof_token`
        yang disertakan saat membuat order atau pembayaran pre-order.
        Token tanpa transaksi akan dibersihkan otomatis setelah 24 jam.

        CATATAN KEAMANAN (area risiko: input validation) — tipe berkas
        diverifikasi dari isi berkas, bukan dari header klien. Berkas
        disimpan dengan nama acak di luar direktori publik.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, captured_via]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG atau PNG, maksimal 5 MB setelah kompresi klien
                captured_via:
                  type: string
                  enum: [webcam, upload]
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  proof_token: { type: string, format: uuid }
                  file_size: { type: integer }
        '413':
          description: Berkas melebihi batas ukuran
        '422': { $ref: '#/components/responses/ValidationError' }

  /payment-proofs/{id}/file:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Payment]
      summary: Ambil berkas bukti pembayaran
      description: |
        Disajikan melalui pemeriksaan izin, bukan tautan langsung ke penyimpanan. Boleh dibuka:
        owner/admin, pengunggah berkas, dan (031-optional-payment-proof) pencatat pembayaran untuk
        bukti yang BERLAKU pada pembayaran itu (bukti yang ditambahkan owner belakangan tetap bisa
        dibuka kasir pemilik pembayarannya). Bukti yang sudah diganti (`superseded_at`) hanya untuk
        owner/admin dan pengunggahnya. Pengguna lain → 403.
      responses:
        '200':
          description: Berkas gambar
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # PENJUALAN
  # ------------------------------------------------------------------
  /orders:
    get:
      tags: [Sales]
      summary: Daftar transaksi
      parameters:
        - { name: event_id, in: query, schema: { type: integer } }
        - { name: session_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [completed, voided] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
    post:
      tags: [Sales]
      summary: Buat transaksi penjualan
      description: |
        Endpoint inti kasir. Seluruh operasi berjalan dalam satu transaksi
        database: order, order_items, payments, payment_proofs, dan
        stock_movements.

        **Aturan yang ditegakkan server:**
        - Sesi kasir harus berstatus `open`
        - Harga diambil dari master, bukan dari kiriman klien
        - Pembayaran non-tunai wajib menyertakan `channel_id`; `proof_token` (foto/berkas bukti) OPSIONAL
          sejak 031-optional-payment-proof — bisa ditambahkan belakangan lewat
          `PATCH /orders/{id}/payments/{payment_id}/confirmation`. Token yang dikirim harus valid dan belum terpakai.
        - Total pembayaran harus menutup `total_amount` — KECUALI penjualan memiliki
          `customer_id` (028-partial-split-payment): penjualan boleh selesai
          dibayar sebagian (`completed`, stok berkurang, `change_amount` 0) dan
          sisanya dilunasi lewat `POST /orders/{id}/payments`. Tanpa pelanggan,
          pembayaran kurang → 409 `customer_required_for_partial_payment`.
        - Stok tidak boleh menjadi negatif

        **Idempotensi** — sertakan `local_ref` berupa UUID yang dibuat
        klien. Bila permintaan dengan `local_ref` sama dikirim ulang,
        server mengembalikan transaksi yang sudah ada, bukan membuat baru.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: Transaksi tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Stok tidak mencukupi, sesi tertutup, atau local_ref sudah dipakai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sales]
      summary: Detail transaksi
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/void:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Sales]
      summary: Batalkan transaksi
      description: |
        Transaksi tidak dihapus. Status berubah menjadi `voided` dan stok
        dikembalikan melalui `stock_movements` bertipe `return`.
        Hanya peran owner dan admin yang diizinkan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Dibatalkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{id}/payments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Sales]
      summary: Pembayaran susulan atas penjualan POS yang dibayar sebagian (028-partial-split-payment, US5)
      description: |
        Mencatat SATU pembayaran dan mengembalikan penjualan terbaru dengan `payment_summary`.
        Siapa saja yang login boleh mencatat (sama seperti checkout). Aturan, semuanya dinilai
        setelah baris order dikunci:
        - `client_ref` (UUID) yang sama pada order yang sama → **200** tanpa pembayaran baru
          (idempotensi); ref milik transaksi lain → 422;
        - order `voided` → 409; sudah lunas → 409; `amount` > sisa tagihan → 422 (`errors.amount`
          menyebut maksimumnya);
        - pembayaran **tunai** memerlukan sesi kasir TERBUKA milik pencatat (409 bila tidak ada) dan
          disimpan di `payments.session_id` — uang dihitung di shift tempat ia diterima; non-tunai
          mencatat sesi bila ada;
        - non-tunai wajib `channel_id`; `proof_token` opsional (031) — bukti bisa ditambahkan belakangan.
        Menulis baris `activity_logs` `payment_recorded` di transaksi yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Pembayaran baru tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Replay `client_ref` — tidak ada pembayaran baru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { description: "Order batal, sudah lunas, atau tunai tanpa sesi kasir terbuka" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}/payments/{payment_id}:
    delete:
      tags: [Sales]
      summary: Hapus satu pembayaran penjualan POS (028-partial-split-payment)
      description: |
        Hanya owner/admin (403 untuk peran lain). 404 bila pembayaran bukan milik order ini. 409 untuk
        order `voided`, dan untuk pembayaran **tunai** milik shift yang SUDAH ditutup (sudah direkonsiliasi —
        menghapusnya akan merusak laporan shift). Menghapus baris pembayaran dan buktinya, menghitung ulang
        `paid_amount`, dan menulis `activity_logs` `payment_deleted` (jumlah/status lama dan baru).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: payment_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Order sesudah dihitung ulang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Order batal, atau tunai milik shift yang sudah ditutup" }

  /orders/{id}/payments/{payment_id}/verify:
    post:
      tags: [Sales]
      summary: Tandai satu pembayaran non-tunai penjualan POS terverifikasi (032-mark-payment-verified)
      description: |
        032-mark-payment-verified — menandai SATU pembayaran non-tunai yang masih `pending` sebagai
        `verified` (sudah dicocokkan dengan mutasi bank/e-wallet). Tanpa body. **Satu arah dan FINAL:**
        tidak ada route untuk membatalkan verifikasi (keputusan produk); jejaknya ada di activity log.

        **Otorisasi:** owner/admin, atau pengguna mana pun KECUALI pencatat pembayaran itu
        (`payments.recorded_by`) — pencatat → 403. Pembayaran lama tanpa pencatat boleh diverifikasi siapa pun.

        **Aturan** (setelah baris transaksi dikunci, jadi dua klik serentak berlaku berurutan): pembayaran
        milik transaksi ini (404 bila bukan); penjualan `voided` → 409; tunai → 422 (`errors.method`; tunai sudah
        terverifikasi sejak dicatat); sudah `verified` → 409; `rejected` → 409.

        Menulis `verified_by`/`verified_at` dan baris `activity_logs` `payment_verified` (nilai lama/baru) di
        transaksi yang sama. Tidak mengubah jumlah, metode, kanal, status, total, kas yang diharapkan, atau
        laporan; pembayaran itu kini muncul di rincian per-metode `GET /sessions/{id}/summary` (rincian itu
        sejak awal hanya menghitung pembayaran terverifikasi).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: payment_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Penjualan sesudah diverifikasi (payments[] memuat verification, verified_by_name, verified_at, can_verify)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Penjualan batal, atau pembayaran sudah terverifikasi / ditolak" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/verify-payments:
    post:
      tags: [Sales]
      summary: Verifikasi massal pembayaran non-tunai dari beberapa penjualan (032-mark-payment-verified, US3)
      description: |
        Untuk tiap penjualan terpilih (id dari daftar Sales), memverifikasi setiap pembayaran NON-TUNAI yang
        masih `pending` lewat jalur satu-pembayaran yang sama (satu transaksi dan satu baris audit
        `payment_verified` per pembayaran). Yang tak bisa diverifikasi pemanggil DILEWATI dan dihitung per
        alasan, tidak menggagalkan sisanya: `voided` (penjualan batal), `rejected`, `already_verified`,
        `own_payment` (dicatat pemanggil, kecuali owner/admin). Pembayaran tunai diabaikan (tidak dihitung).
        Id yang tak ditemukan / milik mode DEMO-LIVE lain diabaikan. Satu arah dan final seperti verifikasi
        tunggal. Hitungan adalah jumlah PEMBAYARAN, kecuali `verified_orders`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_ids]
              properties:
                order_ids: { type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: { type: integer } }
      responses:
        '200':
          description: Ringkasan
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: integer }
                  verified_orders: { type: integer }
                  skipped:
                    type: object
                    properties:
                      already_verified: { type: integer }
                      own_payment: { type: integer }
                      voided: { type: integer }
                      rejected: { type: integer }
                  skipped_total: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}/payments/{payment_id}/confirmation:
    patch:
      tags: [Sales]
      summary: Tambah / ubah / ganti konfirmasi pembayaran penjualan POS (031-optional-payment-proof)
      description: |
        031-optional-payment-proof — menambah, mengubah, atau mengganti KONFIRMASI sebuah pembayaran
        non-tunai yang sudah tercatat: bukti (`proof_token` dari `POST /payment-proofs`), `reference`,
        dan `notes`. Semua kunci opsional; minimal satu harus dikirim (422 `errors.confirmation`).
        Mengirim `null` mengosongkan referensi/catatan, tetapi hasil akhirnya tidak boleh kosong
        sama sekali (bukti, referensi, dan catatan semuanya tak ada → 422). Bukti tidak bisa
        dihapus mentah, hanya diganti: bukti lama ditandai `superseded_at`, file dan barisnya
        DIPERTAHANKAN untuk audit.

        **Otorisasi:** owner/admin, atau pengguna yang mencatat pembayaran itu (`payments.recorded_by`);
        pengguna lain → 403. Pembayaran lama tanpa pencatat → hanya owner/admin.

        **Aturan** (setelah baris transaksi dikunci): pembayaran milik transaksi ini (404 bila bukan);
        penjualan `voided` → 409; pembayaran tunai → 422 (`errors.method`); token bukti tak dikenal/sudah terpakai → 422.

        Tidak pernah mengubah jumlah, metode, kanal, waktu, status, total, atau kas shift. Menulis
        `activity_logs` `payment_confirmation_updated` (nilai lama dan baru) di transaksi yang sama.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: payment_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentConfirmationInput' }
      responses:
        '200':
          description: Penjualan sesudah diubah (payments[] memuat notes, proof_id, has_proof, can_view_proof, can_edit_confirmation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Penjualan sudah dibatalkan" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}/receipt:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sales]
      summary: Data struk
      description: Mengembalikan data siap tampil untuk struk di layar, termasuk identitas toko dari pengaturan dan `app_name` (nama aplikasi untuk teks "Powered by …"). 028-partial-split-payment — juga `paid_amount`, `balance_amount`, `payment_status` (`unpaid|partially_paid|fully_paid`) dan `reference`/`paid_at` per pembayaran; struk yang diambil ulang setelah pembayaran susulan memuatnya.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }

  # ------------------------------------------------------------------
  # POS DRAFTS (006-purchase-order-and-ops, US4)
  # ------------------------------------------------------------------
  /pos-drafts:
    get:
      tags: [Sales]
      summary: Daftar draft transaksi kasir milik pengguna saat ini
      description: |
        Tidak menyentuh stok — checkout tetap menghitung ulang harga dari
        master data saat draft dilanjutkan, sesuai Constitution IV. Hanya
        draft milik pengguna yang login (dilingkupi kepemilikan, bukan
        menu_keys — setiap kasir yang login sudah boleh bertransaksi POS).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PosDraftSummary' }
    post:
      tags: [Sales]
      summary: Simpan keranjang POS saat ini sebagai draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                event_id: { type: integer, nullable: true }
                customer_id: { type: integer, nullable: true }
                label: { type: string, nullable: true, maxLength: 100 }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [variant_id, qty]
                    properties:
                      variant_id: { type: integer }
                      sku: { type: string, nullable: true }
                      qty: { type: integer, minimum: 1 }
                      sell_price:
                        type: string
                        nullable: true
                        description: Snapshot tampilan saja, bukan sumber harga sungguhan.
                discount_amount: { type: string }
      responses:
        '201':
          description: Draft tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosDraftSummary' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /pos-drafts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sales]
      summary: Lanjutkan draft — kembalikan keranjang siap dipakai POS
      description: 404 bila draft bukan milik pengguna yang login (bukan 403 — tidak membocorkan keberadaan draft pengguna lain).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Sales]
      summary: Buang draft
      responses:
        '204': { description: Dibuang }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # PURCHASE ORDER (006-purchase-order-and-ops, US1)
  # ------------------------------------------------------------------
  /purchase-orders:
    get:
      tags: [Purchase Order]
      summary: Daftar purchase order
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, ordered, received, paid, cancelled] } }
        - { name: vendor_id, in: query, schema: { type: integer } }
        - { name: artist_id, in: query, description: 034-seller-po-bom — saring menurut seller yang dibelikan., schema: { type: integer } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Purchase Order]
      summary: Buat purchase order (selalu berstatus draft)
      description: |
        `material_id` wajib untuk baris `line_type=material`, `description`
        wajib untuk baris `line_type=service` (FR-001). `product_id` selalu
        opsional apa pun `line_type`-nya (tautan bahan baku ke produk
        tertentu). `po_number` dibuat server, unik lintas mode DEMO/LIVE.

        034-seller-po-bom — `artist_id` (seller yang dibelikan) WAJIB: satu
        seller per purchase order. Seller inilah dasar filter selector BOM.
        `product_id` ("Linked Product") tidak lagi ditawarkan UI, tetapi
        tetap diterima dan disimpan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /purchase-orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Purchase Order]
      summary: Detail purchase order (termasuk items dan payments)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Purchase Order]
      summary: Perbarui purchase order
      description: |
        Baris item hanya boleh diubah selama status masih `draft` — 409 bila tidak.

        034-seller-po-bom — `artist_id`: menetapkan seller pada PO lama
        (tanpa seller, `artist_id: null`) selalu boleh; MENGUBAH seller
        ditolak 409 bila salah satu baris PO ini sudah dipakai baris BOM.
        Setiap penetapan/perubahan ditulis ke activity log
        (`purchase_order_seller_assigned` / `purchase_order_seller_changed`).

        035-po-row-actions — PO berstatus APA PUN (kecuali dibatalkan, 409)
        tetap bisa mengubah vendor, seller, dan catatan; baris dikunci setelah
        `draft`. Perubahan vendor/total/baris ditulis ke activity log
        (`purchase_order_updated`, nilai lama + baru) di transaksi yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Purchase Order]
      summary: Hapus purchase order
      description: |
        Hanya diizinkan selama status masih `draft` — 409 bila tidak (pesan
        menyarankan Batalkan untuk status lain). 035-po-row-actions: juga 409
        bila PO sudah punya pembayaran, atau salah satu barisnya sudah dipakai
        baris BOM varian — penghapusan tidak boleh meninggalkan data yatim.
        Penghapusan ditulis ke activity log di transaksi yang sama.
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /purchase-orders/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Purchase Order]
      summary: Ubah status purchase order
      description: |
        Transisi yang diizinkan: `draft`→`ordered`|`cancelled`,
        `ordered`→`received`|`cancelled`, `received`→`paid`. Transisi lain
        ditolak 409. Saat pindah ke `received`, setiap baris `material`
        menambah `current_stock` bahan baku terkait via
        `MaterialStockService::applyMovement()` dan mencatat
        `ActivityLogger` di transaksi yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ordered, received, paid, cancelled] }
                cancel_reason: { type: string, nullable: true, maxLength: 255 }
      responses:
        '200':
          description: Status diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /purchase-orders/{id}/payments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Purchase Order]
      summary: Catat pembayaran ke vendor untuk purchase order ini
      description: Lewat PaymentRecorder yang sama dengan pembayaran order/preorder (parameter purchaseOrderId).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount]
              properties:
                method: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
                channel_id: { type: integer, nullable: true }
                amount: { type: string }
                proof_token: { type: string, format: uuid, nullable: true }
                notes: { type: string, nullable: true, maxLength: 1000 }
      responses:
        '201':
          description: Pembayaran dicatat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /purchase-orders/{id}/invoice:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Purchase Order]
      summary: Data faktur purchase order (dirender jadi PDF di klien)
      description: |
        Endpoint ini murni data — sama seperti struk penjualan, PDF-nya
        dirender di klien lewat html2canvas + jsPDF, bukan generator PDF
        di server.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------
  # PELANGGAN
  # ------------------------------------------------------------------
  /customers:
    get:
      tags: [Master Data]
      summary: Cari pelanggan
      parameters:
        - { name: search, in: query, description: "Nama, telepon, atau akun media sosial", schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Customer' }
    post:
      tags: [Master Data]
      summary: Buat pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

  /customers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Master Data]
      summary: Perbarui pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
    delete:
      tags: [Master Data]
      summary: Hapus pelanggan
      description: |
        009-ui-ux-refinements (US4). Soft delete, owner/admin saja. Ditolak
        (409) bila pelanggan masih memiliki order atau pre-order (status
        apa pun) yang mereferensikannya.
      responses:
        '204': { description: Berhasil }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/{id}/transactions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data]
      summary: Riwayat transaksi pelanggan
      description: |
        009-ui-ux-refinements (US5). Menggabungkan order dan pre-order milik
        pelanggan menjadi satu daftar ringkas, diurutkan berdasarkan tanggal
        terbaru. Tier otorisasi baca sama dengan GET /customers (tidak
        diperluas). `status` untuk order memakai kolom status miliknya
        sendiri (completed/voided); untuk pre-order memakai kolom status
        pre-order (ordered/dp_paid/arrived/settled/handed_over/cancelled).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [order, preorder] }
                        id: { type: integer }
                        number: { type: string }
                        status: { type: string }
                        total_amount: { type: string }
                        date: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customers/export:
    get:
      tags: [Master Data]
      summary: Ekspor daftar pelanggan ke .xlsx (020-customer-data-import-export, US1)
      description: |
        Digerbang canAccessAnyMenu(['artists','categories','products','stock',
        'vendors','materials','roles','users']) — tier owner/admin/inventory,
        sama seperti bulk master-data lain (GET /exports/{entity}), lebih
        ketat dari GET /customers yang terbuka untuk semua peran termasuk
        kasir. Berkas terpisah dari workbook master-data gabungan — lihat
        research.md Decision 1 di specs/020-customer-data-import-export/.
        Hanya mencakup pelanggan pada mode data (DEMO/LIVE) yang sedang aktif.
      responses:
        '200':
          description: "Berkas .xlsx (kolom: name, phone, address, email, social_handle, notes)"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /customers/import/template:
    get:
      tags: [Master Data]
      summary: Unduh template impor pelanggan (020-customer-data-import-export, US2)
      description: Kolom header sama persis dengan GET /customers/export, supaya berkas ekspor langsung valid diimpor ulang.
      responses:
        '200':
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /customers/import:
    post:
      tags: [Master Data]
      summary: Impor batch pelanggan dari .xlsx (020-customer-data-import-export, US2/US3)
      description: |
        Validasi PENUH dulu, baru diterapkan sekaligus dalam satu transaksi
        (all-or-nothing, meniru MasterDataImportService/PreorderImport).
        ATURAN BARU: baris dengan `email` yang cocok (case-insensitive,
        exact match, dalam mode data aktif) dengan pelanggan yang sudah ada
        meng-UPDATE pelanggan itu (sel kosong tidak mengosongkan nilai yang
        sudah ada), bukan membuat duplikat. Baris tanpa email SELALU
        membuat pelanggan baru. `dry_run=1` melewati jalur validasi yang
        identik untuk pratinjau (US3), tanpa menulis apa pun.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Berkas .xlsx, maks 10 MB. }
                dry_run: { type: string, enum: ['1'], description: Validasi tanpa menyimpan (pratinjau). }
      responses:
        '200':
          description: Pratinjau (dry_run=1) — tidak ada yang disimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerImportResult' }
        '201':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerImportResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Validasi gagal — tidak ada baris yang disimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  row_errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        errors: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------
  # PRE-ORDER
  # ------------------------------------------------------------------
  /preorders:
    get:
      tags: [Preorder]
      summary: Daftar pre-order
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ordered, dp_paid, arrived, settled, handed_over, cancelled] } }
        - { name: event_id, in: query, schema: { type: integer } }
        - { name: customer_id, in: query, schema: { type: integer } }
        - { name: fulfillment, in: query, schema: { type: string, enum: [pickup, courier] } }
        - { name: dispatch_status, in: query, description: "Penanda manual invoice-terkirim/pengiriman-berjalan. Boleh diulang (`dispatch_status[]=a&dispatch_status[]=b`); nilai berbeda di-OR-kan. Berlaku juga untuk `/preorders/summary` dan `/preorders/export`.", schema: { type: array, items: { type: string, enum: [pending, invoice_sent, shipping] } } }
        - { name: search, in: query, description: "007-preorder-import-export-notify (US1) — cocok parsial, tidak peka huruf besar/kecil, terhadap nama pelanggan.", schema: { type: string } }
        - { name: artist_id, in: query, description: "013-preorder-list-filters-receipt (US1) — hanya pre-order yang punya minimal satu item milik penjual ini (via `whereHas`, tidak menduplikasi baris pre-order yang punya beberapa item dari penjual yang sama).", schema: { type: integer } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PreorderSummary' }
    post:
      tags: [Preorder]
      summary: Buat pre-order
      description: |
        Pelanggan wajib diisi. Stok TIDAK berkurang pada tahap ini karena
        barang belum tersedia.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreorderInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /preorders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Preorder]
      summary: Detail pre-order
      description: |
        007-preorder-import-export-notify (US4) — respons kini menyertakan
        `latest_notification` (percobaan kirim email terakhir untuk
        pre-order ini, atau `null` bila belum pernah dicoba).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Preorder'
                  - type: object
                    properties:
                      latest_notification:
                        type: object
                        nullable: true
                        properties:
                          trigger: { type: string, enum: [status_change, manual_resend] }
                          status: { type: string, enum: [sent, skipped_no_email, skipped_not_configured, failed] }
                          error_message: { type: string, nullable: true }
                          sent_at: { type: string, format: date-time, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Preorder]
      summary: Ubah pre-order (022-preorder-invoice-crud-overhaul, US1, FR-001/FR-001a/FR-002)
      description: |
        Item boleh diubah (tambah/hapus/ubah qty) selama status BUKAN
        "handed_over"/"cancelled" (409 kalau ditolak). Kalau status sudah
        "arrived"/"settled" (stok sudah pernah ditambahkan saat transisi ke
        "arrived"), efek stok dikoreksi lewat DELTA per variant (qty baru
        dikurangi qty lama) — bukan membalik lalu menerapkan ulang seluruh
        item (research.md Decision 3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                customer_id: { type: integer }
                event_id: { type: integer, nullable: true }
                fulfillment: { type: string, enum: [pickup, courier] }
                shipping_cost: { $ref: '#/components/schemas/Money' }
                discount: { $ref: '#/components/schemas/Money' }
                pickup_day: { type: string, format: date, nullable: true }
                courier_name: { type: string, nullable: true }
                expected_date: { type: string, format: date, nullable: true }
                notes: { type: string, nullable: true }
                items:
                  type: array
                  items:
                    type: object
                    required: [variant_id, qty]
                    properties:
                      variant_id: { type: integer }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '409':
          description: Status "handed_over"/"cancelled" (edit ditolak), atau perubahan membuat total lebih kecil dari yang sudah dibayar.
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Preorder]
      summary: Hapus pre-order (022-preorder-invoice-crud-overhaul, US1, FR-003/FR-004)
      description: |
        Hanya boleh selagi status masih "ordered" DAN belum ada pembayaran
        tercatat. Status lain (termasuk "arrived") WAJIB memakai aksi
        "Cancel" (`PATCH /preorders/{id}/status`) — bukan endpoint ini.
      responses:
        '204': { description: Berhasil dihapus }
        '409': { description: 'Status bukan "ordered", atau sudah ada pembayaran tercatat — gunakan aksi Cancel.' }
        '404': { $ref: '#/components/responses/NotFound' }

  /preorders/{id}/invoice:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Preorder]
      summary: Data invoice sesuai status (007-preorder-import-export-notify US2; label "receipt" dihapus seluruhnya di 022-preorder-invoice-crud-overhaul US3)
      description: |
        022-preorder-invoice-crud-overhaul (US4, FR-012) — endpoint yang
        SAMA PERSIS ini juga menjadi sumber data "Payment invoice" (dahulu
        "Payment receipt") di frontend, karena `payments` sudah dimuat di
        sini; tidak ada endpoint kedua untuk dokumen tersebut.

        023-event-availability-invoice-redesign (US3, FR-009) — `shipping_cost`
        (sudah ada sejak `Preorder`/`present()`) kini benar-benar dirender di
        dokumen invoice (bukan hanya dikembalikan tanpa ditampilkan) — tidak
        ada perubahan skema, hanya perilaku frontend.

        Data mentah — PDF-nya dirender di klien (html2canvas + jsPDF), sama
        seperti struk penjualan dan invoice purchase order. `document_type`
        dihitung server dari status pre-order saat ini (`invoice` untuk
        `ordered`/`dp_paid`/`arrived`, `receipt` secara internal untuk
        `settled`/`handed_over`, `cancelled` untuk `cancelled`) — tapi label
        yang ditampilkan ke pengguna SELALU "Invoice" (FR-007), nilai
        `receipt` di sini hanya identifier internal, bukan lagi teks yang
        ditampilkan.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Preorder'
                  - type: object
                    properties:
                      document_type: { type: string, enum: [invoice, receipt, cancelled] }
                      event_name: { type: string, nullable: true, description: "014-sales-receipt-event-footer — null when the preorder has no event_id." }
                      event_location: { type: string, nullable: true }
                      event_start_date: { type: string, format: date, nullable: true }
                      event_end_date: { type: string, format: date, nullable: true }
                      event_available_on_date:
                        type: string
                        format: date
                        nullable: true
                        description: 023-event-availability-invoice-redesign (US2) — resolved via Event::availableOnDate(); null when the event has no available_on set, or no event is linked.
                      store_identity:
                        type: object
                        nullable: true
                        description: 022-preorder-invoice-crud-overhaul (US3, FR-008) — disalin dari assembly yang sama dengan GET /orders/{id}/receipt.
                        properties:
                          name: { type: string }
                          logo_url: { type: string, nullable: true }
                          contact_person: { type: string, nullable: true }
                          contact_phone: { type: string, nullable: true }
                          contact_email: { type: string, nullable: true }
                          address: { type: string, nullable: true }
                      payment_channels:
                        type: array
                        description: 022-preorder-invoice-crud-overhaul (US3, FR-009) — account_number TIDAK disamarkan di sini (beda dari GET /payment-channels untuk kasir non-privileged).
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            type: { type: string, enum: [bank_transfer, qr_ewallet] }
                            provider: { type: string }
                            account_name: { type: string, nullable: true }
                            account_number: { type: string, nullable: true }
                            qr_image_url: { type: string, nullable: true }
                      footer_text: { type: string, nullable: true, description: 022-preorder-invoice-crud-overhaul (US3, FR-010) — sama dengan receipt_footer_text yang sudah ada. }
                      app_name: { type: string, description: "Nama aplikasi untuk teks 'Powered by …' (default BoothPOS) — ikut payload supaya dokumen unduhan massal sama dengan yang di layar." }
        '404': { $ref: '#/components/responses/NotFound' }

  /preorders/bulk-invoices:
    post:
      tags: [Preorder]
      summary: Payload invoice untuk banyak pre-order sekaligus (022-preorder-invoice-crud-overhaul, US5, FR-013)
      description: |
        Mengembalikan array payload invoice LENGKAP (schema sama dengan
        `GET /preorders/{id}/invoice`) untuk setiap id yang diminta, dalam
        satu respons — PDF-nya tetap dirender di klien (tidak ada
        rendering PDF sisi server, research.md Decision 5). `document`
        `invoice` atau `payment_invoice`; untuk `payment_invoice`,
        frontend memilih pembayaran terakhir dari `payments` pada setiap
        payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preorder_ids, document]
              properties:
                preorder_ids: { type: array, items: { type: integer }, minItems: 1 }
                document: { type: string, enum: [invoice, payment_invoice] }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Preorder' } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /preorders/bulk-email:
    post:
      tags: [Preorder]
      summary: Kirim invoice/payment invoice ke banyak pre-order sekaligus (022-preorder-invoice-crud-overhaul, US5, FR-014/FR-015)
      description: |
        Satu email per pre-order terpilih (`PreorderInvoiceMail`, badan
        HTML tanpa lampiran PDF — research.md Decision 5), memakai jalur
        catat-setiap-percobaan yang sama dengan `PreorderNotifier`
        (trigger baru `bulk_invoice_email` di `preorder_notifications`).
        SELALU 200 dengan laporan per-baris — satu pelanggan tanpa email
        tidak menggagalkan batch (FR-015).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preorder_ids, document]
              properties:
                preorder_ids: { type: array, items: { type: integer }, minItems: 1 }
                document: { type: string, enum: [invoice, payment_invoice] }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        preorder_id: { type: integer }
                        status: { type: string, enum: [sent, skipped_no_email, skipped_not_configured, failed] }
        '422': { $ref: '#/components/responses/ValidationError' }

  /preorders/duplicate:
    post:
      tags: [Preorder]
      summary: Duplikat satu atau banyak pre-order (027-preorder-duplicate-split, US1/US2)
      description: |
        Membuat SATU salinan baru per id yang dikirim (tidak pernah digabung).
        Salinan dibangun lewat jalur `create()` yang sama dengan pre-order baru:
        harga tiap barang diambil dari harga varian SAAT INI (bukan harga yang
        tercatat di pesanan asal), status `ordered`, tanpa pembayaran, bukti
        bayar, atau pengiriman, `dispatch_status` `pending`, nomor baru. Yang
        disalin: pelanggan, event, fulfillment, hari jemput/kurir, expected_date,
        ongkir, diskon, catatan, dan barang+qty. Event yang sudah dihapus →
        salinan tanpa event (dan tanpa hari jemput); hari jemput di luar rentang
        event dibuang. Semua status sumber boleh diduplikasi. Sumber tidak
        berubah dan stok tidak disentuh. Tidak ada email yang dikirim; satu
        baris `activity_logs` (`duplicated`) ditulis per salinan.

        SELALU 200 dengan laporan per-pre-order (pola `/preorders/bulk-email`):
        tiap salinan memakai transaksinya sendiri, jadi satu yang gagal tidak
        menggagalkan yang lain. Penyebab gagal: barang/produk dihapus atau
        nonaktif, diskon melebihi total hasil harga baru, atau id bukan milik
        mode data (DEMO/LIVE) yang aktif ("tidak ditemukan").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preorder_ids]
              properties:
                preorder_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 100 }
      responses:
        '200':
          description: Laporan per-pre-order, urutan sama dengan permintaan (id ganda dibuang)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        source_id: { type: integer }
                        source_number: { type: string, nullable: true }
                        status: { type: string, enum: [created, failed] }
                        preorder: { $ref: '#/components/schemas/Preorder', description: "Hanya bila status = created" }
                        error: { type: string, description: "Hanya bila status = failed" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /preorders/summary:
    get:
      tags: [Preorder]
      summary: Statistik ringkas daftar pre-order (013-preorder-list-filters-receipt, US5)
      description: |
        Menghormati filter yang SAMA PERSIS dengan `GET /preorders`
        (`status`/`event_id`/`customer_id`/`fulfillment`/`search`/`artist_id`,
        via helper `applyFilters()` yang sama) sehingga statistik ini tidak
        pernah berbeda dari apa yang sedang ditampilkan di layar. `total_amount`/
        `paid_amount` diambil langsung dari kolom `Preorder` yang sudah
        otoritatif (bukan rekonsiliasi ulang dari `payments`) — lihat
        research.md R3 fitur ini untuk alasannya.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ordered, dp_paid, arrived, settled, handed_over, cancelled] } }
        - { name: event_id, in: query, schema: { type: integer } }
        - { name: customer_id, in: query, schema: { type: integer } }
        - { name: fulfillment, in: query, schema: { type: string, enum: [pickup, courier] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: artist_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_count: { type: integer }
                  by_status:
                    type: array
                    description: Selalu 6 entri (semua status), nol-diisi ("0.00") untuk status tanpa baris yang cocok.
                    items:
                      type: object
                      properties:
                        status: { type: string, enum: [ordered, dp_paid, arrived, settled, handed_over, cancelled] }
                        count: { type: integer, description: "Jumlah (qty) pre-order berstatus ini dalam himpunan terfilter." }
                        total_amount: { $ref: '#/components/schemas/Money' }
                  grand_total: { $ref: '#/components/schemas/Money', description: "BUG YANG DITEMUKAN & DIPERBAIKI — mengecualikan preorder berstatus 'cancelled' (sebelumnya ikut terjumlah). by_status['cancelled'] tetap menampilkan total uangnya sendiri secara terpisah." }
                  total_outstanding: { $ref: '#/components/schemas/Money', description: "Sama seperti grand_total — mengecualikan preorder 'cancelled'." }

  /preorders/export:
    get:
      tags: [Preorder]
      summary: Ekspor daftar pre-order ke .xlsx (007-preorder-import-export-notify, US3; layout diganti seluruhnya di 022-preorder-invoice-crud-overhaul US7)
      description: |
        Hanya owner/admin. Menghormati filter yang sama dengan `GET /preorders`
        (`status`/`event_id`/`customer_id`/`fulfillment`/`search`/`date_from`/`date_to`).

        022-preorder-invoice-crud-overhaul (US7, FR-017): layout MENGGANTIKAN
        SELURUHNYA format row-per-item feature 007/021 — sekarang SATU BARIS
        PER PESANAN dengan kolom `customer_name`, `event_name` (nama, bukan
        ID), `fulfillment` (`pickup`/`mail order`), `pickup_day` (teks
        "Day N"), `products`/`quantities`/`unit_prices` (comma-separated,
        dicocokkan lewat posisi), `shipping_cost`, `courier_name`,
        `expected_date`, `discount`, `notes`, `dispatch_status`,
        `invoice_sent_at`, `shipping_at`. File hasil ekspor ini bisa
        diimpor balik apa adanya (round-trip, SC-005).

        Penanda invoice-terkirim/pengiriman-berjalan: `dispatch_status` bernilai
        `pending`/`invoice_sent`/`shipping`; tanggalnya ISO 8601 dengan offset
        (mis. `2026-09-27T03:00:00+00:00`). Dua kolom tambahan **hanya-baca**,
        `created_at` dan `updated_at`, ikut diekspor SESUDAH kolom di atas —
        untuk dibaca; importer membiarkannya dan tidak pernah menulisnya.

        Filter `status`, `fulfillment`, dan `dispatch_status` boleh berupa nilai
        tunggal ATAU diulang sebagai array (`status[]=a&status[]=b`, di-OR-kan) —
        sama seperti `GET /preorders`, karena tombol Export meneruskan filter list.
      parameters:
        - { name: status, in: query, schema: { type: array, items: { type: string } } }
        - { name: event_id, in: query, schema: { type: integer } }
        - { name: customer_id, in: query, schema: { type: integer } }
        - { name: fulfillment, in: query, schema: { type: array, items: { type: string } } }
        - { name: dispatch_status, in: query, schema: { type: array, items: { type: string, enum: [pending, invoice_sent, shipping] } } }
        - { name: search, in: query, schema: { type: string } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /preorders/import/template:
    get:
      tags: [Preorder]
      summary: Unduh template impor pre-order (007-preorder-import-export-notify, US3)
      description: Hanya owner/admin. Kolom header sama persis dengan yang divalidasi `POST /preorders/import`.
      responses:
        '200':
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /preorders/import:
    post:
      tags: [Preorder]
      summary: Impor batch pre-order dari .xlsx (007-preorder-import-export-notify, US3)
      description: |
        Hanya owner/admin. Validasi PENUH dulu, baru diterapkan sekaligus
        dalam satu transaksi (all-or-nothing, meniru
        `MasterDataImportService` — research.md R3) — bila ada satu baris
        gagal, TIDAK ADA yang disimpan. Setiap pre-order yang diimpor
        SELALU dibuat berstatus `ordered` dengan `paid_amount = 0`, apa pun
        data di berkas (FR-010) — operator memajukan status/pembayarannya
        secara manual setelah impor lewat endpoint yang sudah ada.
        `customer_name` yang belum dikenal otomatis membuat `Customer`
        baru (FR-009). Harga/qty pada baris DIPAKAI APA ADANYA (bukan
        dihitung ulang dari master data saat ini) — pengecualian yang
        disengaja terhadap aturan "server selalu menghitung ulang", karena
        impor mencatat transaksi historis yang sudah terjadi di luar
        sistem (research.md R4).

        022-preorder-invoice-crud-overhaul (US7, FR-017/FR-018): layout
        SATU-BARIS-PER-PESANAN menggantikan seluruhnya format row-per-item
        lama. `event_name` dicocokkan lewat nama (bukan ID) — ambigu/tidak
        ditemukan adalah galat baris. `fulfillment` menerima kata
        "pickup"/"mail order". `pickup_day` ditulis "Day N" (diselesaikan
        ke tanggal asli lewat rentang tanggal event yang cocok, sama seperti
        `resolvePickupDayAndCourier()`). `products`/`quantities`/
        `unit_prices` adalah TIGA kolom comma-separated yang WAJIB sama
        panjang (jumlah berbeda = galat baris, FR-018) dan dicocokkan lewat
        posisi. Aturan cross-field pickup_day/courier_name vs fulfillment
        tetap sama persis dengan `POST /preorders`.

        **Kolom `dispatch_status` / `invoice_sent_at` / `shipping_at`** (opsional;
        kosong = `pending` tanpa tanggal). Aturannya sama dengan
        `PATCH /preorders/{id}/dispatch-status`: `shipping` hanya untuk
        `mail order`; `pending` tidak boleh bertanggal; `invoice_sent` tidak boleh
        punya `shipping_at`; tanggal kosong pada status aktif diisi waktu impor.
        Tanggal diterima sebagai teks ISO 8601 (offset dihormati) atau sel tanggal
        Excel. Baris yang melanggar dilaporkan sebagai galat baris (409), dan
        seluruh berkas ditolak (all-or-nothing). `created_at`/`updated_at` di
        berkas diabaikan — pesanan hasil impor tercatat dibuat saat impor.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Berkas .xlsx dengan tata kolom sama dengan template. }
                dry_run: { type: string, enum: ['1'], description: Validasi tanpa menyimpan (pratinjau). }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  created_count: { type: integer }
                  created_customer_count: { type: integer }
                  preorder_ids: { type: array, items: { type: integer } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Validasi gagal — tidak ada baris yang disimpan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  row_errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        errors: { type: array, items: { type: string } }

  /preorders/{id}/notifications/resend:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Preorder]
      summary: Kirim ulang notifikasi email pre-order (007-preorder-import-export-notify, US4)
      description: |
        Hanya owner/admin. Jalur yang sama persis dengan notifikasi
        otomatis saat status berubah (`PreorderNotifier`), dipicu manual,
        independen dari perubahan status apa pun. SELALU 200 dengan hasil
        percobaan, tidak pernah 500 karena kegagalan kirim (FR-012/FR-013)
        — kegagalan/dilewati adalah hasil yang sah, bukan galat request.
      responses:
        '200':
          description: Percobaan tercatat (berhasil atau tidak)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [sent, skipped_no_email, skipped_not_configured, failed] }
                  recipient_email: { type: string, nullable: true }
                  sent_at: { type: string, format: date-time, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }

  /preorders/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Preorder]
      summary: Ubah status pre-order
      description: |
        Perpindahan status mengikuti state machine pada dokumen UML.
        Lompatan status ditolak dengan 409.

        **Efek stok:**
        - `arrived` menulis `stock_movements` bertipe `purchase`
        - `handed_over` menulis `stock_movements` bertipe `preorder_handover`
        - `handed_over` hanya diizinkan bila `paid_amount` sudah menutup `total_amount`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [dp_paid, arrived, settled, handed_over, cancelled] }
                cancel_reason: { type: string, nullable: true }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '409':
          description: Perpindahan status tidak valid atau belum lunas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /preorders/{id}/dispatch-status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Preorder]
      summary: Ubah penanda invoice terkirim / pengiriman berjalan
      description: |
        Penanda manual, terpisah dari `status` utama — TIDAK menyentuh stok,
        pembayaran, maupun notifikasi email. Bisa maju dan mundur (koreksi salah
        klik). Nilai: `pending` (belum), `invoice_sent`, `shipping`.
        Pre-order berstatus `cancelled` ditolak dengan 409. Nilai `shipping`
        hanya berlaku untuk Mail Order (`fulfillment=courier`); untuk pickup
        ditolak dengan 409. Mengedit pre-order dari Mail Order ke pickup
        menurunkan `shipping` otomatis menjadi `invoice_sent`.

        **Tanggal (diisi server, tak bisa dikirim klien):** respons pre-order
        membawa `invoice_sent_at` dan `shipping_at` (ISO 8601, `null` bila tak
        aktif), selain `created_at`/`updated_at`. Menandai ulang nilai yang
        sudah aktif tidak menggeser tanggalnya; mundur dari `shipping` menghapus
        `shipping_at` tapi mempertahankan `invoice_sent_at`; kembali ke
        `pending` menghapus keduanya. `GET /preorders` juga bisa diurutkan
        dengan `sort_by=created_at|updated_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dispatch_status]
              properties:
                dispatch_status: { type: string, enum: [pending, invoice_sent, shipping] }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '409':
          description: Pre-order sudah dibatalkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Nilai tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /preorders/{id}/split:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Preorder]
      summary: Pisahkan sebagian unit pre-order ke pre-order baru (027-preorder-duplicate-split, US3/US4)
      description: |
        Dua mode. `items`: pengguna menyebut `item_id` + `qty` yang pindah ke SATU
        pre-order baru (baris yang sama boleh disebut dua kali — dijumlahkan dulu).
        `by_seller`: penjual dari baris dengan id terkecil tetap di pesanan asal,
        setiap penjual lain menjadi satu pre-order baru berisi baris utuhnya.

        Aturan (semua ditegakkan server di dalam satu transaksi dengan baris asal
        terkunci — gagal di mana pun berarti tidak ada yang berubah):
        - Ditolak `409` bila status `handed_over`/`cancelled`, bila pre-order
          punya pembayaran APA PUN (tidak ada pembagian pembayaran), atau bila
          diskon asal akan melebihi sisa subtotal + ongkir.
        - Ditolak `422` bila item bukan milik pre-order ini, qty melebihi baris,
          tidak ada unit yang pindah / tidak ada yang tersisa, atau `by_seller`
          pada pre-order dengan satu penjual.
        - Baris yang pindah seluruhnya memakai baris `preorder_items` yang SAMA
          (id tetap, supaya rujukan pergerakan stok tetap benar); baris yang pindah
          sebagian dikecilkan dan snapshot harga/modal/penjualnya disalin ke baris
          baru. Harga TIDAK dihitung ulang.
        - Pesanan baru: pelanggan/event/fulfillment/hari jemput/kurir/expected_date
          disalin, `status` mewarisi pesanan asal, `shipping_cost` 0, `discount` 0,
          tanpa catatan, `dispatch_status` `pending`, `user_id` = pengguna yang
          memisahkan, `source.type` = `split`. Ongkir, diskon, catatan, data
          pengiriman, dan penanda invoice tetap di pesanan asal.
        - Stok TIDAK disentuh dan tidak ada pergerakan stok ditulis; tidak ada
          email; satu baris `activity_logs` (`split`) ditulis pada pesanan asal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [items, by_seller] }
                items:
                  type: array
                  description: Wajib bila `mode` = `items`
                  minItems: 1
                  items:
                    type: object
                    required: [item_id, qty]
                    properties:
                      item_id: { type: integer }
                      qty: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Berhasil dipisah
          content:
            application/json:
              schema:
                type: object
                properties:
                  original: { $ref: '#/components/schemas/Preorder', description: "Termasuk split_children" }
                  created:
                    type: array
                    items: { $ref: '#/components/schemas/Preorder' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Status tertutup, sudah ada pembayaran, atau diskon melebihi sisa tagihan" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /preorders/{id}/payments/{payment_id}:
    delete:
      tags: [Preorder]
      summary: Hapus satu pembayaran pre-order beserta bukti bayarnya
      description: |
        Hanya owner/admin (403 untuk peran lain). Menghapus baris pembayaran dan
        bukti bayarnya (baris `payment_proofs` + file di disk privat, file dihapus
        setelah commit), lalu menghitung ULANG `paid_amount` dari pembayaran yang
        tersisa dan memundurkan status sejauh yang ditimbulkan pembayaran itu:
        `settled` yang tak lagi lunas → `arrived`; `dp_paid` tanpa sisa pembayaran
        → `ordered`; `arrived` tidak pernah mundur (stok sudah masuk). Ditolak
        `409` untuk pre-order `handed_over`/`cancelled`; `404` bila pembayaran
        bukan milik pre-order ini. Satu baris `activity_logs` (`payment_deleted`,
        berisi status dan jumlah lama/baru) ditulis di transaksi yang sama.
        Respons memuat `payment_summary` yang sudah dihitung ulang (028-partial-split-payment).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: payment_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pre-order sesudah dihitung ulang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Pre-order sudah diserahkan atau dibatalkan" }

  /preorders/{id}/payments/{payment_id}/verify:
    post:
      tags: [Preorder]
      summary: Tandai satu pembayaran non-tunai pre-order terverifikasi (032-mark-payment-verified)
      description: |
        032-mark-payment-verified — menandai SATU pembayaran non-tunai yang masih `pending` sebagai
        `verified` (sudah dicocokkan dengan mutasi bank/e-wallet). Tanpa body. **Satu arah dan FINAL:**
        tidak ada route untuk membatalkan verifikasi (keputusan produk); jejaknya ada di activity log.

        **Otorisasi:** owner/admin, atau pengguna mana pun KECUALI pencatat pembayaran itu
        (`payments.recorded_by`) — pencatat → 403. Pembayaran lama tanpa pencatat boleh diverifikasi siapa pun.

        **Aturan** (setelah baris transaksi dikunci, jadi dua klik serentak berlaku berurutan): pembayaran
        milik transaksi ini (404 bila bukan); pre-order `cancelled` → 409 (pre-order `handed_over` tetap boleh: tak ada uang yang bergerak); tunai → 422 (`errors.method`; tunai sudah
        terverifikasi sejak dicatat); sudah `verified` → 409; `rejected` → 409.

        Menulis `verified_by`/`verified_at` dan baris `activity_logs` `payment_verified` (nilai lama/baru) di
        transaksi yang sama. Tidak mengubah jumlah, metode, kanal, status, total, kas yang diharapkan, atau
        laporan; pembayaran itu kini muncul di rincian per-metode `GET /sessions/{id}/summary` (rincian itu
        sejak awal hanya menghitung pembayaran terverifikasi).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: payment_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pre-order sesudah diverifikasi (payments[] memuat verification, verified_by_name, verified_at, can_verify)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Pre-order batal, atau pembayaran sudah terverifikasi / ditolak" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /preorders/{id}/payments/{payment_id}/confirmation:
    patch:
      tags: [Preorder]
      summary: Tambah / ubah / ganti konfirmasi pembayaran pre-order (031-optional-payment-proof)
      description: |
        031-optional-payment-proof — menambah, mengubah, atau mengganti KONFIRMASI sebuah pembayaran
        non-tunai yang sudah tercatat: bukti (`proof_token` dari `POST /payment-proofs`), `reference`,
        dan `notes`. Semua kunci opsional; minimal satu harus dikirim (422 `errors.confirmation`).
        Mengirim `null` mengosongkan referensi/catatan, tetapi hasil akhirnya tidak boleh kosong
        sama sekali (bukti, referensi, dan catatan semuanya tak ada → 422). Bukti tidak bisa
        dihapus mentah, hanya diganti: bukti lama ditandai `superseded_at`, file dan barisnya
        DIPERTAHANKAN untuk audit.

        **Otorisasi:** owner/admin, atau pengguna yang mencatat pembayaran itu (`payments.recorded_by`);
        pengguna lain → 403. Pembayaran lama tanpa pencatat → hanya owner/admin.

        **Aturan** (setelah baris transaksi dikunci): pembayaran milik transaksi ini (404 bila bukan);
        pre-order `cancelled` → 409 (pre-order `handed_over` tetap boleh: konfirmasi tak menggerakkan uang); pembayaran tunai → 422 (`errors.method`); token bukti tak dikenal/sudah terpakai → 422.

        Tidak pernah mengubah jumlah, metode, kanal, waktu, status, total, atau kas shift. Menulis
        `activity_logs` `payment_confirmation_updated` (nilai lama dan baru) di transaksi yang sama.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: payment_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentConfirmationInput' }
      responses:
        '200':
          description: Pre-order sesudah diubah (payments[] memuat notes, proof_id, has_proof, can_view_proof, can_edit_confirmation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Pre-order sudah dibatalkan" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /preorders/{id}/payments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Preorder]
      summary: Catat pembayaran pre-order
      description: |
        Dipakai untuk DP maupun pelunasan. Setiap pembayaran tersimpan SENDIRI
        dan LANGSUNG, berapa pun jumlahnya (028-partial-split-payment): tidak ada
        lagi penahanan entri di klien sampai tagihan tertutup. Pembayaran
        non-tunai wajib menyertakan kanal; `proof_token` opsional sejak
        031-optional-payment-proof (bukti bisa ditambahkan belakangan lewat
        `PATCH /preorders/{id}/payments/{payment_id}/confirmation`). Server menghitung
        ulang `paid_amount` dari entri, memindahkan status (pembayaran pertama →
        `dp_paid`; melunasi pre-order `arrived` → `settled`), menulis baris
        `activity_logs` `payment_recorded`, dan mengembalikan pre-order lengkap
        dengan `payment_summary` serta `payments[]` (referensi, pencatat, status).
        Pre-order `handed_over`/`cancelled` → 409.

        Pengaman (028): jumlah harus > 0 dan ≤ sisa tagihan (dinilai ulang setelah
        baris pre-order dikunci, jadi dua staf yang membayar bersamaan tak bisa
        melebihi tagihan); `client_ref` (UUID, opsional di server, selalu dikirim
        SPA) membuat klik ganda / coba-ulang aman — kunci yang sama pada
        pre-order yang sama menjawab 200 tanpa menambah pembayaran.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Tersimpan — pre-order terbaru dengan `payment_summary`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '200':
          description: Replay idempotensi — `client_ref` yang sama sudah tercatat pada pre-order ini; tidak ada pembayaran baru, isinya keadaan terkini (sama seperti 201).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preorder' }
        '409': { description: "Pre-order sudah diserahkan/dibatalkan, atau sudah lunas (tidak ada sisa tagihan)" }
        '422': { description: "Bentuk salah, `amount` melebihi sisa tagihan (`errors.amount` menyebut maksimum yang bisa dibayar; PERUBAHAN 028 — dulu kelebihan bayar diterima), atau `client_ref` sudah dipakai transaksi lain" }

  /preorders/{id}/shipment:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Preorder]
      summary: Buat data pengiriman
      description: Hanya untuk pre-order dengan `fulfillment = courier`. Satu pre-order satu pengiriman.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '409': { $ref: '#/components/responses/Conflict' }

  /shipments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Preorder]
      summary: Perbarui pengiriman
      description: Dipakai untuk mengisi nomor resi dan memindahkan status pengiriman.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking_number: { type: string, nullable: true }
                status: { type: string, enum: [pending, packed, shipped, delivered] }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }

  # ------------------------------------------------------------------
  # LAPORAN
  # ------------------------------------------------------------------
  /reports/sales:
    get:
      tags: [Report]
      summary: Laporan penjualan
      description: |
        010-split-payment-preorder-reports (US5) — totals dan setiap baris
        `rows[]` sejak fitur ini kini juga memuat pendapatan yang DIAKUI
        dari Pre-order, digabung ke angka penjualan Order biasa. "Diakui"
        berarti dibatasi pada uang yang benar-benar terkumpul di
        `payments` (bukan nilai penuh pre-order), diproporsikan ke tiap
        item sesuai porsi `line_total`-nya terhadap subtotal pre-order;
        pre-order berstatus `cancelled` selalu menyumbang nol. Bentuk
        respons tidak berubah, hanya nilainya lebih lengkap.
      parameters:
        - { name: event_id, in: query, schema: { type: integer } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { type: string, enum: [product, category, artist, day, event, customer], default: product } }
        - { name: include_voided, in: query, description: "1 = sertakan order berstatus `voided` di `transactions[]` (untuk audit). Transaksi batal TIDAK PERNAH ikut `totals`/`rows`.", schema: { type: integer, enum: [0, 1] } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }

  /reports/sales/transactions/export:
    post:
      tags: [Report]
      summary: Ekspor daftar transaksi Sales (.xlsx)
      description: |
        Berkas berisi PERSIS baris yang tampil di halaman Sales (hanya transaksi dari POS; pre-order
        tidak ada di halaman itu, jadi kunci `preorder:*` ditolak 422). Klien hanya mengirim KUNCI baris
        (`keys`: "order:12"); seluruh isi dibangun ulang di server lewat service yang sama
        dengan `GET /reports/sales`, jadi nominal tak bisa dipalsukan dan berkas tak pernah berbeda
        dari layar. Kunci yang tak ada atau di luar filter `event_id`/tanggal DIABAIKAN. Tanpa `keys`
        = seluruh transaksi sesuai filter. Maks. 5000 kunci.

        Kolom: `transaction_no, status, time, customer, sellers, cashier, items` (SEMUA baris
        item, "Nama ×qty; …"), `units, discount, payment_methods, payment_status, cash, non_cash, total`;
        pengguna yang boleh melihat laporan juga mendapat `cost, margin`. Kontak pelanggan
        (telepon/email) SENGAJA tidak ikut. Nominal berupa angka agar bisa dijumlah di Excel.

        028-partial-split-payment: kolom `payment_status` kini berisi `unpaid|partially_paid|fully_paid`
        (dulu status verifikasi mentah) dan ditambah `paid`, `balance` (setelah `total`, sebelum `cost, margin`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id: { type: integer, nullable: true }
                date_from: { type: string, format: date, nullable: true }
                date_to: { type: string, format: date, nullable: true }
                include_voided: { type: boolean, nullable: true }
                keys:
                  type: array
                  maxItems: 5000
                  items: { type: string, pattern: '^order:\d+$' }
      responses:
        '200':
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Kunci tidak valid / lebih dari 5000
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/profit:
    get:
      tags: [Report]
      summary: Laporan modal dan keuntungan
      description: |
        Laba kotor dihitung dari nilai snapshot pada `order_items`, bukan
        harga master saat laporan dibuka. Laba bersih mengurangkan
        `event_cost`. Hanya peran owner dan admin.

        010-split-payment-preorder-reports (US5) — `revenue` dan
        `cost_of_goods` sejak fitur ini juga memuat kontribusi Pre-order:
        pendapatan yang benar-benar terkumpul (bukan nilai penuh
        pre-order) beserta `cost_price` yang diproporsikan dengan rasio
        yang sama, memakai aturan diakui/proporsi yang sama seperti
        `GET /reports/sales` di atas.

        033-seller-recap-pos-preorder-split — `revenue`, `cost_of_goods`
        dan `gross_profit` juga dipisah menurut jenisnya lewat field
        `*_pos` (penjualan POS) dan `*_preorder` (porsi pre-order yang
        terbayar). Bagian pre-order adalah SISA dari total yang tampil
        (dalam sen), jadi POS + pre-order persis sama dengan totalnya.
        `event_cost` dan `net_profit` milik seluruh event dan tidak dipisah.
      parameters:
        - { name: event_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfitReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/artist-profit:
    get:
      tags: [Report]
      summary: Laporan modal dan laba kotor per artist (F9.5)
      description: |
        Untuk setiap artist dengan minimal satu `order_items` 'completed'
        ATAU pre-order non-`cancelled` yang sudah terbayar pada event ini:
        `total_sales` (SUM `line_total`), `modal` (SUM `cost_price * qty`,
        snapshot yang sama dipakai `GET /reports/profit` — bukan modal BOM
        hidup, lihat docblock `ReportController::artistProfit()`), dan
        `gross_profit = total_sales - modal`.

        033-seller-recap-pos-preorder-split — **PERUBAHAN PERILAKU**: laporan
        ini dulu HANYA membaca `order_items` (POS). Kini `total_sales`,
        `modal` dan `gross_profit` adalah POS + porsi pre-order yang sudah
        terbayar (aturan diakui/proporsi sama seperti Rekap Seller dan
        `GET /reports/profit`), sehingga `total_sales` seorang seller sama
        dengan `total_sales`-nya di `GET /reports/artist-settlements`.
        Rinciannya ada di `*_pos` (sama dengan angka lama) dan `*_preorder`
        (sisa dari total, tepat sampai sen). Seller yang hanya punya
        pre-order kini ikut tampil. Urut nama.

        `event_cost` TIDAK dikurangkan di laporan ini sama sekali (sudah
        diperhitungkan terpisah pada `GET /reports/profit`, F9.3) — sengaja
        tidak ada field itu pada respons ini. Hanya peran owner dan admin.
      parameters:
        - { name: event_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        artist_id: { type: integer }
                        artist_name: { type: string }
                        total_sales: { $ref: '#/components/schemas/Money' }
                        modal: { $ref: '#/components/schemas/Money' }
                        gross_profit: { $ref: '#/components/schemas/Money' }
                        sales_pos: { $ref: '#/components/schemas/Money' }
                        sales_preorder: { $ref: '#/components/schemas/Money' }
                        modal_pos: { $ref: '#/components/schemas/Money' }
                        modal_preorder: { $ref: '#/components/schemas/Money' }
                        gross_profit_pos: { $ref: '#/components/schemas/Money' }
                        gross_profit_preorder: { $ref: '#/components/schemas/Money' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/purchases:
    get:
      tags: [Report]
      summary: Laporan pembelian (006-purchase-order-and-ops, US9)
      description: |
        Sumbernya `purchase_orders` (Eloquent, sudah HasDataMode — bukan
        `DB::table()` mentah seperti /reports/sales), bukan `order_items`.
        Tidak diskop event. Hanya peran owner dan admin.
      parameters:
        - { name: vendor_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [draft, ordered, received, paid, cancelled] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        po_number: { type: string }
                        vendor_name: { type: string }
                        status: { type: string }
                        created_at: { type: string, format: date-time }
                        total_amount: { $ref: '#/components/schemas/Money' }
                  totals:
                    type: object
                    properties:
                      po_count: { type: integer }
                      total_amount: { $ref: '#/components/schemas/Money' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/stock-by-artist:
    get:
      tags: [Report]
      summary: Laporan stok per artist (006-purchase-order-and-ops, US10; drilldown 009-ui-ux-refinements, US7)
      description: |
        Sumbernya `product_variants` (sudah HasDataMode via join produk),
        dijumlahkan `current_stock` per artist. Tidak diskop event. Hanya
        peran owner dan admin.

        Tanpa `artist_id`: mengembalikan array ringkasan per artist (bentuk
        lama, tidak berubah). Dengan `artist_id`: mengembalikan detail
        tingkat variant untuk SATU artist tersebut, dengan join
        artist→products→variants yang sama satu level lebih dalam
        (bukan endpoint/query terpisah).
      parameters:
        - name: artist_id
          in: query
          description: |
            Opsional. Bila diisi, respons berganti bentuk menjadi detail
            satu artist (lihat StockByArtistDetail). 404 bila artist_id
            tidak ditemukan atau berada di mode DEMO/LIVE yang sedang
            tidak aktif.
          schema: { type: integer }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Ringkasan seluruh artist (artist_id tidak diisi)
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            artist_id: { type: integer }
                            artist_name: { type: string }
                            variant_count: { type: integer }
                            total_stock: { type: integer }
                  - $ref: '#/components/schemas/StockByArtistDetail'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: artist_id tidak ditemukan pada mode DEMO/LIVE yang aktif

  /reports/preorders:
    get:
      tags: [Report]
      summary: Laporan khusus pre-order (010-split-payment-preorder-reports, US6)
      description: |
        Laporan baru, terpisah dari `GET /reports/sales`/`profit` — fokus
        pada STATE pre-order (status × kelengkapan pembayaran), bukan hanya
        pendapatan yang sudah diakui. Satu baris per kombinasi
        `status` (`ordered`/`dp_paid`/`arrived`/`settled`/`handed_over`/
        `cancelled`) × `payment_completeness` (`unpaid`/`partial`/`paid`).

        `total_collected` dihitung live dari `SUM(payments.amount)`
        (verifikasi bukan `rejected`), bukan cache `preorders.paid_amount`
        (research.md R1/R6) — sama seperti aturan pengakuan pendapatan yang
        dipakai `GET /reports/sales`/`profit` untuk pre-order. Pre-order
        `cancelled` tetap tampil di breakdown status (berbeda dari
        `sales()`/`profit()` yang menganggapnya menyumbang nol pendapatan).

        Hanya peran owner/admin (`canAccessMenu('reports')`, sama seperti
        laporan lain di file ini).

        012-seller-preorder-report-detail-export — tiga mode tambahan lewat
        endpoint yang SAMA (bukan route baru, research.md R3/R4):
        1. `?breakdown=artist` — baris ringkasan di atas dipecah per
           `artist_id`/`artist_name` (join `preorder_items`), dengan
           proporsi yang SAMA seperti diakui-dari-`payments` di atas.
           Cancelled tidak muncul sebagai bucket tersendiri di mode ini
           (beda dari mode default), konsekuensi dari memakai ulang helper
           `preorderRecognizedRevenueBase()` yang sudah memfilter
           `status != 'cancelled'` — didokumentasikan di kode, bukan bug.
        2. `?status=&payment_completeness=` (opsional `artist_id`) —
           drill-down: daftar preorder INDIVIDUAL yang menyusun satu baris
           ringkasan/breakdown, bukan agregat.
      parameters:
        - { name: event_id, in: query, schema: { type: integer }, description: 'Filter ke satu event (FR-014).' }
        - { name: breakdown, in: query, schema: { type: string, enum: [artist] }, description: '012 US2 — pecah baris ringkasan per seller.' }
        - { name: status, in: query, schema: { type: string, enum: [ordered, dp_paid, arrived, settled, handed_over, cancelled] }, description: '012 US3 — hadir bersama payment_completeness memicu mode drill-down.' }
        - { name: payment_completeness, in: query, schema: { type: string, enum: [unpaid, partial, paid] }, description: '012 US3 — dipakai bersama status untuk drill-down.' }
        - { name: artist_id, in: query, schema: { type: integer }, description: '012 US3 — opsional, mempersempit drill-down ke satu seller.' }
      responses:
        '200':
          description: Berhasil — bentuk respons tergantung parameter (lihat description)
      parameters:
        - { name: event_id, in: query, schema: { type: integer }, description: 'Filter ke satu event (FR-014).' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    description: |
                      Tanpa parameter tambahan: baris ringkasan status ×
                      payment_completeness. Dengan `breakdown=artist`: baris
                      per seller (menambah `artist_id`/`artist_name`).
                      Dengan `status`+`payment_completeness`: daftar
                      preorder individual (bentuk berbeda, lihat di bawah).
                    items:
                      oneOf:
                        - type: object
                          properties:
                            status: { type: string, enum: [ordered, dp_paid, arrived, settled, handed_over, cancelled] }
                            payment_completeness: { type: string, enum: [unpaid, partial, paid] }
                            artist_id: { type: integer, description: 'Hanya ada saat breakdown=artist.' }
                            artist_name: { type: string, description: 'Hanya ada saat breakdown=artist.' }
                            preorder_count: { type: integer }
                            total_order_value: { type: string, example: '1500000.00' }
                            total_collected: { type: string, example: '500000.00' }
                            total_outstanding: { type: string, example: '1000000.00' }
                        - type: object
                          description: Baris drill-down (saat status+payment_completeness diberikan)
                          properties:
                            preorder_id: { type: integer }
                            preorder_number: { type: string }
                            customer_name: { type: string, nullable: true }
                            order_value: { type: string, example: '75000.00' }
                            collected: { type: string, example: '75000.00' }
                            outstanding: { type: string, example: '0.00' }
                    items:
                      type: object
                      properties:
                        status: { type: string, enum: [ordered, dp_paid, arrived, settled, handed_over, cancelled] }
                        payment_completeness: { type: string, enum: [unpaid, partial, paid] }
                        preorder_count: { type: integer }
                        total_order_value: { type: string, example: '1500000.00' }
                        total_collected: { type: string, example: '500000.00' }
                        total_outstanding: { type: string, example: '1000000.00' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/artist-settlements:
    get:
      tags: [Report]
      summary: Rekap hasil per artist
      description: |
        Angka dihitung ulang dari `order_items` setiap kali dibaca, tanpa
        potongan komisi.

        Daftar memuat **seluruh artist aktif**, termasuk yang belum punya
        penjualan sama sekali di event ini (seluruh nilai uang `"0.00"`,
        `total_units` 0, `status` `unpaid`, `id` `null`). Artist nonaktif
        hanya ikut bila punya baris settlement di event ini.

        010-split-payment-preorder-reports (US5) — `total_sales`/
        `total_units` sejak fitur ini juga memuat kontribusi Pre-order,
        dihitung ulang dari `preorder_items`/`payments` dengan aturan
        diakui/proporsi yang sama seperti `GET /reports/sales`
        (pre-order `cancelled` menyumbang nol).

        033-seller-recap-pos-preorder-split — tiap baris juga memuat
        pemisahan `pos_units`/`preorder_units` dan `pos_sales`/
        `preorder_sales`. Bagian POS apa adanya; bagian pre-order adalah
        SISA dari total yang tampil (unit integer, uang dalam sen), jadi
        POS + pre-order selalu persis sama dengan `total_units`/
        `total_sales` pada baris yang sama. Field yang sudah ada tidak
        berubah.
      parameters:
        - { name: event_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ArtistSettlement' }

  /reports/artist-settlements/{artist}/transactions:
    parameters:
      - name: artist
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Report]
      summary: Drill-down transaksi yang menyusun rekap satu artist (F11.6)
      description: |
        Daftar order 'completed' pada event ini yang memuat minimal satu
        item milik artist ini, dikelompokkan per order. Karena satu order
        booth ini bisa berisi item dari BEBERAPA artist sekaligus, `items[]`
        pada setiap baris HANYA memuat item milik artist yang diminta —
        bukan seluruh isi order tersebut. Hanya peran owner dan admin.

        012-seller-preorder-report-detail-export (US1) — `transactions[]`
        sekarang juga menyertakan entri bersumber Pre-order (bukan hanya
        Order), dibedakan lewat `source`. Field pengidentifikasi berganti
        nama dari `order_id`/`order_total_for_artist` menjadi `key`/
        `amount_for_artist` karena entri pre-order tidak punya `order_id`.
        Nilai `amount_for_artist` untuk entri pre-order adalah porsi yang
        SUDAH TERKUMPUL (diproporsikan, research.md R1 di 010 & 012),
        bukan nilai penuh preorder — konsisten dengan `total_sales` di
        `GET /reports/artist-settlements`. Preorder berstatus `cancelled`
        tidak pernah muncul di sini. Perbaikan sekaligus: query ini
        sebelumnya tidak memfilter `data_mode` sama sekali (celah lama,
        ditutup di fitur ini).
      parameters:
        - { name: event_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
                  artist:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: 'order-42', description: '"order-<id>" atau "preorder-<id>".' }
                        number: { type: string, description: 'order_number atau preorder_number.' }
                        source: { type: string, enum: [order, preorder] }
                        created_at: { type: string, format: date-time, nullable: true }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              sku: { type: string }
                              name: { type: string }
                              qty: { type: integer }
                              line_total: { $ref: '#/components/schemas/Money' }
                        amount_for_artist:
                          $ref: '#/components/schemas/Money'
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/artist-settlements/{id}/payment:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Report]
      summary: Catat pembayaran ke artist
      description: Menandai berapa yang sudah diserahkan ke artist. Tidak mengubah `total_sales`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: string, example: "1250000.00" }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistSettlement' }

  /reports/{report}/export:
    parameters:
      - name: report
        in: path
        required: true
        schema: { type: string, enum: [sales, profit, artist-settlements, artist-profit, purchases, stock-by-artist, preorder] }
    get:
      tags: [Report]
      summary: Ekspor laporan ke Excel
      description: |
        Parameter filter sama dengan endpoint laporan terkait. Ekspor tidak
        menyertakan kolom kontak pelanggan.

        `report=artist-settlements` (F11.6) sengaja berbeda dari tiga
        laporan lain: berkasnya berisi DUA sheet, "Rekap" (bentuk lama,
        tidak berubah) dan "Detail Transaksi" (baru — satu baris flat per
        item per order, lintas semua artist di event ini: artist_name,
        order_number, date, item_name, qty, line_total).

        033 — sheet "Rekap" mendapat empat kolom di UJUNG (`pos_units`,
        `preorder_units`, `pos_sales`, `preorder_sales`, nama sama dengan
        field API); kolom lama tetap di tempatnya. Sheet "Detail Transaksi"
        tetap hanya memuat item POS (tidak diubah). Ekspor `profit` dan
        `artist-profit` otomatis membawa field `*_pos`/`*_preorder` baru
        sebagai kolom tambahan setelah kolom lama.

        012-seller-preorder-report-detail-export (US4) — tiga tipe laporan
        yang sebelumnya sama sekali tidak bisa diekspor:
        - `report=purchases` — satu sheet, baris sama seperti
          `GET /reports/purchases`.
        - `report=stock-by-artist` — satu sheet, SELALU bentuk ringkasan
          (per-seller), bahkan bila request punya `artist_id` — ekspor ini
          tidak pernah memakai bentuk detail per-varian.
        - `report=preorder` — DUA sheet seperti `artist-settlements`:
          "Ringkasan" (bentuk `GET /reports/preorders` default) dan
          "Per Seller" (bentuk `?breakdown=artist`).
      parameters:
        - { name: event_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Berkas xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  # ------------------------------------------------------------------
  # VENDOR, BAHAN BAKU, DAN BOM (ditambahkan pasca-MVP, 2026-09-01)
