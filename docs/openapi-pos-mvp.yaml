    delete:
      tags: [Vendor & Bahan Baku]
      summary: Hapus bahan baku
      description: |
        Soft delete. Ditolak (409) bila bahan masih punya harga vendor
        terdaftar ATAU masih dipakai baris BOM varian mana pun.
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /materials/{material}/adjustments:
    parameters:
      - { name: material, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Koreksi stok bahan di satu outlet (045 Stage 5)
      description: >
        Selisih (+/−), bukan jumlah akhir. `outlet_id` wajib bila pengguna melihat beberapa outlet (422); di luar yang boleh
        dilihat → 403; saldo outlet tidak boleh negatif (422). Lewat MaterialStockService; audit `material_stock_adjusted`.
        `GET /materials` membawa `outlet_stock[{outlet_id,outlet_code,outlet_name,on_hand}]` (outlet yang berlaku).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty_change, reason]
              properties:
                outlet_id: { type: integer }
                qty_change: { type: number }
                reason: { type: string, maxLength: 255 }
      responses:
        '201': { description: "{material_id,outlet_id,stock_before,stock_after}" }
        '403': { description: Outlet di luar jangkauan }
        '422': { description: Validasi / saldo negatif / outlet wajib }

  /materials/{material}/vendor-prices:
    parameters:
      - { name: material, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Tambah harga vendor untuk satu bahan
      description: |
        Satu bahan boleh punya harga dari banyak vendor (unique pada
        pasangan vendor+bahan). Mengirim `is_preferred: true` melepas
        tanda preferred dari harga lain milik bahan yang sama — hanya
        satu vendor preferred per bahan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorMaterialPriceInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorMaterialPrice' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendor-prices/{vendorPrice}:
    parameters:
      - { name: vendorPrice, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Vendor & Bahan Baku]
      summary: Perbarui harga vendor untuk suatu bahan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorMaterialPriceInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorMaterialPrice' }
    delete:
      tags: [Vendor & Bahan Baku]
      summary: Hapus (detach) harga vendor untuk suatu bahan
      responses:
        '204': { description: Berhasil }

  # ------------------------------------------------------------------
  # 034-seller-po-bom — BOM bersumber BARIS PURCHASE ORDER.
  #
  # Baris BOM menunjuk satu baris PO milik SELLER varian itu (PO berstatus
  # ordered/received/paid) dan menyimpan SNAPSHOT item/tipe/nomor PO/vendor/
  # biaya satuan. Biaya tidak pernah mengikuti PO yang berubah; hanya
  # replace-source (eksplisit) yang mengubahnya. Baris tanpa baris PO adalah
  # baris LEGACY (is_legacy: true). Membaca BOM butuh menu `products`;
  # SEMUA aksi lain butuh menu `products` DAN `purchase_orders` (403 bila
  # tidak). Respons baca/mutasi berbentuk VariantBom { data, summary }.
  # ------------------------------------------------------------------

  /variants/{variant}/outlet-prices:
    parameters: [{ name: variant, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Produk]
      summary: Harga dasar dan harga per outlet sebuah varian (045 Stage 3)
      description: >
        Hanya outlet yang boleh dilihat pengguna yang tampil. `price: null` / `follows_base: true` = outlet itu
        mengikuti harga dasar. Perlu izin mengubah produk.
      responses:
        '200': { description: Berhasil }
        '403': { $ref: '#/components/responses/Forbidden' }

  /variants/{variant}/outlet-prices/{outlet}:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
      - { name: outlet, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Produk]
      summary: Menetapkan atau menghapus harga khusus satu outlet (045 Stage 3)
      description: >
        Lewat PriceService (satu-satunya penulis harga): satu baris price_history ber-`outlet_id` dan audit
        `outlet_price_changed` di transaksi yang sama. `price: null` menghapus harga khusus. Outlet di luar yang
        boleh dilihat → 403 `outlet_forbidden`; harga negatif → 422. Selama rilis menu AKTIF perubahan menjadi
        `menu_change` (payload membawa `outlet_id`/`outlet_code`) yang menunggu rilis, dan selisih di atas ambang
        menunggu persetujuan — jalur yang sama dengan harga dasar; respons membawa `pending`, `requires_approval`,
        `change_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: string, nullable: true, example: "25000.00" }
                note: { type: string, nullable: true }
      responses:
        '200': { description: "Berhasil (changed, pending, requires_approval, change_id, price, effective_price)" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /variants/{variant}/bom:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vendor & Bahan Baku]
      summary: BOM suatu varian (baris + ringkasan biaya)
      description: |
        `summary` memisahkan biaya bahan dan jasa. Baris LEGACY dihitung
        dengan harga acuan vendor hidup (perilaku lama); baris bersumber PO
        memakai snapshot `unit_cost`. `newer_price` dan `source_cancelled`
        adalah ISYARAT yang dihitung saat dibaca (tidak mengubah baris).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Vendor & Bahan Baku]
      summary: Simpan jumlah per unit beberapa baris BOM sekaligus (tombol Simpan)
      description: |
        036-bom-variant-stock-ux. Semua-atau-tidak-sama-sekali dalam SATU
        transaksi: varian dikunci sekali; setiap `id` dibuktikan milik varian ini
        SEBELUM ada yang ditulis; nilai yang tidak berubah dilewati (tanpa jejak
        audit); tiap baris yang berubah dicatat `bom_qty_changed`; bila BOM sudah
        SELESAI, harga modal disinkronkan SEKALI di akhir (`cost_price_synced`).
        Hanya `qty_needed` yang berubah; biaya/vendor/sumber tidak tersentuh.
        Penyimpan terakhir menang (tanpa versi optimistis). Perlu menu `products`
        DAN `purchase_orders`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [id, qty_needed]
                    properties:
                      id: { type: integer, description: id baris BOM; harus unik dalam permintaan. }
                      qty_needed: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Disimpan; BOM yang dimuat ulang.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Salah satu id bukan baris varian ini (mis. dihapus orang lain) — `code` = `bom_line_not_found`; tidak ada yang disimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Bentuk atau jumlah tidak valid (kunci galat `lines.N.qty_needed`); tidak ada yang disimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Vendor & Bahan Baku]
      deprecated: true
      summary: "[LEGACY] Tambah baris BOM lama (bahan + jumlah per unit)"
      description: |
        Jalur lama; membuat baris LEGACY (tanpa baris PO) dan tercatat di
        activity log (`bom_item_added`). Satu baris legacy per bahan. 409
        bila BOM varian sudah SELESAI. UI tidak lagi menawarkannya — pakai
        `POST /variants/{variant}/bom/items`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BomLineInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BomLine' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /variants/{variant}/bom/eligible-lines:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vendor & Bahan Baku]
      summary: Baris PO yang boleh dipilih untuk BOM varian ini
      description: |
        HANYA baris PO milik seller varian ini dengan status ordered,
        received, atau paid (bukan draft/cancelled/PO tanpa seller/seller
        lain/mode lain). `in_bom` menandai baris yang sudah dipakai BOM
        varian ini.
      parameters:
        - { name: q, in: query, description: Teks item/bahan/deskripsi jasa., schema: { type: string } }
        - { name: purchase_order, in: query, description: Sebagian nomor PO., schema: { type: string } }
        - { name: vendor_id, in: query, schema: { type: integer } }
        - { name: line_type, in: query, schema: { type: string, enum: [material, service] } }
        - { name: date_from, in: query, description: Tanggal PO (ordered_at, kalau belum ada created_at)., schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: per_page, in: query, description: Maksimal 100., schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EligibleBomLine' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /variants/{variant}/bom/items:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Tambah satu atau banyak baris PO ke BOM
      description: |
        Biaya satuan, vendor, nomor PO, dan nama item DISALIN SERVER dari
        baris PO (snapshot) — `unit_cost` dari klien diabaikan. `qty` =
        jumlah per SATU unit produk jadi (default 1; bilangan bulat >= 1 — 036: pecahan ditolak 422).
        Semua-atau-tidak-sama-sekali: satu baris yang ditolak membatalkan
        seluruh permintaan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [purchase_order_item_id]
                    properties:
                      purchase_order_item_id: { type: integer }
                      qty: { type: integer, minimum: 1, nullable: true, description: Bilangan bulat >= 1 (angka bulat berbentuk 2.0 / "2" diterima). }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Baris PO itu sudah ada di BOM varian ini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Bukan milik seller varian ini, PO belum/tidak ordered-received-paid, baris tidak dikenal, qty tidak valid, atau duplikat dalam permintaan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /variants/{variant}/bom/complete:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Tandai BOM selesai (harga modal mengikuti BOM)
      description: |
        Sejak itu `cost_price` varian = biaya BOM, disinkronkan otomatis pada
        setiap perubahan BOM, dan dikunci terhadap edit manual (PUT /variants
        → 409). Transaksi yang sudah tercatat tidak berubah. Idempoten.
        409 dengan `code`: `empty` (BOM kosong), `has_legacy` (masih ada
        baris legacy; `rows` menyebut baris itu), `invalid_row` (jumlah ≤ 0
        atau sumber PO bukan milik seller varian ini). PO sumber yang
        DIBATALKAN tidak menghalangi.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Belum memenuhi syarat (lihat `code`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: string, enum: [empty, has_legacy, invalid_row] }
                  rows:
                    type: array
                    items: { type: object, properties: { id: { type: integer }, item_name: { type: string, nullable: true } } }

  /variants/{variant}/bom/reopen:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Buka kembali BOM
      description: Melepas kunci `cost_price`; nilainya TETAP pada angka terakhir. Idempoten.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /variants/{variant}/bom/copy:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Salin BOM varian lain KE varian ini
      description: |
        Hanya antar varian PRODUK YANG SAMA (422 bila beda produk, varian
        sama, atau BOM sumber kosong). Baris digandakan lengkap dengan
        snapshot; sesudahnya tiap varian berdiri sendiri. Target yang sudah
        punya baris butuh `confirm_replace: true` (409
        `{code: requires_confirmation, variants: [...]}`). Salinan tidak
        pernah menandai target selesai dan MEMBUKA KEMBALI target yang
        selesai (harga modal tetap).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, source_variant_id]
              properties:
                mode: { type: string, enum: [from] }
                source_variant_id: { type: integer }
                confirm_replace: { type: boolean }
      responses:
        '200':
          description: Berhasil — VariantBom varian ini ditambah `results`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VariantBom'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/BomCopyResult' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /variants/{variant}/bom/copy-out:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Salin BOM varian ini ke varian berikutnya / semua varian lain / varian pilihan
      description: |
        `next` = varian berikutnya (id lebih besar) pada produk yang sama;
        `all` = semua varian lain. Semua-atau-tidak-sama-sekali dalam satu
        transaksi; aturan konfirmasi dan pembukaan kembali sama dengan
        `/bom/copy`.

        037-variant-drawer-bom-ui — `selected` = hanya varian di `variant_ids`
        (wajib untuk mode ini: 1..200 id berbeda dan ada; diabaikan oleh mode
        lain). Varian pilihan harus produk yang sama dan bukan varian sumber
        sendiri (422); satu id yang tidak ditemukan menggagalkan seluruh
        permintaan (422, tidak ada yang disalin). Varian pilihan yang sudah
        punya baris BOM menghasilkan 409 `requires_confirmation` + `variants[]`
        sampai `confirm_replace: true`. Salinan tidak pernah menandai target
        selesai (target yang selesai dibuka kembali); varian yang tidak dipilih
        tidak pernah tersentuh; satu audit `bom_copied` per target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [next, all, selected] }
                variant_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: integer }
                  description: Wajib bila mode = selected; id varian TUJUAN (produk yang sama, bukan sumber, berbeda satu sama lain).
                confirm_replace: { type: boolean }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/BomCopyResult' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /bom/{bomLine}:
    parameters:
      - { name: bomLine, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Vendor & Bahan Baku]
      summary: Ubah jumlah/catatan satu baris BOM
      description: |
        Hanya `qty_needed` dan `notes`; biaya/vendor/sumber tidak pernah
        berubah di sini. KONTRAK BERUBAH (034): respons kini BOM yang dimuat
        ulang (VariantBom), bukan satu baris datar. 036: `qty_needed` bilangan
        bulat >= 1; UI memakai `PUT /variants/{variant}/bom` (Simpan) untuk
        banyak baris sekaligus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qty_needed: { type: integer, minimum: 1 }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Vendor & Bahan Baku]
      summary: Hapus baris BOM
      description: |
        KONTRAK BERUBAH (034): 200 dengan BOM yang dimuat ulang (dulu 204).
        BOM SELESAI yang menjadi kosong dibuka kembali otomatis
        (`summary.reopened: true`; harga modal tetap pada nilai terakhir).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /bom/{bomLine}/replace-source:
    parameters:
      - { name: bomLine, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vendor & Bahan Baku]
      summary: Ganti sumber (baris PO) sebuah baris BOM — tindakan eksplisit
      description: |
        Satu-satunya cara biaya/vendor/PO sebuah baris berubah (mis. "pakai
        harga terbaru", atau mengganti baris LEGACY dengan baris PO).
        Jumlah per unit tetap. Aturan seller + status sama dengan menambah
        baris; baris PO yang sudah dipakai baris lain BOM ini → 409; sumber
        yang sama → tanpa perubahan. Tercatat (`bom_source_replaced`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchase_order_item_id]
              properties:
                purchase_order_item_id: { type: integer }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantBom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /variants/{variant}/cost-breakdown:
    parameters:
      - { name: variant, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vendor & Bahan Baku]
      summary: Rincian modal bahan (BOM) suatu varian
      description: |
        `bom_cost` = jumlah `qty_needed * unit_cost` seluruh baris BOM.
        `unit_cost` per baris memakai harga vendor `is_preferred` bila
        ada, kalau tidak ada yang ditandai maka harga TERMURAH dipakai
        (lihat `App\Services\BomCostCalculator` untuk alasannya). Bahan
        tanpa harga vendor sama sekali dihitung sebagai biaya nol dan
        ditandai `has_price: false`.

        **`bom_cost` TIDAK menimpa `cost_price` saat BOM belum selesai** —
        keduanya disajikan berdampingan. 034-seller-po-bom: begitu BOM
        ditandai SELESAI (`POST /variants/{variant}/bom/complete`),
        `cost_price` mengikuti `bom_cost` otomatis. Baris bersumber PO memakai
        SNAPSHOT `unit_cost`; baris LEGACY tetap memakai harga vendor acuan.
        `material_cost` + `service_cost` = `bom_cost`.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BomCostBreakdown' }

  # ------------------------------------------------------------------
  # IMPOR & EKSPOR MASTER DATA (PRD 7.15)
  #
  # CATATAN CAKUPAN — impor Excel awalnya dipotong dari MVP (PRD 10.2).
  # Ditambahkan kembali pada 2026-09-01 atas permintaan eksplisit
  # pemilik produk; keputusan pemotongan lama sengaja tidak dihapus dari
  # PRD, hanya diberi catatan bertanggal.
  # ------------------------------------------------------------------

  /exports/{entity}:
    parameters:
      - name: entity
        in: path
        required: true
        schema: { type: string, enum: [artists, categories, products, stock, vendors, materials, vendor_prices, bom, outlet_items, outlet_prices, roles, users] }
    get:
      tags: [Import & Export]
      summary: Ekspor satu entitas master data ke Excel
      description: |
        Satu berkas `.xlsx` berisi SATU sheet bernama sama dengan `entity`,
        dengan judul kolom yang sama persis dengan yang diterima
        `POST /imports/master-data`. Berkas hasil ekspor karena itu bisa
        disunting lalu diunggah kembali apa adanya.

        Sheet `products` berisi **satu baris per varian** (bukan per
        produk), karena harga melekat pada varian.

        `vendors`, `materials`, `vendor_prices`, `bom` ditambahkan
        pasca-MVP (2026-09-01) — lihat catatan bertanggal di
        `CLAUDE.md`/`README.md`/PRD §10.2. `bom` berisi satu baris per
        pasangan varian+bahan, direferensikan lewat `sku` (bukan produk
        induk) karena BOM diikat ke varian.

        `roles`/`users` ditambahkan pada User Story 4 fitur
        001-user-store-settings (2026-09-02). Sheet `users` TIDAK PERNAH
        memuat kolom password (FR-007); kolom `photo_path`-nya adalah
        REFERENSI string ke path penyimpanan, bukan data biner gambarnya,
        dan diabaikan sepenuhnya bila muncul pada berkas impor.

        Digerbang `canManageMasterData()` (owner/admin/inventory) — lebih
        ketat daripada endpoint daftar yang boleh dibaca kasir, karena
        menarik seluruh master data sebagai berkas adalah permukaan
        ekstraksi data massal.
      responses:
        '200':
          description: Berkas xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /imports/master-data/template:
    get:
      tags: [Import & Export]
      summary: Unduh template impor gabungan
      description: |
        Workbook `.xlsx` berisi sepuluh sheet (`artists`, `categories`,
        `products`, `stock`, `vendors`, `materials`, `vendor_prices`, `bom`,
        `roles`, `users`) lengkap dengan judul kolom yang benar dan satu
        baris contoh per sheet (F15.3). Enam sheet terakhir ditambahkan
        pasca-MVP (`vendors`..`bom` pada 2026-09-01, `roles`/`users` pada
        2026-09-02 — User Story 4 fitur 001-user-store-settings) — bukan
        bagian dari F15.3 asli, tapi dibangun mengikuti pola workbook
        gabungan yang sama persis.
      responses:
        '200':
          description: Berkas xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /imports/master-data:
    post:
      tags: [Import & Export]
      summary: Impor massal master data dari satu berkas Excel
      description: |
        Satu berkas `.xlsx` memuat sampai delapan sheet sekaligus. Sheet
        yang tidak dikenali diabaikan dan dilaporkan pada `ignored_sheets`;
        nama sheet dicocokkan tanpa memandang huruf besar/kecil.

        **Urutan pemrosesan** selalu `artists` → `categories` → `products`
        → `stock` → `vendors` → `materials` → `vendor_prices` → `bom` →
        `roles` → `users`, berapa pun urutan sheet di dalam berkas. Sheet
        vendor/bahan baku/BOM ditambahkan pasca-MVP 2026-09-01; `roles`/
        `users` ditambahkan 2026-09-02 (User Story 4) — lihat catatan
        bertanggal di CLAUDE.md/README.md/PRD §10.2; keduanya kapabilitas
        baru, bukan pemulihan salah satu butir yang dicoret PRD §10.2.
        `users` menunjuk `roles` lewat NAMA (`role_name`), bukan kode —
        `Role` tidak punya kolom `code` seperti entitas lain.

        **Semua-atau-tidak sama sekali.** Seluruh berkas divalidasi lebih
        dulu; bila ada satu baris pun yang tidak valid, tidak ada data yang
        diubah dan seluruh galat dikembalikan sekaligus (422). Ini
        menyimpang dari kriteria penerimaan F15.5 (yang meminta baris valid
        tetap tersimpan) secara sengaja: sheet-sheet ini saling bergantung,
        sehingga penyimpanan sebagian meninggalkan master data setengah
        jadi yang jauh lebih sulit dibereskan.

        **Kunci pencocokan (upsert, bukan selalu insert)**
        | Sheet | Kunci |
        |---|---|
        | `artists` | `code` |
        | `categories` | `code` |
        | `products` | `sku` bila diisi; bila kosong, `code_prefix` + urutan varian |
        | `stock` | pasangan (`sku`, `outlet_code`) — jumlah AKHIR per outlet; `outlet_code` wajib bila ada beberapa outlet; stok awal sheet `products` = outlet asal produk |
        | `vendors` | `code` |
        | `materials` | `code` |
        | `vendor_prices` | pasangan (`vendor_code`, `material_code`) |
        | `bom` | pasangan (`sku`, `material_code`) |
        | `outlet_items` | pasangan (`outlet_code`, `product_code` = `code_prefix`); `is_carried` 1/0 (kosong = dibawa untuk baris baru) |
        | `outlet_prices` | pasangan (`sku`, `outlet_code`); `price` angka ≥ 0, atau kata `base` untuk menghapus harga khusus. Ditolak (per baris) saat rilis menu aktif; outlet harus boleh dikelola pengunggah |
        | `roles` | `name` |
        | `users` | `username` |

        **Kode dihasilkan server.** `code_prefix` dan `sku` selalu dibuat
        `ProductCodeGenerator`. Kolom `sku` pada sheet `products` hanya
        boleh menunjuk varian yang SUDAH ada — SKU yang tidak dikenal
        ditolak, tidak dipakai untuk membuat varian baru.

        **Stok bersifat absolut.** Kolom `current_stock` pada sheet `stock`
        adalah jumlah akhir yang diinginkan; server menghitung selisihnya
        terhadap stok saat ini dan menerapkannya sebagai satu
        `stock_movements` bertipe `adjustment` (F15.8). Baris yang angkanya
        sudah sama tidak menghasilkan movement apa pun.

        Sheet `stock` menunjuk varian lewat `sku`. Cara paling aman mengisi
        stok awal varian BARU adalah kolom `initial_stock` di sheet
        `products`, karena SKU dibuat server. Sheet `stock` tetap boleh
        menunjuk SKU yang baru akan dibuat oleh berkas yang sama — SKU-nya
        deterministik (`code_prefix` + `-` + urutan 3 digit, mis.
        `RYU-KY-SAK-001`) — dan penyelesaiannya ditunda sampai sheet
        `products` diterapkan. SKU yang tetap tidak ditemukan setelah itu
        membatalkan seluruh impor dengan galat per-baris biasa.

        **Sel kosong berarti "jangan diubah"**, bukan "kosongkan nilainya".

        **Task 6 — gambar via impor massal.** Sheet `products` dan
        `categories` punya kolom `image_filename`, dan sheet `products`
        SENDIRI juga punya kolom kedua `variant_image_filename` — yang
        pertama gambar PRODUK (dipakai bersama semua variannya), yang
        kedua gambar VARIAN baris itu sendiri secara spesifik (mis. desain/
        motif berbeda per varian). Bila diisi, nilainya harus PERSIS SAMA
        dengan nama asli salah satu berkas yang diunggah bersamaan lewat
        field `images[]` pada request yang sama. Berkas yang cocok disalin
        ke penyimpanan publik (lokasi yang sama dengan
        `POST /products/{id}/image` / `POST /categories/{id}/image` /
        `POST /variants/{id}/image`, Task 5) dan `image_path` entitas yang
        bersangkutan diisi. Nama berkas yang direferensikan TAPI TIDAK ADA
        padanannya di `images[]` adalah GALAT PER BARIS
        (`column: image_filename` atau `column: variant_image_filename`),
        bukan dilewati diam-diam — konsisten dengan strategi
        semua-atau-tidak-sama-sekali impor ini. Kolom kosong berarti
        "tidak ada gambar diikutsertakan" (gambar yang sudah ada, bila ada,
        tidak diubah).

        **Vendor/bahan/BOM (pasca-MVP, 2026-09-01).** Sheet `vendor_prices`
        dan `bom` mereferensikan vendor/bahan/varian lewat `vendor_code`/
        `material_code`/`sku` — pola yang sama dengan `artist_code`/
        `category_code` pada sheet `products`. Baris `bom` boleh menunjuk
        SKU yang baru dibuat sheet `products` pada berkas yang sama
        (diselesaikan setelah sheet `products` diterapkan, pola yang sama
        dengan sheet `stock`). Menandai `is_preferred = 1` pada sheet
        `vendor_prices` melepas tanda preferred dari harga vendor lain
        untuk bahan yang sama.

        **Roles/Users (User Story 4, 2026-09-02).** Sheet `roles` punya
        kolom `menu_keys` berisi daftar kunci menu dipisah KOMA dalam satu
        sel (mis. `pos,session`), divalidasi terhadap registry
        `App\Support\MenuKeys`. Sheet `users` mereferensikan peran lewat
        `role_name` (boleh menunjuk peran baru yang dibuat sheet `roles`
        pada berkas yang sama) dan TIDAK PERNAH punya kolom password
        (FR-007) — akun baru dari impor mendapat password ACAK yang dibuat
        server, wajib diatur ulang pemiliknya lewat `PUT /users/{user}`.
        Baris `users` yang `role_name`-nya tidak dikenal membatalkan
        SELURUH impor (FR-009), termasuk baris `roles` valid pada berkas
        yang sama.

        Digerbang `canAccessAnyMenu()` — siapa pun yang bisa mengelola
        salah satu entitas master data pada berkas (termasuk
        pengguna/peran) boleh mengimpornya secara massal, konsisten dengan
        `canManageMasterData()` (owner/admin/inventory) untuk sheet lain.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Berkas `.xlsx`, maksimal 10 MB.
                dry_run:
                  type: boolean
                  default: false
                  description: |
                    Bila `true`, berkas hanya divalidasi dan jumlah baris
                    dilaporkan — tidak ada data yang ditulis (F15.4).
                images:
                  type: array
                  items: { type: string, format: binary }
                  description: |
                    Task 6 — batch gambar JPEG/PNG (maks 5 MB masing-masing,
                    maks 200 berkas) yang direferensikan lewat kolom
                    image_filename (sheet products/categories) atau
                    variant_image_filename (sheet products), dicocokkan
                    berdasarkan nama berkas ASLI.
      responses:
        '200':
          description: Impor berhasil, atau pratinjau tanpa galat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataImportResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            Berkas ditolak (bukan `.xlsx` valid, terlalu besar, tidak
            memuat sheet yang dikenali) ATAU ada baris yang tidak valid.
            Pada kasus terakhir `errors` berisi daftar galat per baris dan
            `applied` bernilai `false` — tidak ada data yang berubah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataImportResult' }

  # ---------------------------------------------------------------
  # Restaurant — 028-restaurant-dine-in-ordering
  # Setiap rute memeriksa menu-key-nya di SERVER (`dining_setup` / `floor`).
  # ---------------------------------------------------------------
  /dining-tables:
    get:
      tags: [Restaurant]
      summary: Daftar meja (menu `dining_setup`)
      description: Tidak berpaginasi — jumlah meja terbatas secara fisik. `?active=1` menyembunyikan meja nonaktif.
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DiningTable' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Restaurant]
      summary: Buat meja (menu `dining_setup`)
      description: >
        045 Stage 2 — body boleh membawa `outlet_id` (harus termasuk outlet yang boleh dilihat, selain itu 403
        `outlet_forbidden`; kosong = outlet tunggal yang berlaku). Outlet tidak berubah sesudah dibuat. Nama unik per outlet (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiningTableInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiningTable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /dining-tables/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Restaurant]
      summary: Detail meja (menu `dining_setup`)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiningTable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Restaurant]
      summary: Ubah / nonaktifkan meja (menu `dining_setup`)
      description: |
        Semua field opsional. Nama harus unik per area (dalam mode DEMO/LIVE yang aktif).
        Menonaktifkan meja yang sedang punya tab terbuka → `409`. Perubahan status aktif dicatat di log aktivitas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiningTableInput' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiningTable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Restaurant]
      summary: Hapus meja (menu `dining_setup`)
      description: Hanya meja yang BELUM pernah dipakai order apa pun. Selain itu → `409` (nonaktifkan saja). Penghapusan dicatat di log aktivitas.
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /floor:
    get:
      tags: [Restaurant]
      summary: Lantai — semua meja aktif per area dan tab terbukanya (menu `floor`)
      description: |
        Dipanggil polling ±3 detik. Isi respons dihash menjadi `version`; bila klien mengirim
        `?version=` yang sama, server membalas kerangka kecil `{unchanged: true, version}`.
        Jumlah query konstan (tidak bergantung jumlah meja). Hanya data mode DEMO/LIVE yang aktif.

        044-sales-table-view — dipakai juga oleh papan **Meja** di halaman Sales (baca-saja): tiap order terbuka
        membawa `paid_amount` (total terbayar turunan), dan meja NONAKTIF yang masih memegang order terbuka
        ikut dicantumkan (`is_active: false`, `state: occupied`) supaya uang yang berjalan tidak hilang dari
        layar; meja nonaktif tanpa order tetap disembunyikan. Tidak ada nilai yang bergantung jam di respons ini.

        045 Stage 2 — disaring menurut outlet pengguna (`X-Outlet-Id` mempersempit). Satu outlet yang berlaku →
        bentuk di atas (`areas`, `takeaway_tabs`). Beberapa outlet → `outlets: [{id, code, name, areas, takeaway_tabs}]`
        (jumlah query tetap konstan). Nama meja unik PER OUTLET.
      parameters:
        - { name: version, in: query, schema: { type: string }, description: Token `version` dari respons sebelumnya. }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Floor'
                  - $ref: '#/components/schemas/FloorUnchanged'
        '403': { $ref: '#/components/responses/Forbidden' }

  /tabs:
    get:
      tags: [Restaurant]
      summary: Daftar tab terbuka (menu `floor`)
      parameters:
        - { name: session_id, in: query, schema: { type: integer } }
        - { name: table_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TabSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Restaurant]
      summary: Buka tab (menu `floor`)
      description: |
        Tab dibuka di dalam shift yang masih terbuka. Dengan `table_id` → `dine_in`; tanpa → `takeaway`.
        `local_ref` membuat pembukaan ulang (retry) mengembalikan tab pertama. Nomor tab memakai
        penomoran penjualan (`TRX-…`) dan dipertahankan saat tab lunas.
        `409`: meja sudah dipakai tab lain (`existing_tab_id`), meja nonaktif, shift tidak terbuka,
        atau `local_ref` milik penjualan ritel. `422`: pelanggan tidak ditemukan. `404`: meja/shift
        dari mode DEMO/LIVE lain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenTabInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Konflik aturan bisnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  existing_tab_id: { type: integer, nullable: true }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tabs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Restaurant]
      summary: Detail tab (menu `floor`)
      description: |
        Tab `open` atau `completed`. Penjualan ritel dan tab yang dibatalkan/digabung → `404` (pakai `GET /orders/{id}`).
        Tanpa field biaya/margin. `opened_by` = nama kasir yang membuka tab (044, dipakai detail baca-saja di papan Meja).
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Restaurant]
      summary: Tutup tab KOSONG (menu `floor`)
      description: Tanpa efek stok/penjualan; mejanya kosong lagi. Tab yang punya baris → `409`.
      responses:
        '204': { description: Ditutup }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tabs/{id}/handover:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Restaurant]
      summary: Serahkan tab ke shift lain (owner/admin)
      description: Shift tujuan harus masih terbuka. Dicatat di log aktivitas (`handed_over`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: integer }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tabs/{id}/items:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Restaurant]
      summary: Tambah item ke tab (menu `floor`)
      description: |
        Harga dihitung SERVER dari master data — field harga dari klien diabaikan. Baris belum-terkirim
        yang identik (varian, catatan, harga) digabung. Stok dikurangi saat item ditambahkan (varian yang
        dilacak): stok kurang → `409` dan tab tidak berubah.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTabLineInput' }
      responses:
        '201':
          description: Tab terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tabs/{id}/items/{item}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: item, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Restaurant]
      summary: Ubah jumlah/catatan baris yang BELUM dikirim (menu `floor`)
      description: Selisih jumlah menggerakkan stok (sale/return) sebesar selisihnya. Baris yang sudah dikirim → `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTabLineInput' }
      responses:
        '200':
          description: Tab terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Restaurant]
      summary: Hapus (belum dikirim) atau BATALKAN (sudah dikirim) sebuah baris (menu `floor`)
      description: |
        - **Belum dikirim**: dihapus bebas, stok kembali penuh, `reason` tidak wajib.
        - **Sudah dikirim, item dapur masih `new`**: izin `floor`, `reason` WAJIB (`422` bila kosong), stok kembali.
        - **Sudah dikirim (048 / S3)**: body WAJIB `reason_code` (wrong_item|customer_request|kitchen_error|other),
          `kitchen_status` (not_started|started|made; harus sama dengan status dapur sebenarnya, 422 bila berbeda), dan
          `stock_decision` (return|waste; `return` hanya bila belum dimasak). Pemegang izin `order.void` lewat; selain
          itu wajib `override_token` dari `POST /overrides` (aksi `void_line`). Tanpa token → `409 override_required`.
        - `override_token` dibaca dari BODY JSON (DELETE membawa body), bukan dari query.

        Baris dihapus dari order; item tiket dapurnya menjadi `cancelled` (siapa/kapan/alasan) dan tetap tampil di
        layar stasiun agar tak dimasak. Pembatalan item yang sudah dikirim dicatat di log aktivitas
        (`item_cancelled`) dalam transaksi yang sama. Penghapusan/pembatalan yang membuat total < jumlah yang sudah
        dibayar → `409` dan SEMUANYA mundur (stok, tiket, baris, log). Baris order yang sudah `completed` → `409`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255, description: Catatan bebas (opsional). }
                reason_code: { type: string, enum: [wrong_item, customer_request, kitchen_error, other], description: Wajib untuk baris yang sudah dikirim. }
                kitchen_status: { type: string, enum: [not_started, started, made], description: Wajib untuk baris yang sudah dikirim; harus sama dengan status dapur. }
                stock_decision: { type: string, enum: [return, waste], description: Wajib untuk baris yang sudah dikirim. }
                override_token: { type: string, maxLength: 64, description: "Dari POST /overrides (void_line) bila peminta tanpa order.void." }
      responses:
        '200':
          description: Tab terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tabs/{id}/discounts:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Restaurant]
      summary: Beri diskon tab — tingkat order atau baris (048 / S4, menu `floor`)
      description: |
        Persen dihitung server dari basis sebenarnya (subtotal untuk order; harga × qty untuk baris). Diskon
        dikurangkan SEBELUM pajak. Di atas batas peran (`roles.discount_limit_pct`) butuh `override_token` dengan
        action `discount` dan subjek `tab_id`, `scope`, `line_id`, `percent`, `reason_code`. Batas bawaan: pemilik/admin
        tanpa batas (ASUMSI); peran lain 0 sampai diatur. `reason_code` dari kategori `discount`
        (`GET /reason-codes?category=discount`).

        `409 override_required` bila di atas batas tanpa token; `422 override_mismatch` bila token milik tab, baris,
        persen, atau alasan lain; `409 shift_required` bila shift tidak terbuka; `404` bila baris milik tab lain;
        `422` bila persen di luar (0, 100] atau alasan tidak dikenal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [percent, reason_code, scope]
              properties:
                percent: { type: number, example: 10, description: "0 < p ≤ 100, paling banyak dua desimal." }
                reason_code: { type: string, example: member }
                scope: { type: string, enum: [order, line] }
                line_id: { type: integer, nullable: true, description: "Wajib bila scope = line." }
                override_token: { type: string, nullable: true }
      responses:
        '200':
          description: Diskon diterapkan; totals dihitung ulang server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Restaurant]
      summary: Hapus diskon tingkat order (menu `floor`)
      description: |
        Menghapus diskon order. Tanpa token: ini menaikkan tagihan, bukan menguranginya. Diskon baris tidak dihapus
        lewat endpoint ini. Order milik outlet lain → 404; pengguna tanpa menu `floor` → 403.
      responses:
        '200':
          description: Diskon dihapus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tabs/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Restaurant]
      summary: Bayar tab — sebagian atau penuh (menu `floor`)
      description: |
        Memakai aturan pembayaran penjualan ritel (bukti non-tunai, kembalian hanya dari tunai).
        Bila total yang dibayar ≥ total tab → status `completed`, `change_amount` dihitung, meja kosong.
        Bila kurang → tab tetap `open` dengan `balance`. `client_ref` WAJIB: pengiriman ulang dengan
        `client_ref` yang sama tidak mencatat pembayaran lagi (mengembalikan keadaan terkini).
        Tab kosong / bukan `open` → `409`. Shift tidak terbuka → `409` dengan `code` = `shift_required` (048; terminal
        menampilkan tindakan yang tepat tanpa mengurai kalimat galat).

        048 / S3 — metode `edc`: `approval_code` (6–12 huruf kapital atau angka; format salah → 422; nomor kartu TIDAK
        pernah diterima maupun disimpan) dan `confirm_duplicate` (boolean). Kode yang sama dalam
        `edc_duplicate_window_seconds` → `409 duplicate_edc` kecuali `confirm_duplicate: true`. Selama ada QRIS `pending`
        di tab, non-tunai lain → `409 pending_qris` (tunai tetap boleh). Non-tunai tidak boleh melebihi sisa tagihan (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TabPaymentInput' }
      responses:
        '200':
          description: Tab terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /modifier-groups:
    get:
      tags: [Restaurant]
      summary: Daftar grup modifier beserta opsi dan lampirannya (menu `dining_setup`)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ModifierGroup' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Restaurant]
      summary: Buat grup modifier (menu `dining_setup`)
      description: |
        Aturan turunan dinormalisasi server: `single` → `max_select = 1` dan `min_select` = 1 bila wajib,
        0 bila opsional; `multiple` wajib → `min_select ≥ 1`; `max_select` kosong = tanpa batas atas.
        Hanya `min_select > max_select` yang ditolak (`422`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifierGroupInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModifierGroup' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /modifier-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Restaurant]
      summary: Detail grup modifier (menu `dining_setup`)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModifierGroup' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Restaurant]
      summary: Ubah grup / ganti opsi (menu `dining_setup`)
      description: |
        Semua field opsional. Bila `options` dikirim itu adalah PENGGANTIAN PENUH menurut id:
        ada `id` → ubah, tanpa `id` → buat, opsi yang TIDAK dikirim **dinonaktifkan** (tidak pernah dihapus).
        Pesanan/tab yang sudah ada tidak berubah (snapshot).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifierGroupInput' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModifierGroup' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Restaurant]
      summary: Hapus grup modifier (menu `dining_setup`)
      description: Grup yang pernah muncul pada baris order → `409` (nonaktifkan saja). Penghapusan dicatat di log aktivitas.
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /modifier-groups/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Restaurant]
      summary: Lampirkan grup ke produk dan/atau kategori — penggantian penuh (menu `dining_setup`)
      description: |
        Grup yang berlaku untuk sebuah produk = grup produk itu ∪ grup kategorinya (tanpa duplikat, hanya yang
        aktif dan punya opsi aktif). Id dari mode DEMO/LIVE lain, atau grup tanpa opsi aktif → `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_ids, category_ids]
              properties:
                product_ids: { type: array, items: { type: integer } }
                category_ids: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModifierGroup' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stations:
    get:
      tags: [Restaurant]
      summary: Daftar stasiun persiapan (menu `dining_setup` ATAU `kitchen`)
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Station' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Restaurant]
      summary: Buat stasiun (menu `dining_setup`)
      description: >
        045 Stage 2 — sama seperti meja: `outlet_id` opsional saat membuat; nama unik per outlet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StationInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Restaurant]
      summary: Detail stasiun (menu `dining_setup`)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Restaurant]
      summary: Ubah / nonaktifkan stasiun (menu `dining_setup`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StationInput' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Restaurant]
      summary: Hapus stasiun (menu `dining_setup`)
      description: Stasiun yang ditunjuk kategori/produk, atau pernah menerima tiket → `409` (nonaktifkan saja). Dicatat di log aktivitas.
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tabs/{id}/send:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Restaurant]
      summary: Kirim item yang belum terkirim ke dapur/bar (menu `floor`)
      description: |
        ATOMIK dan terkunci pada baris tab. Satu tiket per stasiun, ditambah satu tiket "tanpa stasiun" untuk
        item yang tidak perlu dimasak (item itu langsung berstatus `ready`). Stasiun ditentukan produk →
        kategori → tidak ada; stasiun nonaktif dilewati. Setelah dikirim, baris tidak bisa lagi diubah lewat
        `PATCH/DELETE /tabs/{id}/items/{item}`. Tidak ada yang baru untuk dikirim → `409`.
      responses:
        '200':
          description: Tab terbaru + tiket yang dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  tab: { $ref: '#/components/schemas/Tab' }
                  tickets:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /stations/{id}/tickets:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Restaurant]
      summary: Umpan layar stasiun (menu `kitchen`)
      description: |
        Tiket stasiun yang masih punya item belum-selesai, ditambah item selesai/batal dalam 30 menit terakhir;
        tertua dulu; tiap tiket hanya membawa item yang relevan. Dipanggil polling ±3 detik: token `version`
        (hash isi TANPA `waiting_seconds`) membuat jalur "tidak berubah" menjadi `{unchanged: true}`.
      parameters:
        - { name: version, in: query, schema: { type: string } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      tickets: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
                      version: { type: string }
                  - $ref: '#/components/schemas/FloorUnchanged'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Restaurant]
      summary: Satu tiket UTUH untuk tampilan cetak di browser (menu `kitchen` ATAU `floor`)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ticket-items/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Restaurant]
      summary: Ubah status satu item tiket (menu `kitchen` / `floor`)
      description: |
        Hanya MAJU: `new → preparing → ready → served`. `preparing`/`ready` memerlukan `kitchen`;
        `served` boleh `floor` ATAU `kitchen`. Loncat/mundur/item yang sudah final → `409`. `cancelled`
        TIDAK bisa diset di sini (`422`) — pembatalan lewat `DELETE /tabs/{id}/items/{item}`.
        Siapa dan kapan dicatat per langkah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [preparing, ready, served] }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [preparing, ready, served] }
                  preparing_at: { type: string, format: date-time, nullable: true }
                  ready_at: { type: string, format: date-time, nullable: true }
                  served_at: { type: string, format: date-time, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tabs/{id}/prebill:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Restaurant]
      summary: Tandai pra-bill tercetak (menu `floor`; 048/B13)
      description: |
        Hanya penanda: mengisi `prebill_at`, menaikkan `prebill_count`, dan menandai meja "Bill tercetak" di denah.
        TIDAK mengubah status, stok, atau total; tidak butuh shift. Boleh diulang. Tab yang sudah lunas/dibatalkan → 409.
      responses:
        '200':
          description: Tab terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tabs/{id}/move:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Restaurant]
      summary: Pindahkan tab ke meja kosong lain (menu `floor`)
      description: |
        Meja lama kosong, meja baru terisi; baris, tiket dan pembayaran tidak berubah. Juga mendudukkan tab
        takeaway di sebuah meja (`service_type` menjadi `dine_in`). Meja tujuan terisi → `409` dengan
        `existing_tab_id` (sarankan menggabung); meja nonaktif → `409`; mode DEMO/LIVE lain → `404`.
        Memindahkan ke meja yang sama tidak berefek. 045 Stage 2 — meja di OUTLET lain → `409` dengan `code: outlet_mismatch`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [table_id], properties: { table_id: { type: integer } } }
      responses:
        '200':
          description: Tab terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tabs/{id}/merge:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Restaurant]
      summary: Gabungkan tab SUMBER ke tab ini (menu `floor`)
      description: |
        Baris, tiket dapur dan item tiketnya pindah apa adanya (status persiapan ikut; stok TIDAK disentuh);
        tab sumber menjadi `voided` ("Digabung ke …") dan mejanya kosong; dicatat di log aktivitas (`merged`).
        `409`: tab yang sama, shift berbeda, salah satunya tidak `open`, atau tab sumber sudah punya
        pembayaran (tidak ada logika alokasi pembayaran). Penjualan ritel → `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [source_tab_id], properties: { source_tab_id: { type: integer } } }
      responses:
        '200':
          description: Tab tujuan terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tabs/{id}/split:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Restaurant]
      summary: Pisah tagihan — penjualan terpisah per item, atau bagi rata pratinjau (menu `floor`)
      description: |
        **048 / T059 — `mode: equal`.** Pratinjau bagi rata TANPA pembayaran dan TANPA mengubah tab: `parts` (2–5)
        bagian; setiap bagian rupiah utuh dari tagihan termasuk pajak; sisa pembulatan (dan sen) masuk ke bagian
        TERAKHIR sehingga jumlahnya tepat sama dengan tagihan. Kasir mencatat tiap bagian lewat `POST /tabs/{id}/payments`.
        Tab tanpa baris → 409 `tab_empty`; tab tidak terbuka → 409. Respons: `{total, mode: "equal", parts: [{index, amount}]}` (200).

        Mode bawaan (tanpa `mode`) tetap seperti di bawah.
        Membuat penjualan BARU berstatus `completed` (nomor sendiri, `split_from_order_id` = tab ini) dari item
        yang dipilih dan langsung membayarnya; sisanya tetap terbuka di meja yang sama. Baris yang dipilih UTUH
        dipindahkan (id baris yang sama); sebagian unit → baris asal dikecilkan dan snapshot-nya diklon.
        Jumlah penjualan baru + sisa tab selalu persis sama dengan tagihan semula. Stok TIDAK disentuh.

        `409`: tab sudah punya pembayaran apa pun; pembayaran kurang; jumlah melebihi yang ada; sebagian unit
        pada baris yang sudah dikirim tetapi belum `served` (baris UTUH selalu boleh). Bila tak ada baris
        tersisa, tab ditutup (`voided`) dan mejanya kosong. `client_ref` sama → `200` dengan hasil semula,
        tidak memisah dua kali. `404`: baris milik tab lain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SplitTabInput' }
      responses:
        '201':
          description: Dipisah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SplitTabResult' }
        '200':
          description: Pengiriman ulang (client_ref sama) — hasil semula
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SplitTabResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tabs/{id}/void:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Restaurant]
      summary: Batalkan seluruh tab terbuka (owner/admin)
      description: |
        `reason` WAJIB. Ditolak `409` bila sudah ada pembayaran apa pun (tidak ada alur refund) atau tab tidak `open`.
        Stok hanya kembali untuk baris yang belum dikirim atau yang item dapurnya masih `new`; item tiket yang belum
        selesai menjadi `cancelled`; yang sudah `served` tetap final. Tab menjadi `voided` dan mejanya kosong; baris
        tetap ada pada order `voided` (seperti void penjualan). Dicatat di log aktivitas (`tab_voided`).
        Untuk penjualan yang sudah `completed`, gunakan `POST /orders/{id}/void` (aturan lama, tidak berubah).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Tab yang dibatalkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tab' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

# =====================================================================
# COMPONENTS
# =====================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 25, maximum: 100 }

  responses:
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Peran tidak memiliki izin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Bertentangan dengan aturan bisnis
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:
    ShiftRow:
      type: object
      description: 065 — satu shift pada daftar/panel. Uang berupa string 2 desimal; shift tertutup membaca nilai tersimpan.
      properties:
        id: { type: integer }
        source: { type: string, enum: [app, web], description: "app = shift dari tablet (terminal terisi), web = tanpa terminal." }
        terminal_name: { type: string, nullable: true }
        cashier: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
        outlet: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
        status: { type: string, enum: [open, closed] }
        business_date: { type: string, format: date, nullable: true }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        opening_cash: { $ref: '#/components/schemas/Money' }
        order_count: { type: integer }
        sales_total: { $ref: '#/components/schemas/Money' }
        cash_net: { $ref: '#/components/schemas/Money' }
        noncash_total: { $ref: '#/components/schemas/Money' }
        cash_in: { $ref: '#/components/schemas/Money' }
        cash_out: { $ref: '#/components/schemas/Money' }
        void_count: { type: integer }
        void_total: { $ref: '#/components/schemas/Money' }
        expected_cash: { $ref: '#/components/schemas/Money' }
        counted_total: { $ref: '#/components/schemas/Money', nullable: true }
        difference: { $ref: '#/components/schemas/Money', nullable: true }

    Device:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: "064 — satu-satunya identitas terminal yang tampil; unik di antara terminal aktif satu outlet." }
        outlet_id: { type: integer }
        app_version: { type: string, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }

    DashboardKpi:
      type: object
      properties:
        value: { nullable: true, description: "String 2 desimal untuk uang; integer untuk hitungan." }
        comparison: { nullable: true }
        change_pct: { type: number, nullable: true, description: "null bila pembanding nol/tidak ada." }
        change_abs: { type: integer, description: "Hanya low_stock; kenaikan adalah buruk." }
        scope: { type: string, enum: [organisation], description: "Hanya low_stock." }
        series: { type: array, items: { $ref: '#/components/schemas/DashboardPoint' } }
        comparison_series: { type: array, items: { $ref: '#/components/schemas/DashboardPoint' } }
    DashboardPoint:
      type: object
      properties:
        t: { type: string, description: "HH:00 (today) atau tanggal (7d/30d)." }
        v: { description: "String uang atau integer." }
    DashboardSummary:
      type: object
      properties:
        computed_at: { type: string, format: date-time }
        business_date: { type: string, format: date }
        period: { type: string, enum: [today, 7d, 30d] }
        range: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
        comparison:
          type: object
          properties:
            basis: { type: string, enum: [same_time_yesterday, previous_period] }
            from: { type: string, format: date }
            to: { type: string, format: date }
            up_to: { type: string, description: "HH:MM, hanya same_time_yesterday." }
        # 048 — pendapatan periode dengan pajak: net (pra-pajak), order_discount_total, tax_total, dan
        # grand_total = net_sales − order_discount_total + tax_total (= total struk). Sama definisinya dengan `totals`
        # di GET /reports/sales (refund mengurangi pada tanggal refund).
        revenue:
          type: object
          properties:
            net_sales: { $ref: '#/components/schemas/Money' }
            order_discount_total: { $ref: '#/components/schemas/Money' }
            tax_total: { $ref: '#/components/schemas/Money' }
            grand_total: { $ref: '#/components/schemas/Money' }
        kpis:
          type: object
          properties:
            net_sales: { $ref: '#/components/schemas/DashboardKpi' }
            orders: { $ref: '#/components/schemas/DashboardKpi' }
            avg_order_value: { $ref: '#/components/schemas/DashboardKpi' }
            low_stock: { $ref: '#/components/schemas/DashboardKpi' }
    DashboardAttentionItem:
      type: object
      properties:
        kind: { type: string, enum: [payments_pending, void_after_fire, cash_difference, low_stock] }
        severity: { type: string, enum: [ok, warn, critical] }
        count: { type: integer }
        amount: { type: string, nullable: true }
        amount_unknown_count: { type: integer, description: "Hanya void_after_fire." }
        meta: { type: object, additionalProperties: true }
        link:
          type: object
          nullable: true
          properties: { route: { type: string }, query: { type: object, additionalProperties: true } }
    DashboardAttention:
      type: object
      properties:
        computed_at: { type: string, format: date-time }
        business_date: { type: string, format: date }
        count: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/DashboardAttentionItem' } }
    DashboardOrderRow:
      type: object
      properties:
        id: { type: integer }
        order_number: { type: string }
        type: { type: string, enum: [retail, dine_in, takeaway] }
        table: { type: string, nullable: true }
        items_summary: { type: string }
        status: { type: string, enum: [open, completed, voided] }
        tab: { type: string, enum: [open, partial, paid, cancelled] }
        payment_state: { type: string, enum: [unpaid, partial, pending, paid] }
        methods: { type: array, items: { type: string } }
        total_amount: { type: string }
        paid_amount: { type: string }
        business_date: { type: string, format: date }
        at: { type: string, format: date-time }
        outlet_id: { type: integer, nullable: true }
    DashboardOrders:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DashboardOrderRow' } }
        meta: { type: object, properties: { current_page: { type: integer }, per_page: { type: integer }, total: { type: integer }, last_page: { type: integer } } }
        counts: { type: object, properties: { all: { type: integer }, open: { type: integer }, partial: { type: integer }, paid: { type: integer }, cancelled: { type: integer } } }
        hidden_tabs: { type: array, items: { type: string } }

    CustomerImportResult:
      type: object
      description: Bentuk respons POST /customers/import, baik dry_run maupun penerapan sungguhan (020-customer-data-import-export).
      properties:
        dry_run: { type: boolean }
        created_count: { type: integer }
        updated_count: { type: integer }
        row_errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              errors: { type: array, items: { type: string } }

    StockByArtistDetail:
      type: object
      description: |
        Bentuk respons GET /reports/stock-by-artist ketika query param
        artist_id diisi (009-ui-ux-refinements, US7).
      properties:
        artist_id: { type: integer }
        artist_name: { type: string }
        variants:
          type: array
          items:
            type: object
            properties:
              variant_id: { type: integer }
              sku: { type: string }
              variant_name: { type: string, nullable: true }
              current_stock: { type: integer }
        variant_count: { type: integer }
        total_stock: { type: integer }

    InvoicePaymentSetting:
      type: object
      description: |
        Singleton konfigurasi informasi pembayaran invoice
        (019-billing-system US4). Bukan HasDataMode-scoped — data
        administratif, tampil identik di mode DEMO/LIVE.
      properties:
    SchemaOutdated:
      description: |
        035-po-row-actions — struktur database TERTINGGAL dari versi aplikasi
        (migrasi belum diterapkan; kolom/tabel belum ada). Bisa muncul dari
        endpoint API MANA PUN yang menyentuh bagian skema yang belum ada.
        Hanya SQLSTATE 42S22/42S02 yang dikonversi; galat database lain tetap
        500. Pesan ramah tanpa SQL/nama tabel/kolom; detail lengkap hanya di
        log server. Klien menampilkan status galat + "Coba lagi", bukan layar
        kosong atau keadaan kosong yang menyesatkan.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              code: { type: string, enum: [schema_outdated] }
        id: { type: integer, example: 1 }
        bank_name: { type: string, nullable: true }
        account_number: { type: string, nullable: true }
        account_holder: { type: string, nullable: true }
        instructions: { type: string, nullable: true }

    PosCategory:
      type: object
      required: [id, code, name, display_order, product_count]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        display_order: { type: integer }
        product_count: { type: integer, description: 'Produk aktif dalam mode yang sama; 0 valid' }
    ServerAddress:
      type: object
      required: [selected]
      properties:
        local: { type: string, nullable: true, example: 'http://192.168.1.10:8010' }
        online: { type: string, nullable: true, example: 'https://pos.example.com' }
        selected: { type: string, enum: [local, online] }
    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string, nullable: true, example: INSUFFICIENT_STOCK }

    Paginated:
      type: object
      properties:
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }

    PaginationMeta:
      type: object
      description: 065 — amplop paginasi buatan tangan yang sama dengan `Paginated.meta`.
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "150000.00"

    # BUG YANG DITEMUKAN & DIPERBAIKI — skema ini sebelumnya juga bernama
    # `User` sama seperti skema entitas CRUD pengguna di bawah (lihat
    # bagian "Pengguna & Peran"), yang ditambahkan belakangan oleh alur
    # kerja terpisah. Dua definisi top-level dengan kunci sama di YAML
    # membuat definisi kedua diam-diam menimpa yang pertama pada parser
    # yang taat spesifikasi — endpoint /auth/login dan /auth/me akan
    # terdokumentasi memakai skema yang salah (bentuk objek role, bukan
    # nama+menu_keys) tanpa galat apa pun yang terlihat. Diberi nama
    # sendiri karena memang bentuknya berbeda dari skema entitas User
    # (role di sini nama tampilan saja + menu_keys hasil resolusi sesi,
    # bukan objek Role penuh).
    AuthenticatedUser:
      type: object
      description: |
        Bentuk `user` pada respons /auth/login dan /auth/me — BUKAN skema
        entitas User CRUD (lihat `User` di bagian "Pengguna & Peran").
        `role` adalah NAMA Role yang bisa dikonfigurasi bebas oleh owner
        (bukan lagi enum 4 nilai tetap) — dipakai HANYA untuk tampilan.
        `menu_keys` adalah daftar kunci menu yang boleh diakses akun ini,
        resolusi sekali per sesi login/`GET /auth/me`; ini yang dipakai
        frontend untuk `canAccessMenu()` (cosmetic saja — penegakan
        sesungguhnya tetap di server pada setiap endpoint).
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        role: { type: string, example: Owner }
        menu_keys:
          type: array
          items: { type: string }
          example: [dashboard, pos, session, products, reports, settings]
        is_active: { type: boolean }
        photo_url:
          type: string
          nullable: true
          description: |
            005-ux-enhancements-dashboard — dipakai avatar header (AppSidebar)
            dan layar Profil Saya. null bila belum pernah mengunggah foto.
        language:
          type: string
          enum: [id, en]
          description: >
            Preferensi bahasa antarmuka akun ini (002-language-toggle),
            default 'en'. Berlaku setelah login saja — tidak mempengaruhi
            layar login maupun struk transaksi (selalu Bahasa Indonesia).

    Artist:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, minLength: 3, maxLength: 3, example: RYU }
        name: { type: string }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        product_count: { type: integer, readOnly: true }

    ArtistInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 3, maxLength: 3, description: Huruf kapital. Permanen setelah dibuat. }
        name: { type: string, maxLength: 100 }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean, default: true }

    # -------------------------------------------------------------
    # Pengguna & Peran (001-user-store-settings, ditambahkan 2026-10)
    # -------------------------------------------------------------
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        role:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        is_active: { type: boolean }
        photo_url: { type: string, nullable: true, readOnly: true }
        last_login_at: { type: string, format: date-time, nullable: true }
      description: password TIDAK PERNAH disertakan (FR-007), termasuk pada ekspor massal.

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 50 }
        menu_keys:
          type: array
          items: { type: string }
          description: Divalidasi terhadap registry App\Support\MenuKeys.
        is_system_default:
          type: boolean
          description: |
            `true` untuk 4 peran bawaan (Owner/Admin/Kasir/Inventory) yang
            direproduksi seeder — informasional saja, tidak memblokir edit.
        user_count:
          type: integer
          readOnly: true
          description: Jumlah pengguna AKTIF yang memakai peran ini.

    RoleInput:
      type: object
      required: [name, menu_keys]
      properties:
        name: { type: string, maxLength: 50, description: Unik di antara peran yang belum dihapus. }
        menu_keys:
          type: array
          items: { type: string }
          description: Setiap nilai harus salah satu kunci App\Support\MenuKeys — kunci tak dikenal ditolak 422.
        all_outlets:
          type: boolean
          description: >
            045 — peran melihat SEMUA outlet tanpa penugasan per pengguna. Hanya pengguna yang sendiri melihat semua
            outlet yang boleh mengubahnya (selain itu 403 `outlet_forbidden`); peran Owner/Admin tidak bisa dimatikan
            (409 `outlet_all_by_role`). Perubahan dicatat `role_outlet_scope_changed`.

    UserInput:
      type: object
      required: [name, username, role_id]
      properties:
        name: { type: string, maxLength: 100 }
        username: { type: string, maxLength: 50, description: Unik di antara pengguna yang belum dihapus. }
        password: { type: string, minLength: 8, description: Wajib saat membuat; opsional saat memperbarui (kosong = tidak diubah). }
        role_id: { type: integer, description: Harus merujuk Role yang belum dihapus. }
        is_active: { type: boolean, default: true }

    # -------------------------------------------------------------
    # Vendor, bahan baku, dan BOM (ditambahkan pasca-MVP, 2026-09-01)
    # -------------------------------------------------------------
    Vendor:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, maxLength: 20, example: VNAKR }
        name: { type: string }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        material_price_count: { type: integer, nullable: true, readOnly: true }

    VendorInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 20, description: Permanen setelah dibuat, sama seperti Artist/Category. }
        name: { type: string, maxLength: 150 }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean, default: true }

    BusinessType:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, maxLength: 20, example: RETAIL }
        name: { type: string }
        is_active: { type: boolean }
        company_count: { type: integer, nullable: true, readOnly: true }

    BusinessTypeInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 20, description: Permanen setelah dibuat. }
        name: { type: string, maxLength: 100 }
        is_active: { type: boolean, default: true }

    License:
      type: object
      description: 019-billing-system — rename dari Package (research.md R1').
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        license_tier: { type: string, enum: [pro, master], description: Deskriptif saja — tidak diterapkan otomatis ke Setting multi_artist_enabled instalasi ini. }
        price: { type: string, description: 'Angka desimal sebagai string, mis. "500000.00".' }
        payment_type: { type: string, enum: [one_time, subscription], description: Label deskriptif saja — tidak ada billing berulang otomatis (FR-017). }
        is_active: { type: boolean }
        company_count: { type: integer, nullable: true, readOnly: true }

    LicenseInput:
      type: object
      required: [name, license_tier, price, payment_type]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }
        license_tier: { type: string, enum: [pro, master] }
        price: { type: number, minimum: 0 }
        payment_type: { type: string, enum: [one_time, subscription] }
        is_active: { type: boolean, default: true }

    Company:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string, nullable: true }
        contact_name: { type: string }
        contact_email: { type: string }
        contact_phone: { type: string, nullable: true }
        status: { type: string, enum: [pending_activation, active] }
        can_activate: { type: boolean, readOnly: true, description: 'research.md R14 (019-billing-system, third expansion) — true bila status belum active DAN sudah ada minimal satu Invoice berstatus paid milik company ini.' }
        activated_at: { type: string, format: date-time, nullable: true }
        business_type: { $ref: '#/components/schemas/BusinessType' }
        license: { $ref: '#/components/schemas/License' }
        owner_username: { type: string, readOnly: true }
        created_at: { type: string, format: date-time }

    CompanyOnboardInput:
      type: object
      required: [business_type_id, license_id, name, contact_name, contact_email, owner_username, owner_password]
      properties:
        business_type_id: { type: integer, description: Harus merujuk business type yang masih aktif. }
        license_id: { type: integer, description: Harus merujuk lisensi yang masih aktif. }
        name: { type: string, maxLength: 150 }
        address: { type: string, nullable: true }
        contact_name: { type: string, maxLength: 100 }
        contact_email: { type: string, format: email }
        contact_phone: { type: string, nullable: true }
        owner_username: { type: string, maxLength: 50, description: Harus unik lintas seluruh tabel users. }
        owner_password: { type: string, minLength: 8 }

    CompanyUpdateInput:
      type: object
      description: 019-billing-system (second expansion, research.md R11) — TIDAK termasuk owner_username/owner_password (creation-only, kredensial owner tidak pernah diubah lewat edit company).
      required: [business_type_id, license_id, name, contact_name, contact_email]
      properties:
        business_type_id: { type: integer, description: Harus merujuk business type yang masih aktif. }
        license_id: { type: integer, description: Harus merujuk lisensi yang masih aktif. }
        name: { type: string, maxLength: 150 }
        address: { type: string, nullable: true }
        contact_name: { type: string, maxLength: 100 }
        contact_email: { type: string, format: email }
        contact_phone: { type: string, nullable: true }

    Invoice:
      type: object
      description: 019-billing-system — Invoice sebagai dokumen mandiri (research.md R3'/R4'), bukan lagi anak Company/Package.
      properties:
        id: { type: integer }
        invoice_number: { type: string, description: "Digenerate server, unik lintas mode DEMO/LIVE, format INV-{YYYYMM}-{seq} (research.md R3')." }
        company_id: { type: integer }
        company:
          type: object
          nullable: true
          readOnly: true
          description: research.md R12 — business_type dibaca live dari relasi Company::businessType(), BUKAN snapshot seperti license/subtotal di bawah (mendeskripsikan Company itu sendiri, bukan fakta pembayaran yang dibekukan saat invoice dibuat).
          properties:
            id: { type: integer }
            name: { type: string }
            business_type:
              type: object
              nullable: true
              readOnly: true
              properties:
                id: { type: integer }
                name: { type: string }
        license_id: { type: integer }
        license:
          type: object
          nullable: true
          readOnly: true
          properties:
            id: { type: integer }
            name: { type: string }
            payment_type: { type: string, enum: [one_time, subscription] }
        subtotal: { type: string, description: 'Angka desimal sebagai string, mis. "500000.00".' }
        discount: { type: string, description: 'Angka desimal sebagai string — jumlah tetap, bukan persentase (research.md R4).' }
        grand_total: { type: string, description: 'subtotal - discount, DISIMPAN saat dibuat — tidak pernah dihitung ulang dari license.price yang berubah kemudian (FR-013).' }
        due_date: { type: string, format: date }
        status: { type: string, enum: [unpaid, paid, cancelled] }
        paid_at: { type: string, format: date, nullable: true }
        payment_information: { type: string, nullable: true, description: Default dari invoice_payment_settings saat dibuat, bisa ditimpa per-invoice (FR-015). }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

