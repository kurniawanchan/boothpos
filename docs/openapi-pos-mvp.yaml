                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pengguna & Peran]
      summary: Buat peran
      description: |
        Setiap nilai `menu_keys` divalidasi terhadap registry
        App\Support\MenuKeys — kunci tak dikenal ditolak 422, tidak pernah
        didiamkan tersimpan tanpa efek.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /roles/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pengguna & Peran]
      summary: Detail peran
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pengguna & Peran]
      summary: Perbarui peran
      description: |
        Ditolak 409 (FR-013) bila perubahan `menu_keys` akan membuat TIDAK
        ADA satu pun peran tersisa (selain peran ini) yang mencakup KEDUA
        kunci reserved `users` DAN `roles` — toko tidak boleh pernah
        kehilangan kemampuan mengelola aksesnya sendiri.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Pengguna & Peran]
      summary: Hapus peran
      description: |
        Soft delete. Ditolak 409 bila peran masih dipakai satu atau lebih
        pengguna aktif (FR-014, pesan mengutip jumlah pengguna persis), ATAU
        bila peran ini adalah peran terakhir yang mencakup users+roles
        (FR-013, dicek sesudah FR-014).
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /menu-keys:
    get:
      tags: [Pengguna & Peran]
      summary: Registry menu/fitur yang tersedia
      description: |
        Sumber kebenaran tunggal App\Support\MenuKeys, dikembalikan sebagai
