        image_url: { type: string, nullable: true, readOnly: true, description: "URL siap-pakai (disk publik)." }
        parent_id: { type: integer, nullable: true }
        display_order: { type: integer }
        is_active: { type: boolean }
        station_id: { type: integer, nullable: true, description: "028 — stasiun persiapan default untuk menu kategori ini (stasiun produk menang)." }

    CategoryInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 2 }
        name: { type: string, maxLength: 100 }
        parent_id: { type: integer, nullable: true }
        display_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }

    Variant:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        sku: { type: string, minLength: 14, maxLength: 14, example: RYU-KY-SAK-001 }
        variant_name: { type: string }
        cost_price: { $ref: '#/components/schemas/Money' }
        sell_price: { $ref: '#/components/schemas/Money' }
        current_stock: { type: integer, readOnly: true }
        low_stock_alert: { type: integer, nullable: true }
        is_active: { type: boolean }
        bom_complete: { type: boolean, description: "034 — BOM ditandai selesai; cost_price mengikuti biaya BOM dan dikunci." }
        has_bom: { type: boolean, description: "034 — hanya ada pada GET/PUT produk untuk pengguna menu products (baris BOM dimuat)." }
        bom_cost: { type: string, nullable: true, example: "1800.00", description: "034 — biaya BOM; null bila belum ada baris. Hanya bila has_bom ikut dikirim." }

    VariantInput:
      type: object
      required: [variant_name, sell_price]
      properties:
        variant_name: { type: string, maxLength: 100, default: Standard }
        cost_price: { $ref: '#/components/schemas/Money' }
        sell_price: { $ref: '#/components/schemas/Money' }
        low_stock_alert: { type: integer, nullable: true }
        is_active: { type: boolean, default: true }
        copy_bom_from_variant_id: { type: integer, nullable: true, description: "034 — hanya pada POST /products/{id}/variants." }

    VariantLookup:
      type: object
      description: Bentuk ringkas untuk layar kasir
      properties:
        variant_id: { type: integer }
        sku: { type: string }
        label: { type: string, example: Keychain Sakura — Varian A }
        artist_name: { type: string }
        category_name: { type: string, nullable: true, description: "Nama kategori produk induk (untuk membedakan produk bernama sama)" }
        sell_price: { $ref: '#/components/schemas/Money' }
        current_stock: { type: integer }
        image_url: { type: string, nullable: true, description: "Foto varian sendiri; bila tidak ada, foto produk induk; bila tidak ada, null. Layar kasir memakainya di kartu hasil pencarian dan baris keranjang." }

    Product:
      type: object
      properties:
        id: { type: integer }
        artist_id: { type: integer }
        artist_name: { type: string, readOnly: true }
        category_id: { type: integer }
        category_name: { type: string, readOnly: true }
        code_prefix: { type: string, minLength: 10, maxLength: 10, readOnly: true, example: RYU-KY-SAK }
        name: { type: string }
        description: { type: string, nullable: true }
        image_path: { type: string, nullable: true, description: "Diisi via POST /products/{id}/image atau impor massal (Task 6)." }
        image_url: { type: string, nullable: true, readOnly: true, description: "URL siap-pakai (disk publik), ditambahkan Task 5." }
        is_active: { type: boolean }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }

    ProductInput:
      type: object
      required: [artist_id, category_id, name]
      properties:
        artist_id: { type: integer }
        category_id: { type: integer }
        name: { type: string, maxLength: 150 }
        description: { type: string, nullable: true }
        is_active: { type: boolean, default: true }
        variants:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/VariantInput' }

    StockMovement:
      type: object
      properties:
        id: { type: integer }
        variant_id: { type: integer }
        sku: { type: string, readOnly: true }
        type: { type: string, enum: [purchase, sale, preorder_handover, adjustment, return, initial] }
        qty_change: { type: integer }
        stock_before: { type: integer }
        stock_after: { type: integer }
        reason: { type: string, nullable: true }
        user_name: { type: string, nullable: true, readOnly: true, description: Pengguna pencatat; null bila penggunanya sudah dihapus. }
        variant_name: { type: string, nullable: true, readOnly: true }
        product_id: { type: integer, nullable: true, readOnly: true, description: null bila produknya sudah dihapus (layar Stok memberi pesan jelas). }
        product_name: { type: string, nullable: true, readOnly: true }
        reference:
          type: object
          nullable: true
          readOnly: true
          properties:
            type: { type: string, enum: [order, stock_transfer] }
            id: { type: integer, description: id order / transfer }
            number: { type: string, example: "TRX-20261004-0007" }
        created_at: { type: string, format: date-time }

    CashierSession:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        user_name: { type: string, readOnly: true }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        opening_cash: { $ref: '#/components/schemas/Money' }
        closing_cash: { $ref: '#/components/schemas/Money' }
        expected_cash: { $ref: '#/components/schemas/Money' }
        cash_difference: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [open, closed] }
        counted_total: { $ref: '#/components/schemas/Money', nullable: true, description: '048 — jumlah hitungan buta (null untuk penutupan bentuk lama).' }
        edc_batch_total: { $ref: '#/components/schemas/Money', nullable: true, deprecated: true, description: "065 — tidak diisi lagi untuk penutupan baru; nilai lama tetap sebagai riwayat." }
        variance: { $ref: '#/components/schemas/Money', nullable: true }
        z_report: { type: object, nullable: true, description: '048 — salinan angka shift saat tutup.' }
        device_id: { type: integer, nullable: true }
        opening_denominations:
          type: array
          items:
            type: object
            properties:
              denomination: { type: integer }
              qty: { type: integer }

    CashMovement:
      type: object
      properties:
        id: { type: integer }
        session_id: { type: integer }
        direction: { type: string, enum: [in, out] }
        reason_code: { type: string }
        reason_note: { type: string, nullable: true }
        amount: { $ref: '#/components/schemas/Money' }
        created_by_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    SessionSummary:
      type: object
      properties:
        session: { $ref: '#/components/schemas/CashierSession' }
        order_count: { type: integer }
        total_sales: { $ref: '#/components/schemas/Money' }
        cash_in: { $ref: '#/components/schemas/Money' }
        cash_out: { $ref: '#/components/schemas/Money' }
        change_given: { $ref: '#/components/schemas/Money' }
        by_method:
          type: array
          items:
            type: object
            properties:
              method: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
              count: { type: integer }
              amount: { $ref: '#/components/schemas/Money' }

    Customer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        social_handle: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        address: { type: string, nullable: true }

    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        social_handle: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        address: { type: string, nullable: true }

    PaymentChannel:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [bank_transfer, qr_ewallet] }
        provider: { type: string, example: BCA }
        account_name: { type: string }
        account_number:
          type: string
          nullable: true
          description: Tersamar untuk peran kasir pada daftar. Kosong untuk qr_ewallet.
        qr_image_url: { type: string, nullable: true }
        is_active: { type: boolean }
        can_manage_qr: { type: boolean, description: '056 — true bila pengguna berhak mengganti QR (menu settings); tablet memakai ini untuk menampilkan kontrol ganti QR' }

    PosDraftSummary:
      type: object
      description: 006-purchase-order-and-ops (US4) — bentuk ringkas untuk daftar; GET /pos-drafts/{id} mengembalikan keranjang penuh siap-checkout, bukan bentuk ini.
      properties:
        id: { type: integer }
        label: { type: string, nullable: true }
        item_count: { type: integer }
        total: { $ref: '#/components/schemas/Money' }
        customer_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    PurchaseOrderInput:
      type: object
      required: [vendor_id, artist_id, items]
      properties:
        vendor_id: { type: integer }
        artist_id: { type: integer, description: 034 — seller yang dibelikan (wajib saat membuat; pada PUT boleh dikirim untuk menetapkan/mengubah seller). }
        notes: { type: string, nullable: true }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [line_type, qty, unit_price]
            properties:
              line_type: { type: string, enum: [material, service] }
              material_id: { type: integer, nullable: true, description: Wajib bila line_type=material. }
              product_id: { type: integer, nullable: true, description: Selalu opsional apa pun line_type-nya — menautkan bahan baku ke produk tertentu. }
              description: { type: string, nullable: true, maxLength: 255, description: Wajib bila line_type=service. }
              qty: { type: string, example: "10.000" }
              unit_price: { $ref: '#/components/schemas/Money' }

    PurchaseOrder:
      type: object
      properties:
        id: { type: integer }
        po_number: { type: string, example: PO-20261012-0001 }
        vendor_id: { type: integer }
        vendor_name: { type: string }
        artist_id: { type: integer, nullable: true, description: "034 — seller yang dibelikan; null = PO lama tanpa seller (tidak pernah ditawarkan sebagai sumber BOM)." }
        artist_name: { type: string, nullable: true }
        status: { type: string, enum: [draft, ordered, received, paid, cancelled] }
        ordered_at: { type: string, format: date-time, nullable: true }
        received_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancel_reason: { type: string, nullable: true }
        subtotal: { $ref: '#/components/schemas/Money' }
        total_amount: { $ref: '#/components/schemas/Money' }
        paid_amount: { $ref: '#/components/schemas/Money' }
        notes: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              line_type: { type: string, enum: [material, service] }
              material_id: { type: integer, nullable: true }
              material_name: { type: string, nullable: true }
              product_id: { type: integer, nullable: true }
              product_name: { type: string, nullable: true }
              used_in_bom_count: { type: integer, description: 034 — jumlah baris BOM yang memakai baris PO ini. }
              description: { type: string, nullable: true }
              qty: { type: string }
              unit_price: { $ref: '#/components/schemas/Money' }
              line_total: { $ref: '#/components/schemas/Money' }
        payments:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              method: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
              amount: { $ref: '#/components/schemas/Money' }
              notes: { type: string, nullable: true }
              paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    PaymentInput:
      type: object
      required: [method, amount]
      properties:
        method: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
        channel_id:
          type: integer
          nullable: true
          description: Wajib untuk metode non-tunai, dikosongkan untuk tunai.
        purpose: { type: string, enum: [full, down_payment, settlement], default: full }
        amount: { $ref: '#/components/schemas/Money' }
        proof_token:
          type: string
          format: uuid
          nullable: true
          description: Opsional (031-optional-payment-proof; dulu wajib untuk non-tunai pada penjualan dan pre-order — pembayaran PURCHASE ORDER non-tunai tetap wajib bukti). Diperoleh dari POST /payment-proofs; bila dikirim harus valid dan belum terpakai (422).
        notes:
          type: string
          nullable: true
          description: 006-purchase-order-and-ops (US5) — catatan bebas per entri pembayaran, mis. nomor referensi transfer.
        notes: { type: string, nullable: true }
        reference:
          type: string
          nullable: true
          maxLength: 100
          description: 028-partial-split-payment — nomor referensi / transaksi pembayaran (opsional).
        client_ref:
          type: string
          format: uuid
          nullable: true
          description: 028 — kunci idempotensi buatan klien. Pembayaran ber-`client_ref` yang sama pada transaksi yang sama tidak pernah tercatat dua kali.

    PaymentConfirmationInput:
      type: object
      description: 031-optional-payment-proof — hanya kunci yang berubah; minimal satu kunci.
      properties:
        proof_token: { type: string, format: uuid, nullable: true, description: "Dari POST /payment-proofs; menjadi bukti yang berlaku dan menandai bukti sebelumnya superseded." }
        reference: { type: string, nullable: true, maxLength: 100 }
        notes: { type: string, nullable: true, maxLength: 1000 }

    PaymentSummary:
      type: object
      description: 028-partial-split-payment — ringkasan turunan dari entri pembayaran (tidak pernah disimpan untuk order). Entri `rejected` tidak dihitung; untuk order, total terbayar = jumlah entri − kembalian.
      properties:
        grand_total: { $ref: '#/components/schemas/Money' }
        total_paid: { $ref: '#/components/schemas/Money' }
        remaining: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [unpaid, partially_paid, fully_paid] }
        payment_count: { type: integer }

    Payment:
      type: object
      properties:
        id: { type: integer }
        method: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
        purpose: { type: string, enum: [full, down_payment, settlement] }
        channel_provider: { type: string, nullable: true, readOnly: true }
        provider: { type: string, nullable: true, readOnly: true, description: "Nama kanal (bank/e-wallet) pembayaran ini pada GET /orders/{id}; null untuk tunai." }
        amount: { $ref: '#/components/schemas/Money' }
        verification: { type: string, enum: [pending, verified, rejected] }
        paid_at: { type: string, format: date-time }
        proof_id: { type: integer, nullable: true, description: "024-invoice-layout-shipping-slip — id PaymentProof yang BERLAKU (jika ada; 031: bukti lama yang sudah diganti tidak ikut), dipakai frontend untuk GET /payment-proofs/{id}/file. Pada GET /orders/{id} juga tersedia sejak 031. Dihilangkan bila endpoint tak memuat relasi bukti." }
        reference: { type: string, nullable: true, maxLength: 100 }
        notes: { type: string, nullable: true, description: "031 — catatan pembayaran (sebelumnya tersimpan tetapi tak dikirim)." }
        has_proof: { type: boolean, description: "031 — apakah pembayaran ini punya bukti yang berlaku. Dihilangkan bila relasi bukti tak dimuat (bukan 'tidak ada bukti')." }
        can_view_proof: { type: boolean, description: "031 — dihitung server untuk pengguna yang meminta: boleh membuka berkas bukti (owner/admin, pengunggah, atau pencatat pembayaran untuk bukti yang berlaku)." }
        verified_by_name: { type: string, nullable: true, description: "032 — nama pengguna yang memverifikasi; null untuk tunai/pending/verifier yang sudah dihapus. Dihilangkan bila relasi `payments.verifier` tak dimuat." }
        verified_at: { type: string, format: date-time, nullable: true, description: "032 — kapan diverifikasi (null untuk tunai dan yang masih pending)." }
        can_verify: { type: boolean, description: "032 — dihitung server untuk pengguna yang meminta: pembayaran non-tunai masih pending, transaksi tidak batal, dan pengguna boleh (owner/admin, atau bukan pencatat pembayaran itu)." }
        can_edit_confirmation: { type: boolean, description: "031 — dihitung server: pengguna boleh menambah/mengubah/mengganti konfirmasi (non-tunai; owner/admin atau pencatat pembayaran; transaksi tidak batal)." }
        proofs:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              captured_via: { type: string, enum: [webcam, upload] }

    OrderItemInput:
      type: object
      required: [variant_id, qty]
      properties:
        variant_id: { type: integer }
        qty: { type: integer, minimum: 1 }
        discount_amount: { $ref: '#/components/schemas/Money' }

    OrderInput:
      type: object
      required: [session_id, items, payments, local_ref]
      properties:
        session_id: { type: integer }
        customer_id: { type: integer, nullable: true, description: Kosongkan untuk pembeli walk-in. }
        local_ref: { type: string, format: uuid, description: Dibuat klien. Menjamin idempotensi bila permintaan dikirim ulang. }
        discount_amount: { $ref: '#/components/schemas/Money' }
        notes: { type: string, nullable: true }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemInput' }
        payments:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PaymentInput' }

    OrderItem:
      type: object
      properties:
        id: { type: integer }
        variant_id: { type: integer }
        artist_id: { type: integer }
        artist_name: { type: string, nullable: true, readOnly: true }
        category_name: { type: string, nullable: true, readOnly: true, description: "Hanya di GET /orders/{id}." }
        variant_name: { type: string, nullable: true, readOnly: true, description: "Hanya di GET /orders/{id}." }
        image_url: { type: string, nullable: true, readOnly: true, description: "Foto varian (bila ada). Hanya di GET /orders/{id}." }
        sku_snapshot: { type: string }
        name_snapshot: { type: string }
        qty: { type: integer }
        cost_price: { $ref: '#/components/schemas/Money', description: "TIDAK dikembalikan oleh GET /orders/{id} (terbuka untuk kasir); hanya laporan owner/admin." }
        sell_price: { $ref: '#/components/schemas/Money' }
        discount_amount: { $ref: '#/components/schemas/Money' }
        discount_percent: { type: number, nullable: true, description: '057 — persen diskon baris' }
        discount_reason_code: { type: string, nullable: true }
        line_total: { $ref: '#/components/schemas/Money' }

    OrderSummary:
      type: object
      properties:
        id: { type: integer }
        order_number: { type: string, example: TRX-20261025-0001 }
        total_amount: { $ref: '#/components/schemas/Money' }
        item_count: { type: integer }
        status: { type: string, enum: [completed, voided] }
        created_at: { type: string, format: date-time }

    Order:
      type: object
      properties:
        id: { type: integer }
        order_number: { type: string }
        session_id: { type: integer }
        customer_id: { type: integer, nullable: true }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount_amount: { $ref: '#/components/schemas/Money' }
        discount_percent: { type: number, nullable: true, description: '057 — persen diskon order; null untuk diskon lama / tanpa diskon' }
        discount_reason_code: { type: string, nullable: true }
        discount_reason_label: { type: string, nullable: true }
        reprint_count: { type: integer, description: '057 — jumlah cetak ulang yang sudah diterima server; nomor salinan berikutnya = reprint_count + 2' }
        closed_at: { type: string, format: date-time, nullable: true, description: '057 — waktu order selesai (tutup); null bila belum selesai' }
        total_amount: { $ref: '#/components/schemas/Money' }
        paid_amount: { $ref: '#/components/schemas/Money' }
        change_amount: { $ref: '#/components/schemas/Money' }
        # 048 — pajak eksklusif (sama dengan tab): total_amount = subtotal − discount_amount + tax_amount.
        tax_amount: { $ref: '#/components/schemas/Money' }
        tax_rate: { $ref: '#/components/schemas/Money', description: "Persentase tarif pajak saat order dibuat (snapshot)." }
        status: { type: string, enum: [completed, voided] }
        void_reason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        channel: { type: string }
        created_at: { type: string, format: date-time }
        customer:
          type: object
          nullable: true
          description: "Hanya di GET /orders/{id}. `null` (kunci tetap ada) untuk pembeli walk-in."
          properties:
            id: { type: integer }
            name: { type: string }
            phone: { type: string, nullable: true }
            email: { type: string, nullable: true }
        cashier:
          type: object
          description: "Hanya di GET /orders/{id}."
          properties: { id: { type: integer }, name: { type: string } }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        payments:
          type: array
          description: Entri pembayaran dalam urutan dicatat; tiap entri membawa `reference`, `recorded_by_name`, `status` (`paid`/`rejected`), dan `session_id` (shift tempat uang diterima).
          items: { $ref: '#/components/schemas/Payment' }
        payment_summary: { $ref: '#/components/schemas/PaymentSummary' }

    Backup:
      type: object
      properties:
        id: { type: string, description: "Nama folder cadangan, `Y-m-d_His` (+ `-N` bila dua dalam detik yang sama)." }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, description: Ukuran database.sql }
        has_payment_proofs: { type: boolean, description: Ada payment-proofs.tar.gz di cadangan ini }
        external_copied: { type: boolean, nullable: true, description: "Hanya di respons POST /backups. true = disalin ke BACKUP_EXTERNAL_PATH, false = path diset tapi tak ditemukan/gagal, null = tak dikonfigurasi." }
    BackupRestoreResult:
      type: object
      properties:
        source: { type: string, description: "Id cadangan sumber, atau 'upload'." }
        safety_backup: { $ref: '#/components/schemas/Backup' }
    Receipt:
      type: object
      properties:
        app_name: { type: string, description: "Nama aplikasi untuk teks 'Powered by …' (default BoothPOS)." }
        store_name: { type: string }
        store_contact: { type: string, nullable: true }
        # 001-user-store-settings User Story 3 / SC-004 — field ini
        # sebelumnya terlewat dari task breakdown fitur tsb, ditutup saat
        # ditemukan sebagai celah nyata. Semua nullable — profil toko
        # boleh tidak diisi lengkap, struk tetap tampil tanpa field yang
        # kosong (bukan menampilkan string kosong/"null").
        store_address: { type: string, nullable: true }
        store_logo_url: { type: string, nullable: true, description: URL publik logo toko (dari ImageUploadService), null bila belum diunggah. }
        store_contact_person: { type: string, nullable: true }
        store_contact_phone: { type: string, nullable: true }
        store_contact_email: { type: string, nullable: true }
        order_number: { type: string }
        cashier_name: { type: string }
        terminal_name: { type: string, nullable: true, description: "064 — nama terminal yang mengambil order; null bila tanpa terminal." }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              qty: { type: integer }
              price: { $ref: '#/components/schemas/Money' }
              line_total: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount_amount: { $ref: '#/components/schemas/Money' }
        total_amount: { $ref: '#/components/schemas/Money' }
        payment_summary:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
        change_amount: { $ref: '#/components/schemas/Money' }

    SalesReport:
      type: object
      description: |
        Task 1 — `group_label`, `rows[].entity_id`, dan `transactions`
        ditambahkan supaya KPI `totals.order_count` dan tabel `rows`
        (agregat per group_by) tidak lagi terlihat "berkontradiksi": dua
        transaksi berbeda yang membeli produk yang sama menghasilkan dua
        entri `transactions` tapi hanya satu baris `rows` — keduanya
        sama-sama benar, cuma menjawab pertanyaan berbeda.

        009-ui-ux-refinements (US6) — `group_by=customer` dipakai
        statistik per-pelanggan di Dashboard. Baris untuk grouping ini
        punya bentuk BERBEDA dari `rows[]` generik di bawah (lihat
        `SalesReportCustomerRow`): `customer_id`/`customer_name`/
        `transaction_count`/`total_amount`, bukan
        `entity_id`/`label`/`unit_count`/`amount` — karena "transaksi"
        di sini dihitung `COUNT(DISTINCT orders.id)`, bukan
        `SUM(order_items.qty)`. `customer_id`/`customer_name` bernilai
        `null` untuk order walk-in (tanpa pelanggan tercatat).
      properties:
        sessions:
          type: array
          description: "Shift kasir dari order yang tercantum di `transactions[]`, terbaru dulu (untuk filter shift & ringkasan kas)."
          items:
            type: object
            properties:
              id: { type: integer }
              cashier_name: { type: string, nullable: true }
              opened_at: { type: string, format: date-time }
              closed_at: { type: string, format: date-time, nullable: true }
              status: { type: string }
              opening_cash: { $ref: '#/components/schemas/Money' }
              closing_cash: { $ref: '#/components/schemas/Money', nullable: true }
              expected_cash: { $ref: '#/components/schemas/Money', nullable: true }
              cash_received: { $ref: '#/components/schemas/Money', description: "028-partial-split-payment — tunai yang DITERIMA di shift ini (pembayaran tunai terverifikasi dengan `session_id` = shift, tanpa order batal) dikurangi kembalian order shift ini; mencakup pelunasan susulan atas penjualan shift lain dan tidak bergantung pada filter. Shift yang hanya menerima pelunasan susulan juga tercantum." }
        group_by: { type: string, enum: [product, category, outlet, day, customer] }
        group_label:
          type: string
          description: |
            Label bahasa Indonesia siap-tampil untuk kolom pengelompokan
            (mis. "Produk"/"Kategori"/"Artist"/"Tanggal") — supaya
            frontend tidak perlu hardcode pemetaan group_by -> label.
          example: Produk
        totals:
          type: object
          properties:
            order_count: { type: integer }
            unit_count: { type: integer }
            gross_sales: { $ref: '#/components/schemas/Money' }
            discount_total: { $ref: '#/components/schemas/Money' }
            net_sales: { $ref: '#/components/schemas/Money', description: "Penjualan bersih order selesai (dipakai Dashboard & Laporan)." }
            pos_unit_count: { type: number, description: "Unit terjual dari order POS SAJA. Halaman Sales memakai `pos_*` karena hanya menampilkan transaksi POS." }
            pos_gross_sales: { $ref: '#/components/schemas/Money', description: Penjualan kotor order POS saja. }
            pos_net_sales: { $ref: '#/components/schemas/Money', description: Penjualan bersih order POS saja. }
            # 048 (keputusan pemilik) — pajak eksklusif. net_sales = pra-pajak, TANPA diskon tingkat-order (keputusan O3).
            # grand_total = net_sales − order_discount_total + tax_total = total struk. Refund mengurangi keempatnya
            # pada tanggal refund dengan nilai yang sama.
            tax_total: { $ref: '#/components/schemas/Money', description: Pajak order selesai (dikurangi refund pada tanggal refund). }
            grand_total: { $ref: '#/components/schemas/Money', description: net_sales − order_discount_total + tax_total (= total struk). }
            order_discount_total: { $ref: '#/components/schemas/Money', description: Diskon tingkat-order, tampil sebagai baris sendiri dan dikurangkan pada grand_total. }
        rows:
          type: array
          description: |
            Bentuk baris berbeda untuk `group_by=customer` — lihat
            `SalesReportCustomerRow` alih-alih skema inline di bawah,
            yang berlaku untuk product/category/outlet/day.
          items:
            type: object
            properties:
              entity_id:
                type: integer
                nullable: true
                description: |
                  product_id/category_id/artist_id sesuai group_by, untuk
                  ditaut ke halaman detail entitas (Task 2). `null` untuk
                  group_by=day, yang tidak menunjuk entitas apa pun.
              label: { type: string, description: "Nama produk, kategori, artist, atau tanggal sesuai group_by" }
              unit_count: { type: integer }
              amount: { $ref: '#/components/schemas/Money' }
        transactions:
          type: array
          description: |
            Satu baris = satu order berstatus completed pada rentang/event
            yang difilter — daftar transaksi individual yang sebelumnya
            tidak tersedia lewat endpoint ini. `id` disertakan supaya
            frontend bisa memanggil GET /orders/{id}/receipt untuk struk
            transaksi manapun di daftar ini (Task 3).
          items:
            type: object
            properties:
              paid_amount: { $ref: '#/components/schemas/Money', description: "028 — uang yang sudah dibayar (jumlah entri non-ditolak dikurangi kembalian)." }
              balance_amount: { $ref: '#/components/schemas/Money', description: "028 — sisa tagihan." }
              payment_status: { type: string, enum: [unpaid, partially_paid, fully_paid], description: "028 — status pembayaran turunan; berbeda dari `payment_state` (status verifikasi)." }
              id: { type: integer }
              order_number: { type: string }
              created_at: { type: string, format: date-time }
              cashier_name: { type: string, nullable: true }
              terminal_id: { type: integer, nullable: true, description: "064 — terminal yang mengambil order (null = tanpa terminal, mis. SPA web)." }
              terminal_name: { type: string, nullable: true }
              customer_name:
                type: string
                nullable: true
                description: |
                  F10.6 — nama pelanggan bila order dikaitkan ke satu
                  (`orders.customer_id` nullable — walk-in tidak punya
                  data pelanggan). Disediakan untuk pencarian di
                  frontend atas array `transactions[]` yang sudah
                  diambil (nomor transaksi/nama pelanggan/nama kasir);
                  tidak ada parameter pencarian sisi server yang baru.
              customer_id: { type: integer, nullable: true }
              customer_phone: { type: string, nullable: true }
              customer_email: { type: string, nullable: true }
              item_count: { type: integer, description: "Jumlah BARIS item (bukan jumlah unit)." }
              unit_count: { type: number, description: "Jumlah unit (SUM qty) semua item di transaksi ini." }
              cashier_id: { type: integer, nullable: true }
              discount_amount: { $ref: '#/components/schemas/Money', description: "Total diskon yang diterima pembeli = diskon per item + diskon tingkat order (tidak dobel: orders.subtotal sudah pasca-diskon-item)." }
              payment_methods:
                type: array
                items: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
                description: Metode pembayaran unik yang dipakai transaksi ini (bisa lebih dari satu untuk pembayaran terpisah).
              channel: { type: string, description: "Saluran transaksi (mis. 'offline')." }
              refunded: { type: boolean, description: "048 / S4 — order sudah direfund. Status tetap completed; total halaman mengecualikannya bila tanggal refund berada dalam rentang." }
              refunded_at: { type: string, format: date-time, nullable: true }
              refund_business_date: { type: string, format: date, nullable: true, description: "Tanggal bisnis tempat refund diakui (penjualan dan laporan hari-hari sebelumnya tidak berubah)." }
              artist_names: { type: array, items: { type: string }, description: Nama penjual unik yang barangnya ada di transaksi ini. }
              total_amount: { $ref: '#/components/schemas/Money', description: Total transaksi. }
              key: { type: string, description: "Kunci baris `order:{id}` — dipakai untuk memilih baris dan mengekspornya." }
              status: { type: string, enum: [completed, voided] }
              void_reason: { type: string, nullable: true }
              payment_state: { type: string, enum: [verified, pending, rejected, none], description: "Verifikasi TERBURUK di antara pembayaran (rejected > pending > verified); `none` bila belum ada pembayaran." }
              cash_amount: { $ref: '#/components/schemas/Money', description: "Tunai BERSIH: tunai diterima dikurangi kembalian (pembayaran rejected tidak dihitung)." }
              noncash_amount: { $ref: '#/components/schemas/Money' }
              session_id: { type: integer, nullable: true, description: Shift kasir tempat order dibuat. }
              items_preview: { type: array, description: "Dua baris item terbesar.", items: { type: object, properties: { name: { type: string }, qty: { type: number } } } }
              items_more: { type: integer, description: "Jumlah baris item di luar pratinjau." }
              cost_total: { $ref: '#/components/schemas/Money', description: "HANYA untuk pengguna yang boleh melihat laporan (`canAccessMenu('reports')`); tidak dikirim ke kasir." }
              margin_amount: { $ref: '#/components/schemas/Money', description: "Sama: hanya pengguna yang boleh melihat laporan." }
              margin_percent: { type: number, description: "Sama: hanya pengguna yang boleh melihat laporan." }
            description: |
              Halaman Sales menyaring dan mengurutkan daftar ini di frontend (kasir, penjual,
              metode bayar, jenis pelanggan, rentang tanggal & total), tanpa memuat ulang —
              karena itu setiap baris membawa field-field di atas. SENGAJA tanpa modal/untung:
              halaman ini terbuka untuk semua peran termasuk kasir.

    SalesReportCustomerRow:
      type: object
      description: |
        009-ui-ux-refinements (US6/FR-016) — bentuk `rows[]` saat
        `group_by=customer` pada `GET /reports/sales`, dipakai statistik
        per-pelanggan Dashboard. Satu query `GROUP BY orders.customer_id`
        (Constitution Principle V), bukan loop per-pelanggan.
      properties:
        customer_id:
          type: integer
          nullable: true
          description: |
            `null` untuk order walk-in (orders.customer_id nullable) —
            baris ini tetap muncul, bukan hilang diam-diam dari laporan.
        customer_name: { type: string, nullable: true }
        transaction_count:
          type: integer
          description: COUNT(DISTINCT orders.id) untuk pelanggan ini.
        total_amount: { $ref: '#/components/schemas/Money' }

    ProfitReport:
      type: object
      description: 046 — tiga angka untuk periode; tanpa event, biaya event, laba bersih, atau bagian pre-order.
      properties:
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        revenue: { $ref: '#/components/schemas/Money' }
        cost_of_goods: { $ref: '#/components/schemas/Money' }
        gross_profit: { $ref: '#/components/schemas/Money' }

    OutletSettlement:
      type: object
      properties:
        outlet_id: { type: integer }
        outlet_name: { type: string }
        historical: { type: boolean }
        total_sales: { $ref: '#/components/schemas/Money' }
        total_units: { type: integer }

    Setting:
      type: object
      properties:
        key: { type: string, example: store_name }
        value:
          type: string
          nullable: true
          description: Selalu disimpan sebagai string mentah, terlepas dari `type`. Interpretasinya (mis. boolean) terjadi di sisi pembaca.
        type: { type: string, enum: [string, integer, decimal, boolean, json] }
        group: { type: string, example: receipt }

    SettingInput:
      type: object
      required: [key, value]
      properties:
        key: { type: string, maxLength: 100, example: store_name }
        value:
          nullable: true
          description: "Boleh string, angka, boolean, atau objek (untuk type=json) — dinormalisasi ke string sebelum disimpan."
          example: "Toko Merchandise Dummy"
        type:
          type: string
          enum: [string, integer, decimal, boolean, json]
          description: Dikosongkan berarti memakai `type` dari baris yang sudah ada, atau `string` bila key baru.
        group:
          type: string
          maxLength: 50
          description: Dikosongkan berarti memakai `group` dari baris yang sudah ada, atau `general` bila key baru.

    MasterDataImportResult:
      type: object
      properties:
        message: { type: string }
        applied:
          type: boolean
          description: Apakah perubahan benar-benar tersimpan. Selalu `false` untuk `dry_run` dan untuk berkas yang bergalat.
        dry_run: { type: boolean }
        sheets:
          type: object
          description: |
            Hanya memuat sheet yang benar-benar ada di berkas, dalam urutan
            pemrosesan (artists, categories, products, stock).
          additionalProperties: { $ref: '#/components/schemas/MasterDataImportSheetCount' }
          example:
            artists: { rows: 2, created: 1, updated: 1, unchanged: 0 }
            products: { rows: 5, created: 4, updated: 1, unchanged: 0 }
            stock: { rows: 5, created: 0, updated: 3, unchanged: 2 }
        ignored_sheets:
          type: array
          description: Nama sheet di berkas yang tidak dikenali dan dilewati.
          items: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/MasterDataImportError' }

    MasterDataImportSheetCount:
      type: object
      properties:
        rows: { type: integer, description: Jumlah baris berisi (baris kosong tidak dihitung). }
        created: { type: integer, description: "Baris yang membuat data baru. Sheet `products` dihitung pada level VARIAN; sheet `stock` selalu 0." }
        updated:
          type: integer
          description: |
            Baris yang cocok dengan data yang sudah ada. TIDAK berarti
            nilainya pasti berubah. Untuk sheet `stock`, jumlah baris yang
            menghasilkan `stock_movements`.
        unchanged:
          type: integer
          description: Untuk sheet `stock`, baris yang angkanya sudah sama dengan stok saat ini sehingga tidak menghasilkan movement. Selalu 0 untuk sheet lain.

    MasterDataImportError:
      type: object
      properties:
        sheet:
          type: string
          nullable: true
          enum: [artists, categories, products, stock, vendors, materials, vendor_prices, bom, roles, users, null]
          description: "`null` untuk galat tingkat berkas (mis. tidak ada sheet yang dikenali)."
        row:
          type: integer
          nullable: true
          description: Nomor baris di dalam sheet, sesuai penomoran Excel (baris 1 = judul kolom, data mulai baris 2).
        column: { type: string, nullable: true, example: category_code }
        message: { type: string, example: "Kategori dengan kode 'ZZ' tidak ditemukan." }

    ActivityLog:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer, nullable: true }
        user_name: { type: string, nullable: true, readOnly: true }
        action: { type: string, enum: [created, updated, deleted, stock_adjusted, price_changed, imported, activated, deactivated, handed_over, merged, item_cancelled, tab_voided] }
        entity_type: { type: string, example: Artist }
        entity_id: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        old_values: { type: object, nullable: true, additionalProperties: true }
        new_values: { type: object, nullable: true, additionalProperties: true }
        created_at: { type: string, format: date-time }

    DiningTable:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 60, example: "7" }
        area: { type: string, maxLength: 60, example: Terrace, description: "`\"\"` = tanpa area." }
        seats: { type: integer, minimum: 1, maximum: 99 }
        display_order: { type: integer }
        is_active: { type: boolean }
        has_open_tab: { type: boolean, readOnly: true, description: Ada tab terbuka di meja ini sekarang. }

    DiningTableInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
        area: { type: string, nullable: true, maxLength: 60 }
        seats: { type: integer, minimum: 1, maximum: 99 }
        display_order: { type: integer }
        is_active: { type: boolean }

    FloorTab:
      type: object
      properties:
        id: { type: integer }
        order_number: { type: string, example: TRX-20261003-0012 }
        total_amount: { type: string, example: "250000.00" }
        paid_amount: { type: string, example: "100000.00", description: "Total terbayar turunan (pembayaran bukan `rejected`, dikurangi kembalian). Tidak pernah negatif." }
        opened_at: { type: string, format: date-time }
        session_id: { type: integer }
        ready_count: { type: integer, description: Item yang sudah siap disajikan (dapur). }
        unsent_count: { type: integer, description: Item yang belum dikirim ke dapur. }

    FloorTable:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        seats: { type: integer }
        is_active: { type: boolean }
        state: { type: string, enum: [free, occupied] }
        tab: { allOf: [{ $ref: '#/components/schemas/FloorTab' }], nullable: true }

    Floor:
      type: object
      properties:
        areas:
          type: array
          description: Area bernama urut abjad alami; meja tanpa area (`area = ""`) selalu terakhir.
          items:
            type: object
            properties:
              area: { type: string }
              tables:
                type: array
                items: { $ref: '#/components/schemas/FloorTable' }
        takeaway_tabs:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/FloorTab'
              - type: object
                properties:
                  tab_label: { type: string, nullable: true }
        version: { type: string }

    FloorUnchanged:
      type: object
      properties:
        unchanged: { type: boolean, enum: [true] }
        version: { type: string }

    TabSummary:
      type: object
      properties:
        id: { type: integer }
        order_number: { type: string }
        status: { type: string, enum: [open] }
        service_type: { type: string, enum: [dine_in, takeaway] }
        table: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string }, area: { type: string } } }
        tab_label: { type: string, nullable: true }
        session_id: { type: integer }
        total_amount: { type: string }
        paid_amount: { type: string }
        created_at: { type: string, format: date-time }

    TabLine:
      type: object
      properties:
        id: { type: integer }
        variant_id: { type: integer }
        name: { type: string }
        qty: { type: integer }
        unit_price: { type: string, description: Harga efektif per unit (snapshot saat ditambahkan). }
        line_total: { type: string }
        modifiers:
          type: array
          description: Snapshot pilihan modifier (tidak berubah walau menu diedit kemudian).
          items: { $ref: '#/components/schemas/ModifierChoice' }
        note: { type: string, nullable: true }
        sent: { type: boolean }
        prep_status: { type: string, nullable: true, enum: [new, preparing, ready, served, null], description: null untuk baris belum dikirim. }
        ticket_item_id: { type: integer, nullable: true, description: "Id item tiket dapur — untuk menandai sudah diantar lewat `PATCH /ticket-items/{id}/status`." }
        station: { type: object, nullable: true }

    Tab:
      type: object
      description: Aman untuk kasir — tidak memuat field biaya.
      properties:
        id: { type: integer }
        order_number: { type: string }
        status: { type: string, enum: [open, completed] }
        service_type: { type: string, enum: [dine_in, takeaway] }
        table: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string }, area: { type: string } } }
        tab_label: { type: string, nullable: true }
        opened_by: { type: string, nullable: true, description: Nama kasir yang membuka tab (044). }
        session_id: { type: integer }
        customer_id: { type: integer, nullable: true }
        subtotal: { type: string }
        discount_amount: { type: string }
        tax_amount: { type: string, description: "048 — pajak eksklusif (snapshot saat transaksi), dihitung SETELAH diskon, dibulatkan per order." }
        tax_rate: { type: string, description: "048 — tarif (%) yang dipakai untuk snapshot pajak." }
        total_amount: { type: string, description: "subtotal − diskon + pajak." }
        paid_amount: { type: string }
        change_amount: { type: string }
        balance: { type: string, description: "max(0, total − dibayar)." }
        queue_no: { type: string, nullable: true, example: A-024, description: "048 — nomor antrean order counter dari terminal; per outlet per hari bisnis." }
        receipt_no: { type: string, nullable: true, example: "000124", description: "048 — nomor struk; terisi saat lunas. 064: nomor urut polos PER OUTLET (6 digit), tanpa bagian terminal; nomor lama `T01-000124` tidak berubah. Unik per outlet, bukan seluruh instalasi." }
        guest_count: { type: integer, nullable: true, minimum: 1, maximum: 99 }
        prebill_at: { type: string, format: date-time, nullable: true }
        device: { type: object, nullable: true, description: "064 — terminal yang membuka tab (null untuk tab dari SPA web).", properties: { id: { type: integer }, name: { type: string } } }
        created_at: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/TabLine' } }
        payments:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              method: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
              amount: { type: string }
              verification: { type: string }
              paid_at: { type: string, format: date-time }

    OpenTabInput:
      type: object
      required: [session_id]
      properties:
        session_id: { type: integer }
        table_id: { type: integer, nullable: true }
        tab_label: { type: string, nullable: true, maxLength: 100 }
        customer_id: { type: integer, nullable: true }
        local_ref: { type: string, format: uuid, nullable: true }
        guest_count: { type: integer, nullable: true, minimum: 1, maximum: 99, description: "048 — jumlah tamu. Terminal dikenali dari header `X-Device-Id` (bukan body)." }

    AddTabLineInput:
      type: object
      required: [variant_id, qty]
      properties:
        variant_id: { type: integer }
        qty: { type: integer, minimum: 1, maximum: 999 }
        note: { type: string, nullable: true, maxLength: 255 }
        modifier_option_ids:
          type: array
          items: { type: integer }
          description: |
            Pilihan modifier. Divalidasi server terhadap grup efektif produk (wajib/opsional, tunggal/jamak,
            min/max) — pelanggaran → `422` yang menyebut grup dan rentangnya. Harga efektif per unit =
            harga menu + selisih pilihan (tidak boleh negatif); pilihan di-SNAPSHOT pada baris.

    UpdateTabLineInput:
      type: object
      properties:
        qty: { type: integer, minimum: 1, maximum: 999 }
        note: { type: string, nullable: true, maxLength: 255 }
        modifier_option_ids:
          type: array
          items: { type: integer }
          description: Mengganti pilihan; harga dihitung ulang dari harga dasar SAAT baris ditambahkan (bukan harga menu hari ini).

    TabPaymentInput:
      type: object
      required: [client_ref, payments]
      properties:
        client_ref: { type: string, format: uuid, description: Kunci idempotensi satu pengiriman pembayaran. }
        discount_amount: { type: number, nullable: true, minimum: 0, description: Diskon tingkat-order saat membayar (≤ subtotal). }
        payments:
          type: array
          minItems: 1
          items:
            type: object
            required: [method, amount]
            properties:
              method: { type: string, enum: [cash, bank_transfer, qr_ewallet] }
              channel_id: { type: integer, nullable: true }
              amount: { type: number, minimum: 0.01 }
              proof_token: { type: string, format: uuid, nullable: true }
              notes: { type: string, nullable: true }

    ModifierChoice:
      type: object
      properties:
        group: { type: string, example: Size }
        option: { type: string, example: Large }
        price_delta: { type: string, example: "5000.00", description: Bertanda. }

    ModifierOption:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 100 }
        price_delta: { type: string, example: "5000.00", description: Positif, nol, atau negatif. }
        display_order: { type: integer }
        is_active: { type: boolean }

    ModifierGroup:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        selection_type: { type: string, enum: [single, multiple] }
        is_required: { type: boolean }
        min_select: { type: integer }
        max_select: { type: integer, nullable: true, description: null = tanpa batas atas. }
        display_order: { type: integer }
        is_active: { type: boolean }
        options: { type: array, items: { $ref: '#/components/schemas/ModifierOption' } }
        product_ids: { type: array, items: { type: integer } }
        category_ids: { type: array, items: { type: integer } }

    ModifierGroupInput:
      type: object
      required: [name, selection_type, options]
      properties:
        name: { type: string, maxLength: 100 }
        selection_type: { type: string, enum: [single, multiple] }
        is_required: { type: boolean }
        min_select: { type: integer, minimum: 0, maximum: 50 }
        max_select: { type: integer, nullable: true, minimum: 1, maximum: 50 }
        display_order: { type: integer }
        is_active: { type: boolean }
        options:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, price_delta]
            properties:
              id: { type: integer, nullable: true, description: Ada → ubah opsi itu; tanpa id → buat. }
              name: { type: string, maxLength: 100 }
              price_delta: { type: number }
              display_order: { type: integer }
              is_active: { type: boolean }

    Station:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 60, example: Dapur }
        display_order: { type: integer }
        is_active: { type: boolean }

    StationInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
        display_order: { type: integer }
        is_active: { type: boolean }

    TicketItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        qty: { type: integer }
        modifiers: { type: array, items: { $ref: '#/components/schemas/ModifierChoice' } }
        note: { type: string, nullable: true }
        status: { type: string, enum: [new, preparing, ready, served, cancelled] }
        preparing_at: { type: string, format: date-time, nullable: true }
        ready_at: { type: string, format: date-time, nullable: true }
        served_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancel_reason: { type: string, nullable: true }

    Ticket:
      type: object
      properties:
        id: { type: integer }
        round_no: { type: integer, description: Ronde pengiriman tab ini (1, 2, …). }
        sent_at: { type: string, format: date-time }
        station: { type: object, nullable: true, description: null = tiket "tanpa stasiun" (item langsung siap saji)., properties: { id: { type: integer }, name: { type: string } } }
        order: { type: object, properties: { id: { type: integer }, order_number: { type: string } } }
        table: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
        tab_label: { type: string, nullable: true }
        waiting_seconds: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/TicketItem' } }

    SplitTabInput:
      description: "048 — `mode: equal` memakai hanya `mode` dan `parts` (2–5); mode bawaan memakai `client_ref`, `items`, `payments`."
      type: object
      properties:
        mode: { type: string, enum: [items, equal], description: "Bawaan items. equal = pratinjau bagi rata." }
        parts: { type: integer, minimum: 2, maximum: 5, nullable: true, description: "Wajib bila mode = equal." }
        client_ref: { type: string, format: uuid }
        discount_amount: { type: number, nullable: true, minimum: 0, description: Diskon untuk penjualan terpisah saja (≤ subtotalnya). }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [item_id, qty]
            properties:
              item_id: { type: integer, description: Id baris tab; tidak boleh kembar. }
              qty: { type: integer, minimum: 1 }
        payments:
          type: array
          minItems: 1
          description: Harus menuntaskan penjualan terpisah dalam satu panggilan.
          items: { type: object }

    SplitTabResult:
      type: object
      properties:
        paid_order: { $ref: '#/components/schemas/Tab' }
        tab: { $ref: '#/components/schemas/Tab' }
