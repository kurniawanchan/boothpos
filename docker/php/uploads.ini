; BUG YANG DITEMUKAN & DIPERBAIKI (015-dockerize-dev-environment lanjutan)
; — PHP stock ini punya post_max_size=8M/upload_max_filesize=2M/
; max_file_uploads=20, jauh di bawah apa yang ImportMasterDataRequest
; sendiri SUDAH mendeklarasikan mendukung: xlsx sampai 10 MB
; (ImportMasterDataRequest::MAX_KILOBYTES) + hingga 200 gambar
; (ImportMasterDataRequest::MAX_IMAGES) @ 5 MB masing-masing
; (ImageUploadService::MAX_KILOBYTES). Akibatnya batch impor massal
; produk+gambar yang realistis (mis. 40 gambar ~1-2 MB) ditolak PHP
; SEBELUM permintaan sampai ke Laravel sama sekali — respons yang
; kembali 200 OK berisi HTML warning PHP mentah, bukan JSON, sehingga
; modal impor tampak "macet" di pratinjau tanpa pesan galat yang jelas.
; Ditemukan lewat reproduksi sungguhan (bukan dari membaca kode saja).
upload_max_filesize = 10M
post_max_size = 300M
max_file_uploads = 200
memory_limit = 512M
